l defect"],["B","Bicuspid aortic valve"],["C","Mitral valve prolapse"],["D","Tetralogy of Fallot"],["E","Ventricular septal defect"]],"a":"B"},{"id":"15238","b":9,"n":38,"s":[{"p":"A 2-year-old girl is brought to the clinic due to vomiting. Vomiting has occurred every morning for the past week but has increased in frequency and now occurs intermittently throughout the day. Today, the patient has vomited 8 times and become irritable and lethargic but has had no hematemesis, diarrhea, or sick contacts. She was born at 29 weeks gestation and has a ventriculoperitoneal shunt that was placed after birth due to intraventricular hemorrhage. Temperature is 36.7°C (98.1°F), blood pressure is 90/50 mm Hg, pulse is 104/min, and respirations are 24/min. Physical examination reveals a sleepy, irritable child. The anterior fontanelle is enlarged and tense. Pupils are equal and reactive, and funduscopic examination is limited by lack of patient cooperation. The abdomen is soft and mildly tender to palpation. There is no rebound, guarding, or palpable mass. Skin turgor is decreased, and capillary refill is 2 seconds. Which of the following is the best next step in management of this patient?"}],"o":[["A","Abdominal ultrasound"],["B","Brain imaging"],["C","Empiric proton pump therapy"],["D","Lumbar puncture"],["E","Supportive care and observation only"]],"a":"B"},{"id":"4249","b":9,"n":39,"s":[{"p":"A 16-year-old boy is brought to the office for pain and limited motion of the right knee. The patient has had previous episodes of sudden swelling in his right knee and does not recall them being associated with injury. This current episode of knee pain began 6 months ago. Initially the pain was controlled with heating pads and acetaminophen, but it has gradually worsened over the last 2-3 months. The patient now has difficulty walking. He is worried that he will be unable to go on his annual camping trip with his family. The patient had an episode of prolonged bleeding after a tooth extraction several years ago. He is sexually active, has 2 lifetime partners, and uses condoms intermittently. Temperature is 36.7°C (98°F). On examination, the patient is alert and in no distress. The right knee is swollen and boggy with a small effusion present. The knee is not fully extendable with either active or passive motion. Which of the following is the most likely cause of this patient’s knee joint findings?"}],"o":[["A","Autoimmune cartilage destruction"],["B","Avascular necrosis"],["C","Chronic Borrelia burgdorferi infection"],["D","Disseminated gonococcal infection"],["E","Hemosiderin deposition and fibrosis"],["F","Intraarticular crystal deposition"]],"a":"E"},{"id":"8871","b":10,"n":1,"s":[{"p":"A 17-year-old girl is admitted to the hospital due to purging behavior, weight loss, and syncope. Nasogastric feeds are initiated, and her activities are restricted. On the second day of admission, the patient reports severe shortness of breath and has recurrent episodes of nonsustained ventricular tachycardia. Blood pressure is 82/55 mm Hg, pulse is 112/min, and respirations are 22/min. BMI is 14 kg/m². Physical examination shows an emaciated girl with bibasilar crackles and jugular venous distension. Serum chemistry results are as follows:"},{"ul":["Sodium: 138 mEq/L","Potassium: 2.1 mEq/L","Chloride: 92 mEq/L","Bicarbonate: 28 mEq/L","Blood urea nitrogen: 14 mg/dL","Creatinine: 0.8 mg/dL","Calcium: 8 mg/dL","Glucose: 90 mg/dL","Magnesium: 1 mg/dL","Phosphorus: 0.9 mg/dL"]},{"p":"A marked increase in which of the following hormones best explains this patient’s deterioration?"}],"o":[["A","Aldosterone"],["B","Cortisol"],["C","Glucagon"],["D","Insulin"],["E","Triiodothyronine"]],"a":"D"},{"id":"4828","b":10,"n":2,"s":[{"p":"A 5-month-old girl is brought to the physician for a weight check. The patient has been evaluated several times for poor weight gain. She takes 6 ounces of regular formula every 4 hours. Increasing the caloric density of her formula has not improved her growth. The patient has no diarrhea or vomiting. There is a family history of nephrolithiasis. She was born full term without complications. The patient’s birth weight was 3.6 kg (8 lb, 50th percentile). Current weight is <5th percentile; length and head circumference have been tracking along the 25th percentile. The infant appears thin, but the remainder of the physical examination is unremarkable. Newborn screening results were normal. Laboratory results are as follows:"},{"ul":["Sodium: 140 mEq/L","Potassium: 3 mEq/L","Chloride: 121 mEq/L","Blood urea nitrogen: 10 mg/dL","Creatinine: 0.5 mg/dL","Calcium: 9 mg/dL","Glucose: 98 mg/dL","Arterial blood gas pH: 7.21","PaCO₂: 31 mm Hg","Bicarbonate: 14 mEq/L","Urinalysis pH: 7.9","Urinalysis Potassium: Normal","Urinalysis Sodium: Normal"]},{"p":"Which of the following is the most likely cause of this patient’s failure to thrive?"}],"o":[["A","Cystic fibrosis"],["B","Gastroesophageal reflux"],["C","Insufficient caloric intake"],["D","Lactic acidosis"],["E","Renal tubular acidosis"]],"a":"E"},{"id":"4258","b":10,"n":3,"s":[{"p":"A 15-month-old full-term boy is brought to the clinic for a well-child examination. He has been eating and sleeping well and is meeting all developmental milestones. His day care center had an outbreak of pertussis 6 weeks ago that required it to close for a few days, but the patient has had no cough, nasal congestion, or rhinorrhea. At age 6 months, he had a generalized seizure that lasted approximately 2 minutes within hours of receiving the diphtheria-tetanus-acellular pertussis vaccine. He was taken to the emergency department for observation and discharged later that day. The patient has had no other seizures or medical concerns and takes no medications. His uncle has a history of childhood-onset epilepsy. Vital signs and physical examination are normal. The child is due for the fourth dose of the diphtheria-tetanus-acellular pertussis vaccine. Which of the following is the best next step in management of this patient?"}],"o":[["A","Administer the diphtheria and tetanus toxoids; avoid the pertussis component"],["B","Administer the diphtheria-tetanus-acellular pertussis vaccine as scheduled"],["C","Administer only the tetanus toxoid at this time"],["D","Hold all immunizations containing diphtheria, tetanus, or pertussis components"],["E","Prescribe only postexposure prophylaxis antibiotics"]],"a":"B"},{"id":"15047","b":10,"n":4,"s":[{"p":"A mother brings her 4-year-old adopted daughter to the office due to concerns about her adjustment to preschool. The patient was taken away from her birth mother, who was abusing cocaine and alcohol, at the age of 2 and moved to an orphanage. The girl was adopted by her current family 6 months ago. Prenatal history is unknown. The adoptive mother reports that the patient doesn’t interact with classmates and prefers to play by herself. At home, the girl hardly speaks with the family and stays in her room, where the mother has seen her hoarding toys and food under the bed. The patient is able to dress herself, copy a triangle, write the letters of her name, and walk down the stairs without aid. Her mother says, “Sometimes she doesn’t pay attention or listen to me. At other times she will start to cry for no reason. She doesn’t like being hugged or picked up; nothing I do seems to comfort her.” On examination, the patient is sitting quietly, playing with various toys in the doctor’s office. She makes some eye contact. Speech is normal, but answers are brief with little facial expression. Vital signs and physical examination are normal. She is in the 50th and 60th percentiles for weight and height, respectively. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Adjustment disorder"],["B","Attention-deficit hyperactivity disorder, inattentive type"],["C","Autism spectrum disorder"],["D","Disinhibited social engagement disorder"],["E","Global developmental delay"],["F","Post-traumatic stress disorder"],["G","Reactive attachment disorder"]],"a":"G"},{"id":"12417","b":10,"n":5,"s":[{"p":"The following vignette applies to the next 2 items. A 15-month-old boy is brought to the emergency department with cyanosis. Over the past week, the patient has been teething and has had mild nasal congestion and low-grade fevers. He has been eating and drinking normally. The patient was extremely fussy today, despite his mother giving him acetaminophen and a topical anesthetic that she used when she had a toothache. He was hospitalized for bronchiolitis 6 months ago but is otherwise healthy, and immunizations are up to date. Blood pressure is 90/60 mm Hg, pulse is 158/min and respirations are 50/min. Pulse oximetry is 85% on room air. Physical examination shows a sleepy child with blue discoloration of the skin and nails. The lungs are clear to auscultation bilaterally. Cardiac examination reveals no murmurs or gallops. The abdomen is soft, nontender, and has no hepatosplenomegaly. Blood samples are obtained for laboratory testing, and 100% oxygen is administered but fails to increase the pulse oximetry reading or the cyanosis."},{"p":"Which of the following laboratory findings would most likely be seen in this patient?"}],"o":[["A","Elevated PaCO₂"],["B","Elevated plasma osmolal gap"],["C","Elevated transaminase levels"],["D","Normal co-oximetry results"],["E","Normal PaO₂"]],"a":"E"},{"id":"12418","b":10,"n":6,"s":[{"p":"(Continued from previous question) Which of the following should be administered to this patient?"}],"o":[["A","Dimercaprol"],["B","Fomepizole"],["C","Glucagon"],["D","Methylene blue"],["E","N-acetylcysteine"],["F","Pralidoxime"]],"a":"D"},{"id":"4833","b":10,"n":7,"s":[{"p":"A 4-year-old boy is brought to the emergency department by his parents for evaluation of a fever and headache. Two days ago, the boy began to have low-grade fever, cough, and congestion. Last night, his fever became higher, and he became fussy, more difficult to console, and less active. He slept poorly and woke up with a headache unrelieved with over the counter pain medications. The patient vomited twice prior to arrival. He has no medical conditions but has not received regular health maintenance or vaccinations. Temperature is 39.4°C (102.9°F), pulse is 110/min and respirations are 20/min. Physical examination shows an irritable child. Pupils are equal and reactive; funduscopic examination is limited by photophobia. The oropharynx is erythematous. Nuchal rigidity is present and bilateral lower extremities flex when the neck is flexed. The remainder of the physical examination is normal. Cerebrospinal fluid results are shown below:"},{"ul":["Glucose: 60 mg/dL","Protein: 80 mg/dL","Red blood cells: 2/mm³","White blood cells: 85/mm³","Neutrophils: 10%","Lymphocytes: 70%","Monocytes: 20%"]},{"p":"Which of the following pathogens is most likely responsible for this patient’s presentation?"}],"o":[["A","Cryptococcus neoformans"],["B","Group B coxsackievirus"],["C","Mycobacterium tuberculosis"],["D","Neisseria meningitidis"],["E","Streptococcus pneumoniae"],["F","Treponema pallidum"]],"a":"B"},{"id":"3900","b":10,"n":8,"s":[{"p":"A 17-year-old girl comes to the office due to knee pain. She first noticed a dull, achy pain in her left knee a week ago after soccer practice. Despite icing her knee regularly, the patient has been unable to participate this week due to pain when running and jumping. She does not recall trauma to the knee and has otherwise been healthy. Vital signs are normal. Examination shows a well-appearing adolescent with a moderate effusion of the left knee and a limp. There is mild tenderness to palpation and limited knee extension. Which of the following additional pieces of information is most likely to help identify the underlying diagnosis?"}],"o":[["A","Detailed dietary history"],["B","Family history of bleeding disorder"],["C","Immunization status"],["D","New medications"],["E","Recent rashes"]],"a":"E"},{"id":"2845","b":10,"n":9,"s":[{"p":"A 4-year-old boy is brought to the clinic due to sore throat. He first became ill 2 days ago with fever and rhinorrhea. This morning, he developed a severe sore throat and refused to eat his midmorning snack. The patient has type 1 diabetes mellitus and has been hospitalized twice in the last year for diabetic ketoacidosis. He has had no childhood vaccinations. His mother is a smoker and often smokes cigarettes inside the house. The patient is at the 50th percentile for height and 99th percentile for weight. Temperature is 39.4°C (103°F). While sitting on the examination table, the patient appears distressed and leans forward with his chin thrust forward. Tympanic membranes are clear. Oropharyngeal examination shows multiple dental caries. The tonsils are mildly erythematous and 1+ bilaterally. The submandibular space and neck are soft. Lung examination reveals no wheezes or crackles. Which of the following is the most likely risk factor for this patient’s current condition?"}],"o":[["A","Childhood obesity"],["B","Inadequate dental hygiene"],["C","Lack of recommended immunizations"],["D","Poorly controlled diabetes mellitus"],["E","Secondhand smoke"]],"a":"C"},{"id":"12765","b":10,"n":10,"s":[{"p":"A 3-year-old boy is brought to the office by his father due to a “rash on his bottom” for 2 weeks. The father states, “He has been scratching his bottom during the day. We have tried several over-the-counter barrier ointments and antifungal creams to soothe the area but nothing seems to help.” The child is toilet-trained during the day but uses diapers at night. The patient usually stools twice a day without straining, but for the last few days he has had pain with bowel movements and blood on the toilet paper after wiping. He has had no recent illnesses and has been eating and sleeping well. The patient has no chronic medical conditions, and vaccinations are up to date. His 8-year-old sister had pharyngitis a few weeks ago but is now recovered after antibiotics. Temperature is 37.2°C (99°F). Physical examination shows a well-appearing child with a bright red, sharply defined rash that extends 2 cm circumferentially around the anus. There are 2 fissures in the perianal region. No other rashes are present on the body. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Candidal diaper dermatitis"],["B","Irritant diaper dermatitis"],["C","Pinworm infection"],["D","Seborrheic dermatitis"],["E","Streptococcal perianal dermatitis"]],"a":"E"},{"id":"3911","b":10,"n":11,"s":[{"p":"A 15-year-old girl is brought to the office due to absent menstruation. Her sister and mother attained menarche at 13, and she wants to know when she will start her menstrual period. The patient has asthma and takes albuterol as needed for cough or wheeze. She was hospitalized at age 2 for pneumonia. The patient is on the varsity track team and is a C+ student. Height and weight are at the 60th percentile. Vital signs are normal. Physical examination shows Tanner stage IV breast development and pubic hair, normal external female genitalia, and shaved axillary hair. Pelvic ultrasonography shows 2 normal-sized ovaries but no uterus. Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Complete defect in androgen receptor function"],["B","Congenital absence of an X chromosome"],["C","Cystic fibrosis transmembrane conductance regulator gene defect"],["D","Defective conversion of testosterone to dihydrotestosterone"],["E","Developmental failure of Müllerian duct formation"],["F","Gonadotropin-releasing hormone deficiency"]],"a":"E"},{"id":"2769","b":10,"n":12,"s":[{"p":"A 17-year-old boy is brought to the emergency department for evaluation of facial swelling. Mild swelling of his lips this morning progressed to severe diffuse facial swelling by the afternoon. The patient has had no fevers, recent infections, abdominal pain, vomiting, or other swelling. He is a junior in high school and has been very stressed this week due to midterm examinations. His mother says that he had a similar episode when he had a tooth extracted a year ago. The patient has no chronic medical problems and takes no medications. His father and paternal grandmother both have hypertension. On arrival, temperature is 36.9°C (98.4°F), blood pressure is 120/80 mm Hg, pulse is 82/min, and respirations are 18/min. Examination shows severe edema of the entire face; the patient is unable to open his eyes. The lungs are clear to auscultation, and neither stridor nor muffled voice is present. No rashes are detected. Mild edema of the hands is also seen. Which of the following best explains the pathophysiology of this patient’s condition?"}],"o":[["A","Antibody-mediated hypersensitivity"],["B","C1 inhibitor deficiency"],["C","Cell-mediated hypersensitivity"],["D","Drug-induced bradykinin elevation"],["E","IgE-mediated hypersensitivity"],["F","Immune complex-mediated hypersensitivity"]],"a":"B"},{"id":"4341","b":10,"n":13,"s":[{"p":"A 17-year-old boy comes to the office due to leg pain in his left thigh for over a year. He first noticed the pain only while running, but it became more frequent and more intense even after walking short distances. For the last 3 weeks, the pain has occurred even while sitting down or lying in bed. He has taken acetaminophen and ibuprofen with no relief. The patient has a history of sickle cell disease and has previously been hospitalized for back, chest, and leg pain, but he says that the current pain is different. Three weeks ago, he had an upper respiratory illness that lasted for 3 days and resolved spontaneously. He does not use tobacco, alcohol, or illicit drugs. Temperature is 36.7°C (98°F), blood pressure is 110/70 mm Hg, and pulse is 78/min. Height and weight are at the 10th percentile for age. Physical examination demonstrates an alert, uncomfortable adolescent. There is pain on flexion, extension, and rotation of the left hip, with restricted range of motion. Distal pulses and deep tendon reflexes are normal. Gait is notable for a slight limp. Complete blood count shows normocytic anemia with a normal white blood cell count. Which of the following would most likely explain this patient’s symptoms?"}],"o":[["A","Bacterial infection of the hip joint"],["B","Displacement of the femoral epiphysis"],["C","Fracture of the femoral neck"],["D","Malignancy of the proximal femur"],["E","Osteonecrosis of the femoral head"],["F","Reactive arthritis of the hip joint"]],"a":"E"},{"id":"2432","b":10,"n":14,"s":[{"p":"A 4-month-old boy is brought to the office for “noisy breathing.” The patient’s parents first noticed a harsh sound when he cried at age 2 weeks, but it has gotten louder over the past month, especially when he is lying on his back. The noise seems to improve when the patient is held upright or during “tummy time.” He does not appear to have labored breathing and has never turned blue. The patient has had occasional, small spit-ups after feeds but has been growing well along the 60th percentile for weight. He was born at full term without complications during pregnancy or labor and delivery. On physical examination, the patient has inspiratory stridor when he is supine that improves when he is prone. The remainder of the examination is normal. Which of the following would confirm the most likely diagnosis for this patient?"}],"o":[["A","Chest radiography"],["B","CT scan of the neck"],["C","Flexible fiberoptic laryngoscopy"],["D","Fluoroscopic barium swallow"],["E","MR angiography of the neck"],["F","Plain radiograph of the neck"]],"a":"C"},{"id":"15994","b":10,"n":15,"s":[{"p":"A 10-year-old girl is brought to the office due to right ear pain that began yesterday. The patient’s ear feels itchy and gives the sensation of something stuck inside. She recently returned from visiting her grandparents at their beach house for a family reunion; a few cousins also visiting were recovering from an upper respiratory infection. The patient had recurrent acute otitis media complicated by persistent effusion and required tympanostomy tube placement at age 2. The tympanostomy tubes have since fallen out, and she has had no ear infections since age 3. She is not up to date on vaccinations but has no chronic medical conditions. Her parents are smokers but usually do not smoke inside the house. Temperature is 37.1°C (98.8°F), blood pressure is 102/58 mm Hg, and pulse is 94/min. On examination of the right ear, there is exquisite tenderness to movement of the pinna during otoscopy. The canal is red and swollen. Most of the tympanic membrane can be seen, and it is clear with no fluid. The left ear is normal. Which of the following risk factors most likely contributed to this patient’s condition?"}],"o":[["A","Immunization status"],["B","Multiple sick contacts"],["C","Recurrent acute otitis media"],["D","Tobacco smoke exposure"],["E","Tympanostomy tube placement"],["F","Water exposure"]],"a":"F"},{"id":"4548","b":10,"n":16,"s":[{"p":"A newborn boy is evaluated for respiratory distress shortly after delivery. He was born at an estimated 37 weeks gestation via spontaneous vaginal delivery to a 20-year-old primigravid mother who had no prenatal care. The mother has no chronic medical conditions and does not use tobacco, alcohol, or illicit drugs. The boy’s temperature is 36.7°C (98°F), pulse is 144/min, and respirations are 70/min. Pulse oximetry is 84% on room air. Physical examination shows flattened facies. There are intercostal retractions, and bilateral lungs have decreased aeration. The abdomen is distended, and there is a palpable, soft, suprapubic midline mass. The external male genitalia appear normal. The extremities are cyanotic, and bilateral clubfeet are present. Which of the following is the most likely underlying cause of this patient’s clinical condition?"}],"o":[["A","Congenital diaphragmatic hernia"],["B","Duodenal atresia"],["C","Hypospadias"],["D","Posterior urethral valves"],["E","Transient tachypnea of the newborn"],["F","Wilms tumor"]],"a":"D"},{"id":"4534","b":10,"n":17,"s":[{"p":"An overweight 12-year-old boy presents with left knee pain that has been going on intermittently for the past three months. Physical activity, especially stair climbing, exacerbates the pain. The boy’s mother also points out that he has been limping recently. On physical examination, his anterior left hip is moderately tender to palpation, and when he is asked to stand on his left leg, the right half of his pelvis tilts downward. Which of the following best explains this finding?"}],"o":[["A","Tensor fascia lata weakness"],["B","Psoas muscle weakness"],["C","Quadratus lumborum weakness"],["D","Quadriceps muscle weakness"],["E","Gluteus muscle weakness"]],"a":"E"},{"id":"3817","b":10,"n":18,"s":[{"p":"A 2-year-old boy is brought to the office for the first time by his parents for a well visit. The family recently moved to the area, and the child has not been seen for routine child care since age 12 months. No complications occurred during pregnancy, and the patient was born full term. At age 4 months, he was hypotonic; he did not sit unsupported until age 10 months. Three months ago, the patient developed spasticity and dystonia with involuntary movements of the hands and feet. Over the past month, he has started biting his fingers and hands, pinching himself, and banging his limbs against the wall. Family history is unremarkable. On examination, the patient is nonverbal and hypertonic. There is hyperreflexia of the upper and lower extremities and extensor plantar reflexes bilaterally. Several new and healing abrasions are present on the fingers and hands. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Autism spectrum disorder"],["B","Cerebral palsy"],["C","Lesch-Nyhan syndrome"],["D","Phenylketonuria"],["E","Rett syndrome"],["F","Sydenham chorea"],["G","Tourette syndrome"]],"a":"C"},{"id":"2691","b":10,"n":19,"s":[{"p":"A 14-year-old African American boy comes to the physician after his older brother experienced sudden cardiac arrest during a hiking trip. He has no current complaints and does not use tobacco, alcohol, or illicit drugs. His blood pressure is 110/60 mm Hg and pulse is 75/min. Physical examination shows a supple neck with no jugular venous distension. Carotid pulse seems to have a dual upstroke. There is strong apical impulse, and a systolic ejection murmur is heard along the left sternal border. The lungs are clear to auscultation. Which of the following is most likely to increase the murmur intensity in this patient?"}],"o":[["A","Leg raise"],["B","Squatting"],["C","Supine position"],["D","Sustained handgrip"],["E","Valsalva maneuver"]],"a":"E"},{"id":"4837","b":10,"n":20,"s":[{"p":"A 1-year-old boy is brought to the office for a routine visit. The patient recently transitioned from breast milk to whole milk and enjoys various table foods, including fruits, vegetables, and grains. The family is vegetarian and adds protein to his diet through beans and nut butters. He says 2 words, recently started walking, and often chews on his toys and books. The family lives in a house built in the 1940s that has no chipping paint and has recently been renovated, except for the basement and bedrooms. Height, weight, and head circumference are at the 50th percentile for age. Physical examination is normal. Capillary blood test results are as follows:"},{"ul":["Hemoglobin: 12.5 g/dL","Lead: 12 μg/dL (normal <5 μg/dL)"]},{"p":"Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Apply wallpaper to lead-based-paint walls"],["B","Initiate calcium disodium edetate (EDTA)"],["C","Initiate dimercaprol (British anti-Lewisite)"],["D","Initiate dimercaptosuccinic acid (succimer)"],["E","Measure venous lead level"],["F","Perform abdominal x-ray"],["G","Prescribe oral ferrous sulfate"]],"a":"E"},{"id":"3662","b":10,"n":21,"s":[{"p":"A 12-week-old female infant is brought to the office by her mother due to a three-week history of weakness, poor appetite, and choking spells during feeding. Other accompanying symptoms include excessive sleeping, constipation and apathy. Her prenatal history is unremarkable. She was delivered vaginally at 38 weeks of gestation. She was born outside the United States. Her weight and length at birth were within normal range. She is exclusively breastfed. Her mother’s family history is unremarkable. The identity and family history of her father are unknown. The pertinent physical findings include apathy, weakness, hypotonia, large tongue, sluggish movement, abdominal bloating, and an umbilical hernia. Based on the given information, what is the most likely diagnosis?"}],"o":[["A","Infant botulism"],["B","Werdnig-Hoffmann syndrome"],["C","Myotonic congenital myopathy"],["D","Congenital hypothyroidism"],["E","Myasthenia gravis"]],"a":"D"},{"id":"4857","b":10,"n":22,"s":[{"p":"A 5-year-old boy is brought to the office due to left hip pain. The patient awoke this morning with a limp and says that his left hip hurts, especially with movement or walking. He played soccer outside yesterday with no known injury. Two weeks ago, he had had an upper respiratory infection that has since resolved. He has had no fever, vomiting, diarrhea, or other joint pain. His grandmother has rheumatoid arthritis treated with methotrexate. Temperature is 37.2°C (99°F), blood pressure is 100/65 mm Hg, and pulse is 92/min. Physical examination shows an interactive and talkative child who walks with a limp. The left hip is slightly abducted and externally rotated with mildly decreased range of motion. The patient is able to stand and bear weight on the left lower extremity. The remainder of the examination is normal. Bilateral hip x-ray is normal. Laboratory results are as follows:"},{"ul":["Hemoglobin: 13.5 g/dL","Platelets: 287,000/mm³","Leukocytes: 8,500/mm³","Neutrophils: 60%","Eosinophils: 2%","Lymphocytes: 33%","Monocytes: 5%","Erythrocyte sedimentation rate: 15 mm/h","C-reactive protein: 2 mg/L (normal: ≤ 3)"]},{"p":"Which of the following is the best next step in management of this patient?"}],"o":[["A","Blood culture"],["B","Ibuprofen and close follow-up"],["C","MRI of the left hip"],["D","Serum antinuclear antibodies"],["E","Synovial fluid aspiration of the left hip"]],"a":"B"},{"id":"8772","b":10,"n":23,"s":[{"p":"A 15-year-old boy comes to the physician with left shoulder joint pain and swelling. He has had these symptoms for the past 3 months and they are getting progressively worse. He has no fever, weight loss, or night sweats. The patient lifts weights and plays baseball 5 days a week. He has taken acetaminophen and ibuprofen with little relief. Examination shows a tender mass at the left proximal humerus. Range of motion is normal. Laboratory evaluation shows elevated alkaline phosphatase, erythrocyte sedimentation rate, and lactate dehydrogenase. X-ray of the shoulder is shown in the photograph (shows a spiculated “sunburst” pattern and Codman triangle). Which of the following is the most likely diagnosis?"}],"o":[["A","Ewing sarcoma"],["B","Osteoid osteoma"],["C","Osteomyelitis"],["D","Osteosarcoma"],["E","Stress fracture"]],"a":"D"},{"id":"3235","b":10,"n":24,"s":[{"p":"A 12-year-old girl is brought to the clinic by her parents for evaluation of decreased exercise tolerance and increased lethargy. Her parents say she becomes short of breath with minimal exertion, and for the past 2 weeks her gums have bled when she brushes her teeth. Temperature is 36.7°C (98°F); blood pressure and pulse are normal. Physical examination demonstrates pallor and hepatosplenomegaly. Laboratory results are as follows:"},{"ul":["Hemoglobin: 6.8 g/dL","Platelets: 20,000/mm³","Leukocytes: 40,000/mm³","Blast cells: 15%"]},{"p":"An extensive workup indicates that the patient has acute lymphoblastic leukemia, and the parents are informed that she will need chemotherapy. The parents do not consent to the treatment plan because they believe that the side effects will be too severe and that their child’s quality of life will be poor. Despite an ethics consultation and a lengthy discussion about the benefits of treatment and likely consequences if therapy is withheld, the parents insist on taking her home without scheduling follow-up treatment. Which of the following is the most appropriate next step in the management of this patient?"}],"o":[["A","Comply with the parents' wishes"],["B","Obtain a court order for chemotherapy"],["C","Proceed with chemotherapy immediately"],["D","Provide supportive treatment only"],["E","Recommend transfer of care to another provider"]],"a":"B"},{"id":"2516","b":10,"n":25,"s":[{"p":"A 4-year-old boy is brought to the office due to unusual behavior and concerns about intellectual development. His parents state that “he doesn’t speak a lot and doesn’t seem to listen.” They describe him as a slow learner who uses only single words and frequently mumbles. The patient is able to recognize a circle and the colors yellow and red, but he struggles to recognize other shapes and colors. He scribbles but does not draw lines. The patient crawled at 7 months and walked by 13 months. When he briefly attended preschool, he refused to speak at all and preferred to play with toy cars by himself. He was asked to leave the school due to daily temper tantrums in which he became hyperactive and banged his head with his hands when the teacher tried to redirect him. The patient was born at term from an uncomplicated pregnancy and delivery, and his physical growth has been normal. Weight and height are at the 50th percentile. During the examination, the patient refuses to speak with the physician and sits in the corner lining up toy cars. When his mother attempts to divert his attention from playing, he has a temper tantrum and begins to hit his head. A brief physical examination is normal. Which of the following is the most likely explanation for this child’s behavior?"}],"o":[["A","Autism spectrum disorder"],["B","Developmental language disorder"],["C","Fragile X syndrome"],["D","Global developmental delay"],["E","Lesch-Nyhan syndrome"],["F","Selective mutism"],["G","Stereotypic movement disorder"]],"a":"A"},{"id":"2467","b":10,"n":26,"s":[{"p":"A 2-day-old boy in the newborn nursery was born at 39 weeks gestation to a 38-year-old woman by vaginal delivery. The mother received epidural fentanyl for severe painful contractions during labor, but the delivery was uncomplicated. Since birth, the boy has shown little interest in breast or bottle feeding. He spit up the last feed but has not vomited. He has not yet passed meconium. Physical examination shows a newborn with generalized hypotonia, a flat facial profile, low-set folded earlobes, and a single transverse crease on each palm. His abdomen is firm and distended. Digital rectal examination is notable for a tight anal canal and relieves an expulsion of gas and stool. Abdominal x-ray shows markedly distended loops of bowel with no gas in the rectum. What is the most likely mechanism for his findings?"}],"o":[["A","Constipation from decreased levels of thyroxine"],["B","Failure of neural crest cell migration during fetal intestinal development"],["C","Intestinal ileus from exposure to maternal epidural analgesia"],["D","Intestinal obstruction from inspissated meconium"],["E","Invagination of a part of the intestine into itself"]],"a":"B"},{"id":"3657","b":10,"n":27,"s":[{"p":"A 2-day-old girl develops seizures and a bulging anterior fontanelle. Temperature is 36.8°C (98.2°F), pulse is 180/min, and capillary refill is >4 seconds. Cardiac examination reveals tachycardia. Neurologic examination shows rhythmic contractions of the upper extremities, tongue thrusting, and lip smacking. Head ultrasound is shown (demonstrates hyperechoic material/blood within the germinal matrix extending into the lateral ventricles). Which of the following conditions most likely led to this patient’s condition?"}],"o":[["A","Arteriovenous malformation"],["B","Berry aneurysm"],["C","Congenital infection"],["D","Placental abruption"],["E","Prematurity"]],"a":"E"},{"id":"3830","b":10,"n":28,"s":[{"p":"A 6-year-old boy with cystic fibrosis is brought to the office for shortness of breath. He has had a worsening, productive cough over the past week and now has fever, chills, and difficulty breathing. His vaccinations are up to date. Weight is at <5th percentile and height is at the 10th percentile. His temperature is 38.9°C (102°F), blood pressure is 122/80 mm Hg, pulse is 118/min, and respirations are 28/min. Pulse oximetry shows an oxygen saturation of 91%. Physical examination shows a tired-appearing boy with nasal flaring, intercostal retractions, and a barrel-shaped chest. Auscultation reveals diffuse bilateral wheezing and crackles. Clubbing of the fingers and toes (exhibit) is present. Sputum culture results are pending. What is the most likely causative organism of this patient’s pneumonia?"},{"p":"K. Streptococcus pneumoniae"}],"o":[["A","Burkholderia cepacia complex"],["B","Cryptococcus neoformans"],["C","Histoplasma capsulatum"],["D","Klebsiella pneumoniae"],["E","Legionella pneumophila"],["F","Listeria monocytogenes"],["G","Mycobacterium avium complex"],["H","Pneumocystis jirovecii"],["I","Pseudomonas aeruginosa"],["J","Staphylococcus aureus"]],"a":"J"},{"id":"9566","b":10,"n":29,"s":[{"p":"The following vignette applies to the next 2 items. A 15-year-old girl comes to the office because her menses have not started. She feels embarrassed because her friends have been “developing” and she looks younger than her peers. The patient has no headaches, visual changes, abdominal pain, or behavior changes. Her mother and maternal grandmother began menstruating around age 13. The patient is not sexually active and is not on contraception. Height is <3rd percentile and weight is at the 20th percentile. Vital signs are normal. Physical examination shows no breast development, normal external female genitalia, and Tanner stage 1 pubic hair development. Urine β-hCG is negative."},{"p":"Which of the following is the best next step in management of this patient?"}],"o":[["A","17-hydroxyprogesterone level"],["B","Brain MRI"],["C","Pelvic ultrasound"],["D","Reassurance and observation"],["E","Serum testosterone level"],["F","Serum TSH level"]],"a":"C"},{"id":"9563","b":10,"n":30,"s":[{"p":"(Continued from previous question) The patient undergoes further evaluation with a pelvic ultrasound, which reveals a prepubertal uterus with small ovaries. Laboratory findings are as follows:"},{"ul":["FSH: 60 mU/mL (normal: <40)","LH: 30 mU/mL"]},{"p":"Which of the following is the most likely underlying cause of the patient’s condition?"}],"o":[["A","Abnormal development of Müllerian duct"],["B","Congenital absence of an X chromosome"],["C","Complete androgen receptor insensitivity"],["D","Congenital GnRH deficiency"],["E","Excess endogenous glucocorticoid production"],["F","Severe calorie restriction and deficiency"]],"a":"B"},{"id":"2431","b":10,"n":31,"s":[{"p":"A 3-year-old boy is brought to the emergency department for evaluation of a rash. The rash started on his face yesterday and has since spread to his chest, back, and arms. He has also had a runny nose, dry cough, and fever for the past week. The patient is irritable and uninterested in playing. He has not received vaccinations since age 6 months and takes no medications. A few weeks ago, he went on a camping trip in North Carolina but has not traveled outside the country. Temperature is 40.6°C (105°F), pulse is 130/min, and respirations are 24/min. Examination shows a tired-appearing boy with watery and injected bilateral conjunctivae. Tiny white round lesions are present on the buccal mucosa next to the first and second upper molars. The oropharynx and tonsils are erythematous. Small, soft, mobile lymph nodes are palpated along the anterior and posterior cervical chains. The nontender, blanching rash is shown (erythematous maculopapular rash). Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Adenovirus"],["B","Erythema infectiosum"],["C","Kawasaki disease"],["D","Measles"],["E","Rocky Mountain spotted fever"],["F","Roseola"],["G","Rubella"],["H","Scarlet fever"]],"a":"D"},{"id":"4662","b":10,"n":32,"s":[{"p":"A 14-year-old boy is brought to the office by his camp counselor due to a tick bite. He arrived at summer camp in Vermont earlier today and spent the afternoon outdoors. About an hour ago, the patient noticed a tick attached to his right thigh. He has no fever or pain at the site and has no chronic medical conditions. Vital signs are normal. Physical examination shows a small, brown tick attached to the right medial thigh with an area of erythema 3 mm in diameter. The remainder of the examination is unremarkable. Which of the following is the best next step in management of this patient?"}],"o":[["A","Allow the tick to detach spontaneously and obtain Lyme disease serology"],["B","Apply petroleum jelly and prescribe doxycycline for 21 days"],["C","Crush the tick and prescribe single-dose doxycycline"],["D","Puncture the body of the tick and prescribe amoxicillin for 21 days"],["E","Remove the tick with a small forceps and reassure the patient"]],"a":"E"},{"id":"2867","b":10,"n":33,"s":[{"p":"A 2-year-old boy is brought by his mother to the emergency department due to a high-grade fever that is resistant to acetaminophen. For the last 4 days, the child has been very irritable. He has been coughing frequently and has a poor appetite. Other than the occasional runny nose this winter, the patient has had no acute illnesses. He takes no medications, and immunizations are up to date. Temperature is 38.8°C (102.2°F), blood pressure is 90/60 mm Hg, pulse is 119/min, and respirations are 24/min. Examination shows a well-nourished child who is crying in his mother’s lap. Palpation reveals enlarged cervical lymph nodes and a liver edge that is 2.5 cm below the costal margin. A spleen tip is also palpable. Scattered bruises are present throughout the trunk. Lab results are as follows:"},{"ul":["Hemoglobin: 7.0 g/dL","Platelets: 5,000/mm³","Leukocytes: 81,100/mm³","Blasts: 90%","Lymphocytes: 10%"]},{"p":"Peripheral smear shows blast cells with fine nuclear chromatin, small nucleoli, and scant agranular cytoplasm. Chest x-ray is normal. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute lymphoblastic leukemia"],["B","Burkitt lymphoma"],["C","Chronic lymphocytic leukemia"],["D","Hodgkin lymphoma"],["E","Multiple myeloma"]],"a":"A"},{"id":"2480","b":10,"n":34,"s":[{"p":"A 3-year-old boy is brought to the office by his parents for the evaluation of dry eyes and photophobia. He has some difficulty in adapting to darkness. He is a very poor eater, and his diet consists mainly of canned foods, and very rarely, fresh vegetables or milk. Examination reveals dry, scaly skin, follicular hyperkeratosis in the extensor surfaces of the extremities, and dry, silver-gray plaques on the bulbar conjunctiva. What is the most likely diagnosis of this patient?"}],"o":[["A","Vitamin A deficiency"],["B","Thiamine deficiency"],["C","Ariboflavinosis"],["D","Scurvy"],["E","Hypervitaminosis A"]],"a":"A"},{"id":"13219","b":10,"n":35,"s":[{"p":"A 6-month-old boy is brought to the emergency department for lethargy and poor feeding. For the past 4 days, the infant has been sleepier than normal and eating less. His normal daily intake includes 26 oz of formula and a combination of fruit, cereal, honey, and yogurt; however, he has consumed only 10 oz of formula daily in recent days. This morning, when his mother lifted him from his crib, “he was completely floppy.” The patient has had no vomiting, fever, abnormal movements, or known trauma. He has had frequent wet diapers daily but has not stooled for a week. Until this past week, the patient was able to sit unsupported and reach for toys. His prenatal course and delivery were uncomplicated, and he takes no daily medications. Immunizations are up to date. Weight and length are at the 25th percentile. Temperature is 36.7°C (98.1°F), pulse is 108/min and respirations are 36/min. Examination reveals a severely hypotonic and lethargic infant who cries faintly while lying on the examination table. Which of the following additional findings would most likely be seen on physical examination of this patient?"}],"o":[["A","Asymmetric patellar reflexes"],["B","Bulging fontanelle"],["C","Constricted pupils"],["D","Hyperactive bowel sounds"],["E","Muscle fasciculations"],["F","Ptosis"],["G","Sustained ankle clonus"]],"a":"F"},{"id":"15319","b":11,"n":1,"s":[{"p":"A 5-year-old girl is brought to the office by her mother and the mother’s boyfriend due to leg pain. One week ago, the boyfriend saw the patient fall onto the living room floor after climbing on a couch. Since the incident, she has had persistent leg pain that appears to be worse at night, and for the last 2 days she has been refusing to walk, asking her mother to carry her. The patient has no chronic medical conditions but has had a mild, nonproductive cough for the past month. Temperature is 38.3°C (100.9°F); all other vital signs are normal. Height and weight are at the 20th percentile. Examination shows a pale child. The abdomen is nontender and the liver is palpated 3 cm below the costal margin. Palpation of the bilateral anterior proximal tibias elicits pain. There are a few scattered bruises across the chest and back. The remainder of the examination shows no abnormalities. Complete blood count results are as follows:"},{"ul":["Hemoglobin: 8 g/dL","Platelets: 30,000/mm³","Leukocytes: 3,000/mm³"]},{"p":"Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Acute lymphoblastic leukemia"],["B","Aplastic anemia"],["C","Immune thrombocytopenia"],["D","Infectious mononucleosis"],["E","Juvenile idiopathic arthritis"],["F","Nonaccidental trauma"],["G","Osteomyelitis"]],"a":"A"},{"id":"4279","b":11,"n":2,"s":[{"p":"A 6-year-old girl is brought to the office by her mother for evaluation of abdominal pain. The child has vomited a few times since the pain started this morning. The pain is diffuse, constant, and moderate in intensity. The patient has had no fevers, diarrhea, or bloody stools. Her mother says, “I was wondering if the pain could be due to a bug that’s been going around at school.” She first noticed an erythematous, macular rash over her daughter’s legs and back 2 days ago that has become darker and more confluent today. The patient has a history of moderate persistent asthma for which she uses an inhaled fluticasone inhaler daily and albuterol as needed for wheezing. Her maternal aunt has systemic lupus erythematosus, and her paternal cousin has acute lymphoblastic leukemia that is in remission. Blood pressure is 95/60 mm Hg. Physical examination shows a mildly uncomfortable-appearing girl lying on the table. The abdomen is soft and has diffuse mild tenderness without rebound, guarding, or appreciable masses. A palpable, nonblanching rash is noted over the legs and back. The right knee is mildly swollen and painful with passive range of motion. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hemoglobin: 13.5 g/dL","Platelets: 350,000/mm³","Leukocytes: 9,100/mm³"]},{"p":"Serum chemistry"},{"ul":["Sodium: 140 mEq/L","Potassium: 3.6 mEq/L","Chloride: 105 mEq/L","Bicarbonate: 25 mEq/L","Blood urea nitrogen: 8 mg/dL","Creatinine: 0.4 mg/dL","Calcium: 9.2 mg/dL","Glucose: 118 mg/dL"]},{"p":"Urinalysis"},{"ul":["Specific gravity: 1.022","Protein: +1","Blood: large","Glucose: negative","Ketones: negative","Leukocyte esterase: negative","Nitrites: negative"]},{"p":"Which of the following glomerular abnormalities is most likely present in this patient?"}],"o":[["A","Glomerular basement membrane thickening"],["B","Glomerular basement membrane thinning"],["C","Linear deposition of IgG on the basement membrane"],["D","Localized areas of mesangial sclerosis and collapse"],["E","Mesangial deposition of IgA"],["F","Podocyte fusion"]],"a":"E"},{"id":"15854","b":11,"n":3,"s":[{"p":"An 8-year-old boy is brought to the office by his parents due to difficulty at school. The boy’s teacher reported that he is disruptive to other students and his behavior has worsened over the course of the year. He has difficulty making friends due to his annoying behavior and has trouble sitting still and focusing. At home, the boy is active and affectionate but can easily become irritable, and he has trouble sharing toys with his younger siblings. His mother says, “Everything seems okay, and then suddenly he will start shouting and throwing his toys or occasionally hit his brothers. He routinely forgets to do his homework and chores despite my reminding him over and over, and he gets angry and argumentative when he is reprimanded.” Medical history is insignificant. The patient sleeps and eats well. On examination, he is noted to be fidgety and interrupts the conversation with various questions and comments. In addition to psychosocial interventions, which of the following medications would be most effective for this patient?"}],"o":[["A","Atomoxetine"],["B","Bupropion"],["C","Clonidine"],["D","Fluoxetine"],["E","Haloperidol"],["F","Methylphenidate"],["G","Risperidone"]],"a":"F"},{"id":"3872","b":11,"n":4,"s":[{"p":"A 2-hour-old boy is evaluated in the newborn nursery due to cyanosis. The boy was born at 38 weeks gestation via spontaneous vaginal delivery to a primigravida mother whose pregnancy and delivery were uncomplicated. When the mother attempted to breastfeed in the first hour of life, the patient latched and sucked well but began to appear blue around the lips and face. He began crying and turned pink when he was removed from the breast. He has voided and passed meconium. The patient’s weight is appropriate for gestational age. Heart rate and 4-extremity blood pressures are normal. Examination shows a nondysmorphic neonate with mild cyanosis at rest. Auscultation shows clear lungs and no murmurs. There are no intercostal retractions or stridor. Peripheral pulses are strong and symmetric. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Choanal atresia"],["B","Laryngomalacia"],["C","Tetralogy of Fallot"],["D","Tracheoesophageal fistula with esophageal atresia"],["E","Transient tachypnea of the newborn"],["F","Transposition of the great arteries"]],"a":"A"},{"id":"4852","b":11,"n":5,"s":[{"p":"A newborn boy is brought to the nursery for evaluation after delivery. The mother received no prenatal care but reports that the pregnancy was uncomplicated and she was healthy. The infant was born via spontaneous vaginal delivery and required no resuscitation. Apgar scores were 8 and 9 at 1 and 5 minutes, respectively. On examination, the infant is below the 3rd percentile for weight, 25th percentile for length, and 50th percentile for head circumference. Hepatosplenomegaly is present on examination. Over the next 48 hours, the infant develops jaundice, clear rhinorrhea, and a maculopapular rash on the feet and buttocks that later desquamates. Which of the following congenital infections is most likely in this patient?"}],"o":[["A","Cytomegalovirus"],["B","HIV"],["C","Rubella"],["D","Syphilis"],["E","Toxoplasmosis"]],"a":"D"},{"id":"16356","b":11,"n":6,"s":[{"p":"A 6-year-old boy is brought to the emergency department due to an injury to his left arm. About an hour ago, he was jumping on the bed when he bounced off and landed on his outstretched left hand. He cried and has not wanted to use the arm since then. The patient has no chronic medical conditions. Examination shows mild edema of the left distal forearm with intact sensation and pulses distally. Palpation of the forearm produces sharp pain. The patient refuses to move the wrist. Radiograph is shown in the image (greenstick fracture). The forearm is immobilized. This patient is at greatest risk for developing which of the following long-term complications?"}],"o":[["A","Avascular necrosis"],["B","Chronic osteomyelitis"],["C","Limb length discrepancy"],["D","Limited range of supination and pronation"],["E","No long-term complications"]],"a":"E"},{"id":"4890","b":11,"n":7,"s":[{"p":"A 12-hour-old girl in the neonatal intensive care unit has bilious emesis. She was born at 35 weeks gestation by vaginal delivery to a 22-year-old woman who did not receive prenatal care and used cocaine during her pregnancy. The infant has urinated but has not had a bowel movement. She was able to take 2 bottle feeds by mouth but has been vomiting green fluid since the third feed. Birth weight was 2 kg (4 lb  6 oz), which is small for gestational age. Temperature is 36.9°C (98.4°F), pulse is 160/min, and respirations are 40/min. The abdomen is distended. The rest of the examination is unremarkable. Abdominal x-ray is shown in the exhibit (triple bubble sign). Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Cocaine withdrawal"],["B","Duodenal atresia"],["C","Hirschsprung disease"],["D","Jejunal atresia"],["E","Necrotizing enterocolitis"],["F","Pyloric stenosis"]],"a":"D"},{"id":"2441","b":11,"n":8,"s":[{"p":"A 15-year-old boy is brought to the office for the first time by his parents for behavioral difficulties. The family has just moved to the area, and the patient has had difficulty in school switching between tasks and keeping his attention focused in a large classroom. He was previously in a small classroom with one-on-one teaching and was able to complete most activities with help. The patient’s developmental history is notable for speaking his first word at age 19 months and walking at age 20 months. His mother also had learning difficulties, but she was able to graduate from high school with extensive tutoring. Genetic testing demonstrates hypermethylation at the FMR1 gene. Which of the following findings would most likely be present on the patient’s physical examination?"}],"o":[["A","Arachnodactyly"],["B","Gynecomastia"],["C","Hemihyperplasia"],["D","Macroorchidism"],["E","Obese habitus"],["F","Short stature"],["G","Smooth philtrum"]],"a":"D"},{"id":"4826","b":11,"n":9,"s":[{"p":"A 4-week-old male infant with hypoplastic left heart syndrome has had difficulty feeding and an episode of vomiting over the last 24 hours. He was born at term via normal spontaneous vaginal delivery. The patient underwent palliative heart surgery at age 1 week; the procedure involved cardiotomy and extensive intracardiac and aortic arch repair. His postoperative course was uncomplicated, and he has remained in the hospital for weaning of oxygen and titration of cardiac medications. Two additional palliative surgeries are planned. Temperature is 38.3°C (101°F), blood pressure is 80/40 mm Hg, pulse is 175/min, and respirations are 70/min. Pulse oximetry is 80% on room air. He is cyanotic and small for his age. Cardiopulmonary examination is notable for distant heart sounds, tachycardia, and tachypnea. Abdominal examination is normal. Chest radiographs from a week ago and today are shown in the exhibit (enlarged cardiac silhouette). Which of the following is the most likely cause of this patient’s acute presentation?"}],"o":[["A","Congestive heart failure"],["B","Endocarditis"],["C","Mediastinitis"],["D","Pericardial effusion"],["E","Pulmonary embolism"]],"a":"D"},{"id":"2395","b":11,"n":10,"s":[{"p":"A 16-year-old girl comes to the office for evaluation of painful menstrual periods. The patient underwent menarche at age 13 and initially had irregular menses. Her menstrual cycles now occur every 30 days, with 4 days of moderate bleeding. Her menses have become increasingly painful; lower abdominal pain starts a few hours prior to menses and lasts 1 or 2 days with associated fatigue, dizziness, and diarrhea. She misses school at least 1 day per month due to the pain but is able to maintain her grades and has no pain or other symptoms after completion of menses. The patient has a history of depression, for which she sees a therapist, but has had no recent changes in mood. She recently became sexually active and uses condoms for contraception. Her last menstrual period was a week ago. Vital signs are normal. Pelvic examination shows normal external genitalia and a clear discharge emerging from the cervical os. On bimanual examination, the uterus is mobile, nontender, and normal in size and contour. Bilateral adnexa have no masses or tenderness. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Adenomyosis"],["B","Endometriosis"],["C","Pelvic inflammatory disease"],["D","Primary dysmenorrhea"],["E","Somatic symptom disorder"]],"a":"D"},{"id":"15320","b":11,"n":11,"s":[{"p":"A 4-year-old boy is brought to the office by his mother due to bruising. Over the last month, he has developed multiple bruises along his chest, back, and legs. The patient normally is very active and enjoys playing outside with his older siblings. However, he has been more tired than usual and takes longer naps. He has also had a poor appetite. This past week, his gums have been oozing blood during tooth brushing. The patient takes no daily medications. Last year, he had a tonsillectomy with no complications. His paternal uncle has hemophilia. Vital signs are normal. The patient appears pale and tired. Examination shows a few hematomas on the buccal mucosa. Scattered bruises are present on the shins, anterior chest, and back. Nontender anterior cervical lymphadenopathy is palpated bilaterally. Abdominal examination shows hepatosplenomegaly. No joint swelling is present. Further evaluation of this patient would most likely reveal a deficiency in which of the following?"}],"o":[["A","Collagen synthesis"],["B","Factor VIII production"],["C","Factor XIII production"],["D","Platelet production"],["E","Vitamin K-dependent gamma-carboxylation"],["F","Von Willebrand factor production"]],"a":"D"},{"id":"4842","b":11,"n":12,"s":[{"p":"A 2-month-old boy is brought to the emergency department for evaluation of cyanosis. He became fussy and sweaty while taking his bottle, and his lips “turned blue” for several minutes during the feeding. The infant has had similar episodes during feeding and crying, but these resolved quickly. The patient was born at 39 weeks gestation, and his birth weight was average for gestational age. His weight gain has been slow, currently at the 5th percentile. He is fed pumped breast milk fortified with powdered formula to augment caloric intake. Temperature is 37°C (98.6°F), blood pressure is 80/50 mm Hg, pulse is 150/min and respirations are 55/min. On examination, the infant is ill-appearing, agitated, cyanotic, and tachypneic. Cardiac auscultation reveals a grade 2/6 crescendo-decrescendo systolic ejection murmur at the left upper sternal border and a single second heart sound. The patient is placed in a knee-chest position immediately. This maneuver improves the patient’s condition predominantly by which of the following mechanisms?"}],"o":[["A","Decreased pulmonary vascular resistance"],["B","Decreased systemic vascular resistance"],["C","Increased pulmonary vascular resistance"],["D","Increased systemic vascular resistance"],["E","Increased systemic venous return"]],"a":"D"},{"id":"2378","b":11,"n":13,"s":[{"p":"An 18-month-old boy is brought to the emergency department an hour after drinking liquid oven cleaner from an unlocked kitchen cabinet. His parents tried to give him water and milk, but he has difficulty swallowing. The boy also has blood-tinged oral secretions. His vital signs are stable. Examination shows an anxious child who is crying and drooling. His lips and chin are swollen and erythematous. He has no stridor and his breathing pattern appears normal. Lungs are clear to auscultation. His shirt is covered in oven cleaner. Which of the following is the best next step in management of this patient?"}],"o":[["A","Barium swallow study"],["B","Clothing removal"],["C","Intravenous corticosteroids"],["D","Nasogastric feeding tube"],["E","Nasogastric lavage"],["F","Neutralization with vinegar"],["G","Upper gastrointestinal endoscopy"]],"a":"B"},{"id":"4840","b":11,"n":14,"s":[{"p":"A 6-year-old girl with Down syndrome is brought to the clinic due to behavioral changes. Over the past month, she has stopped running, tripped frequently while walking, and accidentally knocked toys over more often than normal. The patient was toilet-trained at age 4, but recently she began having frequent urinary accidents while playing and has started wearing a diaper again. Physical examination shows an ataxic gait. Muscle tone is decreased throughout. Bilateral ankle deep tendon reflexes are hyperreflexic. When the soles of the feet are firmly stroked, the big toes move upward and the other toes fan out. Urinalysis is normal. Which of the following is the most likely cause of this patient’s presentation?"}],"o":[["A","Alzheimer disease"],["B","Atlantoaxial instability"],["C","Hypothyroidism"],["D","Spinal cord infarction"],["E","Tethered cord syndrome"]],"a":"B"},{"id":"16830","b":11,"n":15,"s":[{"p":"A 14-year-old girl is brought to the clinic for leg pain. She first noticed achiness in the ankles 3 months ago after starting a daily walking routine on a local trail to improve her health. The aches tend to be worse in the morning but improve over the day. The pain spread to the knees, elbows, and wrists over the past month. Prior to this, the patient had been sedentary and spent most of her time indoors watching television. In addition to the walking routine, she has transitioned to a plant-based diet. The patient feels tired most days despite sleeping 9 hours a night. Her weight has improved from the 95th percentile to the 90th percentile over the past 3 months, and her height is stable at the 75th percentile. Temperature is 37.3°C (99.1°F), pulse is 80/min, and respirations are 16/min. Cardiopulmonary examination is normal. Bilateral ankles, knees, elbows, and wrists have mild swelling and tenderness to palpation. Which of the following medications is most appropriate for this patient’s condition?"}],"o":[["A","Ceftriaxone"],["B","Doxycycline"],["C","Levothyroxine"],["D","Naproxen"],["E","Vitamin D and calcium"]],"a":"D"},{"id":"3990","b":11,"n":16,"s":[{"p":"A 1-month-old boy is brought to the office for a routine visit. His prenatal and birth histories are unremarkable. His vital signs and pulse oximetry are normal. Examination shows a harsh, III/VI holosystolic murmur over the left lower sternal border. Palpation indicates no thrill over the precordial region. Brachial and femoral pulses are 2+ and equal. The skin is pink and well perfused. ECG is normal. Which of the following is the most appropriate course of action?"}],"o":[["A","Digoxin and diuretic therapy"],["B","Echocardiography"],["C","Oxygen administration"],["D","Prostaglandin E1 therapy"],["E","Reassurance, no further workup"],["F","Surgical repair"]],"a":"B"},{"id":"2758","b":11,"n":17,"s":[{"p":"A 6-month-old girl is brought to the physician with a rash on her face, arms, and chest. She is constantly scratching and rubbing her arms, and her parents are having a hard time keeping her hands away from the affected areas. The girl drinks breast milk and formula and has not started solid foods. She lives in a carpeted apartment with no pets and bathes every 2 days with a body wash that is free of fragrance, alcohol, and dyes. The patient has not been exposed to new clothing, detergents, lotions, or other substances. Physical examination shows erythematous, scaly lesions on her cheeks, chest, and arms. There are similar lesions on her trunk and forehead. There is no rash in the diaper area, palms, or soles. Which of the following is the most likely diagnosis?"}],"o":[["A","Allergic contact dermatitis"],["B","Atopic dermatitis"],["C","Eczema herpeticum"],["D","Erythroderma"],["E","Plaque psoriasis"],["F","Scabies"],["G","Seborrheic dermatitis"]],"a":"B"},{"id":"2435","b":11,"n":18,"s":[{"p":"A newborn girl is evaluated in the delivery room for respiratory distress. The patient was born 15 minutes ago by spontaneous vaginal delivery at 37 weeks gestation to a mother who received no prenatal care. Temperature is 37°C (98.6°F), pulse is 176/min, and respirations are 70/min. Pulse oximetry is 82% on room air. Physical examination shows grunting; subcostal and suprasternal retractions; and cyanosis of the lips and tongue. The chest appears rounded and the abdomen appears flat. Auscultation reveals absent breath sounds on the left and clear breath sounds on the right. Heart sounds are loudest in the right chest. Which of the following is the best next step in management of this patient?"}],"o":[["A","Broad-spectrum antibiotics"],["B","Chest tube placement"],["C","Endotracheal intubation"],["D","Pericardiocentesis"],["E","Prostaglandin E1 administration"],["F","Surfactant administration"]],"a":"C"},{"id":"4817","b":11,"n":19,"s":[{"p":"The following vignette applies to the next 2 items."},{"p":"A 4-day-old, full-term boy is brought to the office for his first visit after an uncomplicated vaginal delivery and unremarkable newborn nursery course. The patient’s mother, gravida 1 para 1, has blood type A positive, and prenatal laboratory results and ultrasound were normal. Birth weight was 3.4 kg (7 lb  8 oz) and length was 48.5 cm (18 in). He has been exclusively breastfed since birth and nurses for 10 minutes on each breast every 4 hours. The mother’s milk began to come in this morning. The infant passed several dark brown, sticky, meconium stools during the first 2 days of life, but his last stool was yesterday and dark green. He has 2 wet diapers each day but has not voided today. The neonate’s current weight is 3 kg (6 lb  10 oz). He has scleral icterus and jaundice of the face, chest, and abdomen. The rest of his physical examination is normal. Laboratory results are as follows:"},{"ul":["Total bilirubin: 14 mg/dL","Direct bilirubin: 0.9 mg/dL"]},{"p":"Item 1 of 2 Which of the following is the most likely cause of this infant’s hyperbilirubinemia?"}],"o":[["A","Alloimmune hemolytic disease"],["B","Biliary atresia"],["C","Breast milk jaundice"],["D","Breastfeeding jaundice"],["E","Dubin-Johnson syndrome"],["F","Galactosemia"]],"a":"D"},{"id":"4818","b":11,"n":20,"s":[{"p":"Item 2 of 2 Which of the following is the best next step in management of this patient?"}],"o":[["A","Breastfeed every 2-3 hours"],["B","Continue current feeding regimen, follow up in 1 week"],["C","Perform right upper quadrant ultrasound"],["D","Prescribe phototherapy and exchange transfusion"],["E","Switch to a cow’s milk-based formula"],["F","Switch to soy formula"]],"a":"A"},{"id":"2688","b":11,"n":21,"s":[{"p":"A 15-year-old boy collapses suddenly while playing basketball with his friends. The boy played basketball every weekend without any symptoms and was in his usual state of health prior to this event. He has no known past medical history and takes no medications. Family history is significant for a maternal uncle who died at age 25 for unknown reasons. Cardiopulmonary resuscitation is unsuccessful and the patient is pronounced dead. Post-mortem examination would most likely show which of the following?"}],"o":[["A","Abnormal brain mass"],["B","Coronary atherosclerosis"],["C","Hypertrophic cardiomyopathy"],["D","Mutation in the LQT1 gene"],["E","No underlying disease"],["F","Pulmonary embolus"],["G","Ruptured aortic aneurysm"]],"a":"C"},{"id":"4889","b":11,"n":22,"s":[{"p":"You are called to the nursery to evaluate a newborn infant. The mother is a 24-year-old primigravida. Her pregnancy was complicated by preeclampsia. The infant was delivered at 39-weeks gestation via emergent cesarean section due to maternal hypertension and non-reassuring fetal heart tones. On examination, the infant’s weight is 2.6 kg (5 lb  11 oz) placing him in the 5th percentile, height is 18 inches (46 cm) placing him in the 5th percentile, and head circumference is 13 inches (33 cm) placing him in the 10th percentile. The infant’s head seems large for his body. There is a paucity of subcutaneous fat. The remainder of the physical examination is unremarkable. This infant is at risk for having (or developing) which of the following?"}],"o":[["A","Hip subluxation"],["B","Polycythemia"],["C","Hyperglycemia"],["D","Hyperthermia"],["E","Hypercalcemia"]],"a":"B"},{"id":"3418","b":11,"n":23,"s":[{"p":"A 3-year-old girl is brought to the emergency department with lethargy and fever. She had diarrhea for several days, and her parents say that “she suddenly took a turn for the worse”. The girl has refused liquids for the past 12 hours and has not urinated today. She has no allergies and takes no medications. Her temperature is 39.7°C (103.5°F), blood pressure is 60/28 mm Hg, and pulse is 145/min. On examination, she is lethargic and has poor skin turgor. Her capillary refill time is 5 seconds centrally. Despite numerous attempts, it is not possible to start a peripheral intravenous line, and the child’s condition continues to deteriorate. Which of the following is the best next step in management of this patient?"}],"o":[["A","Attempt arterial line placement"],["B","Attempt central venous catheter placement"],["C","Attempt intraosseous cannulation"],["D","Attempt nasogastric tube placement"],["E","Attempt peripheral intravenous line placement"],["F","Transport to intensive care unit for central venous catheter placement"]],"a":"C"},{"id":"4819","b":11,"n":24,"s":[{"p":"A 6-hour-old girl is evaluated in the newborn nursery due to respiratory distress. She was born at 37 weeks gestation via spontaneous vaginal delivery after induction of labor for preeclampsia with severe features. Since birth, the baby has not been able to feed due to tachypnea. Birth weight is at <3rd percentile for gestational age. Temperature is 37.2°C (99°F) and blood pressure is normal. Pulse oximetry is 96% saturation on room air. Examination reveals a plethoric infant. The head is normocephalic with an open and flat anterior fontanelle. Cardiac examination reveals sinus tachycardia and no murmurs. Pulmonary examination reveals tachypnea; breath sounds are clear throughout, and there are no retractions. The infant has normal female infantile genitalia. Chest x-ray shows clear lung fields and a normal cardiac silhouette. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hematocrit: 71% (42%-65%)","Platelets: 200,000/mm³ (150,000-300,000/mm³)","Leukocytes: 20,500/mm³ (9,400-24,000/mm³)"]},{"p":"Serum chemistry"},{"ul":["Glucose: 35 mg/dL (≥ 50 mg/dL)"]},{"p":"Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Congenital adrenal hyperplasia"],["B","Cyanotic heart disease"],["C","Dehydration"],["D","Glycogen storage disease"],["E","Polycythemia"],["F","Transient tachypnea of the newborn"]],"a":"E"},{"id":"13474","b":11,"n":25,"s":[{"p":"A 3-year-old girl is brought to the emergency department by ambulance after being found unresponsive in her family’s pool. She and her mother had been playing on the back porch until the mother went inside “for less than 1 minute” to answer the phone. When the mother came back outside, she found the girl floating face down in the pool. The mother immediately pulled her out and began rescue breathing, and the neighbor called an ambulance. The emergency medical team arrived 5 minutes later, at which time the patient was awake, alert, and coughing. She is an otherwise healthy girl with no prior hospitalizations. The patient lives at home with her parents and 16-year-old brother. On arrival, temperature is 36.7°C (98°F), blood pressure is 90/50 mm Hg, pulse is 104/min, and respirations are 20/min; pulse oximetry is 99% on room air. Physical examination shows a smiling, alert young girl running around the room. Heart rate and rhythm are regular, and the lungs are clear to auscultation with no adventitious sounds or increased work of breathing. Which of the following complications is this patient at greatest risk of developing?"}],"o":[["A","Arrhythmia"],["B","Cerebral edema"],["C","Hypovolemic shock"],["D","Pneumonia"],["E","Respiratory insufficiency"]],"a":"E"},{"id":"16831","b":11,"n":26,"s":[{"p":"A 3-year-old girl is brought to the clinic for evaluation of right knee swelling. Her mother first noticed the swelling and a limp 2 months ago but attributed them to roughhousing with her brother. Typically, the limping was present in the mornings and resolved by midday. However, while bathing the patient last night, her mother noticed that the right knee was more swollen than usual. The knee is not painful, and the patient has had no fever or rashes. Temperature is 37.5°C (99.5°F). She can bear weight on both legs but has a noticeable limp. The right knee is swollen and slightly warm. The overlying skin appears normal and intact. There is no tenderness to palpation. Peripheral pulses are normal. Sensation is intact. This patient is at greatest risk for which of the following complications?"}],"o":[["A","Atrioventricular conduction block"],["B","Inflammatory bowel disease"],["C","Intramuscular hemorrhage"],["D","Pulmonary fibrosis"],["E","Uveitis"]],"a":"E"},{"id":"2451","b":12,"n":1,"s":[{"p":"A 3-year-old boy is brought to the emergency department by his mother due to cough and difficulty breathing. The patient was playing outside with his older sisters when he started coughing uncontrollably. He has been coughing with audible wheezing for the past 30 minutes. The patient has no chronic medical conditions but has had rhinorrhea for the past few days. Temperature is 36.7°C (98.1°F), blood pressure is 92/48 mm Hg, pulse is 114/min, and respirations are 48/min. Pulse oximetry is 91% on room air. The right lung has diminished breath sounds and expiratory wheezing. The left lung is clear. Supplemental oxygen is applied. Chest x-ray reveals hyperinflation of the right lung and left mediastinal shift. Which of the following is the best next step in management of this patient?"}],"o":[["A","Chest CT scan"],["B","Chest tube placement"],["C","Epinephrine"],["D","Nebulized albuterol"],["E","Nebulized racemic epinephrine"],["F","Rigid bronchoscopy"]],"a":"F"},{"id":"15091","b":12,"n":2,"s":[{"p":"A 5-year-old girl is brought to the office by her parents due to problems at school. The patient’s teachers report that she is very quiet in class. When she does talk, she frequently uses the wrong verb tense and is occasionally teased by peers. Her parents report that she was slow to speak as a toddler, but they were not overly concerned as they had assumed that she was quiet and shy. The girl has a friend with whom she plays after school. The patient is able to dress herself, skip, tie her shoelaces, and draw a triangle. Physical examination, audiologic testing, and laboratory evaluation are normal. On examination, the girl is initially shy but warms up as the interview progresses. The patient’s speech is clear, but her vocabulary is limited and she uses simple sentences. She is able to count to 10 slowly. Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","Childhood-onset fluency disorder"],["B","Language disorder"],["C","Selective mutism"],["D","Social (pragmatic) communication disorder"],["E","Specific learning disability"],["F","Speech sound disorder"]],"a":"B"},{"id":"4248","b":12,"n":3,"s":[{"p":"A 4-year-old boy is brought to the clinic for worsening ear pain that started after completing a course of antibiotics for otitis media 2 weeks ago. For the past several nights, he has also been awakened by headaches; however, he feels better after vomiting in the morning. The patient has had recurrent ear infections since infancy but no other medical problems. Temperature is 38°C (100.4°F), blood pressure is 100/60 mm Hg, pulse is 95/min, and respirations are 18/min. Physical examination reveals an irritable child. Funduscopic examination is normal and extraocular motion is intact. The left tympanic membrane is bulging, erythematous, and opaque. The left mastoid is tender, erythematous, and swollen. Complete blood count results are as follows:"},{"ul":["Leukocytes: 17,000/mm³","Neutrophils: 80%","Lymphocytes: 15%","Monocytes: 2%"]},{"p":"Which of the following is the best next step in management of this patient?"}],"o":[["A","Antibiotics and follow-up in 2 days"],["B","Lumbar puncture"],["C","Mastoidectomy"],["D","MRI of the brain"],["E","Skull x-ray"]],"a":"D"},{"id":"4704","b":12,"n":4,"s":[{"p":"A 17-year-old girl is brought to the office due to a worsening rash on her left upper arm. The rash was the size of a dime when the patient initially noticed it 3 weeks ago, but it has since grown in size, developed a raised edge, and become increasingly itchy. She has applied moisturizing creams without improvement. The patient takes no medications and has no allergies. The rash is shown in the image (annular, erythematous plaque with central clearing and a raised, scaly border). What is the most likely diagnosis for this patient?"}],"o":[["A","Dermatophyte infection"],["B","Erythema migrans"],["C","Psoriasis"],["D","Subacute cutaneous lupus"],["E","Urticaria"]],"a":"A"},{"id":"4140","b":12,"n":5,"s":[{"p":"A 16-year-old girl is brought to the office for a routine health maintenance examination. She feels well and has no concerns. The patient is an honor student in tenth grade and plays varsity soccer. She eats a well-balanced diet. Depression screening is negative. The patient has tried marijuana “a few times” but does not use tobacco or alcohol. She has been sexually active with one partner for the past 2 years and takes an oral contraceptive daily. The patient’s parents have type 2 diabetes mellitus but are otherwise healthy. Her maternal grandfather died of a myocardial infarction at age 68. BMI is 24 kg/m². Vital signs and physical examination are normal. Which of the following is the best next step in evaluation of this patient?"}],"o":[["A","Chlamydia and gonorrhea testing"],["B","Electrocardiography"],["C","Fasting lipid panel"],["D","Hemoglobin A1c"],["E","Urine toxicology"]],"a":"A"},{"id":"15121","b":12,"n":6,"s":[{"p":"A 12-year-old boy is brought to the office by his mother for follow-up of behavioral problems. The patient has had poor attention, difficulty listening, and hyperactivity since kindergarten. Despite ongoing behavioral therapy, he continues to have problems at school and at home. He is easily distracted in the classroom and has difficulty sitting still and following instructions. His schoolwork is disorganized and sloppy and his grades are below his academic potential. At home, he annoys family members with his intrusive behavior, forgets his chores, and becomes moody and irritable when reprimanded. Pharmacological treatment options are discussed. The mother is opposed to stimulant medication and would like to consider alternatives. Which of the following is the most appropriate medication to recommend at this time?"}],"o":[["A","Atomoxetine"],["B","Bupropion"],["C","Dextroamphetamine"],["D","Imipramine"],["E","Methylphenidate"],["F","Modafinil"],["G","Valproate"]],"a":"A"},{"id":"2782","b":12,"n":7,"s":[{"p":"An 11-month-old girl is brought to the emergency department by her parents due to a rash. Yesterday, the patient developed a rash on her face that has now spread over her entire body. The parents say that she has been ill for the past 3 days with fever, cough, rhinorrhea, and “pink eye.” The patient has no other medical problems and has received all age-appropriate vaccinations as of age 6 months. She takes no medications and has no allergies. Approximately 3 weeks ago, the family returned from a trip to the Philippines for her grandfather’s funeral. The patient lives with her parents and several pets, including a dog, turtle, and new kitten. Temperature is 39.6°C (103.3°F), blood pressure is 80/50 mm Hg, pulse is 120/min and respirations are 30/min. The patient appears tired and irritable with dry mucous membranes. The conjunctivae are injected without discharge. The lungs are clear to auscultation. Examination shows a blanching, erythematous maculopapular rash covering the face and entire body except for the palms and soles. Which of the following infection-control measures is most effective in preventing the spread of this patient’s infection to others in the emergency department?"}],"o":[["A","Airborne precautions"],["B","Antibiotic prophylaxis"],["C","Antiviral prophylaxis"],["D","Passive immunization"],["E","Vitamin A"]],"a":"A"},{"id":"2669","b":12,"n":8,"s":[{"p":"A 7-year-old boy is brought to the emergency department after a seizure. He was watching television when he developed tonic-clonic movements lasting 5 minutes. The seizure stopped without intervention, but the boy had loss of urine and was confused afterward. The patient was born full term and has no known medical conditions. He has struggled academically in school and is often disruptive in class and unable to stay on task. Family history is significant for a maternal uncle with fragile X syndrome who lives in an assisted-living facility. On physical examination, the pupils are equal and reactive, and the fundi are normal. Mucous membranes are clear, and there is no cleft lip or palate or other facial dysmorphisms. The axillary and inguinal folds have multiple freckles; the chest and back have 6, darkly pigmented macules with smooth borders. This patient’s diagnosis is most commonly associated with which additional finding?"}],"o":[["A","Acoustic neuromas"],["B","Intracardiac tumor"],["C","Optic pathway gliomas"],["D","Testicular enlargement"],["E","Vascular malformations"]],"a":"C"},{"id":"4851","b
