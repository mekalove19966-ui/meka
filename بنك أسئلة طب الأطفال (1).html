<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك أسئلة طب الأطفال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf2f5;--card:#fff;--ink:#13243a;--mut:#5a6b7d;--line:#cdd8e0;--acc:#0b6e8a;--accink:#fff;--ok:#1c7a4b;--okbg:#dff3e8;--no:#b3372f;--nobg:#fbe4e1;--sel:#dcecf3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1822;--card:#16232f;--ink:#e4edf3;--mut:#93a6b6;--line:#2a3b4a;--acc:#5cc0dc;--accink:#06232d;--ok:#6fd49f;--okbg:#143826;--no:#ff8f85;--nobg:#40201d;--sel:#1b3444}}
:root[data-theme="dark"]{--bg:#0e1822;--card:#16232f;--ink:#e4edf3;--mut:#93a6b6;--line:#2a3b4a;--acc:#5cc0dc;--accink:#06232d;--ok:#6fd49f;--okbg:#143826;--no:#ff8f85;--nobg:#40201d;--sel:#1b3444}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;line-height:1.3;margin:8px 0 4px;font-weight:700}
h2{font-size:15px;margin:22px 0 8px;font-weight:600;color:var(--mut)}
.sub{color:var(--mut);margin:0 0 18px}
.by{margin:0 0 6px;font-weight:600;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.btn{border:0;background:var(--acc);color:var(--accink);border-radius:10px;padding:12px 22px;font-weight:600;min-height:46px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.go{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0;color:var(--mut);font-size:14px}
.hist li{padding:6px 0;border-top:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc)}
.q{direction:ltr;text-align:left;font:400 18px/1.65 "Source Serif 4",Georgia,serif}
.q p{margin:0 0 12px}.q ul{margin:0 0 12px;padding-left:22px}
.opts{display:grid;gap:8px;margin-top:16px;font-family:"Source Serif 4",Georgia,serif}
.opt{direction:ltr;text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:17px;line-height:1.5;width:100%}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:600 13px "IBM Plex Sans Arabic",sans-serif}
.opt.sel{background:var(--sel);border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt.ok b{background:var(--ok);color:var(--card);border-color:var(--ok)}
.opt.no b{background:var(--no);color:var(--card);border-color:var(--no)}
.fb{margin-top:14px;padding:10px 14px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--nobg);color:var(--no)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.score{font-size:44px;font-weight:700;line-height:1.2;margin:0}
.list{display:grid;gap:6px;margin-top:10px}
.item{display:flex;gap:10px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
.item span:last-child{direction:ltr;text-align:left;flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk{flex:none;width:22px;font-weight:700}.mk.ok{color:var(--ok)}.mk.no{color:var(--no)}
.tag{font-size:14px;color:var(--mut)}
.hero{background:#0b3c4f;color:#fff;margin:-20px -16px 0;padding:26px 20px 64px;border-radius:0 0 28px 28px;position:relative}
.hero h1{color:#fff;font-size:32px}.hero .sub{color:#b9d6e0;margin:0}.hero .by{color:#7fd3e8}
.tg{position:absolute;top:14px;inset-inline-end:14px;background:transparent;color:#fff;border-color:#ffffff55;font-size:13px;min-height:34px;padding:2px 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:-40px 0 18px;position:relative}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:13px;color:var(--mut);box-shadow:0 6px 20px rgba(10,40,60,.1)}
.stat b{display:block;font-size:24px;color:var(--ink);line-height:1.3}
.card{border-radius:16px;box-shadow:0 6px 24px rgba(10,40,60,.08)}
.opt{transition:border-color .15s,background .15s}.opt:hover{border-color:var(--acc)}
.nv{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.nv button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13px}
.nv .cur{outline:2px solid var(--acc);outline-offset:1px}.nv .done{background:var(--sel)}.nv .ok{background:var(--okbg);border-color:var(--ok)}.nv .no{background:var(--nobg);border-color:var(--no)}
.res{display:flex;gap:20px;align-items:center}.res h2{margin:0}
.ring{position:relative;width:120px;height:120px;flex:none}.ring svg{width:100%;height:100%}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.bk{margin-top:16px;display:grid;gap:6px;font-size:14px;color:var(--mut)}
.brow{display:grid;grid-template-columns:70px 1fr 48px;gap:10px;align-items:center}
.brow i{height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:block}.brow u{display:block;height:100%;background:var(--acc)}
.brow span:last-child{direction:ltr;text-align:end}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[{"id":"3241","b":1,"n":1,"s":[{"p":"A 16-year-old girl comes to the office for emergency contraception. She had unprotected sexual intercourse last night and is worried that she may become pregnant. Her last menstrual period was 1 week ago, and she has had regular menses since menarche. Physical examination is normal and urine pregnancy test is negative. After various emergency contraceptive options are discussed, the patient asks for a pill option and that her parents not be notified about this visit. In most states, which of the following is the most appropriate management of this patient?"}],"o":[["A","Obtain parental consent prior to providing emergency contraception"],["B","Prescribe misoprostol (prostaglandin E₁) pills"],["C","Provide levonorgestrel pill"],["D","Reassure patient that pregnancy is unlikely and no emergency contraception is required"],["E","Supply a short course of high-dose oral contraceptives"]],"a":"C"},{"id":"16223","b":1,"n":2,"s":[{"p":"A 6-month-old boy is brought to the office for a well-child visit. The patient sits with support, mouths toys, and responds to his name. He has not yet started babbling or using a pincer grasp. The patient drinks 24-28 oz daily of donated, pasteurized breast milk obtained through a local milk bank. He was adopted from Uganda at age 2 months. The only available birth history is that the patient was born full-term and that labor and delivery were uncomplicated. Family history is unknown. Immunizations are up to date. He has no chronic medical conditions and takes no medications. Height and weight are at the 20th and 40th percentiles, respectively. Head circumference is at the 30th percentile. The patient has no dysmorphic facial features. The anterior fontanel is open and flat, and the skull bones are soft and flexible to pressure. Bilateral swelling of the wrist is present. There is no bowing of the lower extremities. Cardiopulmonary and abdominal examinations are normal. An x-ray of the wrist is performed (shows metaphyseal widening with cupping and fraying). Which of the following is the most likely cause of this patient’s x-ray abnormality?"}],"o":[["A","Autoimmune inflammatory disorder"],["B","Autosomal recessive lysosomal storage disorder"],["C","Breast milk-transmitted infection"],["D","Congenital infection"],["E","Nonaccidental trauma"],["F","Vitamin deficiency"]],"a":"F"},{"id":"2445","b":1,"n":3,"s":[{"p":"A 6-month-old girl is brought to the physician for evaluation of irritability and listlessness. Her parents are concerned that the child cannot sit or roll even though she was able to do so several weeks before. The child was previously healthy except for 2 prior respiratory infections. On examination, the patient is hypotonic with hepatosplenomegaly and a protuberant abdomen. She has a bright red macula on ophthalmologic examination along with cervical lymphadenopathy. All deep-tendon reflexes are diminished. Which of the following is the most likely cause of this child’s developmental regression?"}],"o":[["A","β-hexosaminidase A deficiency"],["B","Galactocerebrosidase deficiency"],["C","Glucocerebrosidase deficiency"],["D","Lysosomal hydrolase deficiency"],["E","Sphingomyelinase deficiency"]],"a":"E"},{"id":"2945","b":1,"n":4,"s":[{"p":"An 8-year-old boy is brought to the clinic due to abdominal pain and dark urine. His parents report that the symptoms began a week ago. He has no history of fever, nausea, or vomiting and is eating normally. He has not had any previous abdominal pain or trauma. Vital signs are unremarkable. Examination shows scleral icterus and mild abdominal tenderness. An abdominal mass is palpable in the right upper quadrant. Laboratory results are as follows:"},{"ul":["Bilirubin, total: 6.5 mg/dL","Bilirubin, direct: 3.4 mg/dL","Amylase: 138 U/L","Lipase: 152 U/L (3-43 U/L)"]},{"p":"Ultrasonography shows an extrahepatic cystic mass and a normal gallbladder. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Biliary atresia"],["B","Biliary cyst"],["C","Cholangitis"],["D","Pancreatic pseudocyst"],["E","Viral hepatitis"]],"a":"B"},{"id":"3970","b":1,"n":5,"s":[{"p":"A 3-week-old boy is brought to the office due to worsening jaundice. A week ago, the parents noticed that the patient’s eyes and face looked yellow, and his trunk became increasingly yellow over the last 2 days. They describe the infant’s stool as consistently pale. The patient is exclusively breastfed and has been feeding well. The pregnancy and delivery were uncomplicated. Maternal blood type is O positive, and routine prenatal studies were normal. Temperature is 37.2°C (99°F), pulse is 140/min, and respirations are 50/min. Capillary refill is <2 seconds. Examination shows jaundice and hepatomegaly. Laboratory results are as follows:"},{"ul":["Hemoglobin: 15 g/dL","Total bilirubin: 10.3 mg/dL","Direct bilirubin: 8.1 mg/dL","Blood type: B positive","Coombs test: negative"]},{"p":"Which of the following is the most likely diagnosis?"}],"o":[["A","Biliary atresia"],["B","Breast milk jaundice"],["C","Crigler-Najjar syndrome"],["D","Erythroblastosis fetalis"],["E","Gilbert syndrome"],["F","Physiologic jaundice"]],"a":"A"},{"id":"14443","b":1,"n":6,"s":[{"p":"A 13-month-old girl is brought to the office by her mother due to concern about bruising. The mother first noticed bruising around her daughter’s eyes 2 weeks ago after the patient returned from a weekend at her father’s house. She recently started walking and falls frequently; the bruising was attributed to bumping her head on a coffee table. The bruising has since been persistent, and there is no other notable bruising on her body. The patient has no fever, vomiting, diarrhea, cough, or congestion. Three weeks ago, the patient recovered from influenza. The girl’s parents are divorced, and she spends most weekends with her father. Weight is 9 kg (20 lb), down from 9.5 kg (21 lb) a month ago. On examination, the patient has rapid, jerking movements of both eyes with infraorbital ecchymoses bilaterally. The abdomen is mildly distended with a 6-cm (2.4-in) palpable, firm mass anterior to the left flank. Which of the following is the most likely diagnosis?"}],"o":[["A","Child abuse"],["B","Immune thrombocytopenia"],["C","Leukemia"],["D","Neuroblastoma"],["E","Von Willebrand disease"],["F","Wilms tumor"]],"a":"D"},{"id":"3218","b":1,"n":7,"s":[{"p":"A 16-year-old boy is brought to the emergency department after loss of consciousness. The patient was riding his bicycle when he lost his balance and fell, hitting his head on the ground. The fall was witnessed by several friends who report that the boy lost consciousness for approximately 1 minute. There were no seizures following the event. The boy vomited twice in the ambulance and has a mild headache. He has no other medical conditions and takes no medications. Blood pressure is 121/67 mm Hg and pulse is 78/min. The patient is awake and alert. Examination shows a small bruise and an abrasion over the right temporal region. Neurological examination shows intact cranial nerves. Strength is 5/5 bilaterally. Sensations are intact and reflexes are equal. Gait examination shows no abnormalities. Romberg test is negative. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Discharge home with instructions"],["B","Electroencephalography"],["C","Head CT scan without contrast"],["D","Skull radiographs"],["E","Urgent neurosurgical evaluation"]],"a":"C"},{"id":"4174","b":1,"n":8,"s":[{"p":"A newborn boy is undergoing evaluation immediately after birth in the delivery room. He was born to a primigravida mother at 38 weeks gestation. The prenatal course was otherwise uncomplicated, with negative routine infectious serologies and normal anatomic ultrasound. The amniotic fluid was clear. The infant cries immediately and is actively moving all 4 extremities. He is taken to a warmer and dried with blankets. A minute after delivery, heart rate is 120/min. He grimaces and cries vigorously during brief manipulation and examination by the provider. His body is pink but extremities are cyanotic. Which of the following is the most appropriate next step in the management of this patient?"}],"o":[["A","Administer intramuscular vitamin K"],["B","Attach to cardiac monitor"],["C","Bathe in sterile solution"],["D","Place on mother’s chest"],["E","Suction oropharynx and trachea"]],"a":"D"},{"id":"2439","b":1,"n":9,"s":[{"p":"A 14-year-old girl is brought to the emergency department due to progressive weakness in the lower limbs for 3 weeks. Her parents first noticed clumsiness, which has progressed to difficulty walking over the last week. The patient had a fever, cough, and congestion about 1 month ago and has otherwise been well. She has a history of high plantar arches requiring orthotics and mild scoliosis. The patient takes no medication and has no allergies. Her parents and 2 older siblings are healthy. Vital signs are normal. On examination, she has a wide-based gait and has difficulty maintaining balance without assistance. Strength is 2/5 in the lower extremities and 5/5 in the upper extremities. There is decreased vibratory and position sense in the lower extremities. MRI shows cervical spinal cord atrophy. When discussing the most likely diagnosis with the patient’s parents, which of the following statements is most accurate?"}],"o":[["A","A predisposition to malignancy is typical of this progressive disease."],["B","Anti-viral therapy will reduce symptoms."],["C","Genetic testing is recommended to confirm the diagnosis."],["D","This chronic condition typically stabilizes with disease-modifying therapies."],["E","This is a nonprogressive condition that usually improves with supportive care."]],"a":"C"},{"id":"3713","b":1,"n":10,"s":[{"p":"A 2-year-old boy with sickle cell anemia is brought to the emergency department by his parents due to pallor and decreased responsiveness. Yesterday, the patient had abdominal pain and less energy than usual. This morning, he looked pale and the parents had difficulty awakening him. The patient has had no fever, vomiting, diarrhea, or rashes. He takes folic acid and penicillin daily. Temperature is 36.7°C (98.1°F), blood pressure is 70/30 mm Hg, pulse is 158/min, and respirations are 44/min. On physical examination, the patient appears pale and is asleep but is briefly arousable to painful stimuli. Examination reveals a 3/6 systolic ejection murmur throughout the precordium and clear breath sounds. Abdominal examination demonstrates marked splenomegaly, and the patient grimaces with palpation of the left upper quadrant. Capillary refill is >3 seconds, and the extremities are cyanotic and cool to the touch. Which of the following laboratory profiles would most likely be seen in this patient?"}],"o":[["A","Reticulocytes: Decreased | Platelets: Decreased"],["B","Reticulocytes: Decreased | Platelets: Normal"],["C","Reticulocytes: Decreased | Platelets: Increased"],["D","Reticulocytes: Increased | Platelets: Decreased"],["E","Reticulocytes: Increased | Platelets: Increased"]],"a":"D"},{"id":"4514","b":1,"n":11,"s":[{"p":"A 12-year-old girl is brought to the emergency department by her parents for assessment of confusion and rapid breathing. Three days ago the patient developed rhinorrhea, cough, and fever, which have since resolved. The parents say that over the past 48 hours the patient has had increased urination, abdominal pain, and fatigue progressing to somnolence. On arrival, the patient’s temperature is 36.7°C (98°F), blood pressure is 110/70 mm Hg, pulse is 138/min, respirations are 36/min, and pulse oximetry is 99% on room air. On physical examination, she is ill-appearing with tachypnea, subcostal retractions, and dry mucous membranes. There is diffuse abdominal tenderness without rebound. Laboratory results are as follows:"},{"ul":["Hematocrit: 42%","Leukocytes: 13,000/mm³","Sodium: 129 mEq/L","Potassium: 4.8 mEq/L","Chloride: 98 mEq/L","Bicarbonate: 9 mEq/L","Blood urea nitrogen: 24 mg/dL","Creatinine: 1.2 mg/dL","Glucose: 450 mg/dL"]},{"p":"Which of the following is most likely decreased in this patient?"}],"o":[["A","Blood renin activity"],["B","Circulating free fatty acids"],["C","Hypothalamic vasopressin production"],["D","Liver glucose production"],["E","Total body potassium"],["F","Urine solute excretion"]],"a":"E"},{"id":"3907","b":1,"n":12,"s":[{"p":"A 2-month-old girl is brought to the office by her parents for a well-child visit. She is exclusively breastfed and takes vitamin D supplements. The patient is able to lift her head when prone and smiles socially. She lives at home with her mother, father, and grandmother. The father occasionally smokes cigarettes but never in the presence of the child. The grandmother often helps take care of the child overnight and sleeps in the bed with her. Physical examination results are appropriate for age. The child is due for several routine vaccinations today. The mother becomes tearful and mentions that the patient’s 3-month-old cousin recently died in his crib; the cause remains unexplained after autopsy. She asks for information about how to prevent such an incident. In addition to sleeping in the supine position, which of the following factors is associated with decreased incidence of unexplained infant death?"}],"o":[["A","Bed-sharing with a caretaker"],["B","Delaying 2-month vaccinations"],["C","Limiting second-hand smoke exposure"],["D","Placing the infant in a side-sleep position"],["E","Using a home apnea monitor"],["F","Using a soft mattress"]],"a":"C"},{"id":"2474","b":1,"n":13,"s":[{"p":"A 7-day-old girl in the neonatal intensive care unit with truncus arteriosus has poor feeding and abdominal distension. The patient has been hospitalized since birth at 38 weeks gestation via normal spontaneous vaginal delivery and is awaiting adequate weight gain prior to the repair of her congenital heart disease. She has been taking oral formula and has regained her birth weight. Temperature is 35°C (95°F), blood pressure is 60/30 mm Hg, pulse is 180/min, and respirations are 65/min. Pulse oximetry is 82% on room air. Physical examination shows a lethargic, cyanotic neonate with moderate abdominal distension and absent bowel sounds. Bright red blood is visible in her stool. A nasogastric tube is placed for decompression and bilious fluid is recovered. Abdominal x-ray is obtained (shows pneumatosis intestinalis and portal venous gas). What is the most likely diagnosis in this patient?"}],"o":[["A","Clostridioides difficile colitis"],["B","Intussusception"],["C","Malrotation with midgut volvulus"],["D","Milk protein-induced proctocolitis"],["E","Necrotizing enterocolitis"]],"a":"E"},{"id":"2648","b":1,"n":14,"s":[{"p":"A 5-year-old boy is brought to the office by his parents for evaluation of “clumsiness.” The patient’s fine and gross motor development have been normal at prior visits, but he now frequently runs into doorways or corners of furniture while walking around the house. He has also begun drinking large amounts of water and urinating “all the time.” Temperature is 37°C (98.6°F), blood pressure is 95/65 mm Hg, and pulse is 130/min. Physical examination shows dry mucous membranes and loss of peripheral visual fields. Laboratory results are as follows:"},{"ul":["Sodium: 145 mEq/L","Potassium: 3.9 mEq/L","Bicarbonate: 20 mEq/L","Blood urea nitrogen: 18 mg/dL","Creatinine: 0.6 mg/dL","Glucose: 88 mg/dL","Urinalysis Specific gravity: 1.001","Urinalysis Glucose: negative"]},{"p":"CT scan of the brain (exhibit) reveals an abnormality (calcified/cystic suprasellar mass). Which of the following is the most likely diagnosis?"}],"o":[["A","Craniopharyngioma"],["B","Medulloblastoma"],["C","Parasagittal meningioma"],["D","Pituitary adenoma"],["E","Rathke cleft cyst"]],"a":"A"},{"id":"3770","b":1,"n":15,"s":[{"p":"A 3-year-old boy is brought to the office by his mother for follow-up after an emergency department visit for a lower extremity fracture. One week ago, the patient fell while running on the stairs and was found to have a closed tibial fracture. He was placed in a cast and has been doing well since. His history is also notable for a femur fracture shortly after learning to walk at age 13 months. The patient has speech delay and mild hearing loss. His mother has had multiple fractures since childhood and has hearing loss as well. Vital signs are normal. Height and weight are at the 5th and 20th percentiles, respectively. Examination shows a young boy with no dysmorphic features. Bilateral upper and proximal lower extremities have 5/5 strength. Hypermobility of the joints in the hands is noted. The right leg is casted from below the knee to the foot, and capillary refill of the toes is <2 seconds. Based on this clinical presentation, this patient most likely has a defect in which of the following genes?"}],"o":[["A","Dystrophin"],["B","Fibrillin-1"],["C","Fibroblast growth factor receptor 3"],["D","Fragile X mental retardation 1"],["E","Type I collagen"]],"a":"E"},{"id":"16326","b":1,"n":16,"s":[{"p":"A 13-year-old girl is brought to the clinic by her mother due to difficulty walking. The patient noticed a mild ache in both hips 2 months ago that occurred most days after walking home from school. The aches usually resolved after rest but this week, the aches have worsened to the point where she has difficulty walking, and ibuprofen only minimally relieves the symptoms. Her mother attributed the symptoms to muscle soreness related to deconditioning because the patient gained noticeable weight over the past year. The patient has no chronic medical conditions and takes no other medications. Height is at the 75th percentile, and weight is at the 97th percentile. Temperature is 37.4°C (99.3°F). The patient has a waddling gait with both feet turned laterally. Bilateral knees have full range of motion. Both hips externally rotate during hip flexion, and there are no palpable clicks when the hips are brought back to extension. There is limited internal rotation bilaterally. There is mild tenderness to palpation at the bilateral anterior groin. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Iliopsoas bursitis"],["B","Osteosarcoma"],["C","Physiologic genu valgum"],["D","Slipped capital femoral epiphysis"],["E","Transient synovitis"]],"a":"D"},{"id":"2433","b":1,"n":17,"s":[{"p":"A 4-year-old boy is brought to the office due to bedwetting. Toilet-training was initiated at age 2 when he learned the words “pee” and “poop.” His parents are concerned that the boy still urinates in his bed at least 1 night a week despite avoiding fluid intake 2 hours prior to bedtime. The patient’s older sisters were toilet-trained during the day and night by age 3. He has a soft bowel movement in the toilet every day. The boy is active and plays outside for at least an hour a day. He has no medical problems and takes no medications. Physical examination shows a well-nourished, talkative boy. There is no sacral dimple or hair tuft. Testes are descended bilaterally, and the urethral meatus is at the tip of the glans. He can hop on each foot for a few seconds. He identifies the colors of “pee” and “poop” as yellow and brown, respectively. What is the best next step in management of this patient?"}],"o":[["A","Initiate enuresis alarm therapy"],["B","Obtain urinalysis"],["C","Order bladder ultrasound"],["D","Prescribe desmopressin"],["E","Provide reassurance"],["F","Recommend family therapy"],["G","Restrict play time until bedwetting resolves"]],"a":"E"},{"id":"15846","b":1,"n":18,"s":[{"p":"An 11-year-old girl is brought to the emergency department due to right shoulder pain. The patient first noticed the pain 4 days ago after softball practice. She has been placing cold compresses over the shoulder and taking acetaminophen with initial improvement, but the pain has awakened her from sleep the last 2 nights. Today she is unable to lift her right arm to brush her teeth. Four months ago, the patient was diagnosed with polyarticular juvenile idiopathic arthritis involving the wrists, knees, and ankles. She is taking methotrexate, and her symptoms had been gradually improving after dose adjustments. Temperature is 38.5°C (101.3°F). The patient holds her right arm at her side, and she resists attempts to move the shoulder due to pain. The overlying skin is warm. Bilateral wrists, knees, and ankles are mildly edematous. The shoulder joint is aspirated, and synovial fluid analysis reveals leukocyte count of 55,000 cells/mm³, with 80% polymorphonuclear cells and 20% lymphocytes. Which of the following is the best next step in management of this patient?"}],"o":[["A","Add a biologic disease-modifying antirheumatic drug"],["B","Administer intra-articular glucocorticoids"],["C","Begin antibiotic therapy"],["D","Increase methotrexate dose"],["E","Recommend nonsteroidal anti-inflammatory drugs and rest"]],"a":"C"},{"id":"3423","b":1,"n":19,"s":[{"p":"A 3-year-old African American boy is brought to the emergency department for fever. Since returning from a family trip to Nigeria last week, he has been lethargic with constant nausea and headache. He has had several episodes of vomiting and watery diarrhea each day and high spiking fevers, chills, and drenching sweats every other day. The boy carries the sickle cell trait and has no other medical problems. He takes no medications and his vaccinations are up to date. His temperature is 40°C (104°F), blood pressure is 90/60 mm Hg, pulse is 132/min, and respirations are 24/min. Examination shows a tired-appearing boy with jaundice. Lungs are clear to auscultation. The abdomen is soft and nontender. Hepatosplenomegaly is present. Range of motion in his neck and extremities is normal. Laboratory studies show mild anemia and thrombocytopenia. Which of the following factors is associated with decreased morbidity from this illness?"}],"o":[["A","History of hepatitis A vaccination"],["B","History of meningococcal vaccination"],["C","Male sex"],["D","Prophylaxis with ciprofloxacin"],["E","Sickle cell trait"],["F","Young age"]],"a":"E"},{"id":"2478","b":1,"n":20,"s":[{"p":"An 18-year-old woman comes to the pediatrician with her 3-day-old daughter for her first newborn visit and has questions about breastfeeding. She has been breastfeeding exclusively, but says that it is painful and believes that she is not producing enough milk. She would like to stop breastfeeding and switch to formula. Which of the following statements regarding breastfeeding is correct?"}],"o":[["A","Breastfeeding is associated with increased risk of obesity in the infant"],["B","Breastfeeding is associated with increased risk of endometrial cancer in the mother"],["C","Breastfeeding reduces the risk of otitis media in the infant"],["D","Nutritional supplementation is not needed with exclusive breastfeeding"],["E","There is no need for contraception with exclusive breastfeeding"]],"a":"C"},{"id":"2513","b":1,"n":21,"s":[{"p":"A 7-year-old boy is brought to the office due to persistent bedwetting. Since age 3, he has been able to stay dry during the day but continues to have “accidents” 3 nights a week. The child drinks fluids primarily in the morning and early afternoon and does not drink juice or caffeinated beverages. For the past 4 months, his parents have tried enuresis alarms and awarded “gold stars” for dry nights without improvement in the frequency of bedwetting. His parents are frustrated, and the patient is sad about missing activities such as summer camp. He was recently invited to a sleepover party but is nervous about wetting the bed. He has otherwise been in good health, has met all other developmental milestones, and takes no medications. The father had a history of nocturnal enuresis until age 8. Physical examination and urinalysis are normal. Which of the following is the best next step in management of this patient?"}],"o":[["A","Desmopressin"],["B","Imipramine"],["C","Oxybutynin"],["D","Serum glucose"],["E","Urine culture"],["F","Vesicoureterogram"]],"a":"A"},{"id":"16770","b":1,"n":22,"s":[{"p":"A 3-week-old girl is brought to the emergency department due to apnea and cyanosis. Her mother reports multiple episodes over the last 48 hours of gagging and gasping for air. During the last event, the patient started coughing harshly during a feed and then stopped breathing. She became cyanotic for approximately 12 seconds, then quickly returned to normal. The patient has a 1-week history of clear rhinorrhea and increasing cough with episodes of emesis. Temperature is 37.2°C (99°F), blood pressure is 85/52 mm Hg, pulse is 110/min, and respirations are 45/min. She is well developed and active. There is nasal congestion and clear rhinorrhea. Lung sounds are clear except for referred upper airway congestion. Cardiac and abdominal examinations are normal. Which of the following is the most appropriate empiric pharmacotherapy for this patient’s condition?"}],"o":[["A","Amoxicillin"],["B","Azithromycin"],["C","Furosemide"],["D","Oseltamivir"],["E","Ranitidine"]],"a":"B"},{"id":"4217","b":1,"n":23,"s":[{"p":"A 14-year-old girl is brought to the office for a routine physical examination. The patient is starting high school and is going to be on the school’s cross-country team. She has no concerns today. She is healthy and takes no daily medications. Family history is significant for hypertension in her mother. The patient has not undergone menarche and is not sexually active. Height and weight are at the 25th percentile for age. Physical examination shows sexual maturity rating (Tanner) stage 1 breast development. The abdomen is soft, nontender, and nondistended. A small, nonreducible mass is palpated in the left inguinal area. On pelvic examination, the external genitalia appear normal, and there is no pubic hair. The vagina ends in a blind pouch. Sonogram confirms the absence of a uterus, cervix, and ovaries. Karyotype is 46,XY. Which of the following is the best next step in management of this patient?"}],"o":[["A","Elective gonadectomy procedure"],["B","Estrogen therapy"],["C","Growth hormone therapy"],["D","Hymenectomy"],["E","Low-dose corticosteroid therapy"],["F","Reassurance and no further treatment"]],"a":"A"},{"id":"4873","b":1,"n":24,"s":[{"p":"A 7-year-old boy is brought to the emergency department after falling during recess. His teacher saw him jump off a swing and fall onto his outstretched left arm. The patient developed immediate pain in the arm and now refuses to move it at the elbow. On examination, the left arm is grossly deformed, swollen, and slightly pale. The radial pulse is intact. The patient’s x-ray is shown (displaced supracondylar humerus fracture). Two hours later, while the patient is awaiting surgery, pain and swelling continue to increase despite administration of nonsteroidal anti-inflammatory drugs and opioid analgesics. Which of the following complications is most likely present in this patient?"}],"o":[["A","Avascular necrosis of the humeral physis"],["B","Compartment syndrome of the forearm"],["C","Injury to the brachial artery"],["D","Neurapraxia of the median nerve"],["E","Venous thrombosis of the proximal upper extremity"]],"a":"B"},{"id":"3671","b":1,"n":25,"s":[{"p":"An 8-day-old boy is brought to the emergency department by his parents due to hypothermia and poor feeding. The infant was cool to the touch this morning and would not wake to breastfeed. He was born via scheduled repeat cesarean delivery to a 26-year-old woman, gravida 2 para 2. The mother was rubella nonimmune in the first trimester; Group B streptococcal screening was positive, but intrapartum antibiotic prophylaxis was deferred due to the planned cesarean delivery. The pregnancy was otherwise unremarkable. The infant had an uncomplicated nursery stay and was discharged home at age 3 days. The family has 2 dogs and a cat. The patient’s 3-year-old brother attends daycare and has had rhinorrhea and cough this week. Temperature is 35.1°C (95.2°F). Physical examination shows a hypotonic, lethargic infant with a full anterior fontanelle. Initial laboratory studies show a white blood cell count of 2,000/mm³ with 20% bands. During the evaluation, the infant becomes apneic and requires intubation. Which of the following is the most likely cause of this infant’s condition?"}],"o":[["A","Group B Streptococcus"],["B","Haemophilus influenzae"],["C","Listeria monocytogenes"],["D","Neisseria meningitidis"],["E","Streptococcus pneumoniae"],["F","Toxoplasma gondii"]],"a":"A"},{"id":"3969","b":1,"n":26,"s":[{"p":"A 10-year-old boy is brought to an urgent care center by his parents due to a rash. The patient awoke yesterday with a rash on his trunk, but his mother says that “it now seems particularly red in his underarms and private area.” Over the last 2 days, he has also had headache, fever, and sore throat. He has no allergies, and his immunizations are up to date. Temperature is 38.3°C (101°F), blood pressure is 112/70 mm Hg, pulse is 108/min, and respirations are 20/min. The patient is tired-appearing but playful and in no acute distress. Examination reveals a fine, erythematous, papular rash with a rough texture on the anterior trunk. The rash appears more concentrated in the axillae and groin and blanches with pressure. Tender, shotty, anterior cervical lymphadenopathy is present, and the posterior oropharynx is erythematous with tonsillar exudates and soft palatal petechiae. The father adds, “Two kids in his class had the same symptoms and now have peeling of their hands and feet.” What is the most likely diagnosis?"}],"o":[["A","Erythema infectiosum"],["B","Hand, foot, and mouth disease"],["C","Kawasaki disease"],["D","Mononucleosis"],["E","Roseola"],["F","Scarlet fever"],["G","Staphylococcal scalded skin syndrome"]],"a":"F"},{"id":"2472","b":1,"n":27,"s":[{"p":"A 1-day-old boy is evaluated in the neonatal intensive care unit. The patient was born at 34 weeks gestation to a 25-year-old-primigravida after she underwent an induction for preeclampsia with severe features. The delivery was complicated by placental abruption, and a forceps-assisted vaginal delivery was performed due to an abnormal fetal heart rate tracing. Apgar scores were 5 and 8 at 1 and 5 minutes, respectively. Examination shows a comfortable, sleeping infant under a radiant warmer with a nasal cannula in place. There is a firm, well-demarcated swelling on the right parietal scalp with no discoloration or apparent tenderness. The remainder of the head and neck examination is unremarkable. The abdomen is soft with no organomegaly. Which of the following is the most likely cause of this patient’s physical examination findings?"}],"o":[["A","Caput succedaneum"],["B","Cephalohematoma"],["C","Hydrocephalus"],["D","Plagiocephaly"],["E","Subgaleal hemorrhage"]],"a":"B"},{"id":"3668","b":1,"n":28,"s":[{"p":"A 3-year-old girl is brought to the emergency department for acute onset of right elbow pain. She was playing in the snow and started crying when her father pulled her by the arm to take her inside. On examination, the girl keeps her hand in a pronated position, refuses to use her hand, and cries when her elbow is moved. There is no swelling or deformity. Palpation of the radial head elicits mild tenderness. A click is felt when the forearm is hyperpronated, and the child stops crying and starts to use her arm. What is the most likely etiology of this child’s symptoms?"}],"o":[["A","Lateral epicondylitis"],["B","Medial epicondylitis"],["C","Midshaft forearm fracture"],["D","Panner disease"],["E","Radial head subluxation"],["F","Supracondylar fracture"]],"a":"E"},{"id":"3896","b":1,"n":29,"s":[{"p":"A 3-year-old boy is brought to the clinic by his father due to fatigue and pallor. The patient was seen in another clinic a week ago for abdominal pain and diarrhea. A medication was prescribed to help slow the diarrhea, which resolved, but the patient has been much less playful over the last day. Temperature is 36.7°C (98°F), blood pressure is 110/70 mm Hg, pulse is 120/min, and respirations are 20/min. Physical examination shows an uncomfortable-appearing child with scleral icterus. Cardiac examination shows mild tachycardia with no murmurs. A few ecchymoses are noted along the upper and lower extremities. There is pitting edema along bilateral lower extremities to the knees. The remainder of the examination is unremarkable. Laboratory results are as follows:"},{"ul":["Hemoglobin: 7.8 g/dL","Mean corpuscular volume: 84 μm³","Platelets: 40,000/mm³","Leukocytes: 13,000/mm³","PT: 12 sec","PTT: 35 sec"]},{"p":"Peripheral blood smear results are shown (demonstrating schistocytes/fragmented RBCs). Which of the following is the most likely mechanism of this patient’s condition?"}],"o":[["A","Antibody-mediated destruction of red blood cells"],["B","Decreased erythropoietin production"],["C","Defective globin chain synthesis"],["D","Deficiency in an enzyme that protects cells from oxidative injury"],["E","Intravascular shearing of red blood cells"],["F","Systemic activation of coagulation system"]],"a":"E"},{"id":"4290","b":1,"n":30,"s":[{"p":"A 36-year-old woman comes to the clinic for an ultrasound after an elevated alpha-fetoprotein level was found during a second trimester quadruple screen. The patient has had routine prenatal care since 8 weeks gestation. She has been taking a daily prenatal multivitamin since the first trimester and takes no other medications. She has had 2 prior spontaneous abortions but has no chronic medical conditions. The patient does not use tobacco, alcohol, or illicit drugs. Transabdominal ultrasound reveals a fetus with thickened intestinal loops that are floating free in the amniotic sac. There is also decreased fluid in the amniotic sac, suggestive of oligohydramnios. This patient’s ultrasound finding is most likely due to which of the following conditions?"}],"o":[["A","Beckwith-Wiedemann syndrome"],["B","Cystic fibrosis"],["C","Isolated gastroschisis"],["D","Prune belly syndrome"],["E","Trisomy 21"]],"a":"C"},{"id":"2241","b":1,"n":31,"s":[{"p":"A 7-year-old boy is brought to the emergency department due to tea-colored urine this morning. The patient has had no fever, dysuria, urinary frequency, or urgency. He has had a runny nose and periorbital swelling for 2 days that his parents treated with antihistamines. The rhinorrhea has improved, but the facial swelling has worsened. Three weeks ago, the patient had a facial skin infection that resolved with a topical antibiotic cream. He is otherwise healthy and up to date with vaccinations. The patient’s mother has systemic lupus erythematosus. Temperature is 37.4°C (99.4°F) and blood pressure is elevated. Physical examination shows periorbital swelling and mild pedal edema. The remainder of the examination is unremarkable. Laboratory results are as follows:"},{"ul":["Blood urea nitrogen: 10 mg/dL","Creatinine: 1.4 mg/dL","Urinalysis Specific gravity: 1.013","Urinalysis Protein: +1","Urinalysis Red blood cells: >50/hpf","Urinalysis Casts: RBC casts","C3: 33 mg/dL (normal: 55-120)","Anti-double-stranded DNA (dsDNA) antibody: negative"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Drug-induced acute interstitial nephritis"],["B","Granulomatosis with polyangiitis"],["C","IgA nephropathy"],["D","Lupus nephritis"],["E","Poststreptococcal glomerulonephritis"]],"a":"E"},{"id":"4202","b":1,"n":32,"s":[{"p":"A 4-year-old girl is brought to the office by her parents due to frequent squinting of the left eye. That eye also seems more prominent than the right, according to the mother. The child was born full term after a normal pregnancy and delivery. Developmental milestones have been age appropriate. Left eye examination reveals mild proptosis, esotropia, and optic disc pallor. Visual acuity is decreased in the left eye but is normal in the right. There are several large café-au-lait macules and marked axillary freckling. Which of the following is the most likely cause of this patient’s ocular findings?"}],"o":[["A","Acoustic neuroma"],["B","Craniopharyngioma"],["C","Medulloblastoma"],["D","Optic pathway glioma"],["E","Retinitis pigmentosa"],["F","Sporadic retinoblastoma"]],"a":"D"},{"id":"4874","b":1,"n":33,"s":[{"p":"A 2-year-old boy is brought to the office for a routine visit. His parents are concerned that he is not as talkative as his twin sister. The patient’s sister talks “constantly” and is starting to put 3 words together. The boy tends to be quieter and says about 70 words with some 2-word phrases; both children will be enrolled in preschool in the fall. The patient likes making beeping sounds when playing with toy trucks, but he does not play with his sister, only alongside her. The boy is up to date with vaccinations, and his growth parameters are average for his age. He points to a toy across the room, looks at his mother and smiles, and then brings the toy over to show her. When the physician approaches, the patient runs to hide behind his father and initially refuses to cooperate or make eye contact. When his mother tries to help him onto the examination table, he pushes her away and says, “Me do.” Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Autism spectrum disorder"],["B","Cognitive delay"],["C","Conductive hearing loss"],["D","Language delay"],["E","Normal development"]],"a":"E"},{"id":"4005","b":1,"n":34,"s":[{"p":"A 3-month-old girl is brought to the clinic by her father due to fever and fussiness. A fever developed in the patient 2 days ago, and she has been receiving scheduled acetaminophen. The fever initially improved after medication administration but returned several hours later. Now, the patient does not want to feed and is not finishing her bottles but has had no vomiting. She has no rhinorrhea, cough, or congestion. The patient was born at term and had no complications. She has intermittent constipation for which she takes prune juice. Immunizations are up to date. Temperature is 39.4°C (102.9°F) and pulse is 160/min. Examination shows a tired-appearing girl. The fontanel is open and flat. Tympanic membranes are clear with normal bony landmarks. There are no exudates in the posterior oropharynx. The lungs are clear to auscultation bilaterally. The abdomen is soft and bowel sounds are present, but the girl cries during palpation of the lower abdomen. Which of the following is the best next step in management of this patient?"}],"o":[["A","Abdominal radiograph"],["B","Abdominal ultrasound"],["C","CT of the abdomen and pelvis"],["D","Lumbar puncture"],["E","Urinalysis and urine culture"]],"a":"E"},{"id":"4271","b":1,"n":35,"s":[{"p":"A 17-year-old girl is admitted to the hospital due to lower extremity weakness. Onset of tingling in the patient’s feet began 5 days ago; she then developed weakness 3 days ago, which has been worsening, and now she cannot stand or walk. She had an upper respiratory infection 2 weeks ago; otherwise, medical history is unremarkable. Temperature is 36.7°C (98°F), blood pressure is 110/70 mm Hg, pulse is 85/min, and respirations are 18/min. Pulse oximetry is 99% on room air. Physical examination shows an adolescent girl in no acute distress and clear lungs on auscultation. Bilateral ankle and knee flexion/extension strength is 1/5 and hip flexors are 2/5. Reflexes are absent in the lower extremities. The upper extremities have 3/5 strength and 1+ reflexes. The patient can keep her head erect and swallow saliva. Gag reflex is intact. Cerebrospinal fluid results are as follows:"},{"ul":["Leukocytes: 1/mm³","Red blood cells: 0/mm³","Protein: 200 mg/dL","Glucose: 65 mg/dL","Gram stain: No bacteria seen"]},{"p":"Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Chest x-ray"],["B","Elective intubation"],["C","Muscle biopsy"],["D","Spinal MRI with gadolinium"],["E","Spirometry"],["F","Stool assay for botulism toxin"]],"a":"E"},{"id":"2778","b":1,"n":36,"s":[{"p":"An 18-month-old girl is brought to the office by her parents due to a rash and blisters that started this morning. Yesterday, the child was very fussy, particularly when her parents picked her up. The patient also had a fever that responded well to ibuprofen. This morning, the parents noted erythema and peeling skin around her mouth, axillae, and inguinal areas. Medical history is significant for otitis media 6 months ago. Vaccinations are up to date, and the patient takes no daily medications. Temperature is 39°C (102.2°F), blood pressure is 89/52 mm Hg, pulse is 145/min, and respirations are 28/min. Examination reveals an irritable child who cries with any attempt to move her. Superficial flaccid bullae and an erythematous rash are diffusely distributed over the body. Slight focal pressure to the back results in sloughing of the top layer of skin with underlying erythema. The face appears edematous, with perioral crusting. A single pustule is noted under the left naris, but no mucosal lesions are seen. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Bullous impetigo"],["B","Erysipelas"],["C","Erythema multiforme"],["D","Scarlet fever"],["E","Staphylococcal scalded skin syndrome"],["F","Toxic epidermal necrolysis"]],"a":"E"},{"id":"3089","b":1,"n":37,"s":[{"p":"A 3-day-old boy is brought to the emergency department due to bruising. The patient was born at 39 weeks gestation via vaginal delivery at home, and this is his first medical evaluation. He is breastfed exclusively. Vital signs are within normal limits. Several ecchymoses are visible on the extremities. Physical examination is otherwise unremarkable. Laboratory results are as follows:"},{"ul":["Platelets: 270,000/mm³","PT: 26 sec","Activated PTT: 42 sec","Thrombin time: 18 sec (normal: 15-20)"]},{"p":"Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Absent fibrinogen production"],["B","Coagulation factor consumption"],["C","Decreased von Willebrand factor synthesis"],["D","Deficient factor VIII production"],["E","Impaired platelet function"],["F","Reduced coagulation factor carboxylation"]],"a":"F"},{"id":"4223","b":1,"n":38,"s":[{"p":"A 5-hour-old boy is evaluated in the nursery for minimal right arm movement. He was born at 39 weeks gestation to a 37-year-old multigravida via vaginal delivery complicated by difficulty extracting the shoulders. Review of medical records reveals a maternal history of hypertension and recreational marijuana use. The mother missed most of her prenatal appointments. The patient’s birth weight is 4.5 kg (9 lb  14 oz). Vital signs are normal. Examination shows a plethoric infant with crepitus and irregularity over the right clavicle. Moro reflex is absent on the right extremity. Bilateral biceps and grasp reflexes are intact and symmetric. Which of the following risk factors predisposed the infant to this complication?"}],"o":[["A","Congenital infection"],["B","Fetal aneuploidy"],["C","Fetal hyperglycemia"],["D","Maternal hypertension"],["E","Maternal marijuana abuse"],["F","Maternal tobacco use"]],"a":"C"},{"id":"2857","b":1,"n":39,"s":[{"p":"A 4-year-old boy is brought by his parents to the volunteer medical center of a large refugee camp in Egypt for evaluation of eye redness. For 10 days the boy has had mild rhinorrhea and cough that are now resolving. He began having mild eye redness 2 days ago with scant, watery discharge. He has not had ocular pain or itching. The patient’s 6-year-old brother has similar symptoms. The family fled their home in Sudan due to regional conflict and arrived in the refugee camp approximately 2 months ago. The boy’s grandfather and 2 dogs remained at their home. Vital signs are stable. Examination of the chest and abdomen is unremarkable. Examination of the eyes shows several pale follicles and inflammatory changes in the tarsal conjunctivae bilaterally. The conjunctivae appear mildly thickened. Visual acuity is 20/20 bilaterally. Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","Chlamydial conjunctivitis"],["B","Gonococcal conjunctivitis"],["C","Herpes simplex keratitis"],["D","Ocular syphilis"],["E","Orbital cellulitis"],["F","Trachoma"]],"a":"F"},{"id":"2312","b":1,"n":40,"s":[{"p":"A 2-year-old boy is brought to the emergency department by his parents for persistent, high fever over the last 6 days. The patient has been receiving ibuprofen and acetaminophen daily but has had minimal improvement. Two days ago, a rash developed along his trunk that has now spread to his arms and legs. Today, the patient has become increasingly irritable. He has no chronic medical conditions and has not received any vaccinations. Temperature is 39.4°C (103°F), blood pressure is 110/60 mm Hg, pulse is 120/min, and respirations are 24/min. Examination shows injected conjunctiva bilaterally with no discharge. The patient has fissured lips and an erythematous oropharynx. An erythematous, blanching rash covers the abdomen, arms, and legs. The hands are edematous, and the skin adjacent to the fingernails is peeling. There are 3 tender, 2-cm, left-sided cervical lymph nodes. The patient’s laboratory studies reveal:"},{"ul":["Hematocrit: 46%","Leukocytes: 12,000/mm³","Platelets: 500,000/mm³","Urinalysis Protein: negative","Urinalysis White blood cells: 7/hpf","Urinalysis Red blood cells: 0/hpf","Urinalysis Casts: none","Erythrocyte sedimentation rate: 58 mm/h"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute lymphoblastic leukemia"],["B","Adenovirus infection"],["C","Exanthematous drug eruption"],["D","Kawasaki disease"],["E","Measles infection"],["F","Rubella infection"],["G","Scarlet fever"]],"a":"D"},{"id":"3192","b":2,"n":1,"s":[{"p":"A 4-month-old boy is brought to the emergency department after an episode of generalized tonic-clonic seizure 30 minutes ago. The patient was born at 40 weeks gestation by spontaneous vaginal delivery. He was at the 50th percentile for height and weight, and had a normal physical examination. Since birth, the patient has had 3 episodes of upper respiratory infection and otitis media. His parents and older sister have no medical problems. On examination, the patient is lethargic. He weighs 4.2 kg (9.3 lb, <5th percentile). The anterior fontanelle is flat. Pupils are reactive with normal fundi. His tympanic membranes and pharynx are normal. He has round cheeks and a doll-like face. Heart sounds are normal without murmurs. Lungs are clear. The abdomen is protuberant and the liver is palpable 4 cm below the right costal margin. Extremities are thin. Laboratory results are as follows:"},{"ul":["Sodium: 136 mEq/L","Chloride: 96 mEq/L","Bicarbonate: 16 mEq/L","Glucose: 38 mg/dL","Lactic acid: 24 mg/dL (normal: 6-16 mg/dL)"]},{"p":"Urine dipstick is positive for ketones. Serum triglyceride and uric acid levels are increased. Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Excessive endogenous insulin production"],["B","Glucocerebrosidase enzyme deficiency"],["C","Impaired glycogen to glucose conversion"],["D","Inability to break fatty acid chains"],["E","Inadequate total body glycogen stores"]],"a":"C"},{"id":"4359","b":2,"n":2,"s":[{"p":"A 7-year-old Vietnamese boy is brought to the clinic for a routine health maintenance examination. He underwent a splenectomy a year ago for persistent anemia and jaundice. He has received the pneumococcal and meningococcal vaccinations and takes penicillin prophylaxis. His paternal uncle died from complications of hemolytic uremic syndrome 35 years ago. Physical examination reveals a well-appearing child. The sclerae are anicteric. The abdomen is soft and nontender; no masses are palpable. Several well-healed laparoscopy scars are noted. Complete blood count is as follows:"},{"ul":["Hemoglobin: 11.3 g/dL","Reticulocytes: 3%","Platelets: 160,000/mm³","Leukocytes: 8,200/mm³"]},{"p":"Peripheral blood smear with Wright stain is shown in the exhibit (shows Howell-Jolly bodies inside RBCs). This patient’s findings are most likely related to which of the following?"}],"o":[["A","Chronic hemoglobin oxidation and precipitation"],["B","Inability to produce alpha or beta globin chains"],["C","Mechanical red blood cell membrane damage"],["D","Persistence of red blood cell precursor nuclei"],["E","Precipitation of ribosomal ribonucleic acid"]],"a":"D"},{"id":"15506","b":2,"n":3,"s":[{"p":"An 18-hour-old boy is evaluated in the emergency department for low muscle tone since birth. He was delivered at home to a 19-year-old woman at approximately 40 weeks gestation who received no prenatal care. Since birth, the infant has breastfed 4 times, has a weak suck each time, and falls asleep a few minutes after he begins nursing. Weight is 2.3 kg (5.1 lb). The eyes have upslanting palpebral fissures, and the mouth is open with a protruding tongue. The palate is narrow but intact. Cardiopulmonary examination is normal. The abdomen is soft with no hepatosplenomegaly. When the infant is held under the arms, his legs are extended and he almost slips through the examiner’s hands. Which of the following is the most likely underlying diagnosis for this patient?"}],"o":[["A","Beckwith-Wiedemann syndrome"],["B","Down syndrome"],["C","Fragile X syndrome"],["D","Infantile botulism"],["E","Prader-Willi syndrome"]],"a":"B"},{"id":"4531","b":2,"n":4,"s":[{"p":"A 4-year-old boy is brought to the office by his mother for a routine health maintenance visit. The patient has been toilet trained for 2 years. He sees a pediatric dentist every 6 months and has no dental caries. The boy’s mother describes him as a picky eater. She states that he prefers to eat bananas, apples, and bread but dislikes vegetables, meat, and milk products. He participates in a weekly community soccer league. He had acute gastroenteritis twice during infancy, but has no chronic medical conditions and takes no medications. The boy lives with his mother, who is a single parent, and 2 older brothers. He attends preschool 5 days per week and is learning to write his name. His mother says that he is not a social child and prefers to play with his best friend or his brothers. Which of the following preventive health measures is most appropriate at this visit?"}],"o":[["A","Autism screening"],["B","Depression screening"],["C","Meningococcal vaccination"],["D","Rotavirus vaccination"],["E","Urinalysis"],["F","Visual acuity testing"]],"a":"F"},{"id":"16087","b":2,"n":5,"s":[{"p":"A 3-month-old girl undergoes flexible fiberoptic laryngoscopy for evaluation of noisy breathing. Two weeks ago, the patient began making squeaky noises when lying on her back, which have been getting progressively louder and more persistent. Her mother has been putting her to sleep on the stomach, which quiets the breathing. The patient is adequately gaining weight, is breastfeeding well, and does not appear to have labored breathing or cyanosis. Flexible fiberoptic laryngoscopy shows that both nasal cavities are patent to the nasopharynx. The adenoids are small and nonobstructive, and the palate functions well with symmetric elevation. The tonsils and base of tongue are small and not obstructive. There is intermittent collapse of the arytenoid cartilages into the airway, which worsens during crying. The vocal cords are mobile. This patient is most likely making which of the following abnormal sounds?"}],"o":[["A","Biphasic stridor"],["B","Expiratory stridor"],["C","Expiratory wheezing"],["D","Inspiratory rhonchi"],["E","Inspiratory stridor"]],"a":"E"},{"id":"7764","b":2,"n":6,"s":[{"p":"An 8-year-old boy is brought to the emergency department by his father for evaluation of a rash. The patient first noticed slightly pruritic, erythematous lesions on his buttocks and legs 2 days ago. These lesions are not painful, but they have coalesced and darkened since onset. His father notes, “We’ve tried the steroid cream we use for his eczema, but other than reducing the itching, it’s not helping at all.” Over the past 24 hours, the patient has also developed abdominal pain, nausea, and 2 episodes of nonbloody, nonbilious emesis but has had no fevers, preceding trauma, or diarrhea. He has a history of seasonal allergies and moderate eczema, and he takes loratadine daily. The patient is a third-grade student and has no recent travel or known sick contacts. Temperature is 36.1°C (97°F), blood pressure is 90/60 mm Hg, and pulse is 94/min. Physical examination shows nonblanching, purple lesions over the buttocks and thighs and behind the knees. The abdomen is soft with mild diffuse tenderness to deep palpation; there is no rebound tenderness or guarding. Passive range of motion of both hips elicits pain. Which of the following laboratory findings is most likely in this patient?"}],"o":[["A","Elevated creatinine"],["B","Hematuria"],["C","Prolonged PT"],["D","Schistocytes"],["E","Thrombocytopenia"]],"a":"B"},{"id":"4834","b":2,"n":7,"s":[{"p":"The following vignette applies to the next 2 items. A 3-year-old boy is brought to the office for fever. For the past 6 days, he has had a fever of 39°C (102.2°F) to 40°C (104°F) that subsides minimally with acetaminophen. Yesterday, his mother noted a rash on his back. The patient attends a day care center where several children have been sick recently. The patient has a history of sickle cell trait and takes a multivitamin daily. Temperature is 39.2°C (102.5°F), pulse is 140/min, and respirations are 25/min. Physical examination shows an inconsolable boy who cries throughout the visit. His neck is supple with a full range of motion. Both hands and feet are slightly erythematous and edematous, and a maculopapular, blanching rash is present on the trunk. The patient’s eyes and lips appear as shown (bilateral nonexudative conjunctivitis and erythematous, fissured lips)."},{"p":"Which of the following is the most likely diagnosis?"}],"o":[["A","Adenovirus infection"],["B","Hand, foot, and mouth disease"],["C","Kawasaki disease"],["D","Measles"],["E","Neisseria meningitidis infection"],["F","Scarlet fever"],["G","Staphylococcal scalded skin syndrome"]],"a":"C"},{"id":"4835","b":2,"n":8,"s":[{"p":"(Continued from previous question) This patient is at greatest risk for which of the following complications?"}],"o":[["A","Aortic regurgitation"],["B","Coronary artery aneurysm"],["C","Mitral valve prolapse"],["D","Pulmonic stenosis"],["E","Restrictive cardiomyopathy"],["F","Tricuspid valve vegetations"]],"a":"B"},{"id":"12518","b":2,"n":9,"s":[{"p":"A 2-year-old-boy is admitted to the pediatric unit for treatment of a large abscess. He has been treated for 2 other skin abscesses with purulent drainage in the past; one culture was positive for Staphylococcus aureus. The patient has 1 prior hospitalization for pneumonia with empyema. He was born at full term via spontaneous vaginal delivery after an uncomplicated pregnancy. Height and weight have remained at the 5th percentile for age. The patient takes no medications; immunizations are up to date. His father has diabetes mellitus, his brother died at age 3 months from Serratia infection, and his mother and sister are in good health. Temperature is 38.9°C (102°F), blood pressure is 100/70 mm Hg, pulse is 124/min, and respirations are 18/min. Eyes, ears, nose, and throat examinations are normal. There is no lymphadenopathy. S1 and S2 are normal without murmurs; lungs are clear to auscultation. No hepatosplenomegaly is present. A 4× 4 cm fluctuant area of erythema and induration is present on the right thigh. There are no rashes. What is the most likely mechanism behind this patient’s recurrent infections?"}],"o":[["A","Cyclic bone marrow suppression"],["B","Decreased superoxide production"],["C","Destruction of CD4⁺ T lymphocytes"],["D","Failure of membrane attack complex formation"],["E","Hypersecretion of IgE"],["F","Hypogammaglobulinemia"],["G","Impaired neutrophil chemotaxis"]],"a":"B"},{"id":"4155","b":2,"n":10,"s":[{"p":"A 6-year-old boy is brought to the emergency department due to difficulty moving his right arm and leg. The patient was playing alone in his room when his mother heard him fall and then found him unresponsive on the floor. He regained consciousness after 3 minutes, but he was confused and unable to move his right arm and leg. The patient has no known medical conditions and takes no medications. He has had normal development. The patient’s mother has a history of migraines, and his maternal uncle died last year from a hemorrhagic stroke. On physical examination, he is alert with normal speech and behavior and no complaints of pain. Heart sounds are normal. CN II-XII are intact. The right upper and lower extremities are flaccid, and right-sided strength is 0/5. Left-sided strength is 5/5 in the upper and lower extremities. Sensation to light touch is intact in all the extremities. CT scan of the head and MRI of the brain are normal. Over the next 4 hours, the patient gradually regains complete motor function in his right arm and leg. Which of the following is the most likely cause of this patient’s hemiplegia?"}],"o":[["A","Congenital heart disease"],["B","Conversion disorder"],["C","Hemiplegic migraine"],["D","Homocystinuria"],["E","Intracranial hemorrhage"],["F","Seizure activity"]],"a":"F"},{"id":"15472","b":2,"n":11,"s":[{"p":"An 8-month-old girl is brought to the clinic by her mother for posthospitalization follow-up. She was admitted and discharged last week due to fatigue and anemia requiring transfusion of packed red blood cells. Since going home, the patient has had no issues. On examination, she is alert and interactive. Cardiopulmonary examination is unremarkable. The spleen is palpated 2 cm below the costal margin. Hemoglobin electrophoresis performed prior to her initial transfusion shows 5% hemoglobin A2 and 95% hemoglobin F. Her mother asks about the long-term outcome. It is discussed that the patient will need chronic red blood cell transfusions to maintain her hemoglobin at an appropriate level, but individuals are now able to survive into the fifth and sixth decades of life with supportive management. In addition to chronic transfusions, the patient will require which of the following supportive medications to improve long-term survival?"}],"o":[["A","Chelation therapy"],["B","Hydroxyurea therapy"],["C","Iron replacement"],["D","Penicillin prophylaxis"],["E","Vitamin B₁₂ supplementation"]],"a":"A"},{"id":"16261","b":2,"n":12,"s":[{"p":"A 2-day-old girl is in the neonatal intensive care unit due to prematurity and respiratory distress. The patient was born at 29 weeks gestation via spontaneous vaginal delivery to a 28-year-old primigravida mother. Her mother received a single dose of antenatal betamethasone before undergoing a precipitous delivery. Birth weight was 1.3 kg (2 lb  14 oz), and Apgar scores were 5 and 8 at 1 and 5 minutes, respectively. The patient received surfactant replacement and was placed on nasal continuous positive airway pressure (nCPAP) and has been receiving intravenous fluids. A few minutes ago, she developed an acute onset of grunting and increased work of breathing. Respiratory rate is 70/min and pulse oximetry is 80%. Lung examination shows decreased breath sounds on the left and intercostal retractions. Cardiac examination reveals heart sounds that are loudest over the right side of the chest and no murmurs. Bedside transillumination is performed, and the left chest shows increased brightness relative to the right. Which of the following is the best next step in management of this patient?"}],"o":[["A","Discontinue nCPAP"],["B","Increase nCPAP end expiratory pressure"],["C","Initiate chest physiotherapy"],["D","Obtain echocardiogram"],["E","Order chest radiograph"],["F","Perform needle thoracostomy"]],"a":"F"},{"id":"15232","b":2,"n":13,"s":[{"p":"An 18-month-old boy is brought to the emergency department due to fever lasting 2 days. Yesterday, he developed a fever, achiness, and fatigue. Today, the patient vomited 3 times but has had no cough, rhinorrhea, or diarrhea. He has no chronic medical conditions and takes no daily medications. However, the patient has not yet received the routine 12- to 15-month vaccines because of a cross-country move. Temperature is 39.4°C (102.9°F). Physical examination reveals an alert but irritable child who cries and closes his eyes during funduscopic examination. The anterior fontanel is closed. When the examiner flexes the neck, the child flexes the knees. Mucous membranes are dry. The oropharynx has no erythema or exudate. Patellar and Achilles deep tendon reflexes are 2+. Cerebrospinal fluid analysis results are as follows:"},{"ul":["Glucose: 60 mg/dL","Protein: 75 mg/dL","Leukocytes: 150/mm³","Red blood cells: 2/mm³"]},{"p":"Which of the following is the most likely cause of this patient’s illness?"}],"o":[["A","Cryptococcus neoformans"],["B","Cytomegalovirus"],["C","Haemophilus influenzae type B"],["D","Listeria monocytogenes"],["E","Mumps virus"],["F","Streptococcus pneumoniae"]],"a":"E"},{"id":"12404","b":2,"n":14,"s":[{"p":"A 9-year-old girl is evaluated because of a rash. Multiple light patches appeared on the patient’s face, chest, back, and arms a week after she began attending a swim camp and became more pronounced over the past month. The spots are mildly itchy but not painful. No dietary changes or use of new soaps has occurred. The patient applies a new suntan lotion 5 days a week while swimming in the camp’s chlorinated pool; however, the spots do not tan even though the surrounding skin does. She has a history of allergic rhinitis and takes oral antihistamines. She has no history of major illness or hospitalization. Vital signs are normal. On examination, the patient is awake, alert, and comfortable. There is mild nasal congestion with enlarged turbinates and clear postnasal drip but no pharyngeal erythema. Lung sounds are clear. No heart murmurs are present. Multiple pale macules appear on the face, trunk, back, and upper arms, as shown in the image. Some of the spots have slight scaling, and they are not tender to palpation. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Atopic dermatitis"],["B","Irritant contact dermatitis"],["C","Mycosis fungoides"],["D","Pityriasis rosea"],["E","Seborrheic dermatitis"],["F","Tinea versicolor"],["G","Vitiligo"]],"a":"F"},{"id":"15987","b":2,"n":15,"s":[{"p":"A term newborn is evaluated in the nursery 1 hour after a spontaneous vaginal delivery to a 28-year-old primigravida whose pregnancy was uneventful. The patient’s Apgar scores were 9 and 9 at 1 and 5 minutes, respectively. Vital signs are normal. Physical examination shows a newborn sleeping comfortably with overlapping coronal sutures. There is a I/VI systolic murmur at the left upper sternal border that radiates to the axilla. The lungs are clear bilaterally. The abdomen is soft, and the liver is palpable 2 cm below the costal margin. Genitourinary examination shows curvature of an underdeveloped penis. The urethral meatus is at the ventral surface of the base and flanked by the surrounding scrotal sac. Gonads are not palpable. Examination of the back shows a sacral dimple with intact skin. The patient has normal fingers and toes. There is cyanosis in the digits. There is symmetric movement of all 4 extremities, and Moro and suck reflexes are normal. Which of the following is the best next step in evaluation of this patient?"}],"o":[["A","Echocardiogram"],["B","Head ultrasound"],["C","Karyotype analysis"],["D","Liver ultrasound"],["E","Serum alpha-fetoprotein"]],"a":"C"},{"id":"4244","b":2,"n":16,"s":[{"p":"A 1-day-old girl is in the newborn nursery undergoing routine evaluation. She was born at term to a 24-year-old woman by uncomplicated vaginal delivery. The Apgar scores were 7 at 1 minute and 8 at 5 minutes. The prenatal course was complicated with asymptomatic bacteriuria that was treated with an antibiotic. The mother took multivitamins daily throughout the pregnancy. Physical examination of the infant shows bilaterally enlarged mammary glands. The labia are slightly swollen and blood-tinged vaginal discharge is seen. What is the best next step in the management of this patient?"}],"o":[["A","Buccal smear"],["B","Imaging of the adrenal glands"],["C","Imaging of the ovaries"],["D","Measure serum FSH and LH levels"],["E","Measure urinary corticosteroid precursors"],["F","Observation and routine care"]],"a":"F"},{"id":"3457","b":2,"n":17,"s":[{"p":"A 6-year-old boy is brought to the emergency department by his mother due to new-onset chest pain. A week ago, he developed a low-grade fever with nasal congestion and a dry cough. Over the past few days, he has had paroxysms of coughing that seem to be worse at night. Last night, the patient developed pain in his chest that did not improve after he was given acetaminophen. He has no chronic medical conditions and takes no daily medications. Temperature is 37.3°C (99.1°F), blood pressure is 106/76 mm Hg, pulse is 130/min, respirations are 36/min, and pulse oximetry is 98% on room air. There is clear rhinorrhea. The posterior oropharynx and tonsils are erythematous. There is mild swelling of the neck and crepitus over the anterior chest. Pulmonary examination reveals clear and equal breath sounds bilaterally. Cardiac examination shows a normal S1 and S2 with no murmurs, rubs, or gallops. Which of the following is the best next step in evaluation of this patient?"}],"o":[["A","Bronchoscopy"],["B","Chest x-ray"],["C","Contrast esophagography"],["D","Pulmonary function tests"],["E","Throat culture"]],"a":"B"},{"id":"4838","b":2,"n":18,"s":[{"p":"A 2-year-old boy is brought to the emergency department after his parents found a dark red, formed stool in his diaper. He has been eating and drinking well but seems more tired than usual. The family lives on a ranch raising cattle and goats. Temperature is 37°C (98.6°F). Examination shows a pale, cooperative boy. The abdomen is soft, nondistended, nontender, and without masses. There are no anal fissures or hemorrhoids. A fecal occult blood test is positive. Laboratory results are as follows:"},{"ul":["Leukocytes: 8,000/mm³","Hematocrit: 27%","Platelets: 320,000/mm³"]},{"p":"Which of the following is most likely to confirm the diagnosis for this patient?"}],"o":[["A","Abdominal CT scan"],["B","Abdominal ultrasound"],["C","Air contrast enema"],["D","Bacterial stool culture"],["E","Cow’s milk elimination diet"],["F","Technetium-99m pertechnetate scan"],["G","Upper endoscopy"]],"a":"F"},{"id":"16118","b":2,"n":19,"s":[{"p":"A 5-day-old girl is brought to the emergency department due to fussiness. The patient was born at home to a 36-year-old woman, gravida 5 para 5, via spontaneous vaginal delivery. The mother received no prenatal care. The newborn has been breastfeeding exclusively and has had nonbloody, nonbilious vomiting after feeds for the past day. Head circumference and length are at the 50th percentile. Weight is at the 20th percentile. Temperature is 37.2°C (99°F) and pulse is 180/min. The newborn has poor tone and is jaundiced. The anterior fontanelle is sunken with overriding sutures. Eye examination shows bilateral cataracts. Ears are in the normal position, and the palate is intact with a normal tongue. Cardiopulmonary examination is normal. The liver is palpable 4 cm below the costal margin. Which of the following is the most likely cause of this newborn’s presentation?"}],"o":[["A","Advanced maternal age"],["B","In utero fetal alcohol exposure"],["C","Maternal nonadherence to vaccination schedule"],["D","Newborn inability to metabolize breast milk"],["E","Newborn inherited muscle dystrophy"]],"a":"D"},{"id":"2390","b":2,"n":20,"s":[{"p":"A 16-year-old girl comes to the emergency department with heavy vaginal bleeding for 3 days. The patient’s menses have been irregular since menarche at age 14 and occur every 4-5 months; her previous menstrual period was almost 4 months ago. She has no medical problems and has had no surgeries. She does not use tobacco, alcohol, or illicit drugs. The patient is sexually active and uses condoms for contraception. Temperature is 37.2°C (99°F), blood pressure is 110/60 mm Hg, pulse is 90/min, and respirations are 16/min. On pelvic examination, there is a moderate amount of blood in the vaginal vault and active bleeding from the cervical os. Bimanual examination shows a small uterus and no adnexal masses. Pelvic ultrasound reveals a small uterus with a thick endometrial stripe and normal ovaries. Urine pregnancy test is negative. Laboratory results are as follows:"},{"ul":["Hemoglobin: 10 g/dL","Mean corpuscular volume: 76 fL","Platelets: 320,000/mm³","PT: 12 sec","Activated PTT: 26 sec"]},{"p":"Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Emergency dilation and curettage"],["B","High-dose gonadotropin-releasing hormone agonists"],["C","High-dose oral contraceptive therapy"],["D","Packed red blood cell transfusion"],["E","Workup for coagulation factor deficiency"]],"a":"C"},{"id":"15848","b":2,"n":21,"s":[{"p":"A 2-year-old boy is seen in the emergency department for refusal to walk. His family returned 3 days ago from a weekend camping trip in Arizona. The parents do not recall the boy having any injuries, but he did have a cough and runny nose just before the trip. Since returning home, the parents have noticed the patient limping mildly when running. After day care yesterday, his left knee began hurting. The parents placed a cold compress on the knee last evening, which helped. This morning, the patient refused to walk and cried when the parents took him out of bed. He has no chronic medical conditions and takes no medications. Immunizations are up to date. Temperature is 38.3°C (101°F). The skin over the left knee is warm and edematous. There are no abrasions. The patient resists all attempts at passive range of motion. The knee is aspirated, and synovial fluid reveals a leukocyte count of 53,000/mm³; the joint aspiration specimen is sent for culture. The patient is admitted to receive intravenous vancomycin. After 2 days, he continues to have fever and refuses to walk. Which of the following is the most appropriate to add to this patient’s regimen?"}],"o":[["A","Ceftriaxone"],["B","Clindamycin"],["C","Doxycycline"],["D","Itraconazole"],["E","Metronidazole"]],"a":"A"},{"id":"3007","b":2,"n":22,"s":[{"p":"A 15-year-old boy is brought to the clinic due to fatigue, malaise, fever, and sore throat for the past 6 days. The patient has been in bed most of this time, uninterested in reading or playing video games due to tiredness. He has no chronic medical conditions and takes no medications. The patient is sexually active and uses condoms inconsistently. He does not use tobacco, alcohol, or illicit drugs. Temperature is 38.3°C (101°F), blood pressure is 115/70 mm Hg, pulse is 90/min, and respirations are 18/min. Physical examination shows pharyngeal hyperemia with exudates along with cervical and axillary lymphadenopathy. Breath sounds are normal. There are no heart murmurs. The abdomen is soft and nontender. Mild hepatosplenomegaly is present. Joints have a normal range of motion. There is no skin rash. A rapid streptococcal antigen test is negative. Which of the following is the most appropriate management for this patient?"}],"o":[["A","Administer corticosteroids"],["B","Advise bed rest for at least 1 week"],["C","Initiate antibacterial therapy"],["D","Prescribe antiviral treatment"],["E","Refrain from sports for at least 3-4 weeks"]],"a":"E"},{"id":"2572","b":2,"n":23,"s":[{"p":"A newborn male infant is evaluated in the neonatal intensive care unit for growth restriction. The infant was bor
