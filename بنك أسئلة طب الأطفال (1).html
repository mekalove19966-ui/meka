ltrasound"],["E","Repeat complete blood count and urine culture"]],"a":"D"},{"id":"15459","b":8,"n":9,"s":[{"p":"A 4-month-old boy is brought to the clinic by his mother due to concerns of appearing pale. Over the past few days, he has been sleeping more than usual and is less interactive. The boy is exclusively breastfed, and he slept through two of his usual feeding sessions yesterday. He continues to have good urine output. The patient was born at 40 weeks gestation and had a normal nursery course. His mother’s prenatal course was unremarkable. However, the patient’s newborn screen revealed an extra band representing gamma tetramers on hemoglobin electrophoresis. The patient takes a vitamin D supplement daily. Vital signs are normal. He appears tired and has mild scleral icterus. The remainder of the examination shows no abnormalities. Laboratory evaluation of this patient would most likely show which of the following?"}],"o":[["A","Mean corpuscular volume: Normal | Erythrocyte: Decreased | Peripheral smear: Schistocytes"],["B","Mean corpuscular volume: Normal | Erythrocyte: Decreased | Peripheral smear: Spherocytes"],["C","Mean corpuscular volume: Normal | Erythrocyte: Increased | Peripheral smear: Polychromasia"],["D","Mean corpuscular volume: Low | Erythrocyte: Decreased | Peripheral smear: Pencil cells"],["E","Mean corpuscular volume: Low | Erythrocyte: Increased | Peripheral smear: Target cells"]],"a":"E"},{"id":"3838","b":8,"n":10,"s":[{"p":"An 11-year-old boy with sickle cell disease is brought to the emergency department with worsening shortness of breath, weakness, and fatigue over the past 3 days. The patient has no fever, cough, or chest pain. He has had many hospitalizations for treatment of acute pain and a hospitalization for acute chest syndrome. Temperature is 36.7°C (98°F). Pulse oximetry is 98% on room air. Physical examination shows a pale, tired-appearing boy. Cardiac examination reveals tachycardia; a 3/6 systolic murmur is heard throughout the precordium. The lungs are clear to auscultation. The abdomen is soft and nontender with no palpable liver or spleen. Laboratory results are as follows:"},{"ul":["Hemoglobin: 4.5 g/dL","Reticulocytes: 0.1%","Platelets: 200,000/mm³","Leukocytes: 10,000/mm³"]},{"p":"Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Acute chest syndrome"],["B","Aplastic anemia"],["C","Aplastic crisis"],["D","Autoimmune hemolytic anemia"],["E","Myocardial infarction"],["F","Splenic sequestration crisis"]],"a":"C"},{"id":"3197","b":8,"n":11,"s":[{"p":"A 5-month-old boy is brought to the clinic due to fussiness and fever for 2 days. His medical history is significant for previous episodes of otitis media, oral candidiasis, and gastroenteritis due to rotavirus. The patient is at the third percentile for weight. His temperature is 39.3°C (102.8°F), pulse is 120/min, respiratory rate is 28/min, and blood pressure is 80/60 mm Hg. Physical examination shows an erythematous, bulging right tympanic membrane with poor mobility on pneumatic otoscopy. The lymph nodes are not palpable, and the tonsils are not visualized. Laboratory results are as follows:"},{"ul":["Platelets: 240,000/mm³","Leukocytes: 7,500/mm³","Lymphocytes: 5%","IgG: 210 mg/dL","IgA: 35 mg/dL","IgM: 14 mg/dL","CD4⁺ count: 80/mm³ (640-1,175/mm³)","CD8⁺ count: 70/mm³ (335-875/mm³)"]},{"p":"Which of the following is the most likely etiology of this patient’s condition?"}],"o":[["A","Bruton agammaglobulinemia"],["B","Chronic granulomatous disease"],["C","Common variable immunodeficiency"],["D","Severe combined immunodeficiency"],["E","Wiskott-Aldrich syndrome"]],"a":"D"},{"id":"2875","b":8,"n":12,"s":[{"p":"An 8-month-old boy is brought to the physician for evaluation of pale mucous membranes, irritability, and listlessness. The stool examination is negative for blood, ova, and parasites. Serum laboratory studies are as follows:"},{"ul":["Hemoglobin: 6 g/L","Mean corpuscular hemoglobin concentration: 25%","Mean corpuscular hemoglobin: 16.5 pg","Mean corpuscular volume: 68 fl","Red cell distribution width: 22% (normal: 11.5-14.5%)","Reticulocytes: 0.6%","Platelets: 230,000/μL","Leukocytes: 5,500/μL","Iron: 40 μg/dL","Total iron binding capacity: 460 μg/dL (normal: 300-350 μg/dL)","Transferrin saturation: 8.7% (normal 15-50%)","Total bilirubin: 0.9 mg/dL"]},{"p":"The peripheral blood smear shows marked anisocytosis, microcytosis, and hypochromia. Which of the following is the most likely cause of this patient’s anemia?"}],"o":[["A","Alpha thalassemia"],["B","Anemia of chronic disease"],["C","Autoimmune hemolysis"],["D","Beta thalassemia"],["E","Folate deficiency"],["F","Iron deficiency"],["G","Sideroblastic anemia"],["H","Vitamin B₁₂ deficiency"]],"a":"F"},{"id":"3122","b":8,"n":13,"s":[{"p":"A 2-day-old boy is evaluated in the newborn nursery for a diffuse rash that developed this morning and appears on the patient’s face, chest, abdomen, and extremities. He has been breastfeeding every 2-3 hours and voiding frequently. The infant was born at 40 weeks gestation to a 30-year-old woman by vaginal delivery. His mother occasionally develops cold sores during stressful events, most recently a year ago. The mother also had chickenpox as a child. Temperature is 36.7°C (98°F), pulse is 132/min, and respirations are 42/min. Physical examination shows scattered, blanching, erythematous papules and pustules that spare the palms and soles. The rash is shown in exhibit A and exhibit B. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Bacterial blood culture and intravenous antibiotics"],["B","Contact isolation and cessation of breastfeeding"],["C","Parental reassurance"],["D","Skin biopsy"],["E","Topical corticosteroids"],["F","Viral DNA testing and intravenous antiviral therapy"]],"a":"C"},{"id":"4850","b":8,"n":14,"s":[{"p":"A 9-year-old girl is brought to the clinic for evaluation of persistent nasal congestion. Her symptoms began 2 weeks ago with fever, rhinorrhea, and congestion. Over the last week, the patient has developed a dry cough that is worse at night, and she has had to miss her daily swim practice. Her mother had been treating the symptoms with acetaminophen and an over-the-counter cough and cold medication. The fever has resolved, but nasal symptoms have not improved. The patient has no chronic medical conditions and takes no daily medications. Her father smokes cigarettes outside the house. Temperature is 37.2°C (99°F). Examination shows erythema and swelling of the nasal turbinates with purulent nasal drainage bilaterally. Mucopurulent discharge is present in the posterior pharynx. Bilateral tympanic membranes are clear and mobile. The lungs are clear to auscultation. Which of the following is the most common risk factor for development of this patient’s current condition?"}],"o":[["A","Adenoidal hypertrophy"],["B","Chronic cigarette exposure"],["C","Nasal septal deformities"],["D","Recurrent pool water exposure"],["E","Viral upper respiratory infection"]],"a":"E"},{"id":"3694","b":8,"n":15,"s":[{"p":"A 5-year-old girl with chronic renal insufficiency is brought to the physician for a follow-up visit. Since birth, she has had multiple episodes of urinary tract infections, for which she takes trimethoprim-sulfamethoxazole daily for prophylaxis. She has a history of poor growth and mild hypertension but is otherwise developmentally normal. Her mother lost custody of the girl 3 years ago due to failure to comply with recommended treatment and prophylaxis of her infections. The girl has since lived with her grandmother. Examination shows mild bilateral lower-extremity edema but no other abnormalities. Urinalysis shows mild proteinuria but no white blood cells or bacteria. Renal scintigraphy with dimercaptosuccinic acid shows bilateral focal parenchymal scarring and blunted calyces. Which of the following is the most likely predisposing factor for this patient’s recurrent infections?"}],"o":[["A","Common variable immunodeficiency"],["B","Neurogenic bladder"],["C","Posterior urethral valves"],["D","Polycystic kidney disease"],["E","Recurrent sexual abuse"],["F","Unilateral renal agenesis"],["G","Vesicoureteral reflux"]],"a":"G"},{"id":"3676","b":8,"n":16,"s":[{"p":"A 1-day-old boy is admitted to the neonatal intensive care unit due to macrocephaly and jaundice. The infant was born by spontaneous vaginal delivery at 41 weeks gestation to a 38-year-old gravida 4 who had consistent prenatal care. The patient’s mother is an elementary school teacher who traveled to Zambia during the first trimester to work with local teachers. During the trip, she developed fever for 2 weeks, swollen glands, and muscle aches that resolved spontaneously. The patient’s mother had 2 prior live vaginal births and one first-trimester miscarriage. The infant’s weight and length are at the 25th percentile; head circumference is >95th percentile. Vital signs are normal. Physical examination shows diffuse jaundice. The liver is palpable 4 cm below the costal margin. Auscultation of the heart and lungs is normal. Head CT scan shows hydrocephalus and diffuse intracranial calcifications. Laboratory studies reveal a total bilirubin of 7.2 mg/dL and direct bilirubin of 5.5 mg/dL. Which of the following maternal exposures most likely resulted in this infant’s condition?"}],"o":[["A","Infected genital secretions"],["B","Infected respiratory droplets"],["C","Mosquito bite"],["D","Saliva"],["E","Undercooked meat"]],"a":"E"},{"id":"4854","b":8,"n":17,"s":[{"p":"A 2-year-old boy is brought to the emergency department due to fever and respiratory distress. A week ago the patient had rhinorrhea and nasal congestion that spontaneously resolved. For the past 3 days he has had persistent fever and has become increasingly tired. Today his breathing is labored. The patient has no chronic medical conditions and is up to date with recommended vaccinations. Temperature is 38.2°C (100.7°F). Scattered, mobile, subcentimeter lymph nodes are palpable in the anterior cervical chain bilaterally. Cardiac examination shows tachycardia, an S3 gallop, and a grade 3/6 holosystolic murmur loudest at the cardiac apex. Brachial and femoral pulses are 1+. Pulmonary examination reveals tachypnea, nasal flaring, and subcostal retractions. Scattered wheezes are present at the lung bases and persist despite bronchodilator treatment. The liver is palpated 4 cm (1.6 in) below the costal margin. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute rheumatic fever"],["B","Asthma exacerbation"],["C","Community-acquired pneumonia"],["D","Kawasaki disease"],["E","Viral hepatitis"],["F","Viral myocarditis"]],"a":"F"},{"id":"4769","b":8,"n":18,"s":[{"p":"A 14-year-old girl is brought to the office due to heavy vaginal bleeding. Since menarche at age 13, menses have been irregular but not painful. Her last menstrual period was 6 weeks ago, and her current menses started 7 days ago. She is soaking through a thick pad every 2 or 3 hours and bled through her clothing overnight. She has no history of recurrent epistaxis or bruising. The patient has no chronic medical conditions or previous surgeries. Her mother required a blood transfusion with delivery, but has had no other bleeding episodes. Blood pressure is 110/60 mm Hg and pulse is 65/min. The external genitalia are normal and consistent with sexual maturity rating (Tanner stage) 4 development. The abdomen is nontender, nondistended, and has no masses. On pelvic examination, there is dark red bleeding from the cervical os. Urine pregnancy test is negative. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Cervical inflammation"],["B","Endometrial implantation within the myometrium"],["C","Hypothalamic-pituitary-ovarian axis immaturity"],["D","Impaired platelet aggregation"],["E","Monoclonal myometrial proliferation"]],"a":"C"},{"id":"3078","b":8,"n":19,"s":[{"p":"A 4-week-old, full-term boy is brought to the office due to vomiting. Since birth, he has had small spit-ups with feeding. However, for the past few days he has had forceful emesis after every feed that is worsening. The emesis consists of formula and is neither bilious nor bloody. Despite this, the patient has an excellent appetite and “always seems hungry.” He passes one small stool every other day, and his last bowel movement was yesterday. Weight today is down 0.5 kg (1.1 lb) from a well-child visit 2 weeks ago. On examination, the patient is awake and alert. His anterior fontanelle is sunken and he has decreased skin turgor. Capillary refill is 3 seconds. The abdomen is soft, nontender, and nondistended. The scrotum has no erythema, and the testes are descended. Which of the following is the best next step in management of this patient?"}],"o":[["A","Abdominal radiograph"],["B","Abdominal ultrasound"],["C","CT scan of the head"],["D","Serum 17-hydroxyprogesterone level"],["E","Stool guaiac test"],["F","Trial of reflux precautions"]],"a":"B"},{"id":"13626","b":8,"n":20,"s":[{"p":"A 5-year-old girl is brought to the office for evaluation of pubic hair. Her mother first noticed dark hair in the genital area while helping her daughter bathe several weeks ago. The patient has also developed axillary hair and adult-type body odor over the last 2 weeks. She has no known medical conditions and takes no daily medications. She started kindergarten 3 months ago. The girl’s mother underwent menarche at age 12. Weight is at the 75th percentile, height is at the 90th percentile, and BMI is at the 25th percentile. Fundoscopic examination and pupillary reaction are normal bilaterally. Cardiopulmonary examination is normal. The abdomen is soft and nontender; no masses are palpable. Breasts are prepubertal. Sparse, dark, coarse hair is noted in both axillae and over the mons pubis and labia majora. There is no clitoromegaly. Mild comedonal acne is present on the forehead, nose, and chin. Which of the following is the best next step in evaluation of this patient?"}],"o":[["A","Bone age evaluation"],["B","Karyotype analysis"],["C","Pelvic ultrasound"],["D","Serum prolactin level"],["E","Serum TSH level"]],"a":"A"},{"id":"2763","b":8,"n":21,"s":[{"p":"A 3-year-old girl is brought to the emergency department due to a first-time seizure. The patient was watching television 30 minutes ago when her left arm began to twitch, which progressed to twitching in all 4 extremities and loss of consciousness for 1 minute. Medical history is notable for receptive and expressive language delays. Vital signs are normal. Examination shows a sleepy but arousable toddler lying on the bed. An erythematous patch is present on the right forehead and upper eyelid, which her parents say has been present since birth. There is a light brown macule with an irregular border measuring 0.5 cm on the abdomen. Skin examination is otherwise normal. Visual field examination reveals a left homonymous hemianopia. Neurologic examination is otherwise unremarkable. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Capillary hemangioma"],["B","Neurofibromatosis type 1"],["C","Neurofibromatosis type 2"],["D","Sturge-Weber syndrome"],["E","Tuberous sclerosis"]],"a":"D"},{"id":"2656","b":8,"n":22,"s":[{"p":"A 9-year-old girl is brought to the emergency department due to chest pain. The patient was eating dinner with her family an hour ago when she accidentally swallowed a fish bone. She initially had sharp pain but now has only dull pain in the lower part of her chest. The patient can still drink liquids and appears comfortable. Vital signs are normal. There is no neck swelling, tenderness, or crepitus. The lungs are clear to auscultation. The abdomen is soft, nontender, and nondistended. The remainder of the physical examination is unremarkable. Chest radiograph reveals no objects in the esophagus. CT scan shows a 2-cm, linear hyperdensity in the distal esophagus near the lower esophageal sphincter but no subcutaneous emphysema or free air within the mediastinum. Which of the following is the best next step in management of this patient?"}],"o":[["A","Induce emesis"],["B","No additional management indicated"],["C","Obtain a barium esophagogram"],["D","Perform endoscopy"],["E","Repeat imaging in 12-24 hours"]],"a":"D"},{"id":"11968","b":8,"n":23,"s":[{"p":"A 3-day-old girl is being evaluated for fussiness, poor feeding, and decreased urine output that began this morning. She was born to a 31-year-old woman by an uncomplicated home vaginal delivery. During the first 2 days of life, the infant had latched and fed well and made an adequate number of wet diapers. However, she is now afebrile but tachypneic, tachycardic, and mildly hypertensive. Oxygen saturation in the right hand is 96% and oxygen saturation in the right foot is 85% on room air. Capillary refill is equal in both lower extremities and duration is about 4 seconds. A systolic murmur is heard at the left paravertebral interscapular area. A flat bluish-grey discoloration with well-demarcated, irregular borders is seen overlying the sacrum. Laboratory results are as follows:"},{"ul":["Sodium: 137 mEq/L","Potassium: 4.1 mEq/L","Chloride: 100 mEq/L","Bicarbonate: 16 mEq/L","Lactic acid: 18 mg/dL (normal: 9-16 mg/dL)","Arterial blood gas pH: 7.23","PaO₂: 47 mm Hg","PaCO₂: 37 mm Hg"]},{"p":"Which of the following is the most likely underlying pathophysiology of this patient’s findings?"}],"o":[["A","Adrenal cortical hyperplasia"],["B","Adrenal medullary tumor"],["C","Cystic dilations in renal collecting ducts"],["D","Increase in ductal prostaglandin concentration"],["E","Proliferation of the metanephric blastema"],["F","Thickening of the tunica media in the aortic arch"]],"a":"F"},{"id":"3416","b":8,"n":24,"s":[{"p":"A 1-year-old girl is brought to the emergency department because she is not moving her right arm. Her father says that the girl acted normally when she awoke this morning. He was swinging her by the forearms when she suddenly started crying and refused to use her right arm. He has swung her by the arms previously and it usually makes her laugh. The girl lives with her father and her mother, who is currently out of town. Physical examination shows a well-nourished child who holds her right arm in pronation against the chest. She avoids any movement of her right arm. There is no bony tenderness to palpation. No bruises or other abnormalities are seen. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Contact the child protection agency"],["B","Closed reduction and casting of the right arm"],["C","Gently hyperpronate the right forearm"],["D","Order a complete skeletal survey"],["E","Order an x-ray of the right arm"],["F","Schedule open surgical correction"]],"a":"C"},{"id":"3867","b":8,"n":25,"s":[{"p":"A 5-year-old girl is brought to the office for evaluation of pubic hair. Her mother noticed dark hair under the girl’s arms and in her pubic area several days ago when helping her bathe. The patient has no headaches, visual changes, abdominal pain, or behavioral changes. She is obese and currently on a diet and exercise program. Several maternal relatives have type 2 diabetes mellitus. The patient’s height has been tracking along the 50th percentile and weight at the 97th percentile. Physical examination shows a cooperative girl with mild facial acne. No breast buds are palpable. She has dark, coarse hair across the pubis and under both axillae. External genitalia appear normal. Bone age is normal. Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","Congenital adrenal hyperplasia"],["B","Granulosa cell tumor"],["C","Hepatoblastoma"],["D","Hypothalamic glioma"],["E","Idiopathic precocious puberty"],["F","McCune-Albright syndrome"],["G","Pituitary hamartoma"],["H","Premature adrenarche"]],"a":"H"},{"id":"2830","b":8,"n":26,"s":[{"p":"A 5-year-old boy is brought to the office due to ear pain. Two days ago, the patient developed low-grade fever and pain in the left ear. His parents think he is also having trouble hearing from the left ear as they have noticed him tilt his right ear toward the television. For the past week, the patient has also had a runny nose and cough, which developed soon after the family flew home from vacation. He has no history of ear infections or other chronic issues and takes no medications. Temperature is 38.1°C (100.6°F), blood pressure is 110/60 mm Hg, and pulse is 110/min. Examination shows bulging of the left tympanic membrane, which is pale yellow and immobile with pneumatic insufflation. The right tympanic membrane and bilateral auditory canals appear normal. The nasal mucosa appears boggy, and postnasal drip is present. The maxillary and frontal sinuses are nontender. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute otitis media"],["B","Barotrauma"],["C","Bullous myringitis"],["D","Cholesteatoma"],["E","Chronic suppurative otitis media"],["F","Otitis media with effusion"]],"a":"A"},{"id":"2756","b":8,"n":27,"s":[{"p":"A 9-year-old boy is brought to the office due to oozing skin lesions on his legs. The patient developed the rash yesterday and has been uncomfortable due to pain and pruritus. He and his father returned 4 days ago from their annual camping excursion; they had applied sunscreen and insect repellants during the trip. The patient takes no medications and has no known allergies. Skin examination shows a well-demarcated tan line starting just above the knee as well as scattered erythema with overlying vesicles in a linear arrangement below the knees. Some lesions appear wet and others have a thin, crusted coating. Which of the following mechanisms is most likely responsible for this patient’s skin findings?"}],"o":[["A","Antibody-antigen complex deposition"],["B","Autoantibody-mediated hypersensitivity"],["C","Epidermal cell DNA damage"],["D","IgE-mediated response"],["E","T cell-mediated reaction"]],"a":"E"},{"id":"4845","b":8,"n":28,"s":[{"p":"A 6-year-old boy is brought to the office due to eyelid swelling. His mother noted a mosquito bite below his left lower eyelid 2 days ago. He developed mild swelling and redness of the lid yesterday and awoke today with his left eye swollen shut. He had a fever this morning that was relieved with acetaminophen. The patient has also had decreased energy and took naps after breakfast and lunch yesterday, which was unusual. Temperature is 38.3°C (101°F). The left lower eyelid is erythematous, edematous, and tender to palpation. Visual acuity is 20/20 in both eyes. The pupils are equal, round, and reactive. There is limited left eye adduction; the right eye has a normal range of motion. Laboratory results are as follows:"},{"ul":["Hemoglobin: 12.8 g/dL","Platelets: 200,000/mm³","Leukocytes: 18,000/mm³"]},{"p":"Which of the following is the most concerning finding in this patient?"}],"o":[["A","Eyelid edema"],["B","Eyelid erythema"],["C","Fever"],["D","Leukocytosis"],["E","Ophthalmoplegia"]],"a":"E"},{"id":"2457","b":8,"n":29,"s":[{"p":"A 3-year-old girl is brought to the office for a health supervision examination. The patient has met developmental milestones appropriately and is up to date on immunizations. Temperature is 36.6°C (97.9°F), blood pressure is 156/96 mm Hg, and pulse is 100/min. She appears well nourished. On abdominal palpation, there is mild tenderness in the right lower and upper quadrants and a palpable mass in the right abdomen. Ultrasound reveals a 12-cm, heterogenous, solitary mass arising from the superior pole of the right kidney. Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","Neuroblastoma"],["B","Pheochromocytoma"],["C","Polycystic kidney disease"],["D","Renal cell carcinoma"],["E","Wilms tumor (nephroblastoma)"]],"a":"E"},{"id":"4584","b":8,"n":30,"s":[{"p":"A 9-year-old boy is brought to the physician with fever, hives, and joint pain. The pruritic rash began 2 days ago and has spread to cover his trunk and arms. Today, the boy has been having pain in the wrists and ankles. He is currently taking oral penicillin for streptococcal pharyngitis that was diagnosed 9 days ago. His temperature is 38.8°C (101.8°F). Physical examination shows an ill-appearing boy with a diffuse rash on the arms and back. There are palpable lymph nodes in the cervical, axillary, and inguinal regions. The wrists and ankles are tender to palpation but are not swollen or erythematous. The remainder of the physical examination is normal. Which of the following is the most likely diagnosis?"}],"o":[["A","Acute rheumatic fever"],["B","Anaphylaxis"],["C","Henoch-Schönlein purpura"],["D","Infectious mononucleosis"],["E","Scarlet fever"],["F","Serum sickness-like reaction"],["G","Stevens-Johnson syndrome"]],"a":"F"},{"id":"7741","b":8,"n":31,"s":[{"p":"An 18-month-old boy is brought to the office for a well-child visit. He was born full term and had no perinatal complications. He has had 2 episodes of otitis media that required treatment with antibiotics. The patient has a 12-15-word vocabulary, but strangers can understand only about 4 words. According to his parents, he babbles gibberish most of the time. He uses single words to indicate what he wants but does not combine them into 2-word phrases. He pulls to stand and can walk only while holding on to furniture or a parent’s hand. Growth has been consistent along the 40th percentile for height, weight, and head circumference. During the visit, the patient pretends to feed a baby doll and sits on the floor scribbling with a crayon. He offers his mother the crayon but cries when the physician tries to play with him. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Articulation disorder"],["B","Autism spectrum disorder"],["C","Cognitive delay"],["D","Gross motor delay"],["E","Language delay"],["F","Normal development"]],"a":"D"},{"id":"3404","b":8,"n":32,"s":[{"p":"A 6-year-old boy is brought to the office for follow-up for a limp. His symptoms began 2 months ago as a dull ache in the left knee with an intermittent limp. The parents brought him to an urgent care center at that time and were reassured that the laboratory evaluation and x-rays of the knees and hips were normal. The pain has not worsened, but the patient now has a persistent limp with no other joint or muscle pain. He has been well except for a brief upper respiratory infection with low-grade fever about 2 weeks ago. He has a history of recurrent ear infections and had tympanostomy tubes placed 2 years ago. The patient takes no daily medications, and immunizations are up to date. Temperature is 37.1°C (98.8°F), blood pressure is 95/65 mm Hg, pulse is 80/min, and respirations are 16/min. BMI is at the 60th percentile. Examination shows a well-appearing and alert child. Range of motion, particularly internal rotation and abduction, of the left hip is markedly limited. The remainder of the examination is normal. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Bacterial arthritis"],["B","Developmental dysplasia of the hip"],["C","Hematogenous osteomyelitis"],["D","Legg-Calvé-Perthes disease"],["E","Slipped capital femoral epiphysis"],["F","Transient synovitis"]],"a":"D"},{"id":"15895","b":8,"n":33,"s":[{"p":"A 9-year-old girl is brought to the office by her mother for assessment of “bad stomach aches.” The patient has missed 5 days of school in the past few weeks due to intermittent abdominal pain that is “achy all over” and worse in the morning. She has not had associated nausea, vomiting, diarrhea, or constipation. Her appetite is poor. The mother reports that her daughter used to be talkative and outgoing, but now she declines invitations to play at friends' houses and instead takes naps after school. The patient has been distracted in class lately and less engaged in group activities. Her father lost his job 3 months ago and has been home more often since then. The mother says, “Things have been difficult financially. It doesn’t help that her father has started drinking again.” When interviewed, the patient is withdrawn and makes poor eye contact. When asked if she feels depressed, she says, “Everything will be better when no one has to take care of me anymore.” She avoids answering further questions. The patient has no significant medical history. Vital signs and physical examination, including abdominal examination, are normal. Which of the following is the most appropriate next step in the management of this patient?"}],"o":[["A","Arrange for an in-home social work assessment"],["B","Contact the patient’s school for further information"],["C","Obtain a comprehensive metabolic panel"],["D","Obtain an abdominal ultrasound"],["E","Obtain an emergency assessment for possible hospitalization"],["F","Recommend antidepressant treatment"],["G","Recommend family therapy"]],"a":"E"},{"id":"2655","b":8,"n":34,"s":[{"p":"A 3-year-old boy is brought to the emergency department by his pregnant mother after developing severe abdominal pain within the past hour and having several episodes of vomiting. The patient’s vomit is black and red in color. Blood pressure is 80/50 mm Hg, pulse is 140/min, and respirations are 30/min. On physical examination, he is irritable and lethargic. Examination shows a normal oropharynx. Cardiopulmonary examination is normal. The abdomen is soft and mildly tender at the epigastrium; there is no hepatosplenomegaly. The extremities are cool to the touch. Laboratory results are as follows:"},{"ul":["Hemoglobin: 12.5 g/dL","Platelets: 175,000/mm³","Leukocytes: 12,500/mm³","Sodium: 140 mEq/L","Potassium: 3.7 mEq/L","Chloride: 104 mEq/L","Bicarbonate: 18 mEq/L","Blood urea nitrogen: 10 mg/dL","Creatinine: 0.4 mg/dL","Glucose: 100 mg/dL"]},{"p":"Chest x-ray is normal. Abdominal imaging shows several radiopaque tablets in the stomach. Intravenous normal saline is started. Which of the following is the best next step in management of this patient?"}],"o":[["A","Calcium gluconate"],["B","Deferoxamine"],["C","Hemodialysis"],["D","N-acetylcysteine"],["E","Naloxone"],["F","Succimer"],["G","Vitamin K"]],"a":"B"},{"id":"16101","b":8,"n":35,"s":[{"p":"A 2-year-old girl is brought to the office for follow-up after recent hospitalization. Two weeks ago, she had abrupt onset of dysphagia, drooling, and vomiting after eating sausage. She underwent urgent esophagoscopy, which showed complete occlusion of the esophageal lumen with impacted food. Impaction was removed and there were no mucosal lesions or strictures at the site of the impaction. Follow-up barium esophagography reveals a deep impression on the posterior aspect of the esophagus at about the level of T4. Recovery was uneventful. The parents report that this is her second episode of food impaction. The patient drinks liquids well but has always had frequent choking with solid foods. Medical history also includes frequent respiratory tract infections, including 2 episodes of middle lobe pneumonia in the last year. Her weight was advancing along the 50th percentile until approximately age 9 months, when her growth began to slow; weight is now at the 15th percentile. On examination, the child appears small for her age. The oral cavity and oropharynx are clear, the lungs are clear, and heart rate is regular with no murmurs. Which of the following is the most likely etiology of this patient’s condition?"}],"o":[["A","Congenital vascular malformation"],["B","Eosinophilic inflammation of the esophagus"],["C","Esophageal ganglionic degeneration"],["D","Foreign body ingestion"],["E","Fungal infection of the esophagus"],["F","Malignant proliferation of mucous gland tissue"]],"a":"A"},{"id":"3827","b":8,"n":36,"s":[{"p":"A 4-year-old boy is brought to the emergency department by his father due to nausea, vomiting, diarrhea, and abdominal pain over the past 4 hours. Their home bathroom is being repainted due to peeling paint, and prior to the onset of symptoms the patient’s father noticed that several pill bottles were open. Temperature is 37.2°C (99°F), blood pressure is 76/38 mm Hg, pulse is 160/min, and respirations are 34/min. On physical examination, the patient appears tired and is responsive only to painful stimuli. The oropharynx is clear but appears dry. Peripheral pulses are weak, and capillary refill is 4 seconds. Not long after examination, the boy develops hematemesis. Laboratory results are as follows:"},{"ul":["Hemoglobin: 13.5 g/dL","Platelets: 300,000/mm³","Leukocytes: 6,800/mm³","Sodium: 143 mEq/L","Potassium: 4.8 mEq/L","Chloride: 102 mEq/L","Bicarbonate: 14 mEq/L","Blood urea nitrogen: 31 mg/dL","Creatinine: 1.1 mg/dL","Glucose: 118 mg/dL","Arterial blood gas pH: 7.30","PaO₂: 90 mm Hg","PaCO₂: 30 mm Hg"]},{"p":"Chest and abdominal x-rays reveal several small opacities in the stomach and duodenum. Which of the following was most likely ingested by this patient?"}],"o":[["A","Acetaminophen"],["B","Aspirin"],["C","Iron"],["D","Lead"],["E","Oxycodone"],["F","Warfarin"]],"a":"C"},{"id":"2469","b":8,"n":37,"s":[{"p":"A 3-month-old full-term boy is brought to the emergency department for refusal to feed. The infant has been exclusively breastfed since birth but has not been latching onto the nipple. He has been urinating normally and usually stools 3 or 4 times a day, but his last bowel movement was several days ago. He was previously able to hold his head up on his own but his head now seems floppy. The patient’s family recently moved to California and has been enjoying stroller walks in their newly built neighborhood. Other than daily vitamin D supplementation, the infant has never ingested food, even honey. Vital signs are normal. Examination shows bilateral ptosis, sluggish pupillary reaction to light, copious drool, weak suck and gag reflexes, and head lag. The extremities are flaccid and in extension. What is the most likely mechanism of this patient’s illness?"}],"o":[["A","Ascending demyelinating polyneuropathy"],["B","Autoantibodies against acetylcholine receptors"],["C","Bacterial infection of the meninges"],["D","Degeneration of the anterior horn cells in the spinal cord"],["E","Ingestion of Clostridium difficile spores"],["F","Ingestion of Clostridium botulinum spores"],["G","Ingestion of preformed Clostridium botulinum toxin"]],"a":"F"},{"id":"3666","b":8,"n":38,"s":[{"p":"A 3-day-old boy is in the neonatal intensive care unit for management of prematurity. For the past hour, the patient has had decreased spontaneous movements and tone. He has also had one episode of bradycardia and apnea. The patient was delivered vaginally at 28 weeks and 5 days gestation by a multiparous woman with cervical insufficiency. Apgar scores were 8 and 9 at 1 and 5 minutes, respectively. Birth weight was 1.04 kg (2 lb  5 oz). Prenatal laboratory studies and ultrasounds were normal. Rupture of membranes occurred 3 hours prior to birth. The amniotic fluid was clear, and there was no maternal fever. Temperature is 37.1°C (98.8°F). Head circumference is 28.5 cm, an increase of 3 cm from yesterday. Examination shows a lethargic neonate with a weak cry, tense fontanelle, and generalized hypotonia. The patient then develops a generalized seizure. Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Hypocalcemia"],["B","Hypoglycemia"],["C","Hypoxic ischemic encephalopathy"],["D","Inborn error of metabolism"],["E","Intraventricular hemorrhage"],["F","Meningitis"]],"a":"E"},{"id":"15219","b":8,"n":39,"s":[{"p":"An 11-year-old girl is brought to the office due to an unsteady gait. Her parents first noticed increasing clumsiness 6 weeks ago, which has since progressed to difficulty standing and walking. The patient has had no recent illnesses, including fever, cough, or diarrhea. She takes no medication and has no allergies. She has scoliosis for which she sees an orthopedic surgeon twice a year. The patient was adopted, and the only known family history is sudden cardiac death in her biological father. Her adoptive mother has anxiety that is well controlled with medication. On examination, the patient is found to have a wide-based gait and constantly shifts her position to maintain balance. The lower extremities have decreased vibratory and position sense, and ankle jerks are absent bilaterally. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute cerebellar ataxia"],["B","Benzodiazepine ingestion"],["C","Friedreich ataxia"],["D","Guillain-Barré syndrome"],["E","Lead toxicity"]],"a":"C"},{"id":"3198","b":8,"n":40,"s":[{"p":"A 2-year-old boy is brought to the clinic due to a “boil” on his right arm. His medical history includes 3 previous skin infections. The patient had a perianal abscess incised and drained at age 2 months after no improvement following a course of oral antibiotics; cultures grew Staphylococcus aureus. At age 7 months, he had a left inguinal lymphadenitis due to Serratia marcescens. Last year, the patient had a left calf abscess requiring surgical drainage; cultures grew Burkholderia cepacia. His temperature is 37.3°C (99.2°F). Physical examination shows an indurated, fluctuant mass on the lateral aspect of the patient’s right arm. The remainder of his physical examination is unremarkable. Laboratory studies show normal leukocyte, platelet, and B and T cell concentrations. Which of the following is the most likely diagnosis?"}],"o":[["A","Chediak-Higashi syndrome"],["B","Chronic granulomatous disease"],["C","DiGeorge syndrome"],["D","Leukocyte adhesion defect"],["E","Wiskott-Aldrich syndrome"]],"a":"B"},{"id":"2681","b":9,"n":1,"s":[{"p":"A 6-year-old boy is brought to the clinic by his mother due to behavioral concerns. Several months ago, the parents divorced. Over the past month, the mother has noticed that the patient has become increasingly inattentive, which has affected his school and home life. At school, his first-grade teacher has noticed that he often stares into space, blinking for several seconds. Some students in his class have teased him because of this behavior. On several occasions at home, while helping to set the dinner table or while cleaning his room, he would pause. When questioned by his mother, the patient would ignore her, blankly staring before resuming the task. During physical examination, he is pleasant, talkative, and interactive. Neurologic examination shows intact cranial nerves. The patient has normal strength, sensations, and reflexes bilaterally. Gait is normal and Romberg test is negative. This patient would most likely benefit from which of the following?"}],"o":[["A","Cognitive behavioral therapy"],["B","Ethosuximide therapy"],["C","Methylphenidate therapy"],["D","Modafinil therapy"],["E","Reassurance that the behavior is normal"]],"a":"B"},{"id":"3773","b":9,"n":2,"s":[{"p":"A 5-day-old girl is brought to the emergency department for evaluation of vaginal discharge. Her mother has noticed white vaginal discharge mixed with a small amount of blood since yesterday. The girl does not appear to be in pain and has been voiding and stooling adequately. She is exclusively breastfed every 2-3 hours. The mother mentions that she was treated “with a shot and a pill” for a sexually transmitted disease early in her pregnancy and subsequently tested negative. The girl was born via forceps-assisted vaginal delivery due to protracted labor at 38 weeks gestation. Temperature is 36.7°C (98°F). Physical examination reveals a thin, white, odorless vaginal discharge with blood streaking. The external genitalia are otherwise unremarkable, and the abdomen is soft and nontender without palpable masses. What is the most likely cause of this patient’s vaginal discharge?"}],"o":[["A","Candidal vaginitis"],["B","Chlamydia trachomatis infection"],["C","Maternal hormone withdrawal"],["D","Rhabdomyosarcoma"],["E","Traumatic injury"],["F","Vaginal foreign body"]],"a":"C"},{"id":"4404","b":9,"n":3,"s":[{"p":"A 5-month-old girl is brought to the office by her parents for evaluation of a skin lesion on her buttock. Her parents initially noticed a small, red macule several weeks after her birth and thought it was an insect bite. They have been applying over-the-counter hydrocortisone cream but the lesion has progressively enlarged, especially over the last 2 months. The skin lesion is shown in the image. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Arteriovenous malformation"],["B","Cherry angioma"],["C","Nevus flammeus"],["D","Nevus simplex"],["E","Pyogenic granuloma"],["F","Superficial hemangioma"]],"a":"F"},{"id":"3791","b":9,"n":4,"s":[{"p":"A 5-year-old girl is brought to the office for evaluation of “itchy private parts” for the past week. Her mother has noticed the scratching at bedtime but not during the day. Due to the itching, the patient has difficulty falling asleep. Her mother has been applying a topical emollient with only minimal symptom relief. The patient has no urinary symptoms and has soft bowel movements once every other day. She attends daycare during the week and lives with her mother, stepfather, and 13-year-old stepbrother, none of whom have similar symptoms. Physical examination shows an erythematous vulva and no vaginal discharge. The perianal area is excoriated and diffusely erythematous. No other lesions are noted. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Candida vulvovaginitis"],["B","Contact dermatitis"],["C","Helminth infection"],["D","Lichen sclerosus"],["E","Neisseria gonorrhoeae cervicitis"],["F","Scabies infection"]],"a":"C"},{"id":"3681","b":9,"n":5,"s":[{"p":"A 9-month-old girl is brought to the clinic for a well-child visit. She was born precipitously at 35 weeks gestation due to preterm labor to a 22-year-old primigravida who did not receive prenatal care. The patient’s neonatal course was notable for a 1-week hospital stay due to difficulty feeding. She was hospitalized for bronchiolitis at age 3 months for 4 days. The patient can crawl but has not begun cruising. She has been babbling and repeating “mama.” Height, weight, and head circumference track along the 25th percentile. She is alert and smiling at the examiner and her mother. Ophthalmoscopic examination reveals a white reflex in the left eye and a red reflex in the right. Extraocular movements are intact, and the pupils are equal and reactive to light. The corneal light reflex is symmetric. The remainder of the examination is normal. Which of the following is the most likely cause of this patient’s physical examination findings?"}],"o":[["A","Congenital cytomegalovirus infection"],["B","Congenital rubella syndrome"],["C","Retinitis pigmentosa"],["D","Retinoblastoma"],["E","Retinopathy of prematurity"]],"a":"D"},{"id":"3684","b":9,"n":6,"s":[{"p":"A 6-day-old boy is brought to the office for a routine visit after discharge from the hospital. He is exclusively breastfed and is gaining weight appropriately. He was born at 40 weeks gestation to a primigravida who had an uncomplicated vaginal delivery. Physical examination at rest shows bilateral medial deviation of the forefoot. Ankle movements appear normal, and passive and active movement of the foot results in lateral deviation of the forefoot. The remainder of the physical examination is normal. Which of the following is the best next step in management of this patient?"}],"o":[["A","Foot radiographs"],["B","Karyotype analysis"],["C","Reassurance"],["D","Serial manipulation and casting"],["E","Ultrasound of hips"]],"a":"C"},{"id":"4847","b":9,"n":7,"s":[{"p":"An 18-month-old boy is brought to the emergency department due to blood in his stool, which the parents noticed when changing his diaper. The infant has had no previous bleeding and has been eating and drinking normally. He has a history of recurrent otitis media, frequent herpes labialis, and 2 episodes of pneumonia. Vital signs are normal. On examination, the patient is well developed, well nourished, and has a fair complexion. He has eczema on his cheeks, trunk, and extremities. Scattered petechiae are also visible on his lower extremities. The remainder of the physical examination is unremarkable. Laboratory studies show a platelet count of 24,000/mm³ and a leukocyte count of 9,000/mm³. Peripheral smear confirms the low platelet count and that the platelets are small. Genetic testing confirms the diagnosis. Which of the following processes is most likely affected by this patient’s gene mutation?"}],"o":[["A","Antibody class switching"],["B","Cytoskeleton regulation"],["C","DNA repair"],["D","Hydrogen peroxide production"],["E","Maturation of T cells"]],"a":"B"},{"id":"16270","b":9,"n":8,"s":[{"p":"A 4-week-old girl is brought to the office due to yellowing of the skin. The parents first noticed the symptoms a week ago and the patient’s skin has become progressively more yellow. She was born at term to a primigravida mother via spontaneous vaginal delivery. The pregnancy and delivery were unremarkable, and the patient was discharged at 48 hours of life. She is exclusively breastfed and is gaining weight appropriately. Bowel movements occur once or twice daily, but the stool has become increasingly light in color and is now pale gray. Examination reveals scleral icterus and jaundice to the umbilicus. The liver is palpable 4 cm below the costal margin and the spleen tip is palpable. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hemoglobin: 11.0 g/dL"]},{"p":"Liver function studies"},{"ul":["Total bilirubin: 12.8 mg/dL","Direct bilirubin: 8.1 mg/dL","Aspartate aminotransferase (SGOT): 52 U/L","Alanine aminotransferase (SGPT): 70 U/L"]},{"p":"Which of the following is the most likely primary mechanism for this patient’s hyperbilirubinemia?"}],"o":[["A","Decreased conjugation"],["B","Decreased excretion"],["C","Decreased hepatic uptake"],["D","Increased enterohepatic circulation"],["E","Increased production"]],"a":"B"},{"id":"3402","b":9,"n":9,"s":[{"p":"A 1-month-old girl is brought to the office for a routine newborn examination. She was born at 39 weeks gestation to a 26-year-old primigravida by cesarean section for breech presentation. The pregnancy and delivery were otherwise uncomplicated, and prenatal ultrasound revealed normal fetal anatomy. The infant is formula fed every 3-4 hours and sleeps 5-6 hours overnight. The patient lives at home with her parents and grandparents. She received the hepatitis B vaccine at age 5 days. Physical examination shows an alert infant who is moving all extremities equally. There are 4 skin creases along the patient’s inner left thigh and 1 on the right thigh. When supine with the knees flexed, the left knee appears to be inferior to the right knee. Skin examination shows a nonblanching, blue-grey macule with indefinite borders over the sacrum. The rest of the examination is normal. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","MRI of lumbosacral spine"],["B","Reassurance"],["C","Repeat examination in 2 weeks"],["D","Ultrasound of hips"],["E","Ultrasound of lumbosacral spine"],["F","X-ray of hips"]],"a":"D"},{"id":"3686","b":9,"n":10,"s":[{"p":"An 11-year-old boy is brought to the physician for evaluation of scoliosis. His mother noticed that he always seems to be leaning even when he tries to sit or stand upright. The boy has a history of myopia and upward lens dislocation for which he wears corrective glasses. He otherwise has been healthy and doing well in school. His father had scoliosis and vision problems and died from “heart problems” last year. Physical examination shows a boy with a long face, high arched palate with crowded teeth, and upward dislocation of the lens. He has a tall stature for his age; long arms and legs with minimal subcutaneous fat; long, thin fingers; and a prominent sternum. Joint hypermobility, skin hyperelasticity, and 15 degrees of thoracic scoliosis are seen. A diastolic murmur is heard in the aortic area. Which of the following is the most likely etiology of this patient’s condition?"}],"o":[["A","Cystathionine synthase deficiency"],["B","Defective collagen production"],["C","Mutation of the fibrillin-1 gene"],["D","Mutation of the fibrillin-2 gene"],["E","Nondisjunction resulting in an extra X chromosome"]],"a":"C"},{"id":"2466","b":9,"n":11,"s":[{"p":"A 25-hour-old full-term boy in the nursery is vomiting. His mother had attempted to breastfeed but stopped when he developed “bright green” vomiting. The infant has not yet had a bowel movement. Maternal prenatal screening was positive for a copy of the CFTR ΔF508 mutation. His paternal uncle had cystic fibrosis and died of respiratory failure. The boy’s temperature is 36.7°C (98°F), blood pressure is 80/50 mm Hg, pulse is 154/min and respirations are 46/min. Examination shows a crying infant with a markedly distended abdomen. Rectal examination shows no stool in the rectal vault. Feeds are held and a nasogastric tube is placed for decompression. X-rays of the abdomen show markedly dilated loops of bowel with no rectal air and no free air. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Anorectal manometry"],["B","Computed tomography of the abdomen"],["C","Contrast enema"],["D","Rectal biopsy"],["E","Serum lipase"],["F","Surgery"],["G","Sweat chloride testing"]],"a":"C"},{"id":"2486","b":9,"n":12,"s":[{"p":"A 13-month-old boy is brought to the clinic for a well-child visit. The patient has been walking since age 10 months. He can say “mama” and “dada.” Solid food intake consists of homegrown baby food, including small portions of fruits, vegetables, eggs, and grains once a day. He breastfeeds 8-10 times a day. The patient was born full-term and has no chronic medical conditions. He takes no medications or vitamins. He has a cousin with achondroplasia. On examination, the anterior fontanel is wide open. The skull bones are pliable to palpation. Bony prominences are palpated at the costochondral junctions bilaterally. Bilateral legs appear bowed; the left leg appears more bowed than the right. The remainder of his examination is normal. Which of the following is the most likely cause of this patient’s findings?"}],"o":[["A","Achondroplasia"],["B","Congenital syphilis"],["C","Hypothyroidism"],["D","Normal variant"],["E","Nutritional rickets"]],"a":"E"},{"id":"4875","b":9,"n":13,"s":[{"p":"A 1-year-old boy is brought to the clinic to establish care after his family’s recent move to the area. The patient was born at full term and has been growing and developing normally. Each day, he eats meat and pasta and drinks 300 mL (10 oz) of whole milk; however, he does not eat fruit and vegetables. The patient takes no daily medications or vitamins. Weight and height are at the 50th percentile. Conjunctivae and mucous membranes are pale. Cardiac examination reveals no murmurs. Pulmonary examination is normal. The abdomen is soft, and no hepatosplenomegaly is noted. Complete blood count results are as follows:"},{"ul":["Hemoglobin: 10 g/dL (normal: 10.5-13.5)","Red blood cells: 6.1 million/mm³ (normal: 3.7-6)","Mean corpuscular volume: 60 μm³ (normal: 70-86)","Red cell distribution width: 13% (normal: 11.5%-14.5%)","Reticulocytes: 4% (normal: 0.5%-1.5%)"]},{"p":"Which of the following is the most likely cause of this patient’s anemia?"}],"o":[["A","Anemia of chronic disease"],["B","Folate deficiency"],["C","Hereditary spherocytosis"],["D","Iron deficiency"],["E","Thalassemia minor"]],"a":"E"},{"id":"4353","b":9,"n":14,"s":[{"p":"A 4-year-old boy is brought to the office due to a 1-day fever of 38.4°C (101.1°F) and left-sided neck swelling. His mother says, “He was fine until yesterday, but now his neck is really bothering him.” The patient has had no trauma to the area, has not been ill recently, and has no known sick contacts. Vaccinations are up to date. Physical examination shows a red, tender, and fluctuant mass approximately 2 cm in diameter in the left anterior cervical lymph node chain. Dentition and oropharynx are normal. There are no other areas of lymphadenopathy. Which of the following is the most likely infectious etiology?"}],"o":[["A","Adenovirus"],["B","Bartonella henselae"],["C","Cytomegalovirus"],["D","Epstein-Barr virus"],["E","Prevotella buccae"],["F","Staphylococcus aureus"]],"a":"F"},{"id":"2475","b":9,"n":15,"s":[{"p":"A 2-day-old Asian girl is evaluated in the newborn nursery due to jaundice. She was born at 40 weeks gestation to a 30-year-old mother via uncomplicated vaginal delivery. Membranes ruptured spontaneously an hour prior to delivery. Prenatal laboratory testing was normal. Group B streptococcus screen was negative. Maternal blood group is AB, Rh D-positive. The patient has been exclusively breastfeeding with good latch, voiding appropriately, and passing meconium. She has 2 healthy older siblings, both of whom required phototherapy in the first few days of life. Weight and length are at the 50th percentile. Vital signs are normal. On examination, jaundice of the face and neck is present. The remainder of the examination is unremarkable. Laboratory results at 34 hours of life are as follows:"},{"ul":["Total bilirubin: 9 mg/dL","Conjugated bilirubin: 0.4 mg/dL","Hematocrit: 52%","Peripheral smear: normal"]},{"p":"Which of the following mechanisms is contributing to this newborn’s condition?"}],"o":[["A","Decreased beta globin chain production"],["B","Decreased glucose-6-phosphate dehydrogenase activity"],["C","Decreased hepatic bilirubin clearance"],["D","Extrahepatic bile duct fibrosis"],["E","Inherited red blood cell membrane defect"],["F","Isoimmune-mediated hemolysis"]],"a":"C"},{"id":"4030","b":9,"n":16,"s":[{"p":"A 6-year-old boy is brought to the emergency department with severe shortness of breath. He has had a runny nose for the past week and fever, chills, and productive cough for 2 days. The patient was diagnosed with cystic fibrosis on newborn screening and has had multiple hospitalizations since infancy for respiratory infections requiring intravenous antibiotics. He also had multiple skin infections requiring incision and drainage over the past year. Temperature is 39.4°C (103°F), blood pressure is 90/60 mm Hg, pulse is 130/min, and respirations are 35/min. Pulse oximetry shows a SaO₂ of 85% that improves to 92% after oxygen supplementation. Examination shows nasal flaring, intercostal retractions, and grunting, and auscultation reveals bibasilar crackles and expiratory wheezing. Chest x-ray reveals infiltrates in the right and left lower lobes. Influenza antigen testing is positive. Cefepime and oseltamivir are administered. Which of the following empiric antibiotics should also be administered in this patient?"}],"o":[["A","Intravenous itraconazole"],["B","Intravenous nafcillin"],["C","Intravenous vancomycin"],["D","Oral amoxicillin"],["E","Oral azithromycin"],["F","Oral ciprofloxacin"]],"a":"C"},{"id":"15468","b":9,"n":17,"s":[{"p":"An 11-month-old boy is brought to the emergency department due to irritability and poor fluid intake. Two weeks ago, the boy developed a fever with poor appetite and was prescribed antibiotics for presumed bacterial pharyngitis. He continued to have a daily fever despite antibiotic and antipyretic therapy. Over the last 2 days, the patient has consumed half the volume of formula he normally drinks and has been sweating while feeding. He is often irritable when awake and has been napping longer than usual. Temperature is 38.6°C (101.4°F), blood pressure is 74/38 mm Hg, pulse is 194/min, and respirations are 60/min. The patient appears irritable. Bilateral conjunctivae are injected. Cardiopulmonary examination reveals an S3 gallop with grunting and diffuse fine crackles bilaterally. The liver is 3 cm below the costal margin. There is edema of the bilateral lower extremities. A diffuse macular rash with areas of confluence is present on the trunk and the extremities. Echocardiogram shows a left ventricular ejection fraction of 40% with a segment of dilation in the left coronary artery. Which of the following is the most likely etiology of this patient’s condition?"}],"o":[["A","Coxsackievirus infection"],["B","Group A Streptococcus infection"],["C","Kawasaki disease"],["D","Neisseria meningitidis infection"],["E","Systemic lupus erythematosus"],["F","Takayasu arteritis"]],"a":"C"},{"id":"3541","b":9,"n":18,"s":[{"p":"A 3-year-old boy is brought to the emergency department due to loss of consciousness while playing at a park. The boy was short of breath from running when he appeared blue and went limp for approximately 10 seconds. His mother caught his fall and says that he regained consciousness quickly. He did not hit his head or experience any trauma. However, the patient has previously lost consciousness during excess crying and temper tantrums. The events are brief and accompanied by blue discoloration of his lips. The patient was born full term via normal vaginal delivery, and there was no known history of cyanosis or jaundice in the neonatal period. He has met all developmental milestones. The patient’s father has hypertension and hyperlipidemia, and his paternal uncle has a seizure disorder. Temperature is 37.5°C (99.5°F), pulse is 110/min, and respirations are 45/min. Physical examination shows an alert and mildly cyanotic boy with a systolic ejection murmur along the mid to upper left sternal border. When the child squats, the murmur becomes louder and the cyanosis improves. The abdomen is soft, nontender, and nondistended. No organomegaly is present. Femoral and brachial pulses are equal and 2+. Deep tendon reflexes are 2+. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Absence epilepsy"],["B","Breath-holding spell"],["C","Generalized seizure"],["D","Hypertrophic cardiomyopathy"],["E","Isolated atrial septal defect"],["F","Tetralogy of Fallot"],["G","Vasovagal syncope"]],"a":"F"},{"id":"3194","b":9,"n":19,"s":[{"p":"A previously healthy 2-year-old girl is in the intensive care unit due to coma and respiratory failure. The patient began having a headache and confusion a day ago. This morning, her parents brought her to the emergency department due to vomiting. In the emergency department, the patient began having generalized tonic-clonic seizures. She was intubated and sedated. The patient and her older brother had fever, cough, and pharyngitis last week. The nanny gave the child over-the-counter medications for fever, but the parents do not know exactly what. The patient’s older sister had a cold sore on her lip 2 weeks ago. Temperature is 37.1°C (98.8°F). On examination, the girl is unresponsive and intubated. Pupils are equal and have a sluggish reaction to light. The sclera is nonicteric, and the neck is supple. Mild hepatomegaly is palpated on abdominal examination. Laboratory studies are as follows:"},{"p":"Liver function studies"},{"ul":["Total bilirubin: 0.5 mg/dL","Aspartate aminotransferase: 906 U/L","Alanine aminotransferase: 1214 U/L"]},{"p":"Cerebral spinal fluid"},{"ul":["Opening pressure: 320 mm of H₂O","Glucose: 53 mg/dL","Protein: 32 mg/dL","Leukocytes: 2/mm³"]},{"p":"CT scan of the brain reveals diffuse cerebral edema. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Anticholinergic toxicity"],["B","Bacterial meningitis"],["C","Hepatitis A infection"],["D","Reye syndrome"],["E","Viral encephalitis"]],"a":"D"},{"id":"16322","b":9,"n":20,"s":[{"p":"A newborn boy is being evaluated in the nursery for respiratory distress. He was born an hour ago at 37 weeks gestation via spontaneous vaginal delivery to a primigravid mother who had scant prenatal care. Delivery was uneventful. During skin-to-skin contact, the mother noticed his face turn blue. The patient was stimulated and began crying, which improved his color. Weight, length, and head circumference are in the 25th-50th percentile. Temperature is 36.8°C (98.2°F), pulse is 150/min, and respirations are 48/min. Pulse oximetry is 97% on room air. As the crying stops, pulse oximetry decreases to 80% on room air. A 5-French catheter is unable to be passed through either naris. The ears are short and wide with no earlobes. The right eye is as shown in the image (coloboma). Oropharyngeal examination reveals a cleft palate. The patient has a loud, harsh, holosystolic murmur best heard at the lower left sternal border. The testes are not palpable. The skin and extremities appear normal. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","CHARGE syndrome"],["B","DiGeorge syndrome"],["C","Fanconi anemia"],["D","Trisomy 13"],["E","VACTERL syndrome"]],"a":"A"},{"id":"4260","b":9,"n":21,"s":[{"p":"A 2-hour-old boy has developed worsening cyanosis over the past few minutes. The infant was delivered vaginally at term after an uncomplicated pregnancy. Birth weight was 4.1 kg (9 lb). Apgar scores were 7 and 8 at 1 and 5 minutes, respectively. Oxygen is administered by hood but does not relieve the cyanosis. Further examination shows tachypnea, subcostal retractions, a normal first heart sound, a single and loud second heart sound, and no murmur. Which of the following is the most likely cause of the infant’s cyanosis?"}],"o":[["A","Atrial septal defect"],["B","Coarctation of the aorta"],["C","Dextrocardia"],["D","Hypoplastic left heart syndrome"],["E","Patent ductus arteriosus"],["F","Tetralogy of Fallot"],["G","Transposition of the great vessels"],["H","Ventricular septal defect"]],"a":"G"},{"id":"3250","b":9,"n":22,"s":[{"p":"A 10-year-old boy is brought to the emergency department due to sudden-onset nausea, abdominal cramps, and several episodes of vomiting over the last 2 hours. He has not had diarrhea. His mother notes that the patient’s 6-year-old sister has similar symptoms. The children ate barbecued chicken with potato salad at a community lunch 4 hours before the symptoms began. They also swam in the community pool and played with a pet turtle. The patient has a history of upper respiratory infections and received antibiotics a month ago for acute otitis media. Temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, and pulse is 88/min. Abdomen is soft and nontender. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Bacillus cereus"],["B","Campylobacter jejuni"],["C","Clostridium difficile"],["D","Clostridium perfringens"],["E","Enterotoxigenic Escherichia coli"],["F","Giardia lamblia"],["G","Listeria monocytogenes"],["H","Nontyphoidal salmonella"],["I","Shiga toxin-producing Escherichia coli"],["J","Staphylococcus aureus"]],"a":"J"},{"id":"3624","b":9,"n":23,"s":[{"p":"A previously healthy 9-year-old boy is evaluated for a deep puncture wound to the foot. He was walking barefoot on the beach when he stepped on a rusty nail. His parents cleaned the wound with soap and water and applied pressure to it. The boy takes no medications. He has not received any vaccinations due to parental preference. The boy’s parents are divorced and have joint custody of him. The indications, benefits, and risks of tetanus vaccination are discussed with both parents. The mother consents to the proposed tetanus vaccination and requests that it be administered immediately. However, his father refuses to agree to the vaccination as he prefers to explore herbal remedies. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Ask the patient about his wishes and proceed with his decision"],["B","Consult the hospital’s ethics committee"],["C","Obtain a court order to proceed with the proposed treatment"],["D","Proceed with the proposed treatment"],["E","Withhold the proposed treatment"]],"a":"D"},{"id":"3440","b":9,"n":24,"s":[{"p":"A 4-year-old boy is brought to the office for evaluation of a rash. His mother states that “pinpoint” bruises have appeared all over his body during the past 24 hours. The patient has had no bleeding or recent trauma. Three weeks ago, he had an upper respiratory tract infection that resolved uneventfully. The patient takes no medications, he has no allergies, and his immunizations are up to date. There is no family history of bleeding or clotting disorders. Vital signs are normal for age. Physical examination shows a cooperative, well-appearing child with scattered petechiae on the trunk and extremities. Oral mucosa appears normal. There is no lymphadenopathy or splenomegaly. Laboratory results are as follows:"},{"ul":["Hemoglobin: 13.5 g/dL","Platelets: 40,000/mm³","Leukocytes: 7,000/mm³"]},{"p":"Peripheral smear shows few platelets; the platelets are of normal size and morphology. Which of the following is the best next step in management of this patient?"}],"o":[["A","Bone marrow evaluation"],["B","Intravenous antibiotics"],["C","Intravenous immunoglobulin"],["D","Observation"],["E","Platelet transfusion"],["F","Splenectomy"]],"a":"D"},{"id":"16030","b":9,"n":25,"s":[{"p":"A 2-day-old infant is evaluated in the newborn nursery. The patient was born at term via spontaneous vaginal delivery to a 30-year-old woman. The pregnancy and delivery were uncomplicated. The mother had regular prenatal care, and her only medication was a daily prenatal vitamin. Family history is unremarkable. The patient’s length at birth was at the 10th percentile. Weight and head circumference were at the 25th percentile. On initial examination after delivery, the patient was found to have ambiguous genitalia. The infant has been breastfeeding and has had appropriate urine and stool output. Examination shows an alert newborn with normal tone. The abdomen is soft with no palpable masses. Genitourinary examination reveals severe curvature of an underdeveloped phallus. The urethral meatus is at the base of the structure, flanked by labioscrotal folds; the gonads are not palpable. Examination of the mother shows no acne or hirsutism. Laboratory results are as follows:"},{"p":"Serum chemistry"},{"ul":["Sodium: 138 mEq/L","Potassium: 4.0 mEq/L","Chloride: 102 mEq/L","Bicarbonate: 24 mEq/L","Blood urea nitrogen: 11 mg/dL","Creatinine: 0.6 mg/dL","Calcium: 9.2 mg/dL","Glucose: 70 mg/dL"]},{"p":"Endocrine"},{"ul":["Testosterone, serum: 850 ng/dL (normal: 20-80)","Karyotype: 46,XX"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","5-Alpha reductase deficiency"],["B","Androgen insensitivity syndrome"],["C","Congenital adrenal hyperplasia"],["D","Placental aromatase deficiency"],["E","Sertoli-Leydig cell tumor"]],"a":"C"},{"id":"8951","b":9,"n":26,"s":[{"p":"A 6-month-old girl is brought to the office for a well-child visit and routine vaccinations. The patient is exclusively breastfed and is urinating and stooling normally. One month ago, she was hospitalized for intussusception that was reduced successfully by air enema. The patient lives in a small apartment with her mother, brother, and maternal aunt, who is pregnant. Vital signs are normal. On examination, she has mild nasal congestion and clear rhinorrhea. The remainder of the examination is normal. Her mother is very concerned about the potential side effects of vaccinations. Which of the following is this patient’s contraindication to the rotavirus vaccination?"}],"o":[["A","Administration of inactivated immunizations on the same day"],["B","Exclusive breastfeeding"],["C","History of intussusception"],["D","Pregnant household member"],["E","Viral upper respiratory infection"]],"a":"C"},{"id":"3544","b":9,"n":27,"s":[{"p":"A 3-year-old boy is brought to the office due to difficulty keeping up with the other children at day care. Over the last 2 months, the day care attendants have noticed that the patient has seemed more tired and less interested in active play. He has also had difficulty climbing stairs and jumping. The patient’s parents mention that he is still eating well and gaining weight but has had recurrent upper respiratory infections since starting day care. His last upper respiratory infection began 5 days ago. Temperature is 37°C (98.6°F), blood pressure is 90/50 mm Hg, pulse is 94/min, and respirations are 18/min. Examination shows clear rhinorrhea bilaterally. Cardiopulmonary and abdominal examinations are normal. Neurologic examination demonstrates 1+ patellar and Achilles reflexes bilaterally. The calves are enlarged and nontender. Which of the following is the most likely cause of this patient’s presentation?"}],"o":[["A","Absent dystrophin protein expression"],["B","Acetylcholine receptor antibody production"],["C","Muscle fiber viral inflammation"],["D","Neurotransmitter neurotoxin blockade"],["E","Peripheral nerve axon immune cross-reactivity"]],"a":"A"},{"id":"7726","b":9,"n":28,"s":[{"p":"A 5-day-old girl is brought to the physician for her first checkup. She was born full term to a primigravid mother by uncomplicated vaginal delivery. She was discharged from the well-baby nursery 3 days ago. Since then, she has been breastfeeding exclusively every 1-3 hours for 15 minutes per breast. She has had 5-6 wet diapers and 3-4 “yellow, seedy” stools daily. Birth weight was 3402 g (7 lb  8 oz). Current weight is 3260 grams (7 lb  3 oz). On examination, the girl is awake and alert. The anterior fontanelle is open, soft, and flat. Her mucous membranes are moist and capillary refill is <2 seconds. Peeling of the hands and feet is seen, as is acrocyanosis. Her diaper is shown in the image (brick dust/pink stains). Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Continue current feeding regimen"],["B","Fortification of breast milk with powdered formula"],["C","Intravenous fluids"],["D","Serum electrolytes"],["E","Supplementation with infant formula in addition to breastfeeding"],["F","Supplementation with water in addition to breastfeeding"],["G","Urinalysis"]],"a":"A"},{"id":"4843","b":9,"n":29,"s":[{"p":"A 3-year-old boy is brought to the office due to neck swelling. Yesterday, his parents first noticed a small lump on the right side of his neck. Today, the area is red, painful to touch, and larger. The patient had a cough, runny nose, and low-grade fever a week ago, and those symptoms have resolved. When the symptoms appeared, the family had just returned from a family reunion in eastern Arkansas, where several cousins also had a runny nose and fever. The patient has no chronic medical conditions and takes no medications. Immunizations are up to date. Temperature is 38.6°C (101.5°F), blood pressure is 104/74 mm Hg, pulse is 98/min and respirations are 25/min. On examination, a 5-cm, tender, warm, and poorly mobile anterior cervical lymph node is palpated on the right side. The overlying area is erythematous. Cardiopulmonary examination is normal. The abdomen is soft with no hepatosplenomegaly. The remainder of the examination is normal. Which of the following is the most appropriate treatment for this patient?"}],"o":[["A","Azithromycin"],["B","Cefdinir"],["C","Clindamycin"],["D","Itraconazole"],["E","Oseltamivir"],["F","Supportive care only"]],"a":"C"},{"id":"3871","b":9,"n":30,"s":[{"p":"A 6-year-old girl is brought to the office for evaluation of pubic hair development. The girl’s mother reports first noticing axillary hair a few weeks ago while dressing her for school. The patient has also had breast and pubic hair development but no vaginal bleeding, headaches, emesis, or visual disturbances. She has no medical conditions and takes no daily medications. The patient had 2 long bone fractures at ages 4 and 5. Family history is unremarkable. Physical examination reveals 2 large hyperpigmented macules with irregular contours on the left side of her back and chest. Axillae have secondary hair; there is no freckling. Bilateral breasts have budding and enlargement of the areola. There is coarse, dark pubic hair along the labia and the pubic junction. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Adrenal tumor"],["B","McCune-Albright syndrome"],["C","Neurofibromatosis type 1"],["D","Peutz-Jeghers syndrome"],["E","Sturge-Weber syndrome"],["F","Tuberous sclerosis"]],"a":"B"},{"id":"3546","b":9,"n":31,"s":[{"p":"A 5-year-old boy is brought to the office for an annual physical examination. The child has been healthy and takes no medications. His maternal uncle died from a myocardial infarction at age 56. Height and weight are at the 50th percentile. Temperature is 36.7°C (98°F), blood pressure is 95/53 mm Hg, pulse is 92/min, and respirations are 20/min. He is well-appearing and alert. Auscultation of the chest shows a grade II systolic ejection murmur at the left lower sternal border. It is best heard when the child is lying down and decreases with standing. No rubs or gallops are heard. Which of the following is the best next step in management of this patient?"}],"o":[["A","Cardiology referral"],["B","Chest x-ray"],["C","Echocardiogram"],["D","ECG"],["E","Holter monitor"],["F","Reassurance"]],"a":"F"},{"id":"15867","b":9,"n":32,"s":[{"p":"A 4-year-old boy is brought to the clinic for evaluation of fever and pain with urination. The fever began yesterday morning, and in the evening the patient would cry while urinating. Ibuprofen improved his fever and pain, but he began to vomit this morning. Medical history includes a febrile urinary tract infection at age 13 months that resolved after a course of antibiotics. At that time, a renal and bladder ultrasound was normal. Temperature is 39.1°C (102.4°F). Palpation elicits suprapubic and right-sided costovertebral angle tenderness. Urinalysis reveals positive nitrites and leukocyte esterase. A urine culture shows >100,000 colony-forming units/mL of Escherichia coli. The patient is given antibiotics, and his symptoms resolve in 24 hours. A repeat renal and bladder ultrasound is normal. Which of the following is the best next step in management of this patient?"}],"o":[["A","Abdominal and pelvic CT"],["B","Daily antibiotic prophylaxis"],["C","No additional management"],["D","Repeat urine culture in 4 weeks"],["E","Voiding cystourethrogram"]],"a":"E"},{"id":"4853","b":9,"n":33,"s":[{"p":"A 9-month-old infant is brought to the emergency department with lethargy and tachypnea. He was healthy before developing fever and diarrhea four days ago. He has been taking some formula, but has had two to three episodes of diarrhea with each bottle. He has lost three pounds (1.4 kg) since his routine check-up two weeks ago. He has had one wet diaper in the past twenty four hours. On examination, his temperature is 102.5°F (39.1°C), pulse is 200/min, respiratory rate is 42/min, and blood pressure is 70/45 mm Hg. He is lethargic with decreased tone and decreased deep tendon reflexes. His mucous membranes are dry. Cardiopulmonary exam reveals tachycardia and tachypnea. His abdominal exam is unremarkable. Capillary refill is four seconds. Laboratory results are shown below:"},{"p":"Chemistry panel"},{"ul":["Serum sodium: 165 mEq/L","Serum potassium: 4.5 mEq/L","Chloride: 108 mEq/L","Bicarbonate: 14 mEq/L","Blood urea nitrogen (BUN): 20 mg/dL","Serum creatinine: 0.8 mg/dL","Calcium: 10.0 mg/dL","Blood glucose: 98 mg/dL"]},{"p":"Which of the following fluids should be used as a bolus in the resuscitation of this infant?"}],"o":[["A","0.9% saline"],["B","0.45% saline"],["C","5% dextrose"],["D","5% albumin"],["E","Packed red blood cells"]],"a":"A"},{"id":"3906","b":9,"n":34,"s":[{"p":"A 4-year-old girl is diagnosed with Bordetella pertussis infection after an outbreak at her day care center. She has paroxysmal coughing fits and is prescribed a course of macrolide antibiotics. The patient lives with her 30-year-old parents and 1-year-old sister. Her family members have up-to-date immunizations and are asymptomatic. Which of the following is the most appropriate way to limit the immediate risk of infection in household contacts?"}],"o":[["A","Administer pertussis immunization to all household contacts"],["B","Administer postexposure prophylactic vaccination to the sister only"],["C","Prescribe a macrolide antibiotic for all household contacts"],["D","Prescribe a macrolide antibiotic for the sister"],["E","Prophylaxis for close contacts is not required"]],"a":"C"},{"id":"4436","b":9,"n":35,"s":[{"p":"An 18-year-old African American man comes to the office due to several months of excessive urination. The patient voids every few hours during the day and wakes 2 or 3 times per night to urinate despite restricting his evening fluid intake. He says that his urine appears clear and has no visible blood. Medical history is significant for seasonal allergies, for which he frequently takes an antihistamine. He takes no other medications and does not use tobacco, alcohol, or illicit drugs. The patient is sexually active and does not use condoms. He was adopted at a young age; records indicate that his birth mother had sickle cell disease and died from a stroke at age 32. The patient is afebrile and normotensive. Hematocrit is 41% and serum sodium is 138 mEq/L. Urinalysis of a first-morning specimen reveals the following:"},{"ul":["Specific gravity: 1.001 (normal: 1.010-1.030)","pH: 6.6 (normal: 4.5-8)","Protein: none","Blood: negative","Glucose: negative","Ketones: negative","Leukocyte esterase: negative","Nitrites: negative"]},{"p":"This patient’s polyuria is most likely caused by which of the following?"}],"o":[["A","Central diabetes insipidus"],["B","Chlamydia infection"],["C","Hyposthenuria"],["D","Medication adverse effect"],["E","Primary polydipsia"],["F","Type 1 diabetes mellitus"],["G","Type 2 diabetes mellitus"]],"a":"C"},{"id":"16584","b":9,"n":36,"s":[{"p":"A 13-year-old boy is brought to the office due to poor weight gain. His mother also notes that he is the shortest student in his class. The patient has occasional abdominal discomfort and a bloating sensation but has a good appetite and eats a balanced diet. He has had no nausea, vomiting, diarrhea, hematochezia, or melena. The patient has a 3-year history of type 1 diabetes, and his insulin was recently decreased due to recurrent episodes of hypoglycemia. Family history is significant for hypothyroidism in the mother. Vital signs are within normal limits. Weight is at the 5th percentile for age and height is at the 10th. Physical examination shows anicteric sclera, moist mucous membranes, no enlarged lymph nodes, and normal heart and lung sounds. The abdomen is nondistended, soft, and nontender with no organomegaly. Laboratory results are as follows:"},{"ul":["Hemoglobin: 10.8 g/dL","Mean corpuscular volume: 72 μm³","Platelets: 435,000/mm³","Leukocytes: 9,000/mm³","Hemoglobin A1c: 5.5%","TSH: 2.4 μU/mL"]},{"p":"Which of the following is the best next step in evaluation of this patient?"}],"o":[["A","Antitissue transglutaminase antibody assay"],["B","Contrast-enhanced abdominal CT scan"],["C","Quantitative fecal fat testing"],["D","Serum insulin-like growth factor 1 level"],["E","Sweat chloride measurement"]],"a":"A"},{"id":"3543","b":9,"n":37,"s":[{"p":"A 7-year-old girl is brought to the office for a routine physical examination. She and her parents have no concerns. The girl is in the second grade and has several friends at school. She is doing well academically, can tie her shoes independently, and is an adept soccer player. The patient is up to date on vaccinations and takes no daily medications. Weight is at the 50th percentile and height is at the 5th percentile for age. Examination shows a short, webbed neck and a broad chest with widely spaced nipples. Cardiovascular evaluation of this patient would most likely reveal which of the following anomalies?"}],"o":[["A","Atrial septa
