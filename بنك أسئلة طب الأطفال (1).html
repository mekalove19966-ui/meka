old girl is brought to the emergency department due to difficulty feeding. The infant was born at term to a woman age 24, gravida 2 para 2, following an uncomplicated pregnancy and had been breastfeeding well and voiding and stooling normally until 2 days ago. Since then, she has not been waking for feeds and has seemed much sleepier than usual. Today, she is fussy and difficult to console. The patient lives at home with her parents, 2-year-old sister, and 3 cats. Temperature is 35.1°C (95.2°F), blood pressure is 78/52 mm Hg, pulse is 150/min, and respirations are 62/min. The infant has a full fontanelle, jaundice of the chest, mild scleral icterus, and dry mucous membranes. Auscultation of the chest reveals mild tachypnea but clear lung fields. No murmur is present. Abdominal examination is normal. Neurologic examination shows a lethargic infant with decreased tone. Total and direct bilirubin levels and a complete blood count with differential are pending. Which of the following is the most appropriate next step in management of this infant?"}],"o":[["A","Bacterial cultures and antibiotics"],["B","CT scan of the head"],["C","Peripheral smear and reticulocyte count"],["D","Temporary cessation of breastfeeding"],["E","Thyroid function testing"]],"a":"A"},{"id":"3687","b":4,"n":11,"s":[{"p":"A 5-year-old girl is brought to the emergency department with sudden-onset weakness on her left side and slurred speech. She was sitting on the floor at home playing with her toys when she lost her balance and toppled over. Her father caught her and she did not hit her head. The patient has a history of developmental delay and “eye problems,” for which she has been seen by an ophthalmologist. She has no other chronic medical conditions. She takes no medications and has no known allergies. Vital signs are normal. Weight is at the 5th percentile and height is at the 90th percentile. Examination shows an alert, fair-skinned, blue-eyed girl. She has long, thin arms and legs and a decreased upper-to-lower segment ratio. Left upper and lower deep-tendon reflexes are brisk; Babinski sign is upgoing on the left side. Joint hyperlaxity and skin hyperelasticity are also seen. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Ehlers-Danlos syndrome"],["B","Fabry disease"],["C","Homocystinuria"],["D","Krabbe disease"],["E","Marfan syndrome"],["F","Phenylketonuria"],["G","Tay-Sachs disease"]],"a":"C"},{"id":"4438","b":4,"n":12,"s":[{"p":"A 6-year-old boy is brought to the office by his mother due to bleeding gums for the past 3 months. The patient brushes his teeth regularly and visits a dentist twice per year; his most recent dentist appointment 6 months ago was normal. The patient has become easily fatigued over the last 3-4 weeks and is not as active as he was previously. Height is below the 5th percentile and weight is at the 25th percentile for age. Several small patches of hypopigmentation are noted on the trunk. The thumbs appear hypoplastic and thenar eminences are flattened. Laboratory results are as follows:"},{"ul":["Leukocytes: 3,000/mm³","Hemoglobin: 6.5 g/dL","Mean corpuscular volume: 112 μm³","Platelets: 40,000/mm³"]},{"p":"Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Benzene exposure"],["B","Cobalamin deficiency"],["C","Congenital infection"],["D","DNA repair defect"],["E","Red blood cell enzyme deficiency"],["F","Thymic tumor"]],"a":"D"},{"id":"10742","b":4,"n":13,"s":[{"p":"A 3-year-old girl is brought to the emergency department by her babysitter for evaluation of burns. The babysitter states that she was bathing the child when the child turned on the hot water. The child began crying and was quickly removed from the water. The patient lives with her biological parents, who are at work, and has been cared for by this babysitter for the last 6 months. Examination reveals an alert child who is crying inconsolably and in severe pain. The back, buttocks, and legs have patches of blistered, waxy, red skin. If found in this patient, which of the following burn characteristics would be most concerning for child abuse?"}],"o":[["A","Asymmetric distribution of burn"],["B","Non-uniformity of burn depth"],["C","Poor demarcation of wound margins"],["D","Presence of splash marks"],["E","Sparing of flexural creases"]],"a":"E"},{"id":"3260","b":4,"n":14,"s":[{"p":"A 14-year-old boy comes to the office due to right ear pain, pruritus, and discharge over the past week. He has had no cold symptoms, hearing loss, dizziness, or tinnitus. The patient returned yesterday from a 2-week vacation at a lake house, where he swam and fished daily. Temperature is 37.1°C (98.8°F), blood pressure is 110/70 mm Hg, and pulse is 75/min. Manipulation of the right ear during otoscopy elicits pain. There is prominent swelling and erythema of the ear canal with purulent and crusty debris. The tympanic membrane appears normal and has normal mobility. The left ear is normal. Nasal and oropharyngeal mucosa are also normal, and no rashes or skin lesions are noted. Which of the following is the most likely causative organism of this patient’s current condition?"}],"o":[["A","Aspergillus fumigatus"],["B","Candida albicans"],["C","Haemophilus influenzae type b"],["D","Moraxella catarrhalis"],["E","Mucor circinelloides"],["F","Nontypeable Haemophilus influenzae"],["G","Pseudomonas aeruginosa"],["H","Streptococcus pneumoniae"]],"a":"G"},{"id":"2424","b":4,"n":15,"s":[{"p":"A 2-year-old boy is brought to the emergency department due to difficulty breathing that started 6 hours earlier. The patient has had rhinorrhea, nasal congestion, and a dry cough that sounds “like a barking dog” for the past day. Temperature is 37.7°C (99.9°F), blood pressure is 92/64 mm Hg, pulse is 122/min and respirations are 30/min. Pulse oximetry is 99% on room air. The patient has inspiratory stridor when crying. He is diagnosed with croup, administered oral dexamethasone, and observed in the emergency department. On reassessment 30 minutes later, oxygen saturation is 96% on room air and respirations are 40/min. The patient has inspiratory stridor at rest and subcostal and intercostal retractions. Which of the following is the best next step in management of this patient?"}],"o":[["A","Chest radiograph"],["B","Intubation and mechanical ventilation"],["C","Nebulized albuterol"],["D","Nebulized racemic epinephrine"],["E","Supplemental oxygen via face mask"]],"a":"D"},{"id":"4762","b":4,"n":16,"s":[{"p":"A 1-year-old boy is admitted to the intensive care unit for severe respiratory distress and hypoxia requiring endotracheal intubation and mechanical ventilation. Medical history shows 2 prior episodes of pneumonia, chronic thrush, and tympanostomy tube placement for recurrent otitis media. His vaccinations are not fully up to date due to illness at the time of his well visits. The patient is at the 2nd percentile for height and weight. Physical examination shows diffuse crackles in both lungs. Laboratory results are as follows:"},{"ul":["Leukocyte count: 9,000/mm³","Lymphocytes: 5%","CD19+: low","CD3+: absent","HIV-1 antibody: negative","IgG: 220 mg/dL","IgA: 45 mg/dL","IgM: 18 mg/dL"]},{"p":"Which of the following is the best long-term treatment for this patient?"}],"o":[["A","Antiretroviral therapy"],["B","Broad-spectrum antibiotics"],["C","Catch-up vaccinations"],["D","Intravenous immunoglobulin"],["E","Stem cell transplantation"]],"a":"E"},{"id":"15640","b":4,"n":17,"s":[{"p":"A 4-year-old girl is brought to the office by her father due to a day of dysuria and lower abdominal pain. The girl has been toilet-trained for a year but had an episode of urinary incontinence last night. The patient was hospitalized at age 2 for fatigue secondary to hemolytic anemia. Workup ultimately revealed a low glucose-6-phosphate dehydrogenase level at baseline. She has had no hematologic complications since then. Physical examination shows mild suprapubic tenderness but no costovertebral angle tenderness. The remainder of the physical examination is unremarkable. Laboratory results are as follows:"},{"ul":["Urinalysis Leukocyte esterase: positive","Urinalysis Nitrites: positive","Urinalysis Bacteria: many"]},{"p":"Which of the following antibiotics should be avoided in this patient?"}],"o":[["A","Amoxicillin-clavulanate"],["B","Cefixime"],["C","Cefpodoxime"],["D","Cephalexin"],["E","Nitrofurantoin"]],"a":"E"},{"id":"3437","b":4,"n":18,"s":[{"p":"A 7-year-old boy is brought to the emergency department due to fatigue. One week ago, he developed abdominal pain, vomiting, and diarrhea. A few days later, he noticed significant blood in his stool, which has since resolved. The patient had been feeling better until today, when his mother noticed that he did not want to get out of bed. Despite drinking a normal amount of fluids, the patient has not urinated in 24 hours. Multiple family members had similar initial gastrointestinal symptoms after attending a family cookout last week, but they have all recovered. On physical examination, there is scleral icterus and 2+ pedal edema. Which of the following laboratory abnormalities is most likely associated with this patient’s current condition?"}],"o":[["A","Decreased ferritin level"],["B","Decreased platelet count"],["C","Decreased reticulocyte count"],["D","Increased PT"],["E","Increased serum haptoglobin"],["F","Positive direct Coombs test"]],"a":"B"},{"id":"16288","b":4,"n":19,"s":[{"p":"A 4-week-old boy is brought to the clinic due to a change in bowel pattern. The patient was born at term and has been having a bowel movement after most feeds since birth. However, over the past week he has been stooling only 1 or 2 times a day, and the color has become consistently paler. The parents have also noticed progressive yellowing of the eyes over the last few weeks. The patient is exclusively breastfed and is in the 25th percentile for weight. He takes no medications. Temperature is 37.1°C (98.8°F). Physical examination shows a well-appearing infant with scleral icterus and jaundice of the face and chest. The abdomen is soft and bowel sounds are present. The liver is enlarged. The remainder of the examination is normal. Total bilirubin is 12.5 mg/dL. Hepatic ultrasound reveals absence of the gallbladder and confirms hepatomegaly. Which of the following laboratory patterns is most likely to be present in this patient?"}],"o":[["A","Direct bilirubin: ↑ | Gamma-glutamyl transpeptidase: ↑ | Reticulocyte count: Normal"],["B","Direct bilirubin: ↑ | Gamma-glutamyl transpeptidase: ↑ | Reticulocyte count: ↓"],["C","Direct bilirubin: ↑ | Gamma-glutamyl transpeptidase: Normal | Reticulocyte count: Normal"],["D","Direct bilirubin: Normal | Gamma-glutamyl transpeptidase: Normal | Reticulocyte count: ↑"],["E","Direct bilirubin: Normal | Gamma-glutamyl transpeptidase: Normal | Reticulocyte count: Normal"]],"a":"A"},{"id":"15046","b":4,"n":20,"s":[{"p":"A 15-year-old, previously healthy boy is brought to the clinic by his mother due to declining academic performance and change in behavior. The mother reports that the patient used to be a straight A student but has been struggling to keep up in class for the last 3 months. He has also been uncharacteristically moody and irritable. She says, “I recently saw him talking to a wall, but when I asked him about it, he told me to mind my own business.” When seen alone, the patient reports hearing voices sometimes but is unable to determine what they are saying. Vital signs are within normal limits. Growth tracks above the 60th percentile. Physical examination is significant for dysarthria and hand tremors; cardiopulmonary and abdominal examinations are normal. Mental status examination is significant for an irritable affect and minimal eye contact. Laboratory results are as follows:"},{"ul":["Hemoglobin: 15.8 g/dL","Hematocrit: 46%","Platelets: 260,000/mm³","Leukocytes: 8,200/mm³","Sodium: 142 mEq/L","Potassium: 4 mEq/L","Creatinine: 0.8 mg/dL","Total bilirubin: 0.3 mg/dL","Alkaline phosphatase: 20 U/L","Aspartate aminotransferase (SGOT): 212 U/L","Alanine aminotransferase (SGPT): 150 U/L","Gamma-glutamyl transpeptidase: 20 U/L (normal: 0-30)","TSH: 2.9 μU/mL"]},{"p":"Which of the following is the most appropriate next step in diagnosis?"}],"o":[["A","Blood lead level"],["B","Serum ceruloplasmin level"],["C","Serum transferrin saturation level"],["D","Trinucleotide repeat expansion analysis"],["E","Urinary porphobilinogen concentration"],["F","Video electroencephalography"]],"a":"B"},{"id":"4764","b":4,"n":21,"s":[{"p":"A 1-day-old girl is evaluated in the newborn nursery due to swollen hands and feet. She was born at term via an emergency cesarean because her mother had preeclampsia with severe features complicated by pulmonary edema. The newborn’s vital signs are normal. Examination shows a short, webbed neck; dysplastic nails; and bilateral, nonpitting carpal and pedal edema. Ultrasound of the abdomen shows a horseshoe kidney. Which of the following is the most likely cause of the edema in this patient?"}],"o":[["A","Capillary hyperpermeability"],["B","Decreased albumin synthesis"],["C","Excessive sodium retention"],["D","Increased urinary loss of protein"],["E","Left ventricle hypocontractility"],["F","Lymphatic network dysgenesis"]],"a":"F"},{"id":"4196","b":4,"n":22,"s":[{"p":"A 17-year-old girl comes to the clinic for evaluation of a burning sensation while urinating, which began 3 days ago. Today, she developed spotting on toilet paper after voiding. The patient is sexually active with 3 male partners and does not use condoms consistently. She has monthly menses and received outpatient treatment for pelvic inflammatory disease last year. The patient recently completed a course of antibiotics for group A Streptococcus pharyngitis. Vital signs are normal. Physical examination elicits lower abdominal tenderness. Pelvic examination shows clear cervical discharge and no cervical motion tenderness. Urinalysis reveals positive nitrites, positive leukocyte esterase, and 50 white blood cells/hpf. Urine β-hCG is negative. Which of the following is the most likely pathogen causing this patient’s presentation?"}],"o":[["A","Candida albicans"],["B","Chlamydia trachomatis"],["C","Escherichia coli"],["D","Pseudomonas aeruginosa"],["E","Staphylococcus aureus"],["F","Trichomonas vaginalis"]],"a":"C"},{"id":"3077","b":4,"n":23,"s":[{"p":"A 2-year-old boy is brought to the clinic by his parents due to 6 days of high-grade fever and rash and a day of difficulty breathing. The rash began on the patient’s face and subsequently spread to his trunk and extremities. Prior to the onset of rash, he had a nonproductive cough, tearing of eyes, runny nose, and intermittent nasal congestion. The family lives in a rural town in Zambia and is in the United States to visit relatives. The child has received no immunizations. Temperature is 38.7°C (101.7°F) and respirations are 44/min. Physical examination shows a diffuse erythematous, maculopapular rash all over the body that spares the palms and soles. Auscultation of the chest reveals bilateral crackles. The child is admitted to the local hospital for further care. Which of the following has been shown to reduce morbidity and mortality of patients with this infection?"}],"o":[["A","Vitamin A"],["B","Vitamin B₆"],["C","Vitamin B₁₂"],["D","Vitamin E"],["E","Vitamin K"]],"a":"A"},{"id":"2193","b":4,"n":24,"s":[{"p":"A 7-year-old boy is brought to the office by his parents due to 2 days of sore throat, poor appetite, and malaise. Several classmates have missed school due to similar symptoms. The patient has no cough, rhinorrhea, or nasal congestion. He takes no daily medications and has no known allergies. Immunizations are up to date. Temperature is 38.9°C (102°F), blood pressure is 110/70 mm Hg, pulse is 130/min, and respirations are 16/min. On examination, the tonsils are swollen and covered with thin white exudates. Small, tender anterior cervical lymph nodes are palpated. Rapid streptococcal antigen detection testing is negative. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Amoxicillin"],["B","Antistreptolysin O antibody testing"],["C","Heterophile antibody testing"],["D","Rapid influenza testing"],["E","Symptomatic treatment only"],["F","Throat culture"]],"a":"F"},{"id":"14464","b":5,"n":1,"s":[{"p":"A 15-month-old boy is brought to the office for evaluation of bowed legs. The boy’s mother says that his legs have always been slightly bowed, but the bowing appears to have worsened since he started walking a month ago. The patient does not appear to be in pain and is still able to play outside. He eats a varied diet and drinks 16 ounces of whole milk a day. He is an only child and was born at full term via vaginal delivery with no complications. The patient is at the 40th percentile for height and the 25th percentile for weight. On examination, he has full range of motion of bilateral hips and knee and ankle joints. The legs are of equal length and have no joint effusions. When the boy stands with his feet together, there is a tibiofemoral outward bend that results in a gap between the knees. The remainder of the examination is unremarkable. Which of the following is the best next step in management of this patient?"}],"o":[["A","Bilateral leg x-rays"],["B","Leg orthotics and physical therapy"],["C","Reassurance and observation"],["D","Surgical correction"],["E","Vitamin D and calcium supplementation"]],"a":"C"},{"id":"15092","b":5,"n":2,"s":[{"p":"An 18-month-old girl is brought to the emergency department after having a seizure in day care. The staff report that “she suddenly fell down and started shaking” but they also note that the girl has seemed quieter and has repeatedly pulled at her hair over the past month. The patient’s mother says, “My daughter used to say 'mama' and 'papa' and babble away but has begun to talk less in the past few months. She’s also become more needy, wanting me to feed her rather than using a spoon herself.” Medical history is significant for 3 ear infections in the past 10 months and 1 previous seizure thought to have been febrile in origin. Family history is significant for early-onset Alzheimer disease in the patient’s paternal grandfather and retinoblastoma in a paternal cousin. The patient is afebrile, and other vital signs are normal. On physical examination, the patient makes eye contact with the physician but speaks no words. She is noted to have a lurching gait. Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","Angelman syndrome"],["B","Landau-Kleffner syndrome"],["C","Lesch-Nyhan syndrome"],["D","Rett syndrome"],["E","Tuberous sclerosis"]],"a":"D"},{"id":"3912","b":5,"n":3,"s":[{"p":"A 15-year-old girl is brought to the office for evaluation of primary amenorrhea. The patient’s mother and older sisters underwent menarche around age 13. The patient has had no changes in weight or nipple discharge but has difficulty identifying various odors. She has no known medical conditions and has had no surgery. The patient takes no daily medications and does not use tobacco, alcohol, or illicit drugs. She is not sexually active. Height is at the 3rd percentile for age, with 4.8 cm (1.9 in) of growth noted in the last year. Visual fields are intact. No breast tissue is present, and there is no axillary or pubic hair. Ultrasound confirms the presence of a uterus and 2 normal-appearing ovaries. Serum FSH level is 2 mU/mL (normal: 4-30 mU/mL) and LH is 3 mU/mL (normal: 5-25 mU/mL). Karyotype analysis of this patient is most likely to show which of the following?"}],"o":[["A","45,XO"],["B","46,XX"],["C","46,XY"],["D","47,XXX"],["E","47,XXY"]],"a":"B"},{"id":"2447","b":5,"n":4,"s":[{"p":"A 5-year-old boy is brought to the emergency department by his parents due to fever and knee pain. The patient was diagnosed with streptococcal pharyngitis 2 weeks ago and treated with a 10-day course of amoxicillin. Two days ago, he developed fever and fatigue and started eating and drinking less than usual. Today, he cries every time he bends his right knee, and he refuses to walk. Temperature is 39.4°C (102.9°F). On examination, the patient appears tired but alert and is reading a book with his father. The right knee is swollen and tender to palpation. The patient holds the knee in a flexed position and has pain with passive range of motion. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Leukocytes: 16,000/mm³","Hemoglobin: 12.0 g/dL","Platelets: 260,000/mm³"]},{"p":"Immunologic and rheumatologic studies"},{"ul":["C-reactive protein: 62 mg/L (normal: ≤ 8 mg/L)","Erythrocyte sedimentation rate: 44 mm/hr"]},{"p":"X-ray of the right knee shows joint effusion and soft tissue swelling. Which of the following is the best next step in management of this patient?"}],"o":[["A","Arthrocentesis"],["B","Intraarticular corticosteroids"],["C","MRI of the knee"],["D","Penicillin"],["E","Rest and nonsteroidal anti-inflammatory drugs"],["F","Rheumatoid factor assay"]],"a":"A"},{"id":"11441","b":5,"n":5,"s":[{"p":"A 16-year-old boy is brought to the office for evaluation of left thigh pain. The pain, which is dull and aching, has been present during most evenings for the last 2 months. Over the last month, the pain has worsened and is now interrupting his sleep but improves with ibuprofen. The patient has had no trauma, fever, or pain in other joints or extremities. He plays high school basketball and states the pain does not occur during or after practice or games. He has a history of moderate, persistent asthma for which he takes an inhaled corticosteroid daily and albuterol as needed; he has required a course of oral prednisone every 2-3 years since infancy. Vital signs are normal. The left lower extremity shows no redness or deformity. Mild tenderness is elicited with deep palpation of the left distal thigh. All extremities demonstrate normal muscle bulk and strength with full range of motion. Gait is normal. X-ray is shown in the exhibit. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Ewing sarcoma"],["B","Osteoid osteoma"],["C","Osteomyelitis"],["D","Osteosarcoma"],["E","Stress fracture"]],"a":"B"},{"id":"2442","b":5,"n":6,"s":[{"p":"A 4-year-old girl is brought to the office due to behavioral concerns. Over the last 2 months, her parents and preschool teacher have noticed that she frequently does not respond to their questions, and they often need to repeat themselves several times to get a response. Three months ago, the patient was hospitalized due to high fever, headache, nuchal rigidity, and recurrent seizures. Cerebrospinal fluid culture grew Streptococcus pneumoniae, and she was given parenteral antibiotics. The seizures were initially difficult to control but resolved after 72 hours of antibiotic therapy. A repeat cerebrospinal fluid culture was sterile, and the patient completed the course of antibiotics. She has had no fever or headache since then and has not followed up until today’s visit. Vital signs and growth parameters are normal for age. In the office, the child is alert and can hop on 1 foot. She can copy a cross and square on paper. Which of the following is the most likely cause of this patient’s current symptoms?"}],"o":[["A","Bacterial invasion of the brain parenchyma"],["B","Global cerebral hypoxic-ischemic damage"],["C","Inflammatory damage to the cochlea"],["D","Recurrent 3 Hz spike-and-wave epileptiform discharges"],["E","Thrombotic occlusion of dural venous sinus"],["F","Vasospasm-induced cerebral infarction"]],"a":"C"},{"id":"4342","b":5,"n":7,"s":[{"p":"A 9-year-old African-American boy is brought to emergency department due to high fever, poor appetite, and irritability. Blood pressure is 80/60 mm Hg and pulse is 140/min. He has been hospitalized several times before for poorly localized abdominal pain. He also has a history of hematuria. The boy has not received several routine vaccinations because his mother is afraid that they will cause autism. His hematocrit is 22% and the reticulocyte count is 12%. The patient dies several hours after the admission. This patient’s death may have been prevented by which of the following?"}],"o":[["A","Folic acid supplementation"],["B","Vaccination with a live attenuated virus"],["C","Vaccination with a bacterial toxoid"],["D","Vaccination with a conjugate capsular polysaccharide"],["E","Periodic blood transfusions"]],"a":"D"},{"id":"3379","b":5,"n":8,"s":[{"p":"An 11-year-old boy is brought to the office by his mother due to concerns about his anxiety and adjustment to school. Six months ago, he started a new school that requires him to change classrooms for different subjects. This has been stressful for him and has not become easier over time. He often gets in trouble because he forgets to raise his hand and blurts out answers. The patient reads at grade level and does well in math, but he has particular difficulty in classes that require oral participation or group projects. His mother says he has always been shy. He has no friends at school and can annoy others by talking incessantly about his interest in space exploration. The patient’s behavior outside school causes problems as well. When morning traffic required departing from routine by taking a different route to school, he became agitated and refused to go. When interviewed, the patient looks away from the physician and interrupts him to recite the names of planets. Physical examination is remarkable for a repetitive opening and closing motion of his hands, which becomes more intense when he is asked about school, but is otherwise normal. Which of the following is the most likely explanation for the patient’s behavior?"}],"o":[["A","Adjustment disorder"],["B","Attention-deficit hyperactivity disorder"],["C","Autism spectrum disorder"],["D","Obsessive-compulsive disorder"],["E","Schizoid personality disorder"],["F","Social anxiety disorder"],["G","Tourette syndrome"]],"a":"C"},{"id":"2234","b":5,"n":9,"s":[{"p":"An 11-year-old girl is brought to the clinic with fever and abdominal discomfort. Her symptoms began yesterday, and she has had increasing generalized abdominal pain and cramping today. The patient has not been given medication for her symptoms. She has had no sick contacts, dysuria, vomiting, or diarrhea. The patient has no chronic medical conditions and takes no daily medications. Temperature is 38.8°C (101.8°F), blood pressure is 104/66 mm Hg, pulse is 95/min, and respirations are 15/min. Cardiopulmonary examination is normal. The abdomen is soft and tender to palpation throughout the bilateral lower quadrants but has no rebound or guarding. There is no costovertebral angle tenderness. Urinalysis has 2+ protein but is otherwise unremarkable. The patient develops vomiting and diarrhea after the office visit, and all symptoms resolve within the subsequent 24 hours. Urine culture reveals no growth. Which of the following is the best next step in evaluation of this patient’s proteinuria?"}],"o":[["A","24-hour urine collection for protein and creatinine"],["B","First morning urine protein/creatinine ratio"],["C","No further workup indicated"],["D","Renal ultrasound"],["E","Serum albumin and complement levels"]],"a":"B"},{"id":"4830","b":5,"n":10,"s":[{"p":"A 13-year-old boy is brought to the office for a well-child visit. The patient is concerned that he is the shortest boy in his class. He is in 7th grade and participates in soccer and baseball. The patient is a picky eater whose diet consists primarily of cereal, fruit, pasta, and pizza. He has seasonal allergies and takes cetirizine and a daily multivitamin. His mother is 165 cm (65 in), and his father is 178 cm (70 in). Height is 140 cm (55 in) and weight is 39 kg (86 lb). The patient’s sexual maturity rating (Tanner stage) is 1. The remainder of the examination is unremarkable. A radiograph of the left wrist reveals a bone age of 10 years. His growth chart is shown in the exhibit. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Celiac disease"],["B","Constitutional growth delay"],["C","Familial short stature"],["D","Growth hormone deficiency"],["E","Testosterone deficiency"],["F","Thyroid hormone deficiency"]],"a":"B"},{"id":"3600","b":5,"n":11,"s":[{"p":"A week-old boy is brought to the emergency department due to vomiting and poor feeding. His mother received appropriate prenatal care, and the full-term infant was delivered at home. Temperature is 36.7°C (98°F), blood pressure is 40/24 mm Hg, pulse is 164/min, and respirations are 46/min. Physical examination is notable for sunken eyes, a depressed anterior fontanelle, and dry mucous membranes. Capillary refill is 3 seconds, and skin turgor is decreased. No abdominal masses are noted. Genital examination shows a normal uncircumcised penis with bilateral testes palpable in the scrotum. Laboratory results are as follows:"},{"p":"Serum chemistry"},{"ul":["Sodium: 128 mEq/L","Potassium: 5.8 mEq/L","Blood urea nitrogen: 25 mg/dL","Creatinine: 0.7 mg/dL"]},{"p":"Which of the following is most likely to be increased in this patient?"}],"o":[["A","11-deoxycorticosterone"],["B","17-hydroxyprogesterone"],["C","Aldosterone"],["D","Cortisol"],["E","Luteinizing hormone"]],"a":"B"},{"id":"4841","b":5,"n":12,"s":[{"p":"A 2-year-old boy is brought to the emergency department by ambulance due to convulsions. This morning, the patient was sitting on the sofa at home when he suddenly developed rhythmic movements of both arms and legs that lasted about 3 minutes. He was not responsive during the event. Emergency personnel report that the child was sleepy and seemed confused when they arrived. The patient has had rhinorrhea for the past 2 days and fever since this morning. He has had no cough, vomiting, or diarrhea. The patient has no chronic medical conditions, and immunizations are current. His uncle has epilepsy. Temperature is 39.2°C (102.6°F). Physical examination shows an alert and playful toddler. Bilateral conjunctivae are clear, and clear rhinorrhea is present. The neck is supple with full range of motion. Mucous membranes are moist, and capillary refill is <2 seconds. The remainder of the examination is normal. After treating the fever with acetaminophen, which of the following is the best next step in management of this patient?"}],"o":[["A","Brain imaging"],["B","Electroencephalography"],["C","Hospitalization for observation"],["D","Levetiracetam"],["E","Lumbar puncture"],["F","Reassurance and discharge home"],["G","Serum electrolyte panel"]],"a":"F"},{"id":"2463","b":5,"n":13,"s":[{"p":"A 10-month-old girl is brought to the emergency department for evaluation of bright red stools. About an hour ago, the girl’s mother found bright red-tinged formed stools mixed with mucus in the patient’s diaper. The patient has had intermittent abdominal pain since yesterday. These episodes resolve after 10-15 minutes but have been occurring more frequently since this morning. The patient goes to day care, and several other children have had runny nose, vomiting, and diarrhea over the past week. She takes no medications, and her immunizations are up to date. Temperature is 37.3°C (99.1°F), blood pressure is 100/60 mm Hg, and pulse is 150/min. Examination reveals diffuse abdominal tenderness; the infant also appears tired. Fecal testing is positive for blood and negative for leukocytes. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute dysentery"],["B","Appendicitis"],["C","Crohn disease"],["D","Intussusception"],["E","Juvenile polyps"]],"a":"D"},{"id":"4924","b":5,"n":14,"s":[{"p":"A 4-year-old boy is brought to the office for a routine visit. He is growing well and talking in short sentences. The patient can hop and copy a square. He has started to play board games with his brothers and sister but occasionally hits his siblings when he loses a game. His parents are concerned that he cannot yet tie his shoelaces and ask if it is normal for him to occasionally fondle his genitals in public or try to touch his brother’s genitals while bathing. The mother says, “He has shown me dolls kissing each other’s private parts a few times and has asked where babies come from. I haven’t even had that talk with his 6-year-old brother. Is that a normal question for a 4-year-old to ask?” The parents are also concerned that the patient still sucks his thumb when anxious and occasionally wets his bed at night. He will be starting preschool soon. Which of the following behavior is concerning in this patient?"}],"o":[["A","Becoming physically aggressive when losing a game"],["B","Fondling one’s own genitals in public"],["C","Inability to tie shoelaces"],["D","Nocturnal enuresis"],["E","Simulating oral sex using dolls"],["F","Thumb sucking"],["G","Touching the genitals of a sibling while bathing"]],"a":"E"},{"id":"15945","b":5,"n":15,"s":[{"p":"A 21-month-old girl is brought to the emergency department due to difficulty swallowing. She first became ill 3 days ago with runny nose, cough, and low-grade fever. Over the last 4 hours, she became extremely fussy at home and refused to eat or drink. The patient previously has been well and has received all her immunizations. Temperature is 38.3°C (101°F), pulse is 180/min, and respirations are 40/min. The patient is agitated, drooling, and has suprasternal and intercostal retractions. She has audible stridor. Lung examination reveals diminished breath sounds. Due to impending respiratory failure, the patient undergoes endotracheal intubation. During intubation, the epiglottis is noted to be erythematous and edematous. Which of the following is the best empiric antibiotic therapy for this patient?"}],"o":[["A","Ampicillin and gentamicin"],["B","Azithromycin"],["C","Ceftriaxone and vancomycin"],["D","Clindamycin"],["E","Metronidazole"],["F","Piperacillin-tazobactam and tobramycin"]],"a":"C"},{"id":"4844","b":5,"n":16,"s":[{"p":"A 13-year-old boy is brought to the clinic by his mother for evaluation of hip pain. For the past 3 weeks, he has had mild pain in his right hip with an associated limp, which he attributed to a muscle strain from skateboarding. The patient fell while skateboarding last night, which resulted in worsened pain. The patient has taken ibuprofen with some improvement in his pain. He has no chronic medical conditions but did have a runny nose and nasal congestion for a few days last week. Height and weight are in the 95th and 50th percentiles, respectively. Temperature is 37°C (98.6°F). The patient walks with a limp to the examination table, avoiding bearing weight on his right leg. Examination of the right hip shows limited range of motion with internal rotation. There is full range of motion on the left side. Frog-leg lateral x-ray of bilateral hips is shown in the exhibit. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Femoral neck fracture"],["B","Legg-Calvé-Perthes disease"],["C","Osteomyelitis"],["D","Slipped capital femoral epiphysis"],["E","Transient synovitis"]],"a":"D"},{"id":"3821","b":5,"n":17,"s":[{"p":"A 4-year-old boy is brought to the physician for evaluation of binge-eating. He complains constantly of hunger and has temper tantrums when his parents refuse to give him additional snacks. Past medical history is significant for hospitalization during the first month of life for nasogastric feeding due to weak suck and hypotonia. The patient is status post orchiopexy for bilateral cryptorchidism at age 1 year. He also receives physical and speech therapies twice a week. His height is <5th percentile and weight is >99th percentile. On examination, he has a narrow forehead, a down-turned mouth, almond-shaped eyes, and small hands and feet. He has low muscle tone and a microphallus. Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Disregulation of imprinted gene expression in chromosome 11p15"],["B","Loss of the maternal copy of 15q11-q13"],["C","Loss of the paternal copy of 15q11-q13"],["D","Nondisjunction resulting in an extra X chromosome"],["E","X-linked mutation of the fragile X mental retardation 1 gene"],["F","X-linked mutation of the hypoxanthine-guanine phosphoribosyl transferase gene"]],"a":"C"},{"id":"3818","b":5,"n":18,"s":[{"p":"A 4-month-old boy is brought to the office by his parents due to progressive lethargy, poor feeding, fatigue, and increasing pallor for the past 4 weeks. Antenatal and birth histories are unremarkable. The patient’s diet consists mainly of breast milk. Immunizations are current. Physical examination shows a webbed neck, cleft palate, mild hypertelorism, flat nasal bridge, and pale mucous membranes. The thumbs appear triphalangeal. Cardiac examination reveals tachycardia with a systolic ejection flow murmur. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hemoglobin: 4 g/dL","Mean corpuscular volume: 104 μm³","Reticulocytes: 0.4%","Platelets: 300,000/mm³","Leukocytes: 7,500/mm³","Blood type: A-"]},{"p":"Maternal blood type is O+. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Diamond-Blackfan anemia"],["B","Fanconi anemia"],["C","Idiopathic aplastic anemia"],["D","Iron deficiency anemia"],["E","Rh incompatibility"],["F","Wiskott-Aldrich syndrome"]],"a":"A"},{"id":"14531","b":5,"n":19,"s":[{"p":"A 12-year-old boy is brought to the office by his mother due to dark urine for the last 2 days. The patient has had no abdominal pain, dysuria, frequency, or urgency. Three weeks ago, he had a fever and sore throat, which resolved after a week. The patient has no chronic medical conditions and takes no daily medications. Family history is significant for a paternal uncle with sensorineural hearing loss and a cousin who recently underwent a renal transplant. Temperature is 37.2°C (99°F), blood pressure is 150/90 mm Hg, and pulse is 84/min. Physical examination shows an alert child with periorbital edema. Cardiac examination reveals no murmur. The lungs are clear bilaterally. 1+ pitting edema is present on the lower extremities. Urinalysis reveals:"},{"ul":["Bacteria: none","White blood cells: 1-2/hpf","Red blood cells: many/hpf"]},{"p":"Which of the following is the most likely pathological finding in this patient?"}],"o":[["A","Abnormal type IV collagen"],["B","Basement membrane IgG autoantibodies"],["C","IgA mesangial deposits"],["D","Mesangial immune complex deposits"],["E","Papillary ischemic necrosis"]],"a":"D"},{"id":"3441","b":5,"n":20,"s":[{"p":"An 18-month-old boy is brought to the emergency department by his parents due to fever, vomiting, and lethargy. This morning, he developed a fever that initially responded to acetaminophen. Throughout the day, the patient developed a progressive rash on the lower extremities and became increasingly lethargic. He was treated with antibiotics for acute otitis media last month but is otherwise healthy. Immunizations are up to date. The patient lives with his parents and 3-year-old brother. Both he and his brother attend day care. Temperature is 40.2°C (104.4°F), and pulse is 124/min. On examination the patient is lethargic. He flexes his hips when his neck is flexed. There is an erythematous, nonblanching, pinpoint rash on the trunk and lower extremities. Which of the following is the most likely organism causing this patient’s symptoms?"}],"o":[["A","Coxsackievirus"],["B","Group B Streptococcus"],["C","Haemophilus influenzae"],["D","Herpes simplex virus"],["E","Listeria monocytogenes"],["F","Neisseria meningitidis"]],"a":"F"},{"id":"4059","b":5,"n":21,"s":[{"p":"A 5-year-old boy is brought to the physician due to a 1-week history of generalized edema, fatigue, and abdominal pain. Otherwise, he has been well and his medical history is unremarkable. The patient takes a daily multivitamin and no other medications. Blood pressure is 92/55 mm Hg and pulse is 90/min. Periorbital edema and 1+ pretibial edema are found on examination. The scrotum is mildly swollen but nontender. Abdominal examination is unremarkable. Urinalysis results are as follows:"},{"ul":["Specific gravity: 1.028","pH: 5","Protein: 4+","Blood: negative","Casts: none","Crystals: none"]},{"p":"Which of the following light microscopy findings would be expected if a kidney biopsy were performed?"}],"o":[["A","Crescent formation"],["B","Diffuse thickening of basement membrane"],["C","Mesangial hypercellularity"],["D","Normal findings"],["E","Subepithelial spikes"]],"a":"D"},{"id":"2464","b":5,"n":22,"s":[{"p":"A 1-month-old boy is brought to the office for evaluation of blood-streaked stools. He was born at full term and has been breastfed exclusively. The infant usually has 3-5 yellow, seedy stools daily that have been bloody and loose over the past 3 days. He nurses every 2-3 hours but spits up a small amount of breast milk with every feed. His mother recently completed a course of antibiotics for mastitis but otherwise has a regular diet and takes no medications. The patient’s weight, length, and head circumference have been tracking along the 40th percentile. Vital signs are normal. The infant appears well. Physical examination shows diffuse eczema. A fecal occult blood test is positive. Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Clostridium difficile colitis"],["B","Food protein-induced allergic proctocolitis"],["C","Intussusception"],["D","Lactose intolerance"],["E","Malrotation with midgut volvulus"],["F","Meckel diverticulum"]],"a":"B"},{"id":"10553","b":5,"n":23,"s":[{"p":"An 8-year-old previously healthy girl is brought to the office by her mother due to hair loss on the scalp. Several weeks ago, the mother noticed the patch of hair loss, which has progressively enlarged. The mother also says that the girl frequently scratches at the area. The child recently changed to a different school and has been anxious about new teachers and friends. Skin examination findings are shown in the image. There are several enlarged, tender, occipital and posterior auricular lymph nodes. Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Autoimmune disorder"],["B","Cutaneous candidiasis"],["C","Dermatophyte infection"],["D","Pressure-induced alopecia"],["E","Repeated hair plucking"],["F","Seborrheic dermatitis"]],"a":"C"},{"id":"3835","b":5,"n":24,"s":[{"p":"A 4-month-old boy is brought to the clinic for a health supervision examination. The patient was born via cesarean delivery at 37 weeks gestation to a primigravid mother. He spent 1 week in the neonatal intensive care unit for management of hypoglycemia and poor feeding. The patient has had no significant issues since discharge and has been feeding well. He is currently at the 99th percentile for weight. On physical examination, the patient’s tongue is enlarged, and the right leg is significantly larger in circumference than the left. The remainder of the examination is normal. In addition to routine vaccinations, which of the following is the best next step in management of this patient?"}],"o":[["A","Abdominal ultrasound"],["B","Bilateral lower extremity x-rays"],["C","Brain MRI"],["D","Chest x-ray"],["E","Echocardiogram"],["F","Urine homovanillic and vanillylmandelic acid test"]],"a":"A"},{"id":"3123","b":5,"n":25,"s":[{"p":"A 5-month-old boy is brought to the emergency department with a 2-day history of projectile vomiting, diarrhea, and an episode of generalized tonic-clonic seizure activity just prior to arrival. He has been exclusively formula-fed since birth. He was born at 39 weeks gestation and had a “natural birth” at home. The pregnancy and delivery were uncomplicated. The boy did not undergo newborn screening due to parental preferences. His parents and 4-year-old sister are all healthy. One of his maternal uncles is intellectually disabled and lives in a long-term care facility. The boy’s weight, height, and head circumference are at the 10th percentile. Physical examination shows fair hair and skin, blue eyes, an eczematous rash, and mild dehydration. His urine has a musty odor. Which of the following is the most appropriate diagnostic test for this patient’s condition?"}],"o":[["A","Aldolase B activity"],["B","Galactose-1-phosphate uridyl transferase activity"],["C","Karyotype"],["D","Quantitative amino acid analysis"],["E","Thyroid-stimulating hormone"]],"a":"D"},{"id":"15458","b":5,"n":26,"s":[{"p":"A 13-year-old girl is brought to the clinic by her mother because the girl has been increasingly tired over the last several months. The patient’s family is from Greece, and her mother and maternal uncles have chronic anemia. Menarche was 1 year ago. Menses occur regularly each month, lasting 5-6 days with heavy bleeding and passage of clots, requiring her to wake up multiple times each night to change pads. The patient is a vegetarian but occasionally eats eggs. Her family lives in a neighborhood that was built in the 1980s. Vital signs are normal. The patient appears pale. The lungs are clear to auscultation. A soft systolic ejection murmur is heard in the pulmonic area. S1 and S2 are normal, and diastole is quiet. The remainder of the physical examination is normal. Complete blood count shows:"},{"ul":["Hemoglobin: 7.9 g/dL","Mean corpuscular volume: 65 μm³","Erythrocytes: 3.1 million cells/μL","Leukocytes: 6,000/mm³","Platelets: 450,000/mm³"]},{"p":"Which of the following is the best next step in evaluation of this patient?"}],"o":[["A","Bone marrow evaluation"],["B","Hemoglobin electrophoresis"],["C","Iron studies"],["D","Lead level"],["E","Vitamin B₁₂ level"]],"a":"C"},{"id":"13552","b":5,"n":27,"s":[{"p":"A 9-year-old boy is brought to the office by his father for evaluation of chest and abdominal discomfort. For the past several months, the patient has felt a “burning” sensation in his chest after eating. He was evaluated 6 weeks ago and had a normal examination and was prescribed a proton-pump inhibitor, which he has been taking daily. The patient says the medication doesn’t seem to help, and now he has stomach aches after eating. His typical diet consists of soft foods, such as yogurt and mashed potatoes, and he tries to avoid solid foods due to stomach pain. He has also vomited a few times after eating, but his father is not sure if that was due to a specific food. The patient drinks water and no juice or soda. Temperature is 37°C (98.6°F). Physical examination shows eczematous patches on bilateral antecubital fossae and behind both knees. Endoscopy shows circular rings and thickened, linear furrowing of the esophagus. Histology results are pending. Which of the following is the most likely diagnosis?"}],"o":[["A","Achalasia"],["B","Eosinophilic esophagitis"],["C","Foreign body ingestion"],["D","Gastroesophageal reflux disease"],["E","Retropharyngeal abscess"],["F","Vascular ring"]],"a":"B"},{"id":"15830","b":5,"n":28,"s":[{"p":"A 5-year-old girl is brought to the clinic for follow-up after being diagnosed with a febrile urinary tract infection 3 days ago. She was prescribed oral antibiotics, which she has been taking for the past 3 days. Despite taking the antibiotics, the patient continues to have a fever and has had 3 episodes of nonbloody, nonbilious emesis. The patient last vomited this morning but has been able to tolerate ice chips. Urine culture grew >100,000 colony-forming units/mL of Escherichia coli, and sensitivities are pending. Temperature is 38.8°C (101.8°F), blood pressure is 110/70 mm Hg, pulse is 144/min and respirations are 20/min. Bilateral tympanic membranes are clear. The oropharynx is dry but has no exudates or erythema. The lungs are clear to auscultation bilaterally. Bowel sounds are hypoactive. There is tenderness along the left costovertebral angle. In addition to broadening antibiotic coverage, which of the following is the best next step in management of this patient?"}],"o":[["A","Abdominal radiograph"],["B","CT of the abdomen and pelvis"],["C","Reassurance and follow-up in 3 days"],["D","Renal and bladder ultrasound"],["E","Voiding cystourethrogram"]],"a":"D"},{"id":"8952","b":5,"n":29,"s":[{"p":"A 15-month-old boy is brought to the office for a well-child visit by his parents. They are concerned that he has not gained weight since he was adopted 2 months ago despite eating 3 meals and drinking 15-20 ounces of whole milk a day. The boy has 5 or 6 loose, oily bowel movements a day. He also has episodic wheezing and a productive cough for which he takes albuterol as needed. The patient was hospitalized last month for pneumonia. Weight, length, and head circumference are below the 5th percentile. Examination shows an alert boy who is small for his age. Auscultation of the lungs reveals scattered end expiratory wheezes. Heart sounds are normal. The abdomen is soft, nontender, and has no hepatosplenomegaly. Which of the following additional findings is most likely present in this patient?"}],"o":[["A","Absence of bilateral vas deferens"],["B","Atrophy of the intestinal villus"],["C","Calcification of hilar lymph nodes"],["D","Impaired renal glucose reabsorption"],["E","Opacification of the ocular lens"],["F","Ulceration of the intestinal mucosa"]],"a":"A"},{"id":"3788","b":5,"n":30,"s":[{"p":"A 6-day-old boy is brought to the emergency department due to spasms involving the whole body. The infant has had 3 days of difficulty latching on the breast, and this morning he was unable to nurse. The parents have been supplementing breastfeeding with a mixture of honey and goat milk. The infant lives in a religious commune with his parents, 3 older siblings, and 2 dogs. The members of the community do not accept vaccinations. The mother did not receive prenatal care and delivered vaginally with the assistance of her sister. The umbilical cord was cut with a pair of kitchen scissors. Temperature is 38.8°C (101.8°F). Examination shows an irritable infant with marked hypertonicity, neck stiffness, and inspiratory stridor. Auscultation of the heart and lungs is normal. The umbilical stump is swollen and has a small amount of purulent drainage. Cerebrospinal fluid analysis shows the following:"},{"ul":["Glucose: 62 mg/dL","Protein: 38 mg/dL","Leukocytes: 3 cells/μL"]},{"p":"Cultures of the blood, cerebrospinal fluid, and umbilical stump are pending. Which of the following is the most likely diagnosis?"}],"o":[["A","Bacterial meningitis"],["B","Botulism"],["C","Febrile seizure"],["D","Omphalitis"],["E","Rabies"],["F","Tetanus"],["G","Viral meningitis"]],"a":"F"},{"id":"3403","b":5,"n":31,"s":[{"p":"A 10-year-old girl is brought to the clinic for evaluation of a limp. She first noticed mild pain in the right groin 2 weeks ago and took ibuprofen, which initially helped. The pain acutely worsened 2 days ago after the patient fell while ice skating. Since then, she has been unable to fully bear weight on her right leg due to pain, which is now minimally relieved with ibuprofen and rest. The patient has autoimmune hypothyroidism for which she takes levothyroxine. Temperature is 37.2°C (99°F). Height and weight are at the 10th and 25th percentiles for age, respectively. When the right hip is flexed, there is external rotation of the hip. When the left hip is flexed, the hip remains in a neutral position. There is normal range of motion in both knees and no redness or edema overlying the hips and knees. The patient has a limp and bears little weight on her right side when walking. Bilateral hip radiograph with frog-leg lateral view is shown in the exhibit. Which of the following is the best next step in management of this patient?"}],"o":[["A","Closed reduction of the hip joint"],["B","Oral methotrexate therapy"],["C","Physis stabilization with screw fixation"],["D","Rest and analgesics as needed"],["E","Total joint replacement"]],"a":"C"},{"id":"3868","b":5,"n":32,"s":[{"p":"A 6-year-old girl is brought to the office by her parents after they noticed the development of axillary and pubic hair. She has also had a significant growth spurt over the past year. There has been no change in her behavior or school performance. The patient has no headaches, vomiting, or visual disturbances. She has no chronic medical conditions and takes no medications. Family history is unremarkable. BMI is at the 97th percentile for age and sex. The abdomen is soft, nontender, and nondistended. Axillary hair is present and pubic hair is Tanner stage 3; external genitalia are normal. The breasts are Tanner stage 3. Neurologic examination is normal. Bone age is advanced. Serum FSH and LH levels are elevated. Which of the following is the most likely etiology of this patient’s symptoms?"}],"o":[["A","Early activation of the hypothalamic-pituitary-ovarian axis"],["B","Estrogen-producing ovarian cysts"],["C","Excess peripheral conversion of testosterone to estrogen"],["D","Excess production of 17-hydroxyprogesterone"],["E","Exogenous estrogen exposure"],["F","Increased adrenal production of dehydroepiandrosterone sulfate"]],"a":"A"},{"id":"17143","b":5,"n":33,"s":[{"p":"A 7-year-old boy is brought to the office due to hair loss. For the last few weeks, he has had worsening hair loss in patches on the scalp. There is no associated pain or itching. Medical history is unremarkable, and the patient’s height and weight have consistently tracked at around the 30th percentile for age. He has achieved developmental milestones within the normal range and has had no significant academic issues at school. Skin examination findings are as shown in the exhibit. Which of the following is the most likely cause of this patient’s hair loss?"}],"o":[["A","Alopecia areata"],["B","Discoid lupus erythematosus"],["C","Pediculosis capitis"],["D","Telogen effluvium"],["E","Tinea capitis"],["F","Trichotillomania"]],"a":"A"},{"id":"3236","b":5,"n":34,"s":[{"p":"A 34-year-old woman brings her 2 children, ages 4 and 3, to the pediatrician for routine physical examinations. This is their first visit as they recently moved from another state. Medical records indicate that no immunizations have been given. The mother proudly explains, “My children are wonderfully healthy on their own and have no need for these artificial vaccines.” The physician fully discusses the principles and benefits of immunization as well as the inherent risks and potential consequences of not being immunized. The physician recommends that the children be given all age-appropriate vaccinations today. The mother remains convinced that immunizations cause more harm than good and steadfastly refuses vaccination of her children. Which of the following is the most appropriate next step in management?"}],"o":[["A","Document in the medical chart that the risks and benefits of vaccination have been explained"],["B","Explain that physicians are obligated to report cases of vaccine refusal to the local health department"],["C","Obtain a court order for immunization of the children, in the interest of the children and public health"],["D","Proceed with immunizations today, to protect the children and public health"],["E","Request to speak with the children’s father"]],"a":"A"},{"id":"16142","b":5,"n":35,"s":[{"p":"A 7-year-old boy is brought to the clinic by his mother for evaluation of rhinorrhea. Three days ago, the patient developed rhinorrhea and a cough that is worse at night. For the past day, he has had intermittent, mild pain around the upper cheeks, particularly when leaning forward. He had fever on the first day of illness but has been afebrile for 48 hours. The patient’s appetite is decreased, but he is drinking fluids and voiding normally. He has no chronic medical conditions and takes no medication. Immunizations are up to date. Temperature is 37.6°C (99.7°F), pulse is 100/min, and respirations are 20/min. The patient is well-appearing and comfortable on examination. The tympanic membranes are clear. Nasal discharge is profuse and yellow-green in color. The posterior oropharynx is erythematous. Palpation over the upper cheeks bilaterally causes mild discomfort. Cardiopulmonary examination is unremarkable. The abdomen is soft with no organomegaly. Which of the following is the best next step in management of this patient?"}],"o":[["A","Antihistamine therapy"],["B","Inhaled bronchodilator therapy"],["C","Oral antibiotics"],["D","Oral glucocorticoids"],["E","Supportive care"]],"a":"E"},{"id":"3465","b":5,"n":36,"s":[{"p":"A 6-week-old boy is brought to the physician with persistent, worsening vomiting over the past 2 weeks. The emesis occurs with every feed, is nonbilious, and is projectile in nature. The emesis has persisted even though his mother has tried small, frequent feeds and holding the infant upright after feeds. On physical examination, peristaltic waves are seen over the upper abdomen, and an olive-shaped mass is palpated in the right upper quadrant. Laboratory results are as follows:"},{"p":"Serum chemistry"},{"ul":["Sodium: 133 mEq/L","Potassium: 2.8 mEq/L","Chloride: 90 mEq/L","Bicarbonate: 36 mEq/L","Blood urea nitrogen: 18 mg/dL","Creatinine: 0.6 mg/dL","Glucose: 100 mg/dL"]},{"p":"Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Elective surgery later in childhood"],["B","Immediate surgery"],["C","Intravenous hydration and potassium replacement"],["D","Oral metoclopramide"],["E","Switch to a hydrolyzed formula"]],"a":"C"},{"id":"2471","b":5,"n":37,"s":[{"p":"A 7-year-old boy is brought to the office by his parents for an annual checkup. He is in 2nd grade, does well academically, and has no medical problems. His mother worries that he has no friends and prefers to play computer games by himself or spend time repeatedly organizing his extensive baseball card collection. On further questioning, she says that the boy moved to a new school this year because he was being bullied. The mother says, “He is different from the other kids and struggles to join in their games and conversations.” She also mentions that he eats only 3 specific foods and has unusual food rituals. “He likes his glass to be filled to a certain level and doesn’t want different foods touching each other on the plate.” The father disagrees and says, “He’s just a picky eater, like I was as a kid. Other kids can be mean; it’s just part of growing up. It’ll take time for him to get used to this new school and make friends.” Developmental milestones are within normal range. There is no known psychiatric history. On examination, the boy makes poor eye contact and answers the physician’s questions in a polite but formal manner. Physical examination and growth curves are normal. The father asks the physician to reassure his wife that nothing is wrong. Which of the following is the most appropriate course of action?"}],"o":[["A","Explain that his behavior is characteristic of high-functioning autism, but no intervention is necessary if he is otherwise doing well"],["B","Explain the spectrum of developmental disorders and recommend further evaluation"],["C","Inform the parents of an autism spectrum diagnosis and recommend immediate intervention"],["D","Monitor his behavior over the course of the next year as he adapts to his new school"],["E","Reassure the parents that there is no concern as the boy does well in school and his growth curves are normal"]],"a":"B"},{"id":"3531","b":5,"n":38,"s":[{"p":"A 9-year-old girl is brought to the office for difficulty breathing through her nose. The issue started 6 months ago and has progressively worsened. The patient’s medical history is significant for numerous courses of antibiotics for sinus infections and pneumonias as well as vitamin D deficiency. Weight and height are at the 3rd and 5th percentiles, respectively. Temperature is 38.9°C (102°F), blood pressure is 100/70 mm Hg, pulse is 112/min and respirations are 24/min. Pulse oximetry shows an oxygen saturation of 93%. Examination shows a thin girl with audible nasal breathing and bilateral nasal polyps. Lung auscultation reveals diffuse coarse rales. Digital clubbing is present, and multiple bruises are noted on the extremities. Which of the following is the most likely underlying diagnosis in this patient?"}],"o":[["A","Cystic fibrosis"],["B","Eosinophilic granulomatosis with polyangiitis"],["C","IgA deficiency"],["D","Primary ciliary dyskinesia"],["E","Severe combined immunodeficiency"]],"a":"A"},{"id":"2426","b":5,"n":39,"s":[{"p":"A 3-year-old boy is brought to the emergency department by his stepfather due to right knee swelling. The knee swelled immediately after the patient fell while playing outside. He is generally healthy and very active. His stepfather reports that last week while climbing on the living room couch, he fell onto the floor and developed a large bruise to his left hip. Temperature is 36.7°C (98.1°F). Examination shows an uncomfortable-appearing boy with significant swelling of the right knee. The patient has pain with knee movement and limited range of motion. An area of ecchymosis is seen on the left hip. There are also scattered ecchymoses to the anterior shins. The remainder of the physical examination is normal. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hemoglobin: 13 g/dL","Platelets: 187,000/mm³","Leukocytes: 8,500/mm³"]},{"p":"Radiograph of the right knee shows a large effusion but no fracture. Which of the following is the best next step in management of this patient?"}],"o":[["A","Bone marrow evaluation"],["B","Coagulation studies"],["C","Complete skeletal survey"],["D","Reassurance and observation"],["E","Serum transaminase levels"],["F","Synovial fluid Gram stain and culture"]],"a":"B"},{"id":"3786","b":5,"n":40,"s":[{"p":"A 16-year-old boy comes to the emergency department due to a day of severe left thigh pain. He was diagnosed with sickle cell disease during childhood. The boy has had several episodes of unbearable pain in his abdomen, thighs, and lower back that have required 6 separate hospitalizations for pain management and intravenous fluids. Temperature is 36.7°C (98°F), blood pressure is 120/80 mm Hg, pulse is 100/min, and respirations are 16/min. Pulse oximetry shows an oxygen saturation of 97%. Examination shows an uncomfortable-appearing boy. Lungs are clear to auscultation. The left thigh is tender to palpation but has no erythema or swelling. The patient is able to bear weight and has no pain elsewhere. Adequate hydration and analgesics are administered, with improvement of symptoms. On discharge from the hospital, the patient’s hematologist counsels him about starting a first-line medication to decrease the frequency of his pain crisis. What is the most common potential side effect of this first-line medication?"}],"o":[["A","Acute kidney injury"],["B","Iron overload"],["C","Myelosuppression"],["D","Osteonecrosis"],["E","Stroke"],["F","Viral infection"]],"a":"C"},{"id":"12279","b":6,"n":1,"s":[{"p":"A 17-year-old girl comes to the office for evaluation of heavy menstrual bleeding. She typically has 4 days of heavy bleeding, often requiring 5 or 6 pads a day. The patient awakens multiple times a night to change her pad and often soaks through her clothing and bed sheets. She has mild cramping on the first 2 days of her menses that is controlled by ibuprofen but has no intermenstrual bleeding or chronic pelvic pain. Menarche was at age 12; menses were irregular the first couple years but are now regular and occur every 26 days. The patient has no chronic medical conditions and has had no surgery. She has a male partner and uses condoms for contraception. Vital signs are normal. BMI is 23 kg/m². On bimanual examination, the uterus is small and mobile; no adnexal mass or tenderness is present. Laboratory results are as follows:"},{"ul":["Hemoglobin: 9.6 g/dL"]},{"ul":["Mean corpuscular volume: 76 μm³"]},{"ul":["Platelets: 300,000/mm³"]},{"ul":["Prothrombin time: 13 sec"]},{"ul":["Activated PTT: 38 sec"]},{"p":"Urine pregnancy test is negative. Which of the following is the most likely cause of this patient’s heavy menstrual bleeding?"}],"o":[["A","Cyclic bleeding of ectopic endometrial glands"],["B","Immature hypothalamic-pituitary-ovarian axis"],["C","Impaired platelet adhesion"],["D","Inherited factor VIII deficiency"],["E","Localized hyperplastic overgrowth of endometrial glands"],["F","Proliferation of myometrial smooth muscle cells"]],"a":"C"},{"id":"15494","b":6,"n":2,"s":[{"p":"A 15-year-old boy is admitted to the hospital for management of right elbow pain and swelling. The symptoms began 5 days ago while he was watching television at home. The patient has factor VIII deficiency and has been receiving prophylactic recombinant factor VIII infusions through a subcutaneous port 3 times weekly since he was 11 months old. When this episode began, the frequency of his infusions was increased to daily, but the swelling and pain remain. Temperature is 37.6°C (99.7°F). The right elbow has edema, is tender to palpation, and has limited range of motion relative to the left elbow. Laboratory results are as follows:"},{"ul":["Hemoglobin: 13.2 g/dL"]},{"ul":["Platelets: 150,000/mm³"]},{"ul":["Leukocytes: 8,500/mm³"]},{"ul":["PT: 14 sec"]},{"ul":["Activated PTT: 112 sec"]},{"p":"Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Acquired von Willebrand disease"],["B","Fibrinogen dysfunction"],["C","Heparin-induced thrombocytopenia"],["D","Inhibitor development"],["E","Platelet dysfunction"]],"a":"D"},{"id":"3284","b":6,"n":3,"s":[{"p":"A 5-year-old African American boy is brought to the emergency department by his father for increasing fatigue. Three weeks ago, he developed a fever and upper respiratory infection. The fever has persisted; he has had poor appetite and some weight loss. The patient has been less active and is refusing to walk. He has no chronic medical conditions. Temperature is 39.4°C (103°F), blood pressure is 100/70 mm Hg, and pulse is 140/min. Height and weight are at the 80th percentile. The oropharynx is clear and the conjunctivae are pale. Enlarged, nontender lymph nodes are palpable in the cervical, axillary, and inguinal regions. Lungs are clear to auscultation but the spleen is enlarged. Palpation along the middle of bilateral thighs elicits tenderness. Multiple petechiae are seen. Laboratory results are as follows:"},{"ul":["Hematocrit: 20%"]},{"ul":["Platelets: 18,000/mm³"]},{"ul":["Leukocytes: 2,800/mm³"]},{"p":"Chest x-ray is normal. Which of the following would most likely confirm the diagnosis?"}],"o":[["A","Antinuclear antibody testing"],["B","Bone marrow evaluation"],["C","Epstein-Barr virus serology"],["D","Hemoglobin electrophoresis"],["E","HIV antibody testing"]],"a":"B"},{"id":"3672","b":6,"n":4,"s":[{"p":"An 11-year-old previously healthy girl is brought to the pediatrician’s office by her mother with a severe headache. The headache began gradually approximately 2 hours earlier, is bifrontal, and is slightly worse on the right side. The girl feels as though “someone is pounding on my head.” Approximately 30 minutes before her headache started, she noted changes in her vision and saw “dark spots” while watching TV. Her mother says that the patient has no recent fevers or illnesses. She has no history of nighttime awakening or preceding head trauma or injury and no numbness, tingling, or weakness. The girl had never had headaches until 2 weeks prior to presentation, when she had a similar episode. On the way to today’s appointment, she had a single episode of emesis and still complains of nausea. Her temperature is 37.2°C (99°F), blood pressure is 92/54 mm Hg, pulse is 88/min, and respirations are 18/min. The patient’s body mass index is at the 60th percentile for her age and gender. She is lying quietly in bed with her eyes closed. When asked to sit up, she moves very slowly and carefully. Her pupils are equal, round, and briskly reactive to light; she is unable to tolerate a fundoscopic examination. Cardiovascular, respiratory, abdominal, and neurologic examinations are within normal limits. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Administer ibuprofen and counsel the family"],["B","Obtain a computed tomography scan of the head"],["C","Obtain a magnetic resonance image of the brain"],["D","Perform a lumbar puncture"],["E","Perform an electroencephalogram"]],"a":"A"},{"id":"4849","b":6,"n":5,"s":[{"p":"A 13-year-old boy is brought to the office due to progressive pain of the left knee for 3 months. The pain initially occurred only after basketball practice but improved with rest and ibuprofen. However, over the last several weeks, the patient has had knee pain within the first 15 minutes of practice. Last week, the pain became so severe that he missed practice and a game. The patient has had no fever, weight loss, or night sweats. The pain has not caused him to awaken. Vital signs are normal. Physical examination reveals tenderness over the left tibial tubercle, which appears more prominent than the right. The left knee has full range of motion and no palpable effusion. Extension of the left knee against resistance and squatting reproduces the pain. Which of the following is the most likely cause of this patient’s knee pain?"}],"o":[["A","Osgood-Schlatter disease"],["B","Patellar tendinitis"],["C","Patellofemoral pain"],["D","Prepatellar bursitis"],["E","Tibial osteomyelitis"]],"a":"A"},{"id":"12415","b":6,"n":6,"s":[{"p":"An 8-year-old boy is brought to the clinic due to 10 days of profuse diarrhea and abdominal cramps. His stools are foul-smelling and appear nonbloody and oily; volume and frequency have been persistent. The patient tolerates liquids but has had minimal solid food due to lack of appetite. Prior to these symptoms, he was well except for an episode of acute otitis media for which he completed a course of amoxicillin last month. The patient recently returned a few weeks ago from a vacation at his family’s lake house. Weight is 30.4 kg (67 lb), a decrease of 2.3 kg (5 lb) from his annual checkup 3 months ago. He is afebrile. Abdominal examination reveals hyperactive bowel sounds but is otherwise normal, as is the remainder of the examination. Complete blood count is normal, and stool guaiac testing is negative. This patient’s diarrhea is most likely due to which of the following mechanisms?"}],"o":[["A","Enterotoxin activity"],["B","Local epithelial disruption"],["C","Mucosal erosion"],["D","Pancreatic insufficiency"],["E","Transmural inflammation"]],"a":"B"},{"id":"15845","b":6,"n":7,"s":[{"p":"A 2-month-old African American boy is brought to the emergency department due to persistent crying. Last evening, the infant began crying after his mother lifted his legs to change his diaper. Overnight, the patient was intermittently fussy and refused to breastfeed, and he has been difficult to console this morning. He was born at term via cesarean delivery due to breech presentation and was discharged on day of life 2. Temperature is 38.5°C (101.3°F). Cardiopulmonary examination is normal. The liver edge is 1.5 cm below the costal margin. Bilateral testicles are present and nontender. The right hip is held flexed, abducted, and externally rotated. The patient cries with palpation of the upper right thigh and resists movement along that hip. The left hip has full range of motion. Laboratory results are as follows:"},{"ul":["Hemoglobin: 9.1 g/dL"]},{"ul":["Platelets: 250,000/mm³"]},{"ul":["Leukocytes: 20,000/mm³"]},{"ul":["Neutrophils: 80%"]},{"ul":["Lymphocytes: 20%"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute leukemia"],["B","Developmental dysplasia of the hip"],["C","Septic arthritis"],["D","Sickle cell pain crisis"],["E","Transient synovitis"]],"a":"C"},{"id":"3081","b":6,"n":8,"s":[{"p":"A 16-year-old boy is brought to the clinic for evaluation of headaches. For the last month, he has had daily, throbbing pain in the frontal region that is worse in the morning and occasionally associated with nausea and vomiting. Acetaminophen provides some relief. The patient also had several brief episodes of blurriness in his left eye during football practice last week. In addition to acetaminophen, he takes oral isotretinoin for severe acne. Temperature is 36.7°C (98.1°F), blood pressure is 130/80 mm Hg, pulse is 70/min, and respirations are 15/min. The patient is sitting up and cooperative with the examination. The pupils are equal and reactive to light. Eye examination shows bilateral optic disc edema and decreased visual acuity. The visual fields are full. There is no neck stiffness. Motor examination reveals 5/5 strength, 2+ deep tendon reflexes, and a normal plantar response. Sensory examination is unremarkable. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Cluster headaches"],["B","Medication side effect"],["C","Optic chiasm glioma"],["D","Optic neuritis"],["E","Viral encephalitis"]],"a":"B"},{"id":"3193","b":6,"n":9,"s":[{"p":"A 3-day-old boy is brought to the emergency department for evaluation of vomiting and abnormal movements. The patient’s arms and legs began rhythmically jerking about 20 minutes ago. The movements were symmetric and lasted for a minute. He has also had persistent vomiting today, especially after feeding, and had an episode of loose, nonbloody stool. The patient was born at term after an uncomplicated pregnancy and is exclusively breastfed. Temperature is 37.1°C (98.8°F). Examination shows a lethargic newborn with diffuse hypotonia as well as jaundice. The liver edge is palpable. Laboratory results are as follows:"},{"ul":["Glucose: 30 mg/dL"]},{"ul":["Total bilirubin: 9.3 mg/dL"]},{"ul":["Direct bilirubin: 4 mg/dL"]},{"ul":["Ammonia: 40 μg/dL (normal: 40-80)"]},{"ul":["Urinalysis Glucose: negative"]},{"ul":["Urinalysis Reducing substances: 3+"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Biliary atresia"],["B","Breastfeeding failure jaundice"],["C","Galactosemia"],["D","Glycogen storage disease"],["E","Urea cycle defect"]],"a":"C"},{"id":"16980","b":6,"n":10,"s":[{"p":"A 3-year-old boy is brought to the office due to nasal discharge for the past 2 weeks. His mother reports whitish nasal discharge that has become progressively thicker and more malodorous. The patient has had no fever, cough, or shortness of breath. He is eating normally. Medical history includes congenitally acquired HIV, and the patient has taken antiretroviral therapy since birth. Three months ago, CD4 cell count was 520/mm³. He has received all age-appropriate vaccinations. The patient lives with his parents, 6-year-old brother, and a pet dog. His father smokes cigarettes outside of the house. Growth parameters are at the 40th percentile for age. On examination, the patient is playful and interactive. There is purulent drainage from the right nostril, and the right nasal mucosa and turbinates are erythematous and swollen. There is no discharge from the left side, and the left turbinates are pink and nonedematous. The oropharynx and tonsils are normal. There is no cervical lymphadenopathy. Which of the following is the most likely cause of this patient’s current symptoms?"}],"o":[["A","Acute bacterial sinusitis"],["B","Adenoidal hypertrophy"],["C","Allergic rhinosinusitis"],["D","Frontal sinus agenesis"],["E","Intranasal foreign body"],["F","Mucormycosis"]],"a":"E"},{"id":"3836","b":6,"n":11,"s":[{"p":"A 16-year-old boy comes to the office in October due to right knee swelling. The symptoms began yesterday following soccer practice. The patient recalls no specific injury. He has mild associated stiffness. Over the last several months, he has experienced fatigue with occasional flulike illnesses and pain occurring in variable joints. The patient spent the summer at a soccer camp in Maine. He is sexually active with his girlfriend and uses condoms. Vital signs are normal. The patient can bear weight and has a grossly normal gait. Examination of the right knee shows palpable warmth and a large effusion. It is tender to palpation. Range-of-motion testing shows decreased flexion of the right knee compared with the left. All other joints are normal. Plain radiographs reveal no bony deformity. Aspiration yields yellow, translucent fluid with a leukocyte count of 20,000/mm³ (50% neutrophils) and no organisms on Gram stain. Which of the following is the most likely cause of this patient’s knee swelling?"}],"o":[["A","Borrelia burgdorferi infection"],["B","Disseminated gonococcal infection"],["C","Prior Chlamydia trachomatis infection"],["D","Prior streptococcal throat infection"],["E","Staphylococcal joint infection"]],"a":"A"},{"id":"4090","b":6,"n":12,"s":[{"p":"A 3-year-old boy is brought to the office by his mother due to “inattentiveness.” Medical history is significant for preterm birth at 35 weeks, 4 ear infections in the past year, and mild eczema. Vaccinations are up to date and a hearing screening performed 8 months earlier was normal. Family history is significant for asthma in the patient’s father, anxiety in his mother, and attention-deficit hyperactivity disorder (ADHD) in his older brother. The patient’s mother reports that when asked to perform tasks at home, he ignores her and continues to do whatever he is engaged in. He has become more withdrawn lately and often sits in the corner alone playing with rockets instead of playing with his brother. His poor attention span has worsened over the last few months, and his mother wonders if it is related to anxiety about starting preschool 3 months ago. Apart from lack of attention, he is described as an “affectionate, active little boy who loves to run around and loves his pets.” Physical examination reveals a small child who responds only intermittently to the physician’s directions. The patient is able to draw a square and stand on 1 foot. He speaks in brief phrases of 2 or 3 words, which is similar to his presentation 6 months ago. Neurological examination is normal. Growth curves are tracking just under the 50th percentile for stature and weight. Which of the following is the best next step in management of this patient?"}],"o":[["A","Administer an autism spectrum screening questionnaire"],["B","Obtain metabolic testing"],["C","Obtain parent and teacher ADHD rating scales"],["D","Obtain speech and language assessment"],["E","Perform an EEG"],["F","Refer for genetic testing"],["G","Repeat audiometry testing"]],"a":"G"},{"id":"3670","b":6,"n":13,"s":[{"p":"A 4-month-old boy is admitted to the intensive care unit for respiratory distress due to pneumonia. The infant developed cough and tachypnea 2 days ago with progressive worsening of hypoxia and work of breathing. He has had 2 months of poor weight gain and diarrhea, which have not improved despite changing to a hydrolyzed formula. The infant lives with his foster parents, who have 2 older children and a dog. The biological mother did not receive prenatal care after the first trimester. The child’s birth weight was at the 60th percentile and current weight is at the 3rd percentile. Temperature is 39.5°C (103.1°F) and pulse oximetry is 74% on room air. Physical examination shows extensive oral thrush and generalized lymphadenopathy. Auscultation of the heart and lungs reveals a soft systolic ejection murmur and faint bilateral crackles. The remainder of the examination is normal. Laboratory results are as follows:"},{"ul":["Hematocrit: 38%"]},{"ul":["Platelets: 260,000/mm³"]},{"ul":["Leukocytes: 18,000/mm³"]},{"ul":["Neutrophils: 50%"]},{"ul":["Lymphocytes: 45%"]},{"p":"Endotracheal tube aspirate reveals Pneumocystis jirovecii. Which of the following abnormalities is most likel
