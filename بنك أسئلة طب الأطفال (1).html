y present in this patient?"}],"o":[["A","Abnormal chloride ion transporter"],["B","Decreased B lymphocyte count"],["C","Decreased CD4+ lymphocyte count"],["D","Defect in dynein"],["E","Deficiency of adenosine deaminase"],["F","Impaired phagocytosis"]],"a":"C"},{"id":"8956","b":6,"n":14,"s":[{"p":"A 7-year-old boy is brought to the office for a follow-up visit after orchiopexy last week. The patient was recently adopted and, at his well child check a month ago, was diagnosed with an undescended left testicle that was palpable in the inguinal canal. The surgery was uncomplicated, and he is doing well. The patient is otherwise healthy and takes no medications. Height and weight are at the 40th and 50th percentiles, respectively. Physical examination shows a well-nourished boy. Abdomen is soft, nontender, and nondistended. The penis is circumcised, and the meatal opening is at the tip of the phallus. Both testes are palpable in the scrotum. Healing surgical scars are present in the groin. Compared to the general population, this patient is at an increased risk for which of the following conditions?"}],"o":[["A","No additional increased risk"],["B","Pubertal delay"],["C","Recurrent urinary tract infections"],["D","Testicular germ cell tumor"],["E","Testicular torsion"],["F","Varicocele"]],"a":"D"},{"id":"4018","b":6,"n":15,"s":[{"p":"A 3-year-old boy is brought to the physician with a 1-week history of generalized edema that is gradually worsening. He has not been ill recently and his past medical history is unremarkable. He is not taking any medications and his vaccinations are up to date. His temperature is 36.7°C (98°F), blood pressure is 110/80 mm Hg, pulse is 85/min, and respirations are 18/min. On examination, he has periorbital edema and 1+ pretibial pitting. The remainder of the physical examination is normal. Laboratory findings are as follows:"},{"ul":["Sodium: 140 mEq/L"]},{"ul":["Potassium: 3.7 mEq/L"]},{"ul":["Creatinine: 0.8 mg/dL"]},{"ul":["Total protein: 5.5 g/dL"]},{"ul":["Albumin: 2.1 g/dL"]},{"ul":["Aspartate aminotransferase: 17 U/L"]},{"ul":["Alanine aminotransferase: 24 U/L"]},{"ul":["Total bilirubin: 0.9 mg/dL"]},{"ul":["Direct bilirubin: 0.3 mg/dL"]},{"p":"Urinalysis shows 4+ proteinuria and no red blood cells. What is the best next step in the management of this patient?"}],"o":[["A","Echocardiography"],["B","Intravenous albumin"],["C","Liver ultrasound"],["D","Prednisone"],["E","Renal biopsy"],["F","Renal scintigraphy"]],"a":"D"},{"id":"3577","b":6,"n":16,"s":[{"p":"A 12-year-old boy is brought to the office for evaluation of a limp. Since waking this morning, the patient has not been able to put any weight on his right leg due to hip pain. He has had this pain for the past 2 days and has been taking ibuprofen, but the pain has not improved. The patient plays in a baseball league and practices a few days a week. Last week, he fell during practice and scraped his right hip. The abraded area developed mild cellulitis, which was treated with topical antibiotic ointment. The patient has no chronic medical conditions or previous surgeries. Temperature is 38.9°C (102°F). Height is at the 30th percentile and weight is at the 70th percentile for age. On examination, the right hip is externally rotated and has pain with passive movement. The remainder of the examination is normal. Hemoglobin is 13 g/dL, platelets are 280,000/mm³, and leukocyte count is 18,000/mm³. Erythrocyte sedimentation rate is 52 mm/hr. Which of the following treatment options would be most beneficial in preventing long-term morbidity for this patient’s condition?"}],"o":[["A","Cast immobilization"],["B","Intraarticular corticosteroid injection"],["C","Joint aspiration and drainage"],["D","Surgical pinning of the joint"],["E","Total hip arthroplasty"]],"a":"C"},{"id":"12420","b":6,"n":17,"s":[{"p":"A 3-year-old girl is brought to the emergency department due to difficulty breathing. She developed a fever and cough a week ago. The girl was seen by her pediatrician 3 days ago and was prescribed amoxicillin, but her fever has continued and her cough has worsened. The patient’s medical history is notable for several episodes of acute otitis media requiring antibiotics, and her immunizations are up to date except for her annual influenza vaccine. Her family moved from Peru 2 years ago, but she has not traveled anywhere since. Temperature is 39.4°C (103°F), blood pressure is 90/60 mm Hg, pulse is 144/min, respirations are 36/min, and pulse oximetry is 91% on room air. Physical examination shows a tired-appearing girl with subcostal retractions and diminished breath sounds over the right lower lung. Chest x-ray reveals a right lower lung opacity with loss of the costophrenic angle, and ultrasound of the chest demonstrates loculated fluid. A pigtail catheter is placed and fluid analysis is as follows:"},{"ul":["Triglycerides: 5 mg/dL (n = <50 mg/dL)"]},{"ul":["pH: 7.1"]},{"ul":["Glucose: 30 mg/dL"]},{"ul":["Protein: 4.0 g/dL"]},{"ul":["Lactate dehydrogenase: 1,100 U/L"]},{"ul":["Leukocytes: 60,000/mm³"]},{"ul":["Neutrophils: 90%"]},{"ul":["Lymphocytes: 9%"]},{"ul":["Monocytes: 1%"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Chylothorax"],["B","Empyema"],["C","Hemothorax"],["D","Malignant effusion"],["E","Parapneumonic effusion"],["F","Tuberculosis"]],"a":"B"},{"id":"4825","b":6,"n":18,"s":[{"p":"A 10-year-old girl with sickle cell disease comes to the office for a routine visit. She was diagnosed with sickle cell disease by newborn screening. Although the patient was initially asymptomatic, she has experienced several pain crises and pneumonias beginning 2 years ago. She was started on hydroxyurea a year ago and has not had any further pain crises since then. The patient has had no recent illnesses, emergency department visits, or hospitalizations. Her physical examination is unremarkable. Laboratory results are as follows:"},{"ul":["Hemoglobin: 9.0 g/L"]},{"ul":["Mean corpuscular volume: 105 μm³"]},{"ul":["Reticulocytes: 2.0%"]},{"ul":["Platelets: 212,000/mm³"]},{"ul":["Leukocytes: 5,000/mm³"]},{"ul":["Neutrophils: 20%"]},{"ul":["Eosinophils: 5%"]},{"ul":["Lymphocytes: 67%"]},{"ul":["Monocytes: 8%"]},{"p":"Which of the following hemoglobin patterns would most likely be seen in this patient?"}],"o":[["A","% Hemoglobin A: 0 | % Hemoglobin S: 90 | % Hemoglobin F: 7 | % Hemoglobin C: 0"],["B","% Hemoglobin A: 0 | % Hemoglobin S: 80 | % Hemoglobin F: 17 | % Hemoglobin C: 0"],["C","% Hemoglobin A: 50 | % Hemoglobin S: 45 | % Hemoglobin F: 1 | % Hemoglobin C: 0"],["D","% Hemoglobin A: 0 | % Hemoglobin S: 43 | % Hemoglobin F: 3 | % Hemoglobin C: 43"],["E","% Hemoglobin A: 98 | % Hemoglobin S: 0 | % Hemoglobin F: <1 | % Hemoglobin C: 0"]],"a":"B"},{"id":"4765","b":6,"n":19,"s":[{"p":"A 14-year-old girl is brought to the clinic for a routine well-child visit. The girl has been healthy and her only concern is that she has not yet had a menstrual period. Most of her friends have undergone menarche, and she wants to know when she will start menstruating. She wears corrective glasses for myopia. Her father is 190.5 cm (6 ft  3 in) tall, and her mother is 183 cm (6 ft) tall. On examination, the patient’s height and weight are at the 5th and 55th percentiles, respectively. Blood pressure is 140/90 mm Hg in the right upper arm and 90/40 mm Hg in the lower extremities. Multiple pigmented nevi are scattered on the face and chest. Which of the following complications is this patient most at risk of developing?"}],"o":[["A","Chronic constipation"],["B","Endometrial hyperplasia"],["C","Intellectual disability"],["D","Mitral valve prolapse"],["E","Osteoporotic fracture"],["F","Visual field defects"]],"a":"E"},{"id":"3660","b":6,"n":20,"s":[{"p":"A 4-day-old girl is brought to the office due to bilateral eye discharge that began 2 days ago and is worsening. The patient’s mother is a 20-year-old woman, gravida 2 para 2, who had limited prenatal care. During the first trimester, the mother was treated for a sexually transmitted infection. During the third trimester, group B streptococcal screening was positive. The mother had no additional testing or treatment during the pregnancy. Delivery occurred vaginally with no known complications at home under the care of a midwife. Temperature is 36.7°C (98.1°F). The patient has bilateral chemosis, severe eyelid swelling, and significant purulent discharge. The face and chest have mild jaundice. The rest of the examination is normal. Which of the following would most likely have prevented this infant’s clinical findings?"}],"o":[["A","Antenatal acyclovir for the mother"],["B","Antenatal azithromycin for the mother"],["C","Intrapartum ampicillin for the mother"],["D","Intravenous cefazolin for the infant"],["E","Oral azithromycin for the infant"],["F","Topical erythromycin for the infant"]],"a":"F"},{"id":"3289","b":6,"n":21,"s":[{"p":"A 3-year-old boy is brought to the emergency department by his parents for evaluation of sudden-onset abnormal breathing and shortness of breath. Yesterday morning, the patient developed a runny nose. Over the past 12 hours, he developed a fever and has had difficulty breathing. Temperature is 40°C (104°F) and respirations are 48/min. Pulse oximetry shows 86% on room air. On physical examination, the patient appears anxious and is sitting up, leaning forward, and drooling. Inspiratory stridor and suprasternal retractions are present. His lips are mildly cyanotic. Which of the following is the best next step in management of this patient?"}],"o":[["A","Broad-spectrum antibiotics"],["B","Endotracheal intubation"],["C","Intravenous corticosteroids"],["D","Lateral neck radiograph"],["E","Nebulized racemic epinephrine"],["F","Needle cricothyrotomy"]],"a":"B"},{"id":"3548","b":6,"n":22,"s":[{"p":"A 5-year-old girl is brought to the office due to “wetting the bed.” Since age 3, she had been urinating and stooling while on the toilet during the day and night, with no accidents. However, for the past 2 weeks, the patient has wet the bed nightly. She is also more thirsty than usual, urinates more often during the day, and has had accidents at school. Review of systems is positive for fatigue and negative for dysuria and hesitancy. The patient has had no major illnesses and has met all developmental milestones. A month ago, the family moved to a new house after her brother was born. Vital signs are normal. Weight and height are at the 20th and 40th percentile, respectively, but both were at the 40th percentile at her well-child visit 3 months ago. Physical examination shows a tired-appearing girl. Mucous membranes are dry. The rest of the examination is unremarkable. Which of the following is the most likely explanation for this patient’s symptoms?"}],"o":[["A","Autoimmune destruction of pancreatic beta cells"],["B","Bacterial infection of the bladder"],["C","Behavior regression from changes in the home"],["D","Functional fecal retention"],["E","Impaired renal tubule response to antidiuretic hormone"]],"a":"A"},{"id":"3438","b":6,"n":23,"s":[{"p":"A 6-year-old boy is brought to the office due to pallor and decreased energy. For the past 2 days, he has been less active, uninterested in playing, and sleeping throughout the day. On review of systems, the parents note that the patient developed fever, emesis, and diarrhea 10 days ago, but symptoms resolved after a few days without intervention. His older sister had a sore throat a few days ago, but no other family members have been ill. The patient has no chronic medical conditions. Temperature is 37.1°C (98.8°F), blood pressure is 120/70 mm Hg, and pulse is 145/min. Physical examination shows a tired-appearing boy with pale lips. The abdomen is soft, nontender, and nondistended. There are a few small bruises along the bilateral shins. Laboratory results are as follows:"},{"ul":["Hemoglobin: 6.4 g/dL"]},{"ul":["Platelets: 30,000/mm³"]},{"ul":["Leukocytes: 15,200/mm³"]},{"ul":["Creatinine: 2.4 mg/dL"]},{"ul":["Total bilirubin: 3.3 mg/dL"]},{"ul":["Direct bilirubin: 0.1 mg/dL"]},{"ul":["PT: 12 sec"]},{"ul":["Activated PTT: 35 sec"]},{"ul":["Urinalysis Specific gravity: 1.025"]},{"ul":["Urinalysis Protein: +2"]},{"ul":["Urinalysis Blood: moderate"]},{"ul":["Urinalysis Leukocyte esterase: Negative"]},{"ul":["Urinalysis Nitrites: Negative"]},{"ul":["Urinalysis Red blood cells: 20-30/hpf"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Autoimmune hemolytic anemia"],["B","Disseminated intravascular coagulation"],["C","Hemolytic uremic syndrome"],["D","Immune thrombocytopenia"],["E","Paroxysmal nocturnal hemoglobinuria"],["F","Poststreptococcal glomerulonephritis"]],"a":"C"},{"id":"2896","b":6,"n":24,"s":[{"p":"A previously healthy 5-year-old girl is brought to the emergency department with lethargy and altered mental status. She was in her usual state of health until 5 days ago, when she developed a low-grade fever, malaise, headache, cough, coryza, and a sore throat. The fever resolved with over-the-counter aspirin. The patient developed nausea, vomiting, and lethargy this morning. She has no chronic medical problems and takes no other medications. The girl has not received the seasonal influenza vaccine, but her other vaccinations are up to date. The patient’s weight and stature are average. Examination shows a febrile, sleepy girl with hepatomegaly. There is no jaundice or splenomegaly. The patient is not oriented to person, place, or time. Nasal antigen testing is positive for influenza B. Laboratory results are as follows:"},{"ul":["Hemoglobin: 14.2 g/L"]},{"ul":["Platelets: 180,000/mm³"]},{"ul":["Leukocytes: 8,300/mm³"]},{"ul":["Sodium: 140 mEq/L"]},{"ul":["Potassium: 3.8 mEq/L"]},{"ul":["Chloride: 102 mEq/L"]},{"ul":["Bicarbonate: 24 mEq/L"]},{"ul":["Blood urea nitrogen: 16 mg/dL"]},{"ul":["Creatinine: 0.6 mg/dL"]},{"ul":["Glucose: 72 mg/dL"]},{"ul":["Total bilirubin: 0.9 mg/dL"]},{"ul":["Direct bilirubin: 0.3 mg/dL"]},{"ul":["Alkaline phosphatase: 120 U/L"]},{"ul":["Aspartate aminotransferase: 358 U/L"]},{"ul":["Alanine aminotransferase: 410 U/L"]},{"ul":["Ammonia: 94 mcg/dL (normal: <45 mcg/dL)"]},{"ul":["PT: 18 sec"]},{"ul":["PTT: 44 sec"]},{"p":"Percutaneous liver biopsy would most likely reveal which of the following in this patient?"}],"o":[["A","Bile plugs in the bile ducts, portal tract edema, and hepatic fibrosis"],["B","Cirrhosis and periportal eosinophilic inclusion bodies"],["C","Macrovesicular fatty infiltration"],["D","Microvesicular fatty infiltration"],["E","Sinusoidal congestion and hemorrhagic necrosis"]],"a":"D"},{"id":"4836","b":6,"n":25,"s":[{"p":"A 5-year-old girl is brought to the clinic with joint pain and rash. Last week, the patient developed pain in her knees. The pain resolved after a few days, but now her ankles and wrists are tender. She has also developed a nonpruritic, pink rash on her back. The patient had previously been healthy except for a sore throat a few weeks ago that resolved on its own. Temperature is 38.3°C (101°F), pulse is 85/min, and respirations are 20/min. Cardiac examination is normal. The lungs are clear to auscultation. The wrists and ankles are stiff and tender to manipulation. Multiple large, well-demarcated, erythematous, nonpruritic patches with a slightly raised outline are present on the trunk and proximal limbs. Laboratory results are as follows:"},{"ul":["Leukocytes: 6,500/mm³"]},{"ul":["Neutrophils: 56%"]},{"ul":["Lymphocytes: 33%"]},{"ul":["Hemoglobin: 12.5 g/dL"]},{"ul":["Platelets: 380,000/mm³"]},{"ul":["C-reactive protein: 32 mg/L (normal: <3 mg/L)"]},{"ul":["Erythrocyte sedimentation rate: 62 mm/h"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute rheumatic fever"],["B","Henoch-Schönlein purpura"],["C","Lyme disease"],["D","Systemic juvenile idiopathic arthritis"],["E","Systemic lupus erythematosus"]],"a":"A"},{"id":"16456","b":6,"n":26,"s":[{"p":"An 11-year-old girl is brought to the clinic due to blurry vision. The symptoms began 2 weeks ago at school, when a teacher noticed that the child often moved closer to the front of the classroom to see the board. At home, the patient takes frequent breaks when playing video games because of nausea and headaches. She has type 1 diabetes mellitus, which was diagnosed 2 years ago after she was hospitalized for diabetic ketoacidosis. Since then, the diabetes has been well controlled with insulin. The patient’s vision examination 6 months ago was normal. Visual acuity today shows 20/40 bilaterally with no changes after refraction. The pupils are equal and reactive to light, and extraocular movements are intact. Visual fields are full, with enlarged blind spots bilaterally. Dilated retinal examination is shown in the image (shows papilledema / optic disc swelling). The remainder of the neurologic examination is normal. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Diabetic retinopathy"],["B","Idiopathic intracranial hypertension"],["C","Pituitary adenoma"],["D","Retinitis pigmentosa"],["E","Retinoblastoma"]],"a":"B"},{"id":"3195","b":6,"n":27,"s":[{"p":"A 15-month-old boy is brought to the office due to 3 days of fever. In the past 9 months, he has had 4 episodes of otitis media and 2 episodes of lobar pneumonia, one of which required hospitalization and prolonged intravenous antibiotic therapy. The patient is at the 40th percentile for weight. His temperature is 38.2°C (100.8°F). Physical examination shows a bulging, erythematous tympanic membrane on the right side but is otherwise unremarkable. The patient’s laboratory studies are as follows:"},{"ul":["Leukocytes: 8,000/mm³"]},{"ul":["Neutrophils: 6,000/mm³"]},{"ul":["Lymphocytes: 2,000/mm³"]},{"ul":["CD4⁺ T cells: 1,150/mm³ (640-1175/mm³)"]},{"ul":["CD8⁺ T cells: 810/mm³ (335-875/mm³)"]},{"ul":["IgG: 80 mg/dL"]},{"ul":["IgA: 31 mg/dL"]},{"ul":["IgM: 11 mg/dL"]},{"ul":["IgE: 18 mg/dL"]},{"p":"Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","Bruton agammaglobulinemia"],["B","Common variable immunodeficiency"],["C","DiGeorge syndrome"],["D","Severe combined immunodeficiency"],["E","Transient hypogammaglobulinemia of infancy"]],"a":"A"},{"id":"3417","b":6,"n":28,"s":[{"p":"A 2-year-old boy is brought to the emergency department after swallowing magnets 45 minutes ago. The patient was playing with his older brother’s toys when he ingested a few high-power, rare-earth magnets. He has no chest or abdominal pain, nausea, or difficulty breathing. When the patient drank water, he had no pain with swallowing. He has no medical conditions and has had no surgeries. Temperature is 36.9°C (98.4°F), pulse is 88/min, and respirations are 25/min. On examination, the patient is playful and not in distress. Cardiopulmonary examination is normal. The abdomen is soft and nontender. The remainder of the physical examination is unremarkable. Chest x-ray reveals 2 small, radiopaque objects in the distal esophagus; there is no mediastinal widening or subdiaphragmatic air. Which of the following is the best next step in management of this patient?"}],"o":[["A","Induce emesis for foreign body expulsion"],["B","Observe and repeat x-ray in 24 hours"],["C","Order barium contrast study"],["D","Perform endoscopic foreign body removal"],["E","Provide polyethylene glycol to aid in gastrointestinal transit"]],"a":"D"},{"id":"3611","b":6,"n":29,"s":[{"p":"A 17-year-old girl is brought to the office due to a 14-day history of fever, neck “lumps,” sore throat, and malaise. She has severe fatigue and has not been able to attend classes. She also has had difficulty swallowing because of throat pain. The patient has no cough, abdominal pain, nausea, or vomiting. She has no chronic medical conditions. Temperature is 38.7°C (101.7°F), blood pressure is 120/76 mm Hg, pulse is 86/min, and respirations are 24/min. Physical examination shows an uncomfortable patient who is breathing loudly through the mouth. There are no oral lesions. Tonsils are erythematous and markedly enlarged with bilateral exudates. Multiple tender, mobile, posterior cervical lymph nodes are palpable. Heart sounds are normal without murmurs. Lungs are clear without wheezing or rales. The abdomen is soft and nontender; the spleen is palpable 2 cm below the left costal margin. Which of the following complications is this patient most at risk for developing?"}],"o":[["A","Acute airway obstruction"],["B","Acute rheumatic fever"],["C","Aspiration pneumonia"],["D","Coronary artery aneurysm"],["E","Ludwig angina"],["F","Retropharyngeal abscess"],["G","Subglottic stenosis"]],"a":"A"},{"id":"3663","b":6,"n":30,"s":[{"p":"A 2-day-old boy in the newborn nursery did not pass his hearing screening bilaterally. He was born at 37 weeks gestation by cesarean delivery due to labor complicated by minimal fetal heart rate variability and recurrent late decelerations. The mother had an ultrasound at 8 weeks gestation in the emergency department but did not have routine prenatal care. She had a brief febrile illness during her first trimester of pregnancy, followed by 5-7 days of joint pain that resolved without intervention. The infant’s weight, length, and head circumference are <5th percentile. Vital signs are normal. The red reflex is absent bilaterally. Cardiac examination reveals a loud, harsh murmur heard throughout systole and diastole over the left second intercostal space. The liver and spleen are palpable on abdominal examination. Which of the following is the most likely etiology of this infant’s clinical presentation?"}],"o":[["A","Cytomegalovirus"],["B","Listeria monocytogenes"],["C","Parvovirus B19"],["D","Rubella virus"],["E","Toxoplasma gondii"],["F","Treponema pallidum"]],"a":"D"},{"id":"16392","b":6,"n":31,"s":[{"p":"A 3-year-old girl is evaluated for hoarseness that has been getting worse over the past 2 months. The patient has had no fever, shortness of breath, or change in activity level. She is eating normally, gaining weight well, and does not seem to be in pain. Vital signs are within normal limits. On physical examination, the ears are normal appearing with no middle ear fluid. The nasal mucosa is clear with no rhinorrhea, and the turbinates are normal in size. There are no oral mucosal lesions. The tonsils are small and nonobstructive. There is no cervical lymphadenopathy. Aside from hoarseness, examination of cranial nerves is normal. Flexible laryngoscopy shows several finger-shaped lesions on both vocal cords. Which of the following is the most likely cause of this patient’s current condition?"}],"o":[["A","Anomalous airway development"],["B","IgE-mediated hypersensitivity reaction"],["C","Inherited deficiency of C1 inhibitor"],["D","Maternally transmitted viral infection"],["E","Vaccine-preventable bacterial infection"]],"a":"D"},{"id":"12409","b":6,"n":32,"s":[{"p":"A 2-year-old girl is brought to the clinic for evaluation of left knee pain and fever. The knee pain began 2 months ago. At the time of onset, the patient and several other children at day care had cough and rhinorrhea, but only the patient developed joint pain. Movement is limited by pain in the morning but seems to improve in the afternoon. For the past month, she has had a daily fever and an erythematous macular rash over her chest around bedtime. Temperature is 36.1°C (97°F), blood pressure is 90/60 mm Hg, and pulse is 114/min. Physical examination shows swelling, erythema, and warmth of the left knee, with pain elicited on passive and active movement of the left hip. The patient can walk but has a slight limp. Laboratory results are as follows:"},{"ul":["Hemoglobin: 10 g/dL"]},{"ul":["Platelets: 520,000/mm³"]},{"ul":["Leukocytes: 21,000/mm³"]},{"ul":["Erythrocyte sedimentation rate: 100 mm/hr"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute lymphoblastic leukemia"],["B","Acute rheumatic fever"],["C","Osteomyelitis"],["D","Septic arthritis"],["E","Systemic juvenile idiopathic arthritis"],["F","Transient synovitis"]],"a":"E"},{"id":"4870","b":6,"n":33,"s":[{"p":"A 5-year-old girl is brought to the emergency department for evaluation of vaginal discharge. She has had malodorous vaginal discharge and a small amount of vaginal bleeding for about a week. Her mother called the patient’s primary care provider and was told to stop letting the child take bubble baths; however, the symptoms have not improved. Aside from the discharge, the girl is acting normally. The patient was toilet trained at age 2 and has had no episodes of incontinence. She started kindergarten a month ago. The mother says that she has no fever, abdominal pain, or dysuria. On examination, the labia appear normal. Purulent, malodorous vaginal discharge is noted. Visual inspection with the child in knee-chest position shows a whitish foreign body inside the vaginal introitus. Which of the following is the best next step in management of this patient?"}],"o":[["A","Irrigate with warmed fluid after local anesthetic application"],["B","Notify Child Protective Services immediately"],["C","Order a CT scan of the abdomen and pelvis"],["D","Perform speculum examination under general anesthesia"],["E","Prescribe topical estrogen therapy"]],"a":"A"},{"id":"4468","b":6,"n":34,"s":[{"p":"A 16-year-old boy is brought to the emergency department due to 3 weeks of progressive shortness of breath during physical activity. The patient stopped playing golf 2 weeks ago after he became short of breath while walking the course. He also feels more tired and weaker than usual. The patient has had no rash, cough, chest pain, palpitations, dizziness, or fever. Medical history is notable for sickle cell disease; he has had frequent hospitalizations for pain crises and an episode of acute chest syndrome. The most recent hospitalization was 6 months ago. The patient has been on his usual dose of oxycodone for chronic bone pain. Temperature is 36.7°C (98.1°F), blood pressure is 120/70 mm Hg, pulse is 120/min, and respirations are 18/min. Physical examination shows a tired-appearing but comfortable adolescent with conjunctival pallor. Laboratory results are as follows:"},{"ul":["Hemoglobin: 6.7 g/dL"]},{"ul":["Hematocrit: 20.1%"]},{"ul":["Mean corpuscular volume: 110 μm³"]},{"ul":["Reticulocytes: 1%"]},{"p":"Which of the following is the most likely underlying mechanism for this patient’s laboratory findings?"}],"o":[["A","Adverse drug reaction"],["B","Aplastic crisis"],["C","Folate deficiency"],["D","Hyperhemolytic crisis"],["E","Splenic sequestration"]],"a":"C"},{"id":"4823","b":6,"n":35,"s":[{"p":"A 9-month-old child is brought to the office for a routine visit. The patient has had several episodes of otitis media since birth, but no major illnesses or hospitalizations. She was previously happy and sociable around other people but now cries when her mother is not in the room and screams when going to day care. Developmentally, the child pulls herself up to stand and can stand on her own briefly. She can hold a spoon with 3 fingers and throw objects. The patient does not yet respond to her name, babble, or use words. When the physician hides a toy with his hand, the child lifts the hand to look for it. She waves goodbye when the physician waves first. Which of the following is the best next step in management of this patient?"}],"o":[["A","Audiology evaluation"],["B","Physical therapy evaluation"],["C","Psychological evaluation"],["D","Reassurance that the child’s development is normal"],["E","Social services referral"]],"a":"A"},{"id":"4117","b":6,"n":36,"s":[{"p":"A 5-year-old boy is brought to the emergency department due to right-sided hemiplegia. His parents say that he has been having increasing difficulty moving his right arm and leg over the past 3 hours. This morning, approximately 10 hours prior, the child tripped on a toy while brushing his teeth and fell forward with the toothbrush in his mouth. He cried immediately, but his parents did not note any oral bleeding. The boy did say, “My throat hurts” throughout the day but was able to eat his lunch. The child has a history of attention deficit hyperactivity disorder for which he takes methylphenidate. The boy’s mother has a history of migraines, and his grandfather had a stroke at age 62. Neurologic examination shows right hemiplegia, right hemianesthesia, and mild motor aphasia. Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Antithrombin III deficiency"],["B","Arteriovenous malformation"],["C","Carotid artery dissection"],["D","Congenital heart disease"],["E","Focal seizure"],["F","Hemiplegic migraine"],["G","Homocystinuria"],["H","Retropharyngeal abscess"]],"a":"C"},{"id":"3993","b":6,"n":37,"s":[{"p":"An 18-year-old woman is brought to the emergency department with severe abdominal pain. Medical history includes asthma, eczema, and multiple episodes of pneumonia. Her temperature is 37.2°C (99°F), blood pressure is 90/60 mm Hg, and pulse is 128/min. Physical examination shows pallor and a tender, rigid abdomen. Laboratory studies reveal a hemoglobin concentration of 6.9 mg/dL and platelet count of 378,000/mm³. Emergency laparotomy reveals a ruptured ectopic pregnancy. The patient receives a transfusion with blood type O, Rh-negative, packed red blood cells. During the transfusion, she experiences generalized hives and a drop in blood pressure to 70/40 mm Hg. The transfusion is stopped and intramuscular epinephrine is administered. Which of the following is the most likely diagnosis?"}],"o":[["A","Bacterial contamination from transfusion"],["B","Blood group incompatibility"],["C","Cystic fibrosis"],["D","Hyper-IgM syndrome"],["E","Selective IgA deficiency"],["F","Wiskott-Aldrich syndrome"],["G","X-linked agammaglobulinemia"]],"a":"E"},{"id":"4351","b":6,"n":38,"s":[{"p":"A 4-year-old girl is brought to the clinic due to swelling on the neck. The mother first felt a few lumps on the patient’s neck 2 days ago while brushing her hair. Their size has not changed. The patient has had no recent fever, cough, rhinorrhea, or sore throat. She goes to preschool. The family has not traveled outside of the United States. Temperature is 36.6°C (97.9°F), blood pressure is 94/66 mm Hg, pulse is 78/min, and respirations are 14/min. Physical examination shows several nontender, soft, mobile, subcentimeter anterior cervical lymph nodes bilaterally. The oropharynx is clear and cardiopulmonary examination is normal. There is no hepatosplenomegaly. The remainder of the examination is unremarkable. Which of the following is the best next step in management of this patient’s examination findings?"}],"o":[["A","Complete blood count"],["B","Empiric antibiotic therapy"],["C","Monospot testing"],["D","Observation only"],["E","Rapid streptococcal antigen test"]],"a":"D"},{"id":"15143","b":7,"n":1,"s":[{"p":"An 18-month-old boy is brought to the office by his mother for a checkup. The patient was born at full term without complications. Growth has been consistently along the 80th percentile for height and weight. The mother reports, “He is healthy and seems happy just playing by himself, but I am concerned about him not talking.” She says that he makes some sounds that are unintelligible, has a 1-word vocabulary of “no,” and does not yet say “mama,” “dada,” or “bye-bye.” The patient is able to walk and is starting to run. He can scribble and with help can use a spoon to feed himself. On examination, he does not make eye contact, respond to his name, or follow the doctor’s gaze when toys are pointed out to him. Hearing testing is normal. Which of the following is the most likely explanation for the patient’s behavior?"}],"o":[["A","Autism spectrum disorder"],["B","Childhood-onset fluency disorder"],["C","Intellectual disability"],["D","Language disorder"],["E","Selective mutism"],["F","Speech sound disorder"]],"a":"A"},{"id":"16008","b":7,"n":2,"s":[{"p":"An 8-year-old boy is brought to the office for evaluation of heel pain. The patient has had increasing pain in the back of his heels for the past 2 months during basketball season. The pain was tolerable until a recent 3-day basketball tournament, which exacerbated his heel pain. He has no pain in other joints and does not recall a specific injury. The patient has no chronic medical conditions and takes no daily medications. Temperature is 36.7°C (98°F). He is at the 98th percentile for height and the 55th percentile for weight. The patient has a normal gait but is unable to stand directly on his heels without pain. Bilateral heels have mild swelling, and the bases of both are tender to palpation. Dorsiflexion of the ankle elicits pain. The Achilles tendon is nontender. Which of the following is the most likely cause of this patient’s heel pain?"}],"o":[["A","Achilles tendinopathy"],["B","Calcaneal apophysitis"],["C","Juvenile idiopathic arthritis"],["D","Plantar fasciitis"],["E","Tarsal tunnel syndrome"]],"a":"B"},{"id":"4186","b":7,"n":3,"s":[{"p":"A 5-year-old boy is brought to the office by his parents after exposure to a child with a rash. Three days ago, the patient had a day-long playdate with a friend who had low-grade fever and a vesicular rash. That child and another child in the neighborhood were subsequently diagnosed with chickenpox. The patient has no symptoms and no history of medical problems. The boy received age-appropriate vaccinations in infancy but has not received any immunizations after age 1. He lives at home with his mother, father, and 1-year-old brother. The boy’s mother is currently pregnant and immune to the varicella zoster virus. Vital signs are within normal limits. Examination of the skin, ears, and mucous membranes is normal; the remainder of the examination is unremarkable. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Administer acyclovir"],["B","Administer varicella immunoglobulin"],["C","Administer varicella vaccine"],["D","Administer varicella vaccine and varicella immunoglobulin"],["E","Reassurance"]],"a":"C"},{"id":"3787","b":7,"n":4,"s":[{"p":"A 1-year-old African American girl is brought to the office for routine evaluation. She is learning how to walk and says “mama” and “dada.” She recently transitioned from breast milk to cow’s milk. Review of systems is negative. Both parents have sickle cell trait and her sister has sickle cell disease. Her height and weight are appropriate for her age. Physical examination shows a well-appearing, well-nourished child with no abnormalities. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hemoglobin: 14 g/dL"]},{"ul":["Hematocrit: 42%"]},{"ul":["Mean corpuscular volume: 88 fL"]},{"ul":["Reticulocytes: 2%"]},{"p":"Hemoglobin electrophoresis"},{"ul":["Hemoglobin A: 60%"]},{"ul":["Hemoglobin S: 40%"]},{"ul":["Hemoglobin F: 0%"]},{"p":"What is the most common complication of her condition?"}],"o":[["A","Acute chest syndrome"],["B","Dactylitis"],["C","Hematuria"],["D","Ischemic stroke"],["E","Osteomyelitis"],["F","Splenic infarction"],["G","Urinary tract infection"]],"a":"C"},{"id":"3550","b":7,"n":5,"s":[{"p":"A 5-year-old boy is brought to the clinic for a routine examination. The patient is doing well at his preschool and is making friends. His parents report that he has been sleeping longer than usual, often into the afternoon on weekends. They think it is because he is staying up late watching television, and they note he is moving closer to the screen because he cannot see the images clearly. Now, when he wakes up in the morning, the patient has a headache throughout his head that does not resolve with over-the-counter acetaminophen. The patient’s father has obstructive sleep apnea and wears a continuous positive airway pressure mask at night. Height is at the 5th percentile and weight is at the 25th percentile. Temperature is 36.7°C (98°F). Visual acuity is decreased bilaterally. The cranial nerves are intact. Cardiopulmonary examination is normal. Skin reveals numerous freckles in the axillae and 8 flat, small, uniformly hyperpigmented macules on the trunk. Which of the following is the best next step in management of this patient?"}],"o":[["A","Audiometry"],["B","Brain and orbital MRI"],["C","Electroencephalogram"],["D","Erythrocyte sedimentation rate"],["E","Lumbar puncture"],["F","Polysomnography"],["G","Urine toxicology"]],"a":"B"},{"id":"15794","b":7,"n":6,"s":[{"p":"A 16-month-old girl is brought to the office by her mother for evaluation. The mother says, “She was babbling and had started to say a few words, but for the last few weeks she hardly speaks and prefers to sit on her own, rocking back and forth. She doesn’t seem interested in playing with her stuffed animals anymore, and I have also noticed that she seems to be struggling to catch her breath when she gets upset.” Medical history is significant for a simple febrile seizure at age 11 months and an upper respiratory tract infection 6 weeks ago. Family history is significant for a seizure disorder in her father and a learning disorder in her older brother. On physical examination, the patient is noted to have a brief period of hyperventilation followed by hypoventilation, which passes within 30 seconds. Vital signs are otherwise normal. The patient makes brief eye contact with the physician but rocks back and forth and says nothing. She repeatedly twists her fingers and has an unsteady gait. Which of the following is the most likely diagnosis?"}],"o":[["A","Angelman syndrome"],["B","Autism spectrum disorder"],["C","Krabbe disease"],["D","Landau-Kleffner syndrome"],["E","Lennox-Gastaut syndrome"],["F","Lesch-Nyhan syndrome"],["G","Rett syndrome"]],"a":"G"},{"id":"3571","b":7,"n":7,"s":[{"p":"A 15-year-old boy with sickle cell disease is brought to the emergency department after experiencing 2 days of fever and severe pain in the left knee. The patient was hospitalized previously for acute vaso-occlusive crises, which generally occur in his arms. His temperature is 38.2°C (100.8°F). Physical examination shows marked tenderness and swelling over the proximal tibia. Laboratory studies reveal leukocytosis and an elevated C-reactive protein. MRI of the legs shows marked inflammation of the proximal tibia without joint effusion. Blood culture is obtained, and intravenous antibiotics are administered. Which of the following organisms is the most likely cause of this patient’s condition?"}],"o":[["A","Escherichia coli"],["B","Kingella kingae"],["C","Neisseria gonorrhoeae"],["D","Pseudomonas aeruginosa"],["E","Salmonella enteritidis"],["F","Streptococcus agalactiae"],["G","Streptococcus pneumoniae"]],"a":"E"},{"id":"3612","b":7,"n":8,"s":[{"p":"A 7-year-old boy is brought to the office for evaluation of anal pruritus. A month ago, the patient went on a weekend camping trip with a group of friends. During the weekend, they learned to swim in the lake and stayed together in a log cabin. After returning home, the patient began to have increasing anal pruritus that is most severe at night. He has continued to have a healthy appetite and has had no vomiting or diarrhea. The patient has no chronic medical conditions, takes no daily medications, and has no known allergies. Vital signs are normal. Physical examination shows a well-appearing patient in no apparent distress. Skin examination is normal. The lungs are clear to auscultation, and the abdomen is soft and nondistended. Inspection of the anus shows mild perianal erythema with multiple excoriations, but no induration, fluctuance, or fissures. Which of the following is the most appropriate treatment for this patient?"}],"o":[["A","Clotrimazole"],["B","Ivermectin"],["C","Metronidazole"],["D","Permethrin"],["E","Praziquantel"],["F","Pyrantel pamoate"]],"a":"F"},{"id":"3755","b":7,"n":9,"s":[{"p":"A 4-month-old boy is brought to the office by his mother for a routine examination. This is the patient’s first visit as the mother recently moved to the area. Review of medical records shows that the only parental concerns at age 2 months were excessive gassiness and spitting up, both of which have resolved. The patient was born full term and has no chronic medical conditions. Vaccinations are up to date. His parents recently divorced, and he now lives with his mother and 9-year-old sister. The sister has attention-deficit hyperactivity disorder and anxiety. The patient’s height and weight are at the 50th and 75th percentiles, respectively. On physical examination, he is smiling and reaching for the examiner’s stethoscope. He holds his bottle for a few seconds and then drops it on the ground. The patient can sit with support and roll from front to back. Flat, nonblanching, nontender patches over his sacrum and buttocks are shown in the image. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Complete blood count and coagulation studies"],["B","MRI of the brain"],["C","Reassurance"],["D","Sacral ultrasound"],["E","Skeletal survey"]],"a":"C"},{"id":"4104","b":7,"n":10,"s":[{"p":"An 18-month-old boy is brought to the emergency department due to fever and facial rash for 2 days. The patient has a history of atopic dermatitis for which his parents occasionally apply over-the-counter steroid cream. The boy had a flare-up of dry, thickened, itchy skin on his cheeks 4 days ago. He then developed many overlying, painful bumps 2 days ago that have since increased in number. His vaccinations are up to date. Physical examination shows an uncomfortable-appearing child with numerous painful, clear vesicles over erythematous skin on both cheeks as well as a few scattered lesions with overlying dark-red crusting. Submandibular lymphadenopathy is present. The rest of the skin appears dry. The initial gram stain of one of the lesions is negative. Which of the following is the most likely etiology of this patient’s rash?"}],"o":[["A","Herpes simplex virus"],["B","Methicillin-resistant Staphylococcus aureus"],["C","Methicillin-sensitive Staphylococcus aureus"],["D","Poxvirus"],["E","Streptococcus pyogenes"],["F","Trichophyton rubrum"],["G","Varicella zoster infection"]],"a":"A"},{"id":"2712","b":7,"n":11,"s":[{"p":"A 13-year-old girl is brought to the clinic for a routine health maintenance examination. She recently immigrated from Southeast Asia and has no known health concerns. Medical history includes a febrile illness a year ago that was followed by development of pain and swelling in the knees and wrists. At that time, the patient was treated with nonsteroidal anti-inflammatory medications, and her symptoms resolved. Her last physical examination, 2 years ago, was prior to her immigration and was normal. She plays soccer and swims every weekend. Blood pressure is 110/70 mm Hg and pulse is 70/min and regular. Cardiac examination reveals a diminished S1 and a grade 2/6, high-pitched, holosystolic murmur that is loudest at the apex and radiates to the left axilla. The lungs are clear to auscultation. The abdomen is soft, nontender, and has no hepatosplenomegaly. Echocardiogram demonstrates mild mitral regurgitation. Which of the following is the most appropriate treatment for this patient?"}],"o":[["A","Methotrexate"],["B","Metoprolol"],["C","Penicillin"],["D","Warfarin"],["E","No therapy indicated"]],"a":"C"},{"id":"4479","b":7,"n":12,"s":[{"p":"A 6-week-old boy is seen in the office for routine follow-up after discharge from the neonatal intensive care unit. He was born at 31 weeks gestation to a 41-year-old woman via cesarean delivery for preeclampsia with severe features and breech presentation. The hospital course included brief oxygen supplementation via continuous positive airway pressure and nasal cannula and phototherapy for jaundice. The patient is now breastfeeding every 3 hours and gaining weight appropriately. Maternal prenatal laboratory studies were normal. Weight today is 3 kg (6.6 lb). Examination is unremarkable. The parents inquire about upcoming vaccines for their infant. Which of the following is the most accurate statement regarding immunization scheduling for this patient?"}],"o":[["A","Immunizations are given according to the chronologic age"],["B","Immunizations are given according to the corrected gestational age"],["C","Immunizations are given when antibody testing confirms an immune response"],["D","Immunizations are given when weight ≥ 4 kg (8.8 lb)"],["E","Toxoid vaccines are given according to chronologic age, but live attenuated vaccines are given according to corrected gestational age"]],"a":"A"},{"id":"9849","b":7,"n":13,"s":[{"p":"A 5-year-old boy is brought to the clinic due to 3 days of fever. For the past 2 days he has also had throat pain and has not eaten well. His father is worried because the boy is due to start the fall school term in 2 weeks. The patient has no chronic medical conditions and is current with his immunizations. He lives with his older brother, parents, and grandmother. Temperature is 38.3°C (101°F), blood pressure is 108/58 mm Hg, pulse is 108/min, and respirations are 18/min. The oropharynx has several scattered, 1-mm vesicles on the anterior palatine pillars. Several gray, shallow ulcers are also seen on the soft palate and uvula, but the tongue, lips, and buccal mucosa are spared. The skin has no rashes. The remainder of the physical examination is normal. Which of the following is the most likely pathogen associated with this patient’s condition?"}],"o":[["A","Adenovirus"],["B","Coxsackie virus"],["C","Epstein-Barr virus"],["D","Herpes simplex virus"],["E","Streptococcus pyogenes"]],"a":"B"},{"id":"12519","b":7,"n":14,"s":[{"p":"A 12-year-old girl is brought to the office due to nasal congestion for the past 2 weeks. The nasal discharge has become thick and green, and fever started today. On physical examination, the patient has mucopurulent nasal drip and tenderness over the maxillae. The remainder of the examination is normal. Medical history includes 2 prolonged episodes of sinusitis this year and a recent episode of Giardia lamblia infection. The patient was hospitalized last year for Streptococcus pneumoniae bacteremia; prior to this, the patient was in good health. She has had asthma since age 3 but takes no medications other than bronchodilators as needed. Developmental milestones were achieved on time. Immunizations are up to date. Height and weight are currently at the 5th percentile for age. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hemoglobin: 12 g/dL"]},{"ul":["Platelets: 180,000/mm³"]},{"ul":["Leukocytes: 7,500/mm³"]},{"p":"A diagnosis of acute sinusitis is made, and antibiotic therapy is initiated. Which of the following is important in long-term management of this patient?"}],"o":[["A","Antiviral and antifungal prophylaxis"],["B","Cultured thymus transplant"],["C","Hematopoietic stem cell transplant"],["D","Immunomodulator therapy"],["E","Intravenous immunoglobulin infusion"]],"a":"E"},{"id":"4865","b":7,"n":15,"s":[{"p":"A 3-year-old boy with DiGeorge syndrome is brought to the emergency department after a 5-minute, generalized tonic-clonic seizure. For the past week, the patient has been increasingly tired and has had severe morning headaches, which have not been relieved by acetaminophen or ibuprofen. He has been dragging his right leg for several days while walking. His appetite has decreased, and he has been vomiting after waking up in the morning. The patient’s family recently emigrated from a developing country to obtain care for his unrepaired tetralogy of Fallot. The patient has speech delay and a history of recurrent pneumonias and sinus infections. Temperature is 38.3°C (101°F). Physical examination shows a tired-appearing child with dysmorphic facial features. The right lower extremity exhibits decreased strength and the ankle deep tendon reflex is hyperreflexic; the left lower extremity is normal. There is no truncal ataxia. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Bacterial meningitis"],["B","Brain abscess"],["C","Hypocalcemia"],["D","Hypoglycemia"],["E","Hyponatremia"],["F","Medulloblastoma"],["G","Thromboembolic stroke"]],"a":"B"},{"id":"2470","b":7,"n":16,"s":[{"p":"An 8-year-old boy is brought to the office by his mother, who says that the boy has become “unmanageable” over the past 2 years. He does not do anything that he is told, including chores and homework. He either makes excuses, saying that he “forgot,” or does tasks “half-heartedly,” often making careless mistakes while rushing through his work. The boy does not listen to his mother and argues with her about getting ready for school. He recently was taken to the principal’s office for getting out of his seat and talking out of turn. The patient’s teachers like him but describe him as “difficult to teach.” His grades are poor, and he is at risk of not being promoted. The patient has also lost friends due to his intrusive behavior. His mood is usually upbeat, and he enjoys playing soccer and video games. The boy’s weight is in the 40th percentile, his overall development has been normal, and he has met all developmental milestones. The family moved to a new neighborhood, and the patient started attending a different school last year. There is a family history of bipolar disorder in the patient’s uncle. During the course of the evaluation, the boy repeatedly interrupts the discussion with rapid, loud speech. He jumps up and grabs the physician’s stethoscope even after his mother tells him not to touch anything. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Adjustment disorder with disturbance of conduct"],["B","Attention-deficit hyperactivity disorder"],["C","Bipolar II disorder"],["D","Conduct disorder"],["E","Disruptive mood dysregulation disorder"],["F","Oppositional defiant disorder"]],"a":"B"},{"id":"2453","b":7,"n":17,"s":[{"p":"A 9-year-old girl is brought to the clinic for evaluation of recurrent vomiting. The patient has no symptoms today but has had nausea, vomiting, and diffuse abdominal pain for several days each month over the last 8 months. When the vomiting occurs, it typically begins early in the morning, recurs 10-15 times a day, and lasts for 2 days. The vomiting is nonbloody and nonbilious. The mother states that the episodes were more frequent around the beginning of the school year and occurred 5 times in a 2-month span. The last 2 times, the mother has taken time off work because the daughter required hospitalization for intravenous hydration. The patient has no fever, headache, or diarrhea during the episodes. Between episodes, she is active and eats well. Height and weight are at the 25th percentile for age, similar to her prior growth curves at her well visit 6 months ago. The patient is in no distress and is well hydrated. Mucous membranes are moist, but the maxillary incisors have erosive dental caries. The abdomen is soft and nontender. Neurologic examination is normal. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Bulimia nervosa"],["B","Chronic pancreatitis"],["C","Cyclic vomiting syndrome"],["D","Factitious disorder imposed on another"],["E","Gastroesophageal reflux disease"],["F","Inflammatory bowel disease"]],"a":"C"},{"id":"4378","b":7,"n":18,"s":[{"p":"A 17-year-old girl is brought to the emergency department by her mother after an episode of loss of consciousness 20 minutes ago. The patient was taking a shower when her mother heard her fall. By the time the mother opened the bathroom door, she was lying on the floor and unresponsive. The patient woke up within a few minutes and was taken to the emergency department by ambulance. During transport, she was drowsy and confused. The mother notes that the patient recently broke up with her boyfriend, has been under significant stress at school, and has been sleeping poorly. In the emergency department, blood pressure is 120/70 mm Hg, pulse is 90/min, and respirations are 13/min. The patient is now alert and answers questions appropriately. Examination of the head shows no obvious injury, step-off, or hematoma. The pupils are symmetric and reactive to light. Fingerstick glucose level is 100 mg/dL. Which of the following is most likely to be seen in this patient?"}],"o":[["A","Elevated serum acetaminophen level"],["B","Orthostatic hypotension"],["C","Pulsus paradoxus"],["D","Systolic murmur that increases with standing"],["E","Tongue laceration"]],"a":"E"},{"id":"2226","b":7,"n":19,"s":[{"p":"A 3-year-old girl is brought to the physician with dysuria. Her parents say that she has been crying with urination, even though “a small amount comes out at a time.” She has no vomiting, nausea, or fever. In the past year, the girl had 3 bladder infections that were treated with antibiotics; the last infection was 2 months ago. She also has a history of constipation since starting cow’s milk at age 1 and takes a laxative as needed to help with bowel movements. Her temperature is 37.2°C (99°F), blood pressure is 80/50 mm Hg, and pulse is 110/min. Examination shows suprapubic tenderness and small anal fissures at 12 o’clock and 2 o’clock. Rectal examination shows normal anal wink and tone; hard stool is palpated in the rectal vault. Urinalysis shows positive leukocyte esterase, positive nitrites, and white blood cells 60/hpf. Urine culture shows 100,000 colonies of Escherichia coli. Renal ultrasound and voiding cystoureterogram are normal. Which of the following is the most likely mechanism for this patient’s infection?"}],"o":[["A","Inadequate treatment of prior infection"],["B","Neurologic impairment"],["C","Renal insufficiency"],["D","Sexual abuse"],["E","Urinary reflux"],["F","Urinary stasis"]],"a":"F"},{"id":"15847","b":7,"n":20,"s":[{"p":"A 16-year-old girl is seen in the emergency department due to knee pain. Two days ago, the patient noticed swelling and a deep, aching pain in her left knee. She took a dose of acetaminophen, which improved the pain. The swelling worsened yesterday, and today the patient has a limp due to pain. She has no chronic medical conditions. Temperature is 36.7°C (98°F). On the palmar side of each hand, there are a few nontender pustules with a surrounding erythematous rim, each 3-4 mm in diameter. The left knee has an effusion but is without erythema; range of motion is decreased due to pain. Joint aspiration reveals a leukocyte count of 30,000/mm³; synovial fluid culture is negative. Which of the following historical factors is most commonly associated with this patient’s presentation?"}],"o":[["A","Lack of vaccinations"],["B","Recent viral upper respiratory illness"],["C","Skin abrasion"],["D","Tick bite"],["E","Unprotected sexual intercourse"]],"a":"E"},{"id":"2373","b":7,"n":21,"s":[{"p":"A 1-day-old boy is undergoing routine evaluation in the nursery. He was born via vaginal delivery to a primigravida at 38 weeks gestation. The mother took a daily prenatal vitamin and had routine prenatal care. Pregnancy was complicated by gestational diabetes, which was controlled by diet. Labor and delivery were unremarkable. Birth weight was 3.7 kg (8 lb  2 oz). The boy is awake and alert with normal tone and a strong sucking reflex. The lungs are clear to auscultation, and the heart has a normal rate and rhythm without murmurs. The abdomen is soft, nontender, and nondistended. The penis is uncircumcised, and the urethral meatus is visualized at the tip of the glans. The scrotum is significantly swollen with no discoloration. Both testicles are palpated within the scrotal sac. A light shone behind the scrotum transilluminates the swelling. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Aspiration of fluid"],["B","Genetics consultation"],["C","Reassurance and observation"],["D","Scrotal ultrasound"],["E","Surgical intervention"]],"a":"C"},{"id":"4871","b":7,"n":22,"s":[{"p":"A previously healthy 6-month-old child is brought to the physician for a routine examination. The parents state that during the past month, the child has been feeding poorly and has been fussier than usual. On examination, the child has a bulging anterior fontanelle and widely spaced sutures. Her scalp veins are also noted to be prominent. The remainder of the physical examination is within normal limits. The infant’s growth chart is shown in the exhibit. Which of the following is the best next step in the management of this patient?"}],"o":[["A","Recheck the head circumference in 1 month"],["B","Skull radiographs"],["C","Lumbar puncture"],["D","CT scan of the brain"],["E","Electroencephalogram"]],"a":"D"},{"id":"16834","b":7,"n":23,"s":[{"p":"A 17-year-old girl comes to the office due to a rash. She joined the high school cross country running team 2 months ago and has had a progressive itchy rash on her feet since that time. The patient tried replacing her running shoes and socks, but the symptoms continued. Medical history is unremarkable. Examination findings are shown in the image. Which of the following is the most appropriate treatment for this patient’s condition?"}],"o":[["A","Cephalexin capsules"],["B","Miconazole cream"],["C","Nystatin powder"],["D","Permethrin cream"],["E","Triamcinolone ointment"]],"a":"B"},{"id":"16029","b":7,"n":24,"s":[{"p":"A 3-hour-old newborn is being evaluated in the nursery. The patient was born at 37 weeks gestation via spontaneous vaginal delivery to a 32-year-old woman. The mother had regular prenatal care and no complications during the pregnancy or delivery. Family history is unremarkable. The patient measures at the 50th percentile for weight and head circumference. Length is at the 75th percentile. Examination shows a vigorously crying newborn who soothes easily. The anterior fontanelle is open, soft, and flat. The patient has a strong suck reflex, and the neck appears normal. The eyes appear normally spaced. Chest examination is normal with equal breath sounds bilaterally. The abdomen is soft and has no organomegaly. Urogenital examination shows curvature of an underdeveloped phallus with the urethral meatus at the base. Labioscrotal folds are fused, and the gonads are not palpable. The 17-hydroxyprogesterone level is elevated. Which of the following is the most likely karyotype in this patient?"}],"o":[["A","45,X"],["B","46,XY"],["C","46,XX"],["D","47,XXY"],["E","47,XYY"]],"a":"C"},{"id":"16086","b":7,"n":25,"s":[{"p":"A 4-month-old boy is brought to the office by his mother due to noisy breathing. Approximately a month ago, his mother first noticed a squeaky noise when he was crying or lying in his crib. The noise has become progressively louder and persistent. The patient was recently placed in a day care after his mother returned to work; she attributed the noisy breathing to a viral infection, but it has failed to resolve. He is breastfed but is fed formula at day care. The mother reports no episodes of difficulty breathing or bluish discoloration during feeding, but he often spits up a small amount after feeds. The patient was born at full term without complications and is up to date with vaccinations. He is afebrile; height and weight are at the 60th percentile. On physical examination, the patient appears well and smiles at the examiner. When the patient is placed supine on the examination table, inspiratory stridor is heard, which resolves quickly when he is placed in the prone position. No cyanosis is noted. The remainder of the examination shows no abnormalities. Which of the following is the most likely diagnosis?"}],"o":[["A","Airway foreign body"],["B","Allergic rhinitis"],["C","Choanal atresia"],["D","Food allergy"],["E","Laryngomalacia"],["F","Laryngotracheobronchitis (croup)"]],"a":"E"},{"id":"17518","b":7,"n":26,"s":[{"p":"A 13-year-old girl is brought to the clinic due to frequent headaches. She first developed mild headaches a year ago, which were treated intermittently with ibuprofen. Over the last 3 months, the headaches have progressively worsened in severity and now occur almost daily. The pain has awakened the patient from sleep multiple times. She has no chronic medical conditions and takes no additional medications. The patient’s growth chart shows that height tracked along the 50th percentile until age 11; today it is at the 5th percentile. Weight remains stable at the 75th percentile. Temperature is 37.2°C (99°F), blood pressure is 110/70 mm Hg, and pulse is 90/min. Examination shows mild optic disc edema. The neck is supple. Cardiopulmonary examination is normal. Strength is 5/5 in the bilateral upper and lower extremities. Sensation is intact. Reflexes are 2+ bilaterally. Finger-nose-finger testing shows no dysmetria. The patient has a normal gait. Sexual maturity rating (Tanner) is stage 1. Skin examination is normal. MRI of the brain for this patient would most likely show which of the following?"}],"o":[["A","Enhancing lesion in the internal auditory canal"],["B","Parietal lesion with air-fluid levels and a hyperdense rim"],["C","Subependymal nodules in the lateral ventricles"],["D","Suprasellar mass with calcifications"],["E","Tumor in the cerebellar vermis"]],"a":"D"},{"id":"15118","b":7,"n":27,"s":[{"p":"A 10-month-old boy is brought to the office by his mother for a routine well-child visit. She says, “I’m planning on returning to work next month, but I’m worried about dropping him off at day care. Whenever someone tries to hold him, he cries and has screaming fits. He’s gotten very clingy with me and my husband.” The patient crawls, pulls to a stand, and says “Ma.” The mother tries to feed him a range of foods, but he often refuses to eat certain vegetables. She says, “He just seems a bit fussier in general—my 4-year-old daughter was more easygoing at his age.” The family moved from out of town 3 weeks ago for the mother’s new job. During the evaluation, the patient sits quietly on his mother’s lap but cries when he is picked up and weighed by the nurse. When the physician calls the patient’s name, he turns his head away from the physician and looks at his mother. Physical examination is normal, and growth is at the 55th percentile. Which of the following is the most likely explanation for this patient’s behavior?"}],"o":[["A","Adjustment disorder"],["B","Autism spectrum disorder"],["C","Normal development"],["D","Reactive attachment disorder"],["E","Separation anxiety disorder"]],"a":"C"},{"id":"17170","b":7,"n":28,"s":[{"p":"A 5-year-old boy is brought to the clinic by his parents due to hearing loss. Over the past year, the patient has had increased difficulty hearing normal conversations. He was born at 36 weeks gestation and was small for gestational age but otherwise has had no medical problems. He is at the 50th-75th percentile for height, weight, and head circumference. A tuning fork held over the middle of the forehead sounds louder in the left ear. Tuning fork sounds are better heard with air conduction bilaterally. Which of the following is the most likely etiology of this patient’s hearing loss?"}],"o":[["A","Cholesteatoma"],["B","Chronic otitis media"],["C","Congenital infection"],["D","Foreign body"],["E","Noise exposure"],["F","Otosclerosis"]],"a":"C"},{"id":"4495","b":7,"n":29,"s":[{"p":"A 3-year-old boy is brought to the clinic due to 3 days of fever and painful swelling in his right groin. His medical history includes 4 previous episodes of cutaneous abscesses and a lung abscess due to Staphylococcus aureus, all of which required drainage and prolonged antimicrobial therapy. The boy’s maternal uncle died in childhood from recurrent infections. The patient’s temperature is 38.5°C (101.3°F). Physical examination shows an enlarged, tender, and fluctuant lymph node in the right inguinal area. There are several areas of scarring over previous drainage sites. The remainder of the physical examination is normal. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hematocrit: 40%"]},{"ul":["Platelets: 320,000/mm³"]},{"ul":["Leukocytes: 11,000/mm³"]},{"ul":["Neutrophils: 50%"]},{"ul":["Bands: 10%"]},{"ul":["Lymphocytes: 35%"]},{"p":"Gram stain of fluid aspirated from the affected lymph node reveals numerous organism-filled, segmented neutrophils. Cultures grow Aspergillus niger. Which of the following tests would most likely confirm this patient’s diagnosis?"}],"o":[["A","B cell concentrations"],["B","CH50 assay"],["C","Dihydrorhodamine test"],["D","Fluorescence in situ hybridization"],["E","Immunoglobulin levels"],["F","T cell concentrations"]],"a":"C"},{"id":"4142","b":7,"n":30,"s":[{"p":"A 15-year-old girl is brought to the office for evaluation of short stature. The patient has always been short compared to her peers, but she recently tried out for her school’s basketball team and now asks “if anything can make me taller.” She has not yet undergone menarche and has never been sexually active. The patient takes no medications or oral contraceptives. Height is <3rd percentile and weight is at the 20th percentile. Blood pressure is 130/80 mm Hg and pulse is 92/min. Physical examination reveals clear lung fields and a 2/6 systolic ejection murmur heard loudest in the left infraclavicular area. The abdomen is soft and nontender. Breast development is Tanner stage 1, and pubic hair development is Tanner stage 4. Which of the following laboratory values is most likely to be present in this patient?"}],"o":[["A","High estrogen"],["B","High FSH"],["C","High inhibin A"],["D","High testosterone"],["E","Low growth hormone"],["F","Low LH"]],"a":"B"},{"id":"3658","b":7,"n":31,"s":[{"p":"A 9-year-old boy is brought to the emergency department after having a seizure at school. His teacher says he suddenly fell to the ground with sustained flexion of the arms and extension of the legs, followed by clonic movements of his whole body for 5 minutes. The patient appeared sleepy after the episode, but his behavior is now at baseline. His parents arrive shortly after and note that the boy has been increasingly tired and irritable over the last few months, and his school performance has declined this semester. The patient has no medical issues and takes no medications. Physical examination shows decreased muscle strength on the left side of the body, with brisk deep-tendon reflexes in the left arm and leg. Visual field examination is normal. MRI of the brain reveals a space-occupying lesion in the right parietal lobe. Which of the following is most likely responsible for this patient’s symptoms?"}],"o":[["A","Craniopharyngioma"],["B","Ependymoma"],["C","Glioblastoma"],["D","Low-grade astrocytoma"],["E","Medulloblastoma"],["F","Neuroblastoma"]],"a":"D"},{"id":"3326","b":7,"n":32,"s":[{"p":"A 7-year-old girl is brought to the emergency department with a painful swollen eye. She awoke this morning with left eye swelling, which has progressively worsened throughout the day. The patient has seasonal allergies for which she takes an over-the-counter antihistamine. She has no other significant medical history. Temperature is 39.1°C (102.4°F). Examination of the left eye shows tender, swollen, erythematous eyelids and a small abrasion below the eyelid. There is mild conjunctival injection but no drainage. Extraocular movements are normal and do not cause pain. Visual acuity is 20/20 bilaterally. Funduscopic examination is normal, and examination of the right eye is unremarkable. Facial sensation is intact. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Allergic conjunctivitis"],["B","Anterior uveitis"],["C","Bacterial conjunctivitis"],["D","Cavernous sinus thrombosis"],["E","Optic neuritis"],["F","Orbital cellulitis"],["G","Preseptal cellulitis"]],"a":"G"},{"id":"17059","b":7,"n":33,"s":[{"p":"A 3-year-old boy is brought to the office by his parents due to leg pain. Over the past 3 months, he has had progressive, bilateral lower leg pain that is worse with activity. The patient began walking at age 19 months and has always walked on his toes. He has had no fever, joint swelling, or rash. The patient takes no medications, and his immunizations are up to date. He was adopted as an infant, and his biological family history is unknown. Examination shows bilateral calf enlargement and thin, atrophied thighs. There is no focal tenderness with palpation. The patient has a waddling gait. His creatine kinase level is markedly elevated. Muscle biopsy shows replacement of muscle by fat and connective tissue. Which of the following additional tests should be performed at this time?"}],"o":[["A","Abdominal ultrasound"],["B","Antinuclear antibody"],["C","Echocardiogram"],["D","Skeletal survey"],["E","Slit lamp eye examination"]],"a":"C"},{"id":"16228","b":7,"n":34,"s":[{"p":"A newborn boy is evaluated in the delivery room 10 minutes after birth for increasing respiratory distress. He was born at 38 weeks gestation by a forceps-assisted vaginal delivery complicated by a 2-minute shoulder dystocia. The infant’s mother did not receive any prenatal care. Temperature is 36.8°C (98.2°F), blood pressure is 70/40 mm Hg, pulse is 168/min, and respirations are 72/min. Oxygen saturation is 82% on room air. Physical examination shows grunting, nasal flaring, and cyanosis of the mucous membranes. Chest x-ray is shown in the exhibit. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Congenital diaphragmatic hernia"],["B","Group B Streptococcus pneumonia"],["C","Tension pneumothorax"],["D","Tetralogy of Fallot"],["E","Transient tachypnea of the newborn"]],"a":"A"},{"id":"4856","b":8,"n":1,"s":[{"p":"A 6-week-old boy is brought to the office by his parents for evaluation of inconsolable crying. The patient has cried almost continuously up to 4 hours every evening for the past 3 weeks. Pacifiers do not seem to calm him, and he often refuses to feed during this time, making the parents feel overwhelmed and worried. The patient is happy and alert during the rest of the day. He was born full term via uncomplicated spontaneous vaginal delivery and is growing well. He breastfeeds every 2-4 hours and has 2-3 soft stools daily. Temperature is 37.3°C (99.1°F). The anterior fontanel is soft. Otoscopic examination shows erythematous tympanic membranes that are compliant on insufflation bilaterally. Heart and lung examination is unremarkable, and the abdomen is soft. Which of the following is the most appropriate management of this patient?"}],"o":[["A","Order an abdominal ultrasound"],["B","Prescribe a trial of an H₂ receptor blocker"],["C","Prescribe an oral antibiotic"],["D","Recommend lactose-free formula"],["E","Review soothing techniques"]],"a":"E"},{"id":"3760","b":8,"n":2,"s":[{"p":"An 11-year-old boy is brought to the office by his mother for a routine examination. She is worried that her son will be laughed at or bullied because of some unusual behaviors. The boy has a 4-year history of episodes in which he clears his throat, grimaces, and blinks his eyes. He has also recently started shrugging his left shoulder, which his mother fears is very noticeable to others. His medical history is otherwise unremarkable. The boy is having difficulty in math but is earning passing grades in other subjects. He has a few friends at school but prefers to play the piano and clarinet by himself after school. The mother notes that his shoulder movements stop when he plays a musical instrument. Physical examination is unremarkable with the exception of sporadic left-sided shoulder shrugs. Which of the following disorders is most likely to develop in this boy?"}],"o":[["A","Antisocial personality disorder"],["B","Autism spectrum disorder"],["C","Conduct disorder"],["D","Major depressive disorder"],["E","Obsessive-compulsive disorder"],["F","Oppositional defiant disorder"],["G","Seizure disorder"],["H","Social anxiety disorder"]],"a":"E"},{"id":"3555","b":8,"n":3,"s":[{"p":"A 6-year-old boy is brought to the pediatrician with leg pain. Over the last few months, he has had pain in both legs that occurs only at night. The pain is worst in his thighs although he occasionally has pain in his calves as well. The episodes last a few hours each and improve with massage and over-the-counter medications. The pain has remained unchanged over the past few months. When he has the pain, the patient does not feel an urge to move the legs. He has no leg pain during the day. He is able to walk, run, and play at school without any complaints, and his mother has noticed no change in his activity level. He has no fever, chills, or weight loss and there is no history of recent trauma. On examination, the boy has full range of motion of the hips and knees bilaterally. No swelling or tenderness to palpation is noted and he has a normal gait. His mother is very worried because his 9-year-old cousin died of leukemia 6 months earlier. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Blood cultures"],["B","Bone scan"],["C","Complete blood count"],["D","Observation and reassurance"],["E","Plain radiographs"],["F","Psychiatric evaluation"]],"a":"D"},{"id":"4876","b":8,"n":4,"s":[{"p":"A 2-year-old boy is brought to clinic by his parents for a routine well-child visit. He has no known medical conditions and is growing and developing appropriately. The patient is starting to put words into short sentences and sleeps well at night. His diet consists mostly of cheese and yogurt. He drinks approximately five 8-oz cups (1183 mL) of whole cow’s milk each day. Two months ago, the patient’s family moved from Greece to the United States. He has no allergies and immunizations are up to date. Height and weight are at the 25th percentile. Temperature is 36.7°C (98.1°F). The conjunctivae and mucous membranes are pale. The lungs are clear to auscultation bilaterally. Cardiac examination reveals tachycardia and a 2/6 systolic murmur along the left upper sternal border. Complete blood count is as follows:"},{"ul":["Hemoglobin: 8 g/dL","Mean corpuscular volume: 70 μm³","Erythrocytes: 3.1 million/μL","Platelets: 260,000/mm³","Leukocytes: 8,200/mm³"]},{"p":"Which of the following additional findings is most likely to be present in this patient?"}],"o":[["A","Abnormal hemoglobin electrophoresis"],["B","Elevated mean corpuscular hemoglobin concentration"],["C","Elevated red blood cell distribution width"],["D","High indirect bilirubin level"],["E","Increased circulating nucleated red blood cells"],["F","Low serum total iron-binding capacity"]],"a":"C"},{"id":"4313","b":8,"n":5,"s":[{"p":"A 13-year-old girl is brought to the office for evaluation of sunburn. She and her family just returned from a 4-day vacation to the Bahamas. While there, the patient applied sun protection factor 50 sunscreen every morning about 30 minutes before walking to the beach. She specifically bought “water-resistant” sunscreen so that she could swim. After 2 days, however, she developed painful redness on her face and shoulders that has started to peel. The patient is otherwise healthy and takes no daily medications. Her parents say that “everybody tans easily” in their family, and there is no family history of skin cancer. Physical examination shows a well-appearing adolescent with tender, blanching erythema on the face, shoulders, and arms. There is no edema or vesicles. Appropriate supportive care measures for treatment of her sunburn are discussed with the family. Which of the following is the most appropriate preventive recommendation to provide this patient?"}],"o":[["A","Apply sunscreen immediately before sun exposure"],["B","Apply sunscreen immediately before swimming"],["C","Change to sun protection factor 75 sunscreen"],["D","Continue current sun protection regimen"],["E","Form a baseline tan with a tanning bed before sun exposure"],["F","Reapply sunscreen every 2 hours"],["G","Restrict sun exposure to midday hours only"],["H","Wear light-colored clothing while outdoors"]],"a":"F"},{"id":"2468","b":8,"n":6,"s":[{"p":"A 1-day-old boy is in the neonatal intensive care unit due to congenital anomalies noted at birth. The infant was born vaginally at 36 weeks gestation to a 25-year-old woman, gravida 2 para 2, who declined prenatal testing and reported decreased fetal movement in the week preceding delivery. The infant was not latching well for the first 24 hours but has urinated and stooled. Examination shows a small face and jaw with a prominence on the back of the head. The oral mucosa is pink, but the hands and feet are mildly cyanotic. There are no skin creases on the palmar aspect of the digits. There is overlapping of the fingers bilaterally along with convexity of bilateral soles and limited hip abduction. A murmur at the left lower sternal border is heard on auscultation. Which of the following cardiovascular abnormalities is most likely present in this patient?"}],"o":[["A","Atrial septal defect"],["B","Congenital atrioventricular block"],["C","Patent ductus arteriosus"],["D","Transposition of the great arteries"],["E","Truncus arteriosus"],["F","Ventricular septal defect"]],"a":"F"},{"id":"2870","b":8,"n":7,"s":[{"p":"A 7-year-old boy is brought to the office due to “yellow eyes” over the past few months. His parents state that he has been tired, pale, and frequently uninterested in playing. The boy’s father has had similar symptoms throughout his life. The patient takes no daily medications. Physical examination shows a tired-appearing boy with pale conjunctivae, scleral icterus, and generalized jaundice. The tip of the spleen is palpable. Laboratory results are as follows:"},{"ul":["Hemoglobin: 10 g/dL","Reticulocytes: 10%","Platelets: 240,000/mm³","Leukocytes: 8,000/mm³","Mean corpuscular volume: 82 μm³","Mean corpuscular hemoglobin concentration: 38% Hb/cell","Total bilirubin: 3 mg/dL","Direct bilirubin: 0.2 mg/dL","Aspartate aminotransferase (SGOT): 27 U/L","Alanine aminotransferase (SGPT): 32 U/L"]},{"p":"Peripheral smear shows anisocytosis, spherocytes, and polychromatophilia. Direct and indirect antiglobulin (Coombs) tests are negative. Which of the following laboratory tests is the best next step in evaluation of this patient?"}],"o":[["A","Bone marrow evaluation"],["B","Eosin-5-maleimide binding"],["C","Erythrocyte CD55 and CD59 protein testing"],["D","Glucose-6-phosphate dehydrogenase activity"],["E","Hemoglobin electrophoresis"],["F","Serum B₁₂ level"],["G","Serum iron level"]],"a":"B"},{"id":"3692","b":8,"n":8,"s":[{"p":"An 18-month-old girl is brought to the emergency department due to fever and abdominal pain. Yesterday she began to cry while urinating. Today her parents saw a small amount of blood in the urine, and the urine was malodorous. The patient was born at term and has no chronic medical conditions. Temperature is 38.9°C (102°F), blood pressure is 96/62 mm Hg, pulse is 130/min, and respirations are 20/min. Physical examination shows suprapubic tenderness and left costovertebral angle tenderness. Complete blood count reveals leukocytosis. Serum creatinine and electrolytes are normal. Catheterized urinalysis results are as follows:"},{"ul":["Blood: moderate","Leukocyte esterase: positive","Nitrites: positive","Bacteria: moderate","White blood cells: 50+/hpf","Red blood cells: 20-30/hpf","Casts: none"]},{"p":"A urine culture grows 100,000 colony-forming units/mL of Escherichia coli. Antibiotics are administered, and her fever and pain resolve on the second day of hospitalization. In addition to completing the current course of antibiotics, which of the following is the best next step in management of this patient?"}],"o":[["A","Begin daily antibiotic prophylaxis"],["B","No further studies indicated"],["C","Obtain voiding cystourethrogram"],["D","Perform renal and bladder u
