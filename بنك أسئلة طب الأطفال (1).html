":12,"n":9,"s":[{"p":"A 3-year-old boy is brought to the emergency department due to abdominal pain. The pain began several hours ago and comes and goes. During these episodes, he holds his belly, screams, and draws up his legs. He has had nonbloody, nonbilious vomiting 3 times since the last painful episode. Between the episodes, the patient has no pain and is playful. His last bowel movement was yesterday and was normal. Two weeks ago, he had gastroenteritis that resolved after 3 days. He otherwise has no chronic medical conditions and takes no medications. Temperature is 37.2°C (99°F), blood pressure is 95/50 mm Hg, and pulse is 100/min. Abdominal examination shows a soft abdomen that is tender with voluntary guarding to palpation at the right upper and lower quadrants. Rectal examination reveals no fissures or hemorrhoids. The remainder of the examination is normal. Ultrasound of the abdomen is shown in the image (demonstrates a “target sign”). Which of the following is the best next step in management of this patient?"}],"o":[["A","Air enema"],["B","CT scan of the abdomen"],["C","Exploratory laparotomy"],["D","HIDA scan"],["E","Technetium-99m pertechnetate scan"]],"a":"A"},{"id":"12664","b":12,"n":10,"s":[{"p":"A 6-year-old boy is brought to the clinic by his parents due to 3 weeks of itchy, red eyes. The patient has had intermittent, mild, clear eye drainage and rubs his eyes frequently. These symptoms have worsened so that he now has difficulty paying attention at school. His parents have noticed some light crusting of both eyes when he wakes up in the morning. The patient has a history of mild, intermittent asthma for which he uses an albuterol inhaler. He lives with his parents, little sister, 2 cats, and a hamster. His sister has had rhinorrhea, cough, pharyngitis, and fever for 2 days. Vital signs are normal. Examination shows bilateral, diffuse conjunctival injection and mild eyelid edema. The child has no photophobia. Visual acuity is 20/20 in both eyes. Which of the following is the most likely etiology of this patient’s condition?"}],"o":[["A","Abrasion of corneal epithelium"],["B","Bacterial infection of conjunctiva"],["C","IgE-mediated hypersensitivity"],["D","Obstruction of the nasolacrimal duct"],["E","Viral infection of conjunctiva"],["F","Viral infection of cornea"]],"a":"C"},{"id":"4711","b":12,"n":11,"s":[{"p":"A 6-month-old boy is brought to the office for evaluation of a progressive facial rash that started 3 weeks ago near his eyebrows and spread to areas of the face and scalp. The rash does not appear to be painful or pruritic. The mother recently started using a mild, unscented shampoo that slightly improved the scalp rash. Physical examination of the scalp is shown in the exhibit (shows greasy, yellowish scales on the scalp/“cradle cap”). In addition, erythematous, scaly plaques are on the eyebrows, nasolabial folds, and behind the ears. Which of the following is the most likely diagnosis?"}],"o":[["A","Atopic dermatitis"],["B","Contact dermatitis"],["C","Psoriasis"],["D","Seborrheic dermatitis"],["E","Tinea capitis"]],"a":"D"},{"id":"4855","b":12,"n":12,"s":[{"p":"A 9-year-old boy is brought to the office by his parents for evaluation of behavior problems. His mother says that he never listens, gets distracted easily, and is hyperactive all the time. He is unable to sit still at the dinner table, constantly interrupts her when she is speaking on the phone, and makes excuses for forgetting his homework and chores. The father says his wife is overreacting as the boy has always been very active. He adds, “I was the same way as a kid; I am sure he’ll grow out of it.” There have been no changes in the patient’s appetite or sleep. He has friends at school and likes to play sports and video games. Physical examination is remarkable for a scar on his right leg and multiple scabs on his right knee, which he reports are due to falling off his bike and skateboard. The remainder of the physical examination is normal. The child’s mother asks if there is any medication that can help him “calm down.” Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Initiate a trial of methylphenidate"],["B","Interview parents separately"],["C","Monitor the patient’s behavior over the next year"],["D","Obtain a hearing test"],["E","Obtain teacher evaluations"],["F","Reassure parents that behavior is age-appropriate"],["G","Refer for educational testing"]],"a":"E"},{"id":"3384","b":12,"n":13,"s":[{"p":"A 15-year-old girl is brought to the office by her mother due to hair loss. The patient was cast in the lead role of the school play a month ago and has been wearing hats and wigs to stay in character. A few days ago, her mother noticed several bald spots on the patient’s scalp. The patient does well in school and enjoys rehearsals. She does not use alcohol or illicit drugs. Menarche was at age 13; menstruation occurs every 4-6 weeks and typically lasts 5-7 days. Vital signs are normal. BMI is 22 kg/m². Physical examination shows a 3× 5 cm area of patchy hair loss in the right parietal region surrounded by several areas of uneven hair growth. Eyebrows are sparse. Scalp and skin examination shows no scaling or erythema. Physical examination is otherwise unremarkable. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Alopecia areata"],["B","Androgenetic alopecia"],["C","Discoid lupus erythematosus"],["D","Telogen effluvium"],["E","Tinea capitis"],["F","Traction alopecia"],["G","Trichotillomania"]],"a":"G"},{"id":"2629","b":12,"n":14,"s":[{"p":"A 10-year-old boy is brought to the office due to left knee pain and difficulty walking. His parents say that he developed knee pain several months ago, but it was mild and did not affect his mobility. Over the past week, the patient has had increasing pain that prevents him from playing soccer or basketball. He describes the pain as continuous, nonradiating, and sometimes worse at night. The patient has taken ibuprofen but it has not relieved the pain. He does not recall any preceding trauma. He has had occasional fever over the last month; temperature today is 37.2°C (99°F). The patient has an antalgic gait and favors the right side. The left knee is swollen and erythematous. A tender, immobile mass is palpated above the left knee. Laboratory results are as follows:"},{"ul":["Leukocytes: 14,600/mm³","Erythrocyte sedimentation rate: 40 mm/hr"]},{"p":"X-ray of the knee shows a central lytic lesion in the distal femur with cortical layering, a “moth-eaten” appearance, and extension into the soft tissue. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Ewing sarcoma"],["B","Fibrosarcoma"],["C","Giant cell tumor of bone"],["D","Juvenile idiopathic arthritis"],["E","Multiple myeloma"],["F","Osteoid osteoma"],["G","Unicameral bone cyst"]],"a":"A"},{"id":"15894","b":12,"n":15,"s":[{"p":"An 11-year-old boy is brought to the office by his mother for assessment of behavioral issues. His mother explains that he has “not been himself” since starting middle school a few months ago. The patient has become increasingly argumentative with his parents and becomes irritable with his siblings for no clear reason. He spends most of his time in his bedroom and comes out only to eat dinner, quickly returning to his room after only a few bites. He watches TV late into the night due to restlessness, struggles to fall asleep, and then complains that he is tired the next day. The patient used to regularly attend soccer practice and spend time with friends afterward but recently said that he is “bad at” the sport and wants to quit the team. A teacher has expressed concern that his grades have dropped from a B to a C average, that he is not engaged in class, and that his work has become “sloppy.” When interviewed without his mother present, the patient says, “I just wish people would leave me alone.” The patient does not use alcohol or illicit drugs. Vital signs are normal, and physical examination shows no abnormalities. He makes poor eye contact and fidgets with his clothes. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Adjustment disorder with mixed disturbance of emotions and conduct"],["B","Attention-deficit hyperactivity disorder"],["C","Disruptive mood dysregulation disorder"],["D","Major depressive disorder"],["E","Normal, age-appropriate behavior"],["F","Oppositional defiant disorder"]],"a":"D"},{"id":"4320","b":12,"n":16,"s":[{"p":"A 10-year-old girl is brought to the office by her mother for evaluation of recent behavioral changes. The patient has been sleeping poorly and recently started wetting her bed. Her grades in school have dropped significantly, and she has been notably anxious and sad. The patient’s parents are having financial difficulties and considering divorce. The father drinks alcohol most evenings after coming home from work. The mother appears stressed by her husband’s drinking and is very concerned about her daughter. The physician has known the patient since she was a toddler and found her to be cheerful, lively, and cooperative at her checkup 6 months ago. After the mother leaves the room, the physician asks the patient about school and home, at which point she suddenly bursts into tears. After providing support, which of the following is the best next step in management of this patient?"}],"o":[["A","Ask the patient about physical, emotional, or sexual abuse"],["B","Encourage the mother to attend a support group for family members of alcoholics"],["C","Interview the mother alone"],["D","Reassure patient and mother that this is a normal stress response"],["E","Recommend cognitive-behavioral therapy"],["F","Recommend family therapy"]],"a":"A"},{"id":"3824","b":12,"n":17,"s":[{"p":"A 2-year-old girl is brought to the clinic due to irritability for 2 weeks. She has also had intermittent fevers and poor appetite. The patient has had no cough, rhinorrhea, vomiting, or diarrhea. She has no chronic medical conditions and takes no medications. Her parents have a history of cold sores but have had no recent outbreaks. The family recently went camping but has not traveled internationally. Temperature is 36.7°C (98°F), blood pressure is 90/50 mm Hg, pulse is 104/min, and respirations are 22/min. On examination, the patient is tired-appearing and pale. The right upper eyelid is drooping and the right pupil is constricted. When the patient cries, only the left side of the face appears flushed. Cardiopulmonary examination is unremarkable. The abdomen is soft, nontender, and nondistended with no palpable masses. She has no dysmetria when reaching for objects and has full strength in all extremities. MRI reveals a cervical paravertebral mass. Which of the following is the most likely diagnosis?"}],"o":[["A","Herpes simplex virus infection"],["B","Lyme disease"],["C","Medulloblastoma"],["D","Neuroblastoma"],["E","Pheochromocytoma"],["F","Pilocytic astrocytoma"]],"a":"D"},{"id":"2831","b":12,"n":18,"s":[{"p":"An 8-year-old girl is brought to the office due to a small amount of left-sided ear discharge that has persisted for the last 3 weeks. She was seen twice over the last 2 months and completed 2 courses of antibiotics, but the discharge has persisted. She has no pain or fever but has hearing loss on the left side. The patient has had recurrent ear infections and underwent tympanostomy tube placement at age 2. Immunizations are up to date. Vital signs are normal. Otoscopy reveals some scarring on the left tympanic membrane, with peripheral granulation and some skin debris. Which of the following is the most likely diagnosis?"}],"o":[["A","Cholesteatoma"],["B","Malignant otitis externa"],["C","Meniere disease"],["D","Osteoma"],["E","Otosclerosis"]],"a":"A"},{"id":"4761","b":12,"n":19,"s":[{"p":"A 2-month-old girl is brought to the clinic for a well-child visit. Her parents are concerned about the back of her head being flat on the right. The infant usually sleeps on her back in a crib but she sometimes naps in a car seat or stroller. She is breastfeeding well and receives vitamin D supplementation. Birth history is significant for a full-term cesarean delivery due to breech presentation. Physical examination shows flattening of the right occiput with anterior displacement of the right ear and forehead. The patient demonstrates a preference to tilt her head to the left while rotating the chin to the right. When the head is turned to the right, there is a firm mass in the inferior portion of the left sternocleidomastoid. The mass does not transilluminate. The hips are stable with no clicks or clunks. Which of the following is the most likely underlying cause of this patient’s presentation?"}],"o":[["A","Congenital lymphatic malformation"],["B","Fracture of the clavicle"],["C","Postural deformity of the neck"],["D","Premature closure of a cranial suture"],["E","Tumor of the posterior fossa"]],"a":"C"},{"id":"4891","b":12,"n":20,"s":[{"p":"A 4-year-old boy is brought to the emergency department with fever and neck pain. He has had rhinorrhea, nasal congestion, and a sore throat for the past week. Two days ago, he developed fever and worsening neck pain. Today, the patient has refused to eat or drink. He has no chronic medical conditions and immunizations are current. Temperature is 39.7°C (103.5°F), pulse is 120/min, and respirations are 24/min. On examination, the patient appears tired and uncomfortable. Palpation of the neck reveals bilateral anterior cervical lymphadenopathy. The patient refuses to move his neck; passive extension is painful. His voice is muffled. Mouth opening is limited by pain, and the tonsils appear erythematous and symmetrically enlarged with gray exudates. The uvula is midline. Chest auscultation reveals good bilateral air entry without stridor or rhonchi. Lateral neck radiograph shows widened prevertebral space but no other abnormalities. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Diphtheria"],["B","Epiglottitis"],["C","Meningitis"],["D","Peritonsillar abscess"],["E","Retropharyngeal abscess"],["F","Tracheitis"]],"a":"E"},{"id":"3661","b":12,"n":21,"s":[{"p":"A 15-year-old, previously healthy boy is brought to the office due to progressive muscle weakness. Over the past 2 months, the patient has had increasing difficulty making facial expressions, including smiling and frowning. He has also had difficulty swallowing but has no pain. The patient takes no medications, and vaccinations are up to date. He was adopted as an infant, and his biological family history is unknown. Physical examination shows ptosis, temporal wasting, thin cheeks, and emaciated extremities. Delayed relaxation is noted on contraction of the thenar and hypothenar muscles, which also appear atrophied. Deep tendon reflexes are normal and Babinski sign is absent. Testicular volume is small for age. What is the most likely mode of genetic transmission of this patient’s condition?"}],"o":[["A","Autosomal dominant"],["B","Autosomal recessive"],["C","De novo mutation"],["D","Mitochondrial"],["E","X-linked dominant"]],"a":"A"},{"id":"4497","b":12,"n":22,"s":[{"p":"A 4-month-old boy is brought to the office for follow-up after a recent urgent care visit to evaluate noisy breathing. The noisy breathing began shortly after birth and worsens when he cries or eats. He was given an inhaled bronchodilator and oral corticosteroid but there has been no improvement. The patient is fed cow’s milk-based formula and feeding seems to tire him, so it takes about 40 minutes to finish each bottle. He has normal-appearing stools daily. The patient was born at 37 weeks via spontaneous vaginal delivery. He is at the 20th percentile for height and weight. He attends daycare, his parents are nonsmokers, and they have a cat. The patient is afebrile with normal vital signs. Physical examination shows biphasic stridor that is louder on exhalation. The stridor improves with extension of the neck but does not improve with prone positioning. There is no cough, rhinorrhea, or skin changes. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Airway compression by a vascular ring"],["B","Allergic reaction to cow’s milk"],["C","Aspiration of a foreign body"],["D","Bacterial infection of the epiglottis"],["E","Viral infection leading to subglottic edema"]],"a":"A"},{"id":"8923","b":12,"n":23,"s":[{"p":"A 13-year-old boy is brought to the office by his mother due to behavioral problems at school. The patient started at a new school 2 months ago after his family moved to the area for his father’s job. His teachers report that he is fidgety in the classroom and has difficulty completing assignments on time. His mother states that he has always been a good student, but his grades have been declining over the past year, despite spending 3-4 hours on homework every night. The patient states that assignments have been taking longer to complete because he must rewrite them until his handwriting is “just right.” He worries that if he does not achieve this, his father will lose his job and the family will have to move again. The patient has had no change in sleep or appetite. He does not feel sad or depressed but describes feeling anxious. Physical examination shows no abnormalities, and results of routine laboratory evaluation are within normal range. Which of the following is the most appropriate management for this patient’s condition?"}],"o":[["A","Buspirone"],["B","Dialectical behavior therapy"],["C","Fluoxetine"],["D","Methylphenidate"],["E","Psychodynamic psychotherapy"],["F","Reassurance and close follow-up"]],"a":"C"},{"id":"3785","b":12,"n":24,"s":[{"p":"A 9-month-old boy is brought to the office by his parents due to swelling of the feet and hands for the past day. They first noted the swelling when the patient refused to hold his bottle of morning formula. He has also had poor feeding and fussiness. The patient has had no preceding upper respiratory symptoms and no known sick contacts. He was recently adopted from Nigeria, and his family history is not available. Vaccines are up to date. Temperature is 38.3°C (101°F) and pulse is 150/min. On examination, the dorsal surfaces of the hands and feet on both sides are swollen and tender to palpation. The remainder of the patient’s joints appear normal. He is unable to grasp the examiner’s hands due to restricted range of movement. No rash is seen on skin examination. X-rays of the feet and hands reveal soft tissue swelling. What is the most likely cause of this patient’s presentation?"}],"o":[["A","Autoimmune arthritis"],["B","Hypertrophic osteoarthropathy"],["C","Ischemic necrosis of bone"],["D","Microvascular occlusion"],["E","Salmonella bone infection"],["F","Staphylococcus bone infection"]],"a":"D"},{"id":"3329","b":12,"n":25,"s":[{"p":"A 3-day-old girl is brought to the emergency department due to a day of copious, purulent eye drainage. She was born vaginally to a 31-year-old woman, gravida 3 para 3. The family declined routine prophylactic medications, including vitamin K, erythromycin ointment, and hepatitis B vaccination, for the newborn. The patient was discharged with her parents at 24 hours of life. She has been breastfeeding exclusively and voiding and stooling normally. Temperature is 36.8°C (98.2°F). Examination shows bilateral eyelid edema, conjunctival injection, and purulent discharge. The anterior fontanel is open, soft, and flat. The nares are patent, and the oral mucosa is clear without lesions or thrush. Auscultation reveals clear lungs bilaterally and no murmurs. The abdomen is soft, nontender, and nondistended, and the external genitalia appear normal with no discharge. Which of the following is the most likely diagnosis?"}],"o":[["A","Chemical conjunctivitis"],["B","Chlamydial conjunctivitis"],["C","Dacryostenosis"],["D","Gonococcal conjunctivitis"],["E","Herpes simplex virus conjunctivitis"],["F","Staphylococcus aureus conjunctivitis"]],"a":"D"},{"id":"16615","b":12,"n":26,"s":[{"p":"A newborn boy is being examined in the newborn nursery. He was born at term to a 34-year-old primigravida via spontaneous vaginal delivery. The mother had routine prenatal care with an uneventful pregnancy, and family history is unremarkable. Weight, length, and head circumference are at the 25th percentile. Examination shows an awake newborn with normal tone. The anterior fontanel is open and flat. The ears are in the normal position. Eye examination shows absence of the iris in both eyes. Examination of the oropharynx reveals an intact palate. Cardiopulmonary examination is normal. The abdomen is soft and the liver edge is palpable. Genitourinary examination shows the urethral opening at the ventral side of the penile shaft. The left testis is not palpable but the right testis is present. Examination of the skin and extremities is normal. This patient is at increased risk of developing which of the following disorders?"}],"o":[["A","Acute myeloid leukemia"],["B","Medullary thyroid carcinoma"],["C","Neuroblastoma"],["D","Optic pathway glioma"],["E","Retinoblastoma"],["F","Wilms tumor"]],"a":"F"},{"id":"4734","b":12,"n":27,"s":[{"p":"A 3-day-old girl is in the neonatal intensive care unit due to low birth weight. She was born at 36 weeks gestation to a 25-year-old woman via a precipitous spontaneous vaginal delivery. The patient’s mother received no routine prenatal care. Weight, length, and head circumference are <3rd percentile. Physical examination reveals palpable overriding sutures on the skull. Red reflex is absent bilaterally. A continuous, harsh murmur is best heard over the left upper sternal border. The abdomen is nondistended and nontender. The liver and spleen are enlarged. Tone is normal, and Moro reflex and palmar grasp reflex are intact. The patient did not pass the newborn hearing screen. Which of the following maternal factors is most commonly associated with this patient’s presentation?"}],"o":[["A","Chronic exposure to cat feces"],["B","Daily alcohol consumption"],["C","Exposure to a sexually transmitted disease"],["D","Ingestion of unpasteurized dairy products"],["E","Lack of childhood vaccination"]],"a":"E"},{"id":"3721","b":12,"n":28,"s":[{"p":"A 2-day-old boy is evaluated in the newborn nursery for jaundice. He was born to a 24-year-old primigravid woman who is in good health. The mother consumed a well-balanced diet and took prenatal vitamins throughout the pregnancy. The infant is breastfeeding poorly, with a weak latch and suck. On examination, the patient has jaundice, scleral icterus, a large tongue, and a hoarse cry. His tone is normal but his activity is decreased. Laboratory results are as follows:"},{"ul":["Total bilirubin: 15.3 mg/dL","Direct bilirubin: 0.7 mg/dL","TSH: 110 μU/mL","Thyroxine (T4), serum: 0.6 μg/dL"]},{"p":"Which of the following is the most likely cause of this infant’s condition?"}],"o":[["A","Defective synthesis of thyroxine"],["B","Iodine deficiency (endemic goiter)"],["C","Panhypopituitarism"],["D","Thyroid dysgenesis"],["E","Transplacental TSH-receptor antibody"]],"a":"D"},{"id":"3266","b":12,"n":29,"s":[{"p":"A 16-year-old girl is brought to the emergency department with rash and joint pain. A pink rash developed on her face yesterday and has spread to her chest, back, and extremities this morning. She also awoke today with pain in her fingers and wrists. The patient feels tired and has had a fever but no neck stiffness, nausea, or vomiting. She is sexually active with a male partner and uses condoms inconsistently. She has received no vaccinations. Temperature is 38.2°C (100.8°F), blood pressure is 118/76 mm Hg, pulse is 86/min, and respirations are 14/min. Physical examination shows a well-appearing and well-hydrated girl. There is a blanching, erythematous maculopapular rash on the face, chest, back, and extremities that spares the palms and soles. Posterior auricular and suboccipital lymphadenopathy is present. The oropharynx is clear. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Epstein-Barr virus"],["B","Measles virus"],["C","Neisseria gonorrhoeae"],["D","Rubella virus"],["E","Treponema pallidum"],["F","Varicella-zoster virus"]],"a":"D"},{"id":"3905","b":12,"n":30,"s":[{"p":"An 18-year-old man comes to the office due to an irritating, dry cough. He developed symptoms approximately 3 weeks ago after returning from a Caribbean cruise with his family. The patient visited several islands during the trip and participated in many activities, including hiking and water sports. He initially had clear rhinorrhea for a week, followed by a dry cough that lasted a week. This week, the coughing episodes have worsened, now occur without warning, and have twice caused vomiting. The patient has no chronic medical conditions and last received routine childhood vaccinations at age 11. Vital signs are normal. Examination shows nasal congestion. The lungs are clear to auscultation. There is bilateral muscle tenderness between the ribs. The lymph nodes and spleen are not enlarged. Which of the following risk factors is most associated with this patient’s diagnosis?"}],"o":[["A","Exposure to exotic bird species"],["B","Poorly maintained air conditioning systems"],["C","Swimming in contaminated water"],["D","Unprotected sexual activity"],["E","Waning acquired immunity"]],"a":"E"},{"id":"2421","b":12,"n":31,"s":[{"p":"A 15-year-old girl comes to the emergency department due to nausea and lower abdominal pain. The pain began yesterday but has become more severe over the past 12 hours. The patient describes the pain as “crampy” with periodic sharp and stabbing sensations. She has no appetite and vomited twice this morning. Her last bowel movement 3 days ago was firm and nonbloody. The patient also started having vaginal spotting today. She normally has menstrual cramping but not usually this severe. She has no medical history other than an episode of abnormal vaginal discharge 3 months ago that self-resolved. Menarche occurred at age 13, and the patient’s menstrual periods are irregular. Temperature is 36.7°C (98°F), blood pressure is 110/60 mm Hg, and pulse is 78/min. Examination shows tenderness to palpation in the left lower quadrant of the abdomen. Which of the following is the most likely explanation for this patient’s condition?"}],"o":[["A","Ascending upper genital tract infection involving the hepatic capsule"],["B","Developing blastocyst implanted in an extrauterine location"],["C","Granulomatous inflammation of discontinuous small intestine segments"],["D","Inflammation of a sac-like protrusion of the colonic wall"],["E","Peritoneal irritation from follicular fluid released during ovulation"],["F","Telescoping of a proximal portion of intestine into a more distal portion"]],"a":"B"},{"id":"3443","b":12,"n":32,"s":[{"p":"A 9-year-old girl is brought to the emergency department due to sudden onset of uncontrollable, continuous writhing of the arms and hands and grimacing of the face. A month ago, she had a sore throat and fever that resolved after a few days without treatment. The girl and her family recently returned to the United States after living in Honduras for a year. The patient takes no daily medications and her vaccinations are current. Vital signs are normal. On examination, the patient has multiple dental caries, and the oropharynx is nonerythematous and without exudate or tonsillar enlargement. Cardiac examination reveals a pericardial friction rub. Laboratory studies show an erythrocyte sedimentation rate of 65 mm/h. ECG shows a prolonged PR interval and diffuse ST elevations. Infection with which of the following organisms is the most likely cause of this patient’s symptoms?"}],"o":[["A","Coxsackievirus"],["B","Cytomegalovirus"],["C","Parvovirus B19"],["D","Streptococcus mutans"],["E","Streptococcus pyogenes"],["F","Trypanosoma cruzi"]],"a":"E"},{"id":"3442","b":12,"n":33,"s":[{"p":"A one-year-old girl is brought to the emergency department (ED) by her mother due to a one-day history of fever and drowsiness. The child has been irritable since yesterday. On examination, she is hypothermic, lethargic and has nuchal rigidity. She flexes her hips when her neck is flexed. She appears septic, and large petechial and purpuric lesions are developing on her body. In the ED, she suddenly becomes hypotensive. Despite aggressive fluid and antibiotic resuscitation, the child dies. What will most likely be revealed as the cause of death during the autopsy of this child?"}],"o":[["A","Myocarditis and heart failure"],["B","Acute respiratory distress syndrome"],["C","Bone marrow failure"],["D","Adrenal gland failure"],["E","Acute renal failure"],["F","Thyroid gland destruction"],["G","Fulminant hepatic failure"]],"a":"D"},{"id":"3711","b":12,"n":34,"s":[{"p":"A 4-year-old boy is brought to clinic for evaluation of crossed eyes. The mother noticed that the patient’s left eye has been very slightly deviated toward the nose over the last few months. The patient has no chronic medical conditions and takes no medications. Vaccinations are up to date. Visual acuity screen reveals 20/20 and 20/50 in the right and left eyes, respectively. Corneal light reflex is central in the right eye and temporal in the left eye. When the right eye is covered, the left eye shifts fixation from a nasal to temporal direction. When the left eye is covered, the right eye remains in midline position. Red reflex is more intense in the left eye. Dilated funduscopic examination is normal bilaterally. In addition to corrective lenses, which of the following is the best next step in management of this patient?"}],"o":[["A","Latanoprost drops to the left eye"],["B","Latanoprost drops to the right eye"],["C","No additional intervention indicated"],["D","Patching of the left eye"],["E","Patching of the right eye"]],"a":"E"},{"id":"4832","b":12,"n":35,"s":[{"p":"A 7-year-old boy is brought to the emergency department due to right leg pain. His mother says that he was running around the house and fell on the carpet an hour ago. The patient has been crying and experiencing thigh pain since the fall. He did not hit his head or lose consciousness. Medical history is notable for 3 fractures after seemingly minor injuries. Temperature is 36.7°C (98°F), blood pressure is 100/60 mm Hg, pulse is 148/min, and respirations are 20/min. On physical examination, the patient is crying but is alert and cooperative. His teeth appear translucent and gray but he otherwise appears well-kept. There is hyperlaxity of the joints of the hands, and upper extremity strength is 5/5 bilaterally. The right thigh is markedly tender to palpation with obvious deformity. X-ray demonstrates fracture of the proximal femur and does not involve the growth plate, which appears normal. Which of the following is most likely diagnosis in this patient?"}],"o":[["A","Child abuse"],["B","Duchenne muscular dystrophy"],["C","Ehlers-Danlos syndrome"],["D","Osteogenesis imperfecta"],["E","Paget disease of bone"],["F","Rickets"]],"a":"D"},{"id":"15406","b":12,"n":36,"s":[{"p":"A 3-year-old boy is brought to the clinic due to decreased energy and yellow skin. The patient first became ill 2 days ago when he developed a runny nose and cough. Yesterday, he had abdominal pain with nausea, but he has not had vomiting or diarrhea. The mother also noticed yellowing of the patient’s eyes and skin, and this morning he did not want to play or eat. Medical history includes similar yellowing of the skin after birth that required phototherapy. Otherwise, he has been healthy. Several members of his family had similar intermittent episodes of skin yellowing during childhood, and 2 relatives underwent splenectomies in adulthood. The patient takes no medications. Physical examination shows a tired-appearing toddler with mild jaundice. Eye examination shows mild scleral icterus. The abdomen is soft and tender in the left upper quadrant. The spleen is 4 cm below the costal margin. The remainder of the examination shows no abnormalities. Laboratory results are as follows:"},{"ul":["Hemoglobin: 8.6 g/dL","Platelets: 160,000/mm³","Leukocytes: 7,000/mm³"]},{"p":"Additional evaluation of this patient would most likely reveal which of the following laboratory findings?"}],"o":[["A","Reticulocyte count: High | Direct Coombs: Negative | Mean corpuscular hemoglobin concentration: High"],["B","Reticulocyte count: High | Direct Coombs: Negative | Mean corpuscular hemoglobin concentration: Low"],["C","Reticulocyte count: High | Direct Coombs: Positive | Mean corpuscular hemoglobin concentration: Normal"],["D","Reticulocyte count: Low | Direct Coombs: Negative | Mean corpuscular hemoglobin concentration: High"],["E","Reticulocyte count: Low | Direct Coombs: Negative | Mean corpuscular hemoglobin concentration: Normal"]],"a":"A"},{"id":"16721","b":12,"n":37,"s":[{"p":"A 16-year-old girl is brought to the office for evaluation of hyperglycemia. A week ago, the patient was seen at an urgent care clinic due to vaginal discharge and dysuria. She was diagnosed with candidal vulvovaginitis, and her urine dipstick was positive for glucose and negative for ketones. Finger-stick blood glucose was 200 mg/dL and a subsequent hemoglobin A1c level was 7.6%. The patient has been excessively thirsty over the past several weeks but has had no abdominal pain, nausea, or vomiting. She has no previous medical conditions and takes no medications. Family history is significant for diabetes mellitus and hypertension in both parents. Vital signs are within normal limits and BMI is at the 95th percentile for her age. Which of the following findings is most likely to be observed in this patient?"}],"o":[["A","Bitemporal hemianopia"],["B","Elevated fecal fat levels"],["C","Extensive acanthosis nigricans"],["D","Glucokinase gene mutation"],["E","Pancreatic autoantibodies"]],"a":"C"},{"id":"15567","b":12,"n":38,"s":[{"p":"A 17-year-old boy with chronic immune thrombocytopenia (ITP) comes to the clinic for follow-up. The patient was initially diagnosed with ITP over a year ago when he developed prolonged epistaxis after colliding with another player during a soccer game. This past school year the patient has been unable to participate in sports due to frequent episodes of mucosal bleeding after mild trauma warranting pharmacologic intervention. He has received treatment with multiple medications, including intravenous immunoglobulin and prednisone. His response to treatment has been transient, with platelet counts that have decreased rapidly to the 10,000/mm³ range at follow-up visits. Physical examination shows diffuse petechiae and a few areas of ecchymosis along the thighs but is otherwise normal. Laboratory results are as follows:"},{"ul":["Hemoglobin: 13.0 g/dL","Platelets: 10,000/mm³","Leukocytes: 7,500/mm³","Neutrophils: 57%","Eosinophils: 3%","Lymphocytes: 33%","Monocytes: 7%","ABO blood group antigen, Rh(D) antigen: negative","Direct antibody testing (Coombs): negative"]},{"p":"Workup for autoimmune disorders and chronic viral infections is negative. Bone marrow evaluation reveals a normocellular marrow with slightly increased megakaryocytes. Which of the following is the best next step in management of this patient?"}],"o":[["A","Anti-D immune globulin"],["B","Desmopressin"],["C","Epoetin alfa"],["D","Granulocyte colony-stimulating factor"],["E","Scheduled platelet transfusion"],["F","Splenectomy"]],"a":"F"},{"id":"3949","b":13,"n":1,"s":[{"p":"A 17-year-old man comes to the emergency department and complains of intense left flank pain that radiates to the groin. He refers to his symptom as “stone passage,” which he has experienced “so many times since childhood.” His uncle has the same problem. Urinalysis shows hexagonal crystals. The urinary cyanide nitroprusside test is positive. Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Amino acid transport abnormality"],["B","Parathyroid adenoma"],["C","Abnormality of uric acid metabolism"],["D","Excessive intestinal reabsorption of oxalate"],["E","Infection"]],"a":"A"},{"id":"3554","b":13,"n":2,"s":[{"p":"A 5-year-old boy is brought to the emergency department by his parents for difficulty walking. The patient has had pain in his legs since the morning and “wouldn’t even get out of bed.” The father says that his son played 2 soccer games yesterday with no pain or trauma. One week ago, the patient had a low-grade fever and cough that have since resolved. Review of systems is positive for a nonpruritic rash on his back and legs for the past 2 days that the parents attribute to a new laundry detergent. He has had no nausea, emesis, weight loss, or night sweats. The patient has no significant medical history and takes no daily medications. Temperature is 36.7°C (98°F), blood pressure is 90/40 mm Hg, pulse is 138/min and respirations are 20/min. Physical examination shows an uncomfortable-appearing boy lying in bed who cries with any attempt to move his legs. A purplish, nonblanching rash is noted over his buttocks and posterior thighs. Abdominal examination is soft with active bowel sounds and mild diffuse tenderness to palpation without rebound or guarding. Lower extremity joints demonstrate no deformity, erythema, swelling, or warmth. The patient refuses to walk due to pain in his legs. Laboratory results from urinalysis are as follows:"},{"ul":["Specific gravity: 1.016"]},{"ul":["pH: 7.0"]},{"ul":["Protein: trace"]},{"ul":["Blood: large"]},{"ul":["Glucose: negative"]},{"ul":["Ketones: negative"]},{"ul":["Leukocyte esterase: negative"]},{"ul":["Nitrites: negative"]},{"p":"The patient is admitted to the hospital for further management. Which of the following complications of the underlying disease is he most likely to develop?"}],"o":[["A","Hemolytic anemia"],["B","Intussusception"],["C","Joint destruction"],["D","Urethritis"],["E","Uveitis"],["F","Volvulus"]],"a":"B"},{"id":"2485","b":13,"n":3,"s":[{"p":"A 5-hour-old girl is evaluated in the newborn nursery due to “crying a lot.” She was born at 40 weeks gestation by vacuum-assisted vaginal delivery to a mother with gestational diabetes mellitus. The delivery was complicated by a prolonged second stage of labor due to difficulty in delivering the shoulders. Estimated fetal weight on prenatal ultrasound was 4 kg (8.8 lb). The patient’s birth weight was 4.6 kg (10 lb). Physical examination shows a small area of scalp edema that does not cross suture lines. Palpation of the left clavicular bone reveals crepitus. Passive movement of the left upper extremity elicits crying. Moro reflex is decreased on the left. Bilateral extremities are neurovascularly intact. Which of the following is the best next step in management of this patient?"}],"o":[["A","Administer aspirin for analgesia"],["B","Closed reduction using traction"],["C","Figure-of-8 splint placement"],["D","Open reduction and internal fixation"],["E","Reassurance and gentle handling"]],"a":"E"},{"id":"3282","b":13,"n":4,"s":[{"p":"A 6-day-old girl is seen in the newborn unit for persistent jaundice. She was born at 39 weeks gestation to a primigravid 17-year-old woman with O+ blood type, who had an unremarkable pregnancy and normal prenatal laboratory results. On the first day of life, the infant developed jaundice on the face that has now spread to below the umbilicus and to the palms. Phototherapy was initiated, but repeated attempts at stopping therapy have resulted in rebound hyperbilirubinemia. The infant is feeding well, has normal urine output, and is passing soft, yellow stool. Temperature is 36.7°C (98°F). Vital signs are normal. On examination, the patient is asleep but easily aroused. The sclerae are icteric. The abdomen is soft and nontender, the liver is nonpalpable, and the spleen is enlarged. The skin shows generalized jaundice. Laboratory results at 24 hours of life showed hemoglobin of 15.7 g/dL, total bilirubin of 13 mg/dL, and direct bilirubin of 0.2 mg/dL. Current laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Leukocytes: 10,000/mm³ (9,400-34,000/mm³)"]},{"ul":["Hemoglobin: 12 g/dL (14.5-22.5 g/dL)"]},{"ul":["Mean corpuscular volume: 98 μm³ (95-121 μm³)"]},{"ul":["Mean corpuscular hemoglobin concentration: 42% Hb/cell (29%-37% Hb/cell)"]},{"ul":["Platelets: 230,000/mm³"]},{"ul":["Red cell distribution width: 18% (11.5%-14.5%)"]},{"ul":["Reticulocytes: 6% (1.8%-4.6%)"]},{"p":"Hematology"},{"ul":["Blood type: A+"]},{"ul":["Direct Coombs test: negative"]},{"p":"Which of the following is the most likely cause of this patient’s anemia?"}],"o":[["A","Autoantibody-mediated hemolysis"],["B","Decrease in alpha-globin chain production"],["C","Defect of the red blood cell membrane"],["D","Deficiency in erythrocyte glycolytic enzyme"],["E","Impairment of beta-globin chain production"],["F","Incompatibility in maternal-fetal blood types"],["G","Limited intestinal absorption of folic acid"]],"a":"C"},{"id":"4064","b":13,"n":5,"s":[{"p":"A 12-year-old boy is brought to the office by his parents due to progressive back pain. The pain began several months ago in the central low back during sports practice. Over the last month, the pain has persisted after other activities and occasionally radiates to the patient’s buttocks and legs. Neither acetaminophen nor ibuprofen has significantly improved the pain. The patient has had no fever, rash, or other joint pain. He participates in golf and competitive diving. Medical history is unremarkable. His mother and maternal aunt have rheumatoid arthritis. Temperature is 36.7°C (98°F), blood pressure is 110/65 mm Hg, pulse is 80/min, and respirations are 16/min. Physical examination reveals a palpable step-off in the lumbosacral area. The pain is reproducible with lumbar extension; lumbar flexion is painless. Straight-leg raising test is normal bilaterally. Gait is normal. Which of the following is the most likely diagnosis?"}],"o":[["A","Ankylosing spondylitis"],["B","Epidural abscess"],["C","Lumbar disc herniation"],["D","Lumbosacral strain"],["E","Metastatic tumor"],["F","Spondylolisthesis"],["G","Vertebral compression fracture"]],"a":"F"},{"id":"3079","b":13,"n":6,"s":[{"p":"A 4-year-old girl is brought to the emergency department due to 9 days of fever of at least 39°C (102.2°F) each day. Over the past few days, she has developed a rash that started on her trunk and spread to her extremities. Her family has also noticed that the patient is “much crankier than normal.” She has had no cough, rhinorrhea, or emesis. Six weeks ago, the patient completed a 10-day course of amoxicillin for streptococcal pharyngitis. She has no medical conditions, has received no vaccines, and takes no daily medications. Temperature is 39.4°C (103°F), blood pressure is 90/60 mm Hg, and pulse is 135/min. On physical examination, the patient is irritable and crying but becomes calm when held by her mother. Bilateral conjunctivae are injected. A 1.7-cm, tender, mobile anterior cervical lymph node is palpated. Cardiac examination reveals a regular rhythm with mild tachycardia and no murmurs, rubs, or gallops. The trunk and extremities have a blanching maculopapular eruption; the hands and feet are erythematous and edematous. An image of the patient’s mouth is shown in the exhibit (strawberry tongue). The posterior pharynx is mildly injected without exudates or tonsillar hypertrophy. Which of the following is the best next step in evaluation of this patient?"}],"o":[["A","Adenovirus PCR of nasopharynx"],["B","Echocardiogram"],["C","Lymph node biopsy"],["D","Reassurance and close follow-up"],["E","Serum measles IgM antibody"],["F","Throat culture"]],"a":"B"},{"id":"2473","b":13,"n":7,"s":[{"p":"A 30-minute-old boy is in the neonatal intensive care unit with central cyanosis. He was born at 28 weeks gestation by vaginal delivery to a 16-year-old girl. The pregnancy was complicated by premature labor, and the mother received glucocorticoids and magnesium sulfate shortly after the onset of labor. Membranes ruptured spontaneously 6 hours prior to delivery; amniotic fluid was clear. The boy initially emerged vigorous with spontaneous respirations but rapidly developed respiratory distress. Birth weight was 1 kg (2 lb  4 oz). His temperature is 36°C (96.8°F) under radiant heat, blood pressure is 65/35 mm Hg, pulse is 140/min, and respirations are 70/min. Pulse oximetry showed 75% on room air and improves to 90% with 35% FiO₂ by continuous positive air pressure ventilation. Physical examination shows grunting, intercostal and subcostal retractions, nasal flaring, and shallow respirations. Bilateral breath sounds are diminished. A chest x-ray shows diffuse, fine, reticular granularity and perihilar linear opacities bilaterally. What is the most likely diagnosis in this patient?"}],"o":[["A","Congenital diaphragmatic hernia"],["B","D-transposition of the great arteries"],["C","Meconium aspiration syndrome"],["D","Persistent pulmonary hypertension"],["E","Respiratory distress syndrome"],["F","Transient tachypnea of the newborn"]],"a":"E"},{"id":"3200","b":13,"n":8,"s":[{"p":"A 1-year-old boy is brought to the clinic for evaluation of easy bruising, nosebleeds, and decreased activity over the past week. The patient had a fever and a rash 6 weeks ago and was diagnosed with a viral exanthem. His fever resolved after several days and the rash was gone in 2 weeks. The patient has no chronic medical conditions. He eats mostly fruit and vegetables, and drinks 480 mL (16 oz) of cow’s milk daily. On examination, he is well-developed, anicteric, and pale. Cardiac examination reveals tachycardia; a grade 1/6 systolic ejection murmur is noted. The abdomen is soft, nontender, and without hepatosplenomegaly. The skin has multiple ecchymoses over the left shoulder and bilateral lower extremities and many petechiae in the groin. Complete blood count results are as follows:"},{"ul":["Hemoglobin: 7.9 g/dL"]},{"ul":["Platelets: 12,000/mm³"]},{"ul":["Leukocytes: 3,000/mm³"]},{"ul":["Reticulocytes: 0.5%"]},{"p":"Bone marrow biopsy results are shown in the exhibit (hypocellular marrow with fat). Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acquired aplastic anemia"],["B","Acute lymphocytic leukemia"],["C","Diamond-Blackfan anemia"],["D","Fanconi anemia"],["E","Transient erythroblastopenia"],["F","Vitamin B₁₂ deficiency"]],"a":"A"},{"id":"4049","b":13,"n":9,"s":[{"p":"A 13-year-old girl comes to the office for a routine well-child visit. She reports skin lesions on her trunk that are not painful or pruritic but have increased in size and number over the past few years. She has no chronic medical problems and takes no medications. Vital signs are within normal limits. Physical examination reveals several large, uniformly pigmented, macular skin lesions. Her eye examination is shown in the image (Lisch nodules). This patient is at greatest risk of developing which of the following?"}],"o":[["A","Acute hepatic failure"],["B","Acute lymphoblastic leukemia"],["C","Nerve sheath tumors"],["D","Renal angiomyolipoma"],["E","Retinal hemangioblastoma"]],"a":"C"},{"id":"3286","b":13,"n":10,"s":[{"p":"A 6-year-old boy is brought to the office with a 10-day history of thick and persistent nasal discharge, nasal congestion, and cough. He has had no associated vomiting, headache, or earache. The patient has mild, persistent asthma for which he uses an inhaled corticosteroid. Temperature is 37.2°C (98.9°F), pulse is 90/min, and respirations are 15/min. Physical examination reveals yellow mucus dripping in the posterior nasopharynx. Tympanic membranes are clear bilaterally. Nasal turbinates are red and swollen. Maxillary sinuses are tender to palpation. Heart sounds are normal and the lungs are clear to auscultation bilaterally. Skin examination shows no rashes. Which of the following organisms is the most likely cause of this patient’s condition?"}],"o":[["A","Aspergillus fumigatus"],["B","Nontypeable Haemophilus influenzae"],["C","Pseudomonas aeruginosa"],["D","Rhizopus arrhizus"],["E","Staphylococcus aureus"],["F","Streptococcus pyogenes"]],"a":"B"},{"id":"2280","b":13,"n":11,"s":[{"p":"An 8-year-old boy is brought to the emergency department due to a staring episode this evening. While eating dinner, the parents first noticed the patient’s head tilt to the right, followed by right arm twitching. The patient then began chewing his lips and picking at his shirt while staring straight ahead. He did not respond to his name or to touch. The episode lasted for 2-3 minutes, and the patient seemed confused and tired afterward. He had no incontinence during the event but was unable to move his right arm for 5-10 minutes afterward. The patient has no other medical conditions or allergies. He was previously doing well in school, but his grades have declined over the past few months, and his teacher has noted that he seems intermittently distracted. Vital signs are normal. Physical examination shows an awake and alert child. Cranial nerves are intact, and reflexes are 2+. Romberg test is negative. An interictal electroencephalogram is normal and does not change with hyperventilation. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Absence seizure"],["B","Focal seizure"],["C","Juvenile myoclonic epilepsy"],["D","Lennox-Gastaut syndrome"],["E","Tic disorder"]],"a":"B"},{"id":"17298","b":13,"n":12,"s":[{"p":"A 10-year-old boy is brought to the emergency department due to penile pain. Two hours earlier, he was practicing martial arts with his older brother when he was accidentally kicked directly in the groin. The patient had severe pain at the time of impact and continues to have moderate pain but no nausea or vomiting. Temperature is 36.7°C (98.1°F), blood pressure is 118/62 mm Hg, and pulse is 88/min. The pelvis is stable and nontender to downward pressure. The medial thighs and perineum appear normal. The dorsal aspect of the penis has moderate bruising and swelling. There is a small contusion on the left hemiscrotum. Bilateral testes are nontender to palpation, have normal contours, and retract with stroking of the medial thighs. The patient gives a urine sample, which is pinkish red. Which of the following is the best next step in management of this patient?"}],"o":[["A","CT scan of the abdomen and pelvis"],["B","Examination of the prostate"],["C","Foley catheterization"],["D","Oral analgesics and outpatient follow-up"],["E","Retrograde urethrography"],["F","Testicular ultrasound"]],"a":"E"},{"id":"3005","b":13,"n":13,"s":[{"p":"A 7-year-old boy is brought to the emergency department due to fever and right leg pain. The patient’s symptoms began 3 days ago, when his parents noticed him limping. He had mild right lower leg pain at that time, but subsequently developed fever, fatigue, and decreased appetite 2 days ago. The patient’s pain is currently 7 on a scale of 0-10 in severity, is nonradiating, and is unrelieved by ibuprofen, heat, or rest. He has no history of trauma and is otherwise healthy. Immunizations are up to date. The patient’s second cousin has sickle cell disease. Current temperature is 39.4°C (102.9°F), blood pressure is 100/70 mm Hg, pulse is 138/min, and respirations are 22/min. Examination of the right leg shows bony point tenderness, erythema, and warmth over the proximal tibia. Blood is drawn for culture. Which of the following organisms will most likely be isolated from this patient’s blood?"}],"o":[["A","Escherichia coli"],["B","Pseudomonas aeruginosa"],["C","Salmonella species"],["D","Staphylococcus aureus"],["E","Staphylococcus epidermidis"],["F","Streptococcus agalactiae"],["G","Streptococcus pyogenes"]],"a":"D"},{"id":"2452","b":13,"n":14,"s":[{"p":"A 10-hour-old boy in the newborn nursery has bilious emesis. He was born at 38 weeks gestation by vaginal delivery to a primigravid 39-year-old woman who received no prenatal care. The patient has voided once but has not yet passed meconium. Physical examination shows a hypotonic neonate with a flat face, prominent tongue, low-set ears, and slanted palpebral fissures. The hands are short with incurved fifth fingers, and a large space is present between bilateral first and second toes. The abdomen is soft and without distension, guarding, or rigidity. Auscultation reveals a loud holosystolic murmur most prominent at the left lower sternal border with a precordial thrill. A nasogastric tube is placed, and abdominal x-ray is shown in the exhibit (double bubble sign). In addition to echocardiogram, which of the following is the best next step in this patient?"}],"o":[["A","Barium enema"],["B","Karyotype"],["C","Pyloric ultrasound"],["D","Rectal biopsy"],["E","Surgical repair"],["F","Sweat test"],["G","Upper gastrointestinal series"]],"a":"E"},{"id":"15725","b":13,"n":15,"s":[{"p":"A 12-year-old boy is brought to the office for fever. Two weeks ago, he developed rhinorrhea, sore throat, and cough. For the past 2 days, the patient has had a fever and progressively worsening pain behind his eyes that radiates to his right forehead. He woke early this morning and vomited twice. He has had no diarrhea. The patient has no chronic medical conditions and takes no daily medications. Temperature is 39.7°C (103.5°F), blood pressure is 134/86 mm Hg, pulse is 116/min, and respirations are 26/min. The patient appears drowsy and uncomfortable. Examination shows copious green nasal discharge from the right naris. Palpation of the right forehead elicits tenderness. Oropharyngeal examination shows erythema along the posterior oropharynx with purulent drainage. The neurologic examination is nonfocal. Which of the following is the best next step in management?"}],"o":[["A","CT scan of the head"],["B","Lumbar puncture"],["C","Nasopharyngeal culture"],["D","NSAIDs and reassurance"],["E","Oral antibiotic therapy"]],"a":"A"},{"id":"3642","b":13,"n":16,"s":[{"p":"A 4-year-old boy is brought to the office due to a rash. Four days ago, the patient developed a localized rash consisting of a few small, round spots on his left foot. Over the next 2 days, some of the spots developed into pustules, and the affected area appeared slightly moist. The rash is mildly itchy and painful. His sister, with whom he shares a room, has also developed a few small, round spots on her hands. The patient has atopic dermatitis and intermittent asthma, for which he uses over-the-counter emollients and albuterol as needed, respectively. Vital signs are normal. Physical examination shows 5-7 small papules and pustules on the left dorsal foot. Some lesions are covered with a transparent, yellow crusting. There is no induration or streaking erythema. The rest of the examination is normal. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Oral acyclovir"],["B","Oral amoxicillin"],["C","Topical hydrocortisone"],["D","Topical ketoconazole"],["E","Topical mupirocin"],["F","Topical permethrin"]],"a":"E"},{"id":"3553","b":13,"n":17,"s":[{"p":"A 13-day-old full-term girl is brought to the physician during winter with a runny nose, cough, and fussiness over the past 2 days. Her birth history is unremarkable and she has been feeding and growing well. The girl has a sibling in day care, where other children have been ill. Her temperature is 37.8°C (100°F), respirations are 70/min, and pulse oximetry is 95% on room air. Examination shows a crying infant with clear rhinorrhea and bilateral wheezes and crackles. Which of the following complications is this patient at greatest risk of developing?"}],"o":[["A","Apnea"],["B","Bacteremia"],["C","Bacterial pneumonia"],["D","Fungal pneumonia"],["E","Lymphoma"]],"a":"A"},{"id":"4926","b":13,"n":18,"s":[{"p":"A 2-month-old full-term girl is brought to the office for a well-baby visit. She drinks 5 oz of a standard cow milk protein-based formula every 4 hours. Her parents are concerned as she regurgitates a small amount of formula after each feed. The patient is “fussy” when the formula spills out of her nose but then calms down after burping. She has no coughing, gagging, or breathing difficulties. Her weight, height, and head circumference have been tracking along the 25th percentile since birth. Physical examination reveals intermittent smiling and cooing. The patient is able to lift her head briefly to 30 degrees while prone. Her lungs are clear to auscultation. The abdomen is soft, nontender, and nondistended. Which of the following is the best next step in management of this infant?"}],"o":[["A","Initiate proton-pump inhibitor therapy"],["B","Obtain abdominal ultrasound"],["C","Provide reassurance"],["D","Recommend sleeping in the prone position"],["E","Switch to a hydrolyzed formula"],["F","Switch to goat milk"],["G","Thicken formula with oatmeal"]],"a":"C"},{"id":"16341","b":13,"n":19,"s":[{"p":"A 6-year-old girl is brought to the clinic for evaluation of knee pain. The patient first had soreness in her right knee 4 days ago, after her first gymnastics class. Her mother gave her acetaminophen and massaged her knee, but this did not help. The patient also developed a limp over the past 2 days. She has no chronic medical conditions and does not take daily medications. Height is at the 50th percentile and weight is at the 75th percentile. Temperature is 37.9°C (100.2°F). When walking, she limits weight-bearing on her right side. When supine, the right hip is held flexed with the knee pointed laterally. There is limited internal rotation and extension of the right hip. The right knee has full range of motion and there is no tenderness on palpation around the knee. Laboratory evaluation shows leukocyte count of 11,500/mm³ and C-reactive protein of 8 mg/L (normal: <10). Ultrasound of the hips shows small, bilateral effusions. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Juvenile idiopathic arthritis"],["B","Osgood-Schlatter disease"],["C","Septic arthritis"],["D","Slipped capital femoral epiphysis"],["E","Transient synovitis"]],"a":"E"},{"id":"3288","b":13,"n":20,"s":[{"p":"A 2-year-old boy is brought to the emergency department by his babysitter due to noisy breathing. The patient has had rhinorrhea, congestion, and a cough for 2 days. The cough worsened last night when he developed a high-pitched noise during inspiration that worsens when he cries. Earlier today, the patient was playing in the same room as his 6-year-old brother, who also has cold symptoms. He has no chronic medical conditions. The babysitter is unsure of the patient’s immunization status. Temperature is 38°C (100.4°F), pulse is 140/min, and respirations are 44/min. Pulse oximetry is 96% on room air. On examination, the patient is alert with mild suprasternal retractions and a harsh, dry cough. The pharynx is mildly erythematous without tonsillar enlargement or asymmetry. The lungs are clear on auscultation. Which of the following is the most likely diagnosis?"}],"o":[["A","Bacterial tracheitis"],["B","Bronchiolitis"],["C","Croup"],["D","Epiglottitis"],["E","Foreign body aspiration"],["F","Laryngomalacia"]],"a":"C"},{"id":"12357","b":13,"n":21,"s":[{"p":"An 11-year-old boy is brought to the office by his parents due to a pruritic skin rash for 2 weeks. The rash started on his hands and subsequently spread to the trunk and lower extremities. His mother reports that the patient is constantly scratching the rash and his sleep is now disturbed due to intense pruritus. A cousin who recently visited and shared a room with him had similar symptoms. The patient has had no fever and is up to date with routine vaccinations. Physical examination shows numerous 2- to  3-mm erythematous papules and vesicles with excoriation on his neck, hands, feet, and waistline. His chest and proximal arms and legs are unaffected. Which of the following is the most appropriate initial intervention in management of this patient?"}],"o":[["A","No intervention necessary"],["B","Oral acyclovir"],["C","Oral clindamycin"],["D","Topical clotrimazole"],["E","Topical hydrocortisone"],["F","Topical permethrin"]],"a":"F"},{"id":"3459","b":13,"n":22,"s":[{"p":"An 8-year-old boy is brought to the emergency department with 2 days of rhinorrhea, congestion, cough, and wheezing that worsened acutely prior to arrival at the hospital. In the emergency department, he receives nebulized albuterol and ipratropium, intravenous corticosteroids, and intravenous magnesium sulfate. Due to lack of significant improvement in symptoms, the patient is admitted to the intensive care unit and started on continuous nebulized albuterol and intravenous terbutaline. Due to persistent respiratory distress and poor oxygenation, bilevel positive airway pressure is started on hospital day 2. After 2 hours of therapy, pulse oximetry shows 89% on 60% fraction of inspired oxygen, and the patient becomes agitated. There is diminished air entry on chest auscultation and no wheezing is heard. Arterial blood gas results are as follows:"},{"ul":["pH: 7.22"]},{"ul":["PaO₂: 50 mm Hg"]},{"ul":["PaCO₂: 62 mm Hg"]},{"p":"What is the best next step in management of this patient?"}],"o":[["A","Continue bilevel positive airway pressure with close observation"],["B","Endotracheal intubation"],["C","Nebulized racemic epinephrine"],["D","Needle thoracostomy"],["E","Tracheostomy"]],"a":"B"},{"id":"4872","b":13,"n":23,"s":[{"p":"A previously healthy 15-month-old girl is brought to the emergency department by her parents for evaluation of an episode of unresponsiveness. The girl was playing with her toys and, as the father removed them to prepare for bedtime, she began crying incessantly. The girl then emitted a long, drawn-out cry, turned “blue,” and went limp and unresponsive for “a few seconds.” After this episode, she was alert and acted like her usual self. The patient takes no medications and her vaccinations are up to date. She is at the 40th percentile for weight, length, and head circumference. Vital signs and physical examination are unremarkable. This patient’s diagnosis is most likely associated with which of the following?"}],"o":[["A","Arrhythmia"],["B","Epilepsy"],["C","Normal development"],["D","Orthostatic hypotension"],["E","Structural heart disease"],["F","Vitamin B₁₂ deficiency"]],"a":"C"},{"id":"16847","b":13,"n":24,"s":[{"p":"A 16-year-old girl comes to the office due to a skin condition. For the last 3 years, she has had small “pimples” on the posterior surface of her upper arms. The lesions are associated with mild pruritus during the winter months but are otherwise asymptomatic, and the patient is primarily concerned due to their appearance when she wears short-sleeved tops. Medical history is unremarkable, and the patient takes no medications. Examination findings are as shown in the exhibit. Which of the following is the most likely diagnosis of this patient’s skin condition?"}],"o":[["A","Folliculitis"],["B","Keratosis pilaris"],["C","Miliaria"],["D","Pseudofolliculitis"],["E","Rosacea"]],"a":"B"},{"id":"3552","b":13,"n":25,"s":[{"p":"A 3-year-old boy is brought to the clinic for evaluation of red-tinged urine, which his mother noticed earlier this week. The patient has had multiple episodes since but has no associated dysuria. He has had no prior injury but was recently treated with antibiotics for streptococcal pharyngitis. The patient has no chronic medical conditions and has reached all developmental milestones. Temperature is 36.7°C (98.1°F). Examination shows a well-appearing and well-nourished boy. There is a firm, nontender, palpable mass in the left abdomen. Urinalysis reveals:"},{"ul":["Blood: 2+"]},{"ul":["Glucose: negative"]},{"ul":["Protein: negative"]},{"ul":["Bacteria: none"]},{"ul":["Red blood cells: 30/hpf"]},{"ul":["White blood cells: 1/hpf"]},{"p":"Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","IgA nephropathy"],["B","Nephrolithiasis"],["C","Neuroblastoma"],["D","Poststreptococcal glomerulonephritis"],["E","Renal cell carcinoma"],["F","Wilms tumor (nephroblastoma)"]],"a":"F"},{"id":"15922","b":13,"n":26,"s":[{"p":"A 4-year-old boy is brought to the clinic for evaluation of scrotal swelling. His mother first noticed swelling near his right testicle after giving him a bath 2 days ago. It has not been painful, and the patient has had no difficulty urinating. Neither the mother nor the patient recalls specific trauma to the area. The patient is otherwise healthy and takes no medications. Temperature is 37.1°C (98.8°F). Initial blood pressure is 160/96 mm Hg; a repeat assessment is 158/92 mm Hg. Physical examination shows an alert child who is active and cooperative. The abdomen is nontender, and bowel sounds are present. Genitourinary examination reveals Tanner stage 1 development with bilateral testicles within the scrotum. There is a palpable, nontender, soft, coiled mass superior to the right testicle. When a light is placed at the base of the scrotum, the mass does not transilluminate. In addition, the mass does not decrease in size when the patient is supine. Urinalysis reveals no blood, nitrites, or leukocyte esterase. Which of the following is the best next step in management of this patient?"}],"o":[["A","Biopsy of the scrotal mass"],["B","Reassurance and observation only"],["C","Surgical orchiectomy"],["D","Ultrasound of the abdomen"],["E","Urine culture"]],"a":"D"},{"id":"12495","b":13,"n":27,"s":[{"p":"A 16-year-old girl is evaluated for fatigue over the past 6 months. Over the past 2 years, the patient has had intermittent pain in her arms and legs that was attributed to “growing pains.” She has not had any fever, cough, vomiting, diarrhea, weight loss, or depressed mood. The patient has no significant medical history and does not take any medications. Her developmental milestones were achieved on time, and she performs well in school. She was adopted at age 3, and her family history is unknown. On examination, the patient appears comfortable and in no distress. Temperature is 36.7°C (98.1°F), blood pressure is 110/70 mm Hg, pulse is 78/min, and respirations are 14/min. Height and weight are at the 5th percentile for age. There are no rashes, enlarged lymph nodes, or jaundice. There is no nasal congestion; tympanic membranes and pharynx are normal. Cardiac examination shows a normal S1 and S2 without murmurs. The lungs are clear without wheezing and rales. The abdomen is soft and nontender, with the liver palpable 4 cm below the right costal margin and the spleen palpable 10 cm below the left costal margin. Pubic hair and breast development is Tanner stage 1. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hemoglobin: 8.6 g/dL"]},{"ul":["Hematocrit: 28%"]},{"ul":["Platelets: 78,000/mm³"]},{"ul":["Leukocytes: 8,200/mm³"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute lymphocytic leukemia"],["B","Anorexia nervosa"],["C","Fanconi anemia"],["D","Gaucher disease"],["E","Parvovirus infection"],["F","Turner syndrome"],["G","Wilson disease"]],"a":"D"},{"id":"12341","b":13,"n":28,"s":[{"p":"A newborn boy is evaluated in the nursery an hour after delivery. The infant was born via vaginal delivery to a 20-year-old primigravid mother who had routine prenatal care. The pregnancy was complicated by mild gestational hypertension without preeclampsia. The mother developed a fever 2 days ago and a vesicular rash on her face yesterday. On the day of delivery, the rash spread to her chest and abdomen and became intensely pruritic. She went into labor later that day and delivered the infant without difficulty. Skin-to-skin contact between the mother and infant was deferred due to the maternal rash. Apgar scores were 8 and 9 at 1 and 5 minutes, respectively. The boy weighs 2.95 kg (6 lb  8 oz). Vital signs and physical examination are normal. The mother does not recall having similar symptoms previously, but the father had a similar rash during his childhood. Which of the following is the most appropriate management of this infant?"}],"o":[["A","Active immunization with live attenuated virus"],["B","Close observation and follow-up"],["C","Passive immunization with monoclonal antibody"],["D","Test for presence of protective antibody"],["E","Treatment with antiviral therapy"],["F","Viral culture at age 24 hours"]],"a":"C"},{"id":"17088","b":13,"n":29,"s":[{"p":"A 9-year-old boy is brought to the clinic due to poor academic performance. The patient receives special needs education, including speech therapy. His teachers have had difficulty keeping his attention in class, and his grades are declining. Over the last few weeks, the patient has been falling asleep at his desk. He watches television in the evenings until bedtime at 9 PM and wakes at 7 AM every day. He feels tired most days and is occasionally sad because his parents recently divorced. Blood pressure is 104/70 mm Hg and respirations are 26/min. Weight and height are at the 50th and 20th percentile, respectively. Tonsils are 1+. Cardiopulmonary examination is normal. The patient has difficulty opening his hands after squeezing the examiner’s fingers. There is full range of motion in the bilateral extremities. Which of the following is the most likely explanation for this patient’s clinical presentation?"}],"o":[["A","Absence seizures"],["B","Adjustment disorder"],["C","Cerebral palsy"],["D","Myotonic dystrophy"],["E","Narcolepsy"],["F","Poor sleep hygiene"]],"a":"D"},{"id":"8820","b":13,"n":30,"s":[{"p":"A newborn boy is undergoing examination in the delivery room immediately following birth. He was born via spontaneous vaginal delivery at 39 weeks gestation to a primigravid 15-year-old adolescent. Delivery was complicated by meconium-stained amniotic fluid. The mother received prenatal care and had an uncomplicated pregnancy. At 5 minutes of life, the patient’s heart rate is 120/min and respiratory rate is 50/min. He is flexing his extremities, and he moves and cries vigorously in response to stimulation. The patient has cyanosis of the hands, feet, and circumoral area; the remainder of his skin is pink. Which of the following interventions is indicated during this patient’s hospital stay?"}],"o":[["A","Chest x-ray"],["B","Echocardiogram"],["C","Electrocardiogram"],["D","Hyperoxia test"],["E","Pulse oximetry"]],"a":"E"},{"id":"3665","b":13,"n":31,"s":[{"p":"A 10-year-old boy is brought to the clinic due to headache, vomiting, and visual disturbances. The patient has had 2 weeks of persistent headache; he was given over-the-counter analgesics but had no relief. He has also had daily episodes of nonbloody, nonbilious emesis. Neurologic examination shows bilateral retraction of the upper eyelids and limitation of upward gaze with a preference for downward gaze. Pupils react sluggishly to light but respond appropriately to accommodation. Strength, sensation, and deep tendon reflexes are normal. Gait is normal. Plantar reflexes are downgoing bilaterally. Which of the following lesions is most likely responsible for this patient’s symptoms?"}],"o":[["A","Craniopharyngioma"],["B","Medulloblastoma"],["C","Neuroblastoma"],["D","Pinealoma"],["E","Retinoblastoma"]],"a":"D"},{"id":"2906","b":13,"n":32,"s":[{"p":"A 6-hour-old boy is being evaluated in the nursery. He was born at 39 weeks gestation via spontaneous vaginal delivery to a 33-year-old primigravida. The pregnancy was complicated by intravenous drug use, and the mother was incarcerated for 2 months during the second trimester. First trimester serologies, including RPR, HIV antibodies, and hepatitis B surface antigen (HBsAg), were negative. Due to the mother’s risk profile, follow-up testing was obtained during the third trimester and revealed the following:"},{"ul":["HBsAg: Positive"]},{"ul":["Anti-HBsAg: Negative"]},{"ul":["IgM Anti-HBcAg: Negative"]},{"ul":["Anti-HBcAg: Positive"]},{"p":"Liver function testing was normal. Hepatitis C and repeat HIV testing were negative. The remainder of the pregnancy was uncomplicated. The infant weighs 3.7 kg (8 lb  3 oz). Physical examination of the infant is normal. There is no jaundice or hepatomegaly. Which of the following is the most appropriate next step in management of this infant?"}],"o":[["A","Administer hepatitis B immune globulin"],["B","Administer hepatitis B immune globulin and vaccine"],["C","Administer hepatitis B vaccine"],["D","Obtain hepatitis B antibody panel"],["E","Obtain liver function testing"],["F","Restrict breastfeeding"]],"a":"B"},{"id":"3396","b":13,"n":33,"s":[{"p":"A 2-month-old boy is brought to the emergency department by ambulance after a seizure. His mother says that he rolled off the bed last night while his older sister was changing his clothes and that he cried for a few minutes but fed well last night. Today, the patient had a tonic-clonic seizure that lasted 4 minutes after his morning feeding. He has been otherwise healthy. The patient was born at 31 weeks gestation, and his postnatal course was complicated by respiratory distress and hypoxia requiring intubation for several days. Height and weight are at the 50th percentile; head circumference is at the 98th percentile. Temperature is 36.7°C (98°F), blood pressure is 90/50 mm Hg, and pulse is 144/min. Physical examination shows a limp infant who withdraws from painful stimuli. The anterior fontanelle is full and tense. Funduscopy reveals bilateral papilledema and retinal hemorrhages. The abdomen is soft with no hepatosplenomegaly. Which of the following is the most likely etiology of this patient’s seizure?"}],"o":[["A","Cerebrospinal fluid obstruction"],["B","Electrolyte abnormality"],["C","Hypoxic encephalopathy"],["D","Meningeal inflammation"],["E","Subdural venous shearing"],["F","Thromboembolism formation"]],"a":"E"},{"id":"14717","b":13,"n":34,"s":[{"p":"An 18-month-old girl is brought to the office by her parents due to difficulty breathing. The patient has had a runny nose and congestion since yesterday. Coughing started last night and has worsened throughout the day. The patient is drinking fluids and voiding is normal. She was hospitalized at age 4 months for bronchiolitis and had a recent urgent care visit after putting a bead in her nose. The patient takes no daily medications and vaccinations are up to date. Temperature is 37.8°C (100°F), blood pressure is 90/60 mm Hg, and respirations are 30/min. Pulse oximetry is 97% on room air. During examination, the patient coughs and cries but is easily consoled. The cough is harsh, and inspiratory stridor is heard when she is crying but resolves at rest. The lungs are clear to auscultation. Which of the following is the most likely cause of the patient’s symptoms?"}],"o":[["A","Bronchoconstriction and small airway inflammation"],["B","Edema and narrowing of the proximal trachea"],["C","Edema of the epiglottis and aryepiglottic folds"],["D","Foreign body obstruction within the bronchus"],["E","Vascular ring malformation within the larynx"]],"a":"B"},{"id":"3910","b":13,"n":35,"s":[{"p":"A 6-year-old boy with congenital deafness is brought to the emergency department after fainting. He was running with friends in his backyard when he suddenly dropped to the ground. He regained consciousness quickly and without confusion. Review of systems is negative for shaking movements, tongue-biting, or urinary incontinence. He has no history of similar episodes. The boy has met all developmental milestones and takes no medications. His past medical history is significant for bilateral cochlear implantation at age 2 for sensorineural hearing loss. He had a brother who drowned suddenly at age 7. Blood pressure is 110/70 mm Hg and heart rate is 70/min and regular. Physical examination is unremarkable. Serum chemistry is normal. Electrocardiogram is obtained. Which of the following therapies is most appropriate for this patient?"}],"o":[["A","Ethosuximide"],["B","Levetiracetam"],["C","Propranolol and pacemaker"],["D","Quinidine"],["E","Sotalol"],["F","Verapamil"]],"a":"C"},{"id":"2783","b":13,"n":36,"s":[{"p":"An 11-month-old girl is brought to the office due to a rash. The patient has had a low-grade fever for the past 3 days that has been controlled with acetaminophen. She developed a rash on her face 2 days ago that has since spread to her chest, abdomen, and extremities. The patient has had no cough, rhinorrhea, nasal congestion, vomiting, or diarrhea. She has otherwise been healthy. The patient has received all routine, age-appropriate vaccinations and takes no medications. Temperature is 38°C (100.4°F), blood pressure is 100/50 mm Hg, pulse is 88/min, and respirations are 18/min. Physical examination shows a playful infant with small, tender lymph nodes in the suboccipital, posterior auricular, and posterior cervical areas. There is patchy erythema on the soft palate. The rash is shown in the image. A similar-appearing rash is present on the face. The remainder of the examination is normal. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Erythema infectiosum"],["B","Kawasaki disease"],["C","Measles"],["D","Rubella"],["E","Scarlet fever"]],"a":"D"},{"id":"4183","b":13,"n":37,"s":[{"p":"A 52-hour-old girl in the newborn nursery develops vomiting and abdominal distension. She was delivered at 40 weeks gestation to a 30-year-old woman by cesarean section for failure to progress. Apgar scores were 8 and 9 at 1 and 5 minutes, respectively. The patient has been voiding appropriately but has not yet passed meconium. Today, she has spit up all feeds and now has bilious emesis. Her abdomen is tense and distended. Rectal examination shows no stool in the rectal vault and normal tone. Feeds are held and a nasogastric tube is placed for decompression. Upright abdominal radiograph shows multiple dilated loops of small bowel with paucity of air in the large intestine and rectum. Left lateral decubitus view shows free air above the liver, and an emergency laparotomy is performed. Viscous meconium is irrigated and evacuated, primarily from the ileum with some from the colon. The colon is found to be diffusely narrow. Which comorbidity of her underlying condition will this patient most likely develop?"}],"o":[["A","Chronic rhinosinusitis"],["B","Early-onset Alzheimer disease"],["C","Hypothyroidism"],["D","Infertility"],["E","Sensorineural hearing loss"]],"a":"A"},{"id":"3875","b":13,"n":38,"s":[{"p":"A 6-year-old girl is brought to the office for evaluation of breast and pubic hair development. Her parents noticed that she started developing breasts several months ago, and she recently started growing coarse axillary and pubic hair. The patient has had no changes in her behavior or school performance. She has no headaches, visual changes, vomiting, or vaginal bleeding. The patient has no chronic medical conditions and no previous surgery. She takes no daily medications and has no known allergies. BMI is at the 50th percentile for age. Physical examination reveals axillary hair; pubic hair is Tanner stage 3, and breasts are Tanner stage 3. The remainder of the examination is unremarkable. Bone age is consistent with age 8. Basal LH level is high. Which of the following is the best next step in evaluation of this patient?"}],"o":[["A","Adrenal CT scan"],["B","Dexamethasone suppression test"],["C","Karyotype analysis"],["D","MRI of the brain"],["E","Pelvic ultrasound"],["F","Reassurance and follow-up in 6 months"]],"a":"D"},{"id":"3640","b":13,"n":39,"s":[{"p":"A 3-year-old boy with sickle cell anemia is brought to the emergency department due to fever. He has chills but no bone pain, cough, or difficulty breathing. The patient’s medical history includes hospitalization as an infant for dactylitis and again last summer for splenic sequestra
