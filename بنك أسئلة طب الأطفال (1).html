tion crisis. Other than ibuprofen and acetaminophen for fever and pain, he takes no medications regularly and his vaccinations are current. Temperature is 39.5°C (103.2°F), blood pressure is 78/40 mm Hg, pulse is 140/min, and respiratory rate is 22/min. Physical examination shows a lethargic boy with mild pallor. Laboratory results are as follows:"},{"ul":["Hematocrit: 24%"]},{"ul":["Platelets: 325,000/mm³"]},{"ul":["Leukocytes: 18,800/mm³"]},{"ul":["Neutrophils: 80%"]},{"ul":["Bands: 13%"]},{"p":"Blood culture is pending. Which of the following organisms is the most likely cause of this patient’s condition?"}],"o":[["A","Haemophilus influenzae type B"],["B","Neisseria meningitidis"],["C","Pseudomonas aeruginosa"],["D","Salmonella enteritidis"],["E","Staphylococcus aureus"],["F","Streptococcus pneumoniae"]],"a":"F"},{"id":"4858","b":13,"n":40,"s":[{"p":"A previously healthy 1-year-old girl is brought in for a routine evaluation. She drinks 6 glasses of whole milk a day but is a very picky eater. The girl is otherwise developmentally appropriate. She lives with her parents and pet dog in a house built in 2008. The patient’s height and weight are at the 50th percentile for her age and sex. Temperature is 37°C (98.6°F), pulse is 118/min, and respirations are 21/min. Her physical examination is unremarkable. Complete blood count results are as follows:"},{"ul":["Hemoglobin: 10.5 g/dL"]},{"ul":["Hematocrit: 34%"]},{"ul":["Mean corpuscular volume: 70 μm³"]},{"ul":["Red blood cells: 2 million cells/mm³"]},{"ul":["Reticulocytes: 0.8%"]},{"ul":["Platelets: 250,000/mm³"]},{"ul":["Leukocytes: 6,500/mm³"]},{"p":"Which of the following is the most appropriate next step in management of this child?"}],"o":[["A","Blood transfusion"],["B","Colonoscopy"],["C","Hemoglobin electrophoresis"],["D","Oral iron therapy"],["E","Serum creatinine"]],"a":"D"},{"id":"3630","b":14,"n":1,"s":[{"p":"A 9-year-old boy is brought to the emergency department due to lower extremity weakness and pain. The patient first noticed soreness in his legs yesterday and had difficulty standing this morning. He has a tingling sensation in his toes and fingers as well as lower back pain. Temperature is 37.2°C (98.9°F), blood pressure is 105/70 mm Hg, and pulse is 40/min. The patient is alert and responds appropriately. Heart and lung examinations are normal aside from bradycardia. The lower back pain is nonreproducible with palpation of the spinous processes or paraspinal muscles. Neurologic examination shows decreased strength and diminished reflexes in both lower extremities. There is pain and mildly decreased sensation with pinprick testing. Which of the following is most associated with this patient’s underlying diagnosis?"}],"o":[["A","Birth records concerning for perinatal asphyxia"],["B","Family history of muscular dystrophy"],["C","History of seizure disorder"],["D","Incomplete vaccination history"],["E","Living in a homeless shelter"],["F","Recent diarrheal illness"]],"a":"F"},{"id":"18554","b":14,"n":2,"s":[{"p":"An 8-year-old boy is brought to the office due to a 2-month history of excessive urination. The parents report that the boy is sometimes irritable and restless and has been drinking excessive amounts of water. He has had normal growth with achievement of all expected milestones and takes no medications. The patient’s maternal grandfather tends to drink excess amounts of water. Vital signs reveal tachycardia. On physical examination, mucous membranes are dry. Neurologic examination shows no focal deficits. Laboratory results on a random blood sample are as follows:"},{"ul":["Sodium: 143 mEq/L","Potassium: 4.2 mEq/L","Chloride: 100 mEq/L","Bicarbonate: 24 mEq/L","Blood urea nitrogen: 30 mg/dL","Creatinine: 1.0 mg/dL","Calcium: 9.2 mg/dL","Glucose: 100 mg/dL","Urinalysis Specific gravity: 1.001","Urinalysis Protein: none","Urinalysis Blood: negative","Urinalysis Glucose: negative","Urinalysis Ketones: negative","Urinalysis Nitrites: negative","Urinalysis Bacteria: none","Urinalysis White blood cells: 1-2/hpf"]},{"p":"Urine osmolality is 120 mOsm/kg H₂O. Which of the following is the most appropriate next step in management?"}],"o":[["A","Chest x-ray"],["B","Fractional excretion of sodium"],["C","MRI of the brain"],["D","Oral glucose tolerance test"],["E","Renal ultrasound"],["F","Water deprivation test"]],"a":"F"},{"id":"4671","b":14,"n":3,"s":[{"p":"A 16-year-old boy comes to the emergency department due to a dirt bike collision. Trauma evaluation reveals a femur fracture, and the patient undergoes open reduction and internal fixation. He receives a packed red blood cell transfusion postoperatively. Five minutes after the transfusion begins, the patient acutely develops chills and severe flank pain. Temperature is 39.1°C (102.4°F), blood pressure is 88/40 mm Hg, pulse is 130/min, and respirations are 30/min. Physical examination shows bleeding around the intravenous catheter site. Breath sounds are normal. Which of the following is the most likely cause of this patient’s transfusion reaction?"}],"o":[["A","ABO incompatibility"],["B","Anamnestic antibody response"],["C","Bacterial contamination of the blood product"],["D","Cytokine release from the transfused blood product"],["E","Preformed antibodies against IgA"]],"a":"A"},{"id":"18164","b":14,"n":4,"s":[{"p":"A 2-year-old girl is brought to the office due to drainage from the left ear. The patient has been irritable over the past few days, and this morning, her mother noticed foul-smelling drainage on her pillow. Three weeks ago, the patient was treated with amoxicillin for an episode of acute otitis media. Temperature is 37.9°C (100.2°F); all other vital signs are normal. On examination, the left external ear is unremarkable except for some dried, crusted drainage at the entrance of the external canal. Otoscopic examination reveals a perforated, erythematous left tympanic membrane with a small amount of purulent drainage. Which of the following is the most appropriate pharmacotherapy for this patient?"}],"o":[["A","Amoxicillin-clavulanate"],["B","Azithromycin"],["C","Ciprofloxacin"],["D","Fluconazole"],["E","Trimethoprim-sulfamethoxazole"],["F","Vancomycin"]],"a":"A"},{"id":"17427","b":14,"n":5,"s":[{"p":"An 8-year-old boy is brought to the emergency department due to neck swelling and fever. He first developed left-sided neck swelling 2 days ago. Over the last 24 hours, the area has become significantly larger, and the patient cries if the area is touched. He developed fever this morning but has otherwise been well. Temperature is 38.9°C (102°F). Physical examination shows a red, tender, and fluctuant anterior cervical mass approximately 4 cm in diameter in the left anterior lymph node chain. Incision and drainage are performed, and the patient is admitted to the hospital for intravenous antibiotic therapy. Anaerobic bacteria are cultured from the aspirated purulent fluid. Which of the following risk factors most likely contributed to this patient’s condition?"}],"o":[["A","Exposure to rabbits"],["B","Incomplete immunizations"],["C","Inhalation of infectious respiratory droplets"],["D","Poor dental hygiene"],["E","Recent scratches by a kitten"],["F","Rose gardening"]],"a":"D"},{"id":"17494","b":14,"n":6,"s":[{"p":"A 5-year-old girl is brought to the clinic due to abdominal cramping and diarrhea. The diarrhea started 3 days ago and was initially watery but now contains visible mucus. The patient attends a small day care where several other children have recently developed similar diarrhea. Temperature is 38.3°C (101°F), blood pressure is 100/62 mm Hg, and pulse is 98/min. On examination, she appears uncomfortable but is appropriately answering questions and is interactive. The mouth is slightly dry. Heart and lung examinations are normal. The abdomen is diffusely tender to palpation without hepatosplenomegaly. A stool sample is positive for occult blood, and a stool culture is also obtained. The patient tolerates fluids she receives in the office. In addition to encouraging increased fluid intake, which of the following is the most appropriate management of this patient?"}],"o":[["A","Abdominal ultrasound"],["B","Air contrast enema"],["C","Antibiotic therapy"],["D","Bismuth subsalicylate"],["E","Close follow-up only"],["F","Loperamide"]],"a":"E"},{"id":"17488","b":14,"n":7,"s":[{"p":"A 6-month-old girl is brought to the emergency department due to cough, congestion, and increased work of breathing over the past 2 days. The patient has been very fussy and has a decreased appetite. For the last week, her parents and 5-year-old brother have had congestion and rhinorrhea without high fevers or myalgias. Her brother’s school has reported many sick children over the past winter. Temperature is 37.6°C (99.7°F) and respirations are 65/min. On examination, the patient is fussy and tachypneic with nasal flaring and subcostal retractions. Lung examination reveals a prolonged expiratory phase with diffuse crackles and end-expiratory wheezing. Which of the following is the best next step in management of this patient’s condition?"}],"o":[["A","Antibiotics"],["B","Glucocorticoids"],["C","Loop diuretics"],["D","Racemic epinephrine"],["E","Supportive care only"]],"a":"E"},{"id":"18465","b":14,"n":8,"s":[{"p":"An 18-year-old man is brought to the emergency department following a generalized tonic-clonic seizure. He developed full body jerking at home this morning, which lasted approximately 1 minute. The episode occurred just before the patient was about to visit the clinic for evaluation of a worsening headache for the past 2 days. His parents say that he has also seemed clumsy over the same period, including tripping a few times yesterday. He has no history of seizures and was previously healthy except for seasonal allergies managed with over-the-counter medications. Temperature is 38.9°C (102°F), blood pressure is 130/80 mm Hg, and pulse is 92/min. The patient is awake but oriented only to person. Pupillary examination is unremarkable. The patient has bilateral hyperreflexia in the upper and lower extremities. MRI of the brain is shown (demonstrates temporal lobe edema/abnormalities). Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","Drug-induced encephalopathy"],["B","Herpes simplex virus encephalitis"],["C","Medulloblastoma"],["D","Reye syndrome"],["E","Subacute sclerosing panencephalitis"]],"a":"B"},{"id":"17184","b":14,"n":9,"s":[{"p":"A 2-year-old boy is brought to the office for a health supervision visit. His mother has noticed that the patient looks cross-eyed at times, but she otherwise has no concerns. The patient was born at full term without pregnancy complications. He has no medical conditions, but family history is significant for glaucoma in his father. Examination shows the right eye is mildly deviated toward the nose, and pupillary red reflexes are asymmetric. There is no proptosis, and extraocular movements are intact and nonpainful. Which of the following is the best next step in management of this patient?"}],"o":[["A","Dilated funduscopic examination"],["B","Fluorescein examination of the eye"],["C","Intraocular pressure measurement"],["D","MRI of the brain with gadolinium"],["E","Visual evoked potential testing"]],"a":"A"},{"id":"18284","b":14,"n":10,"s":[{"p":"A 16-year-old previously healthy boy is brought to the emergency department 30 minutes after a head injury. He was playing football when he had a helmet-to-helmet impact with another player. The patient was dazed and disoriented for several minutes after the incident but did not lose consciousness. He stumbled and fell after getting up. The patient is now awake and alert and reports mild headache but no nausea, vision changes, or other subjective neurologic deficits. Vital signs are within normal limits. On physical examination, he appears tired. There is no obvious head deformity. The pupils are equal and reactive, and there is no facial droop. Bilateral upper and lower extremity muscle strength, deep tendon reflexes, and sensation are normal. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Disruption of white matter tracts"],["B","Fracture of bone at the base of the skull"],["C","Neuronal functional disturbance"],["D","Rupture of the middle meningeal artery"],["E","Tearing of the bridging veins"]],"a":"C"},{"id":"17967","b":14,"n":11,"s":[{"p":"An 8-year-old girl is brought to the office due to enuresis. Although she has been toilet-trained since age 3, she has been wetting the bed most nights for the past 6 months. The patient has had no episodes of daytime incontinence. She goes to sleep easily at night in her own room. Her mother reports that she moves around a lot when sleeping and snores loudly. The patient is often tired after coming home from school and naps for 2 hours most afternoons. On examination, tympanic membranes are clear. The nasal septum is straight, and there is no rhinorrhea; there is tonsillar hypertrophy. There is no cervical adenopathy. The lungs are clear to auscultation and heart sounds are normal. Urinalysis is unremarkable. The patient is at greatest risk for which of the following complications?"}],"o":[["A","Aspiration pneumonia"],["B","Internuclear ophthalmoplegia"],["C","Ketoacidosis"],["D","Pyelonephritis"],["E","Systemic hypertension"]],"a":"E"},{"id":"18664","b":14,"n":12,"s":[{"p":"A 4-month-old boy is brought to clinic by his mother for routine follow-up. He was last seen at his 2-month checkup. The mother reports that the patient continues to feed well but has noticed that his head is larger than other infants'. He can roll from front to back, sit straight when propped, and hold his head steady without support. The patient can bring objects to his mouth and make babbling sounds. The patient was born at 37 weeks gestation and adopted at birth. Temperature is 37.2°C (99°F), pulse is 130/min, and respirations are 30/min. Examination shows a symmetrical head with an open and soft fontanelle. Pupils are equal and reactive, and extraocular movements are intact. Eyes and ears are in the normal positions. The neck is supple. Abdominal and skin examination is unremarkable. Extremities appear normal. Growth charts are shown in the exhibit (head circumference tracking steadily just above the 98th percentile; length and weight tracking normally). Head ultrasound shows normal ventricles and brain parenchyma. Which of the following is the best next step in management of this patient?"}],"o":[["A","Cranial molding helmet"],["B","Karyotype analysis"],["C","Lumbar puncture for opening pressure"],["D","MRI of the brain"],["E","Reassurance and continued observation"]],"a":"E"},{"id":"14172","b":14,"n":13,"s":[{"p":"A 13-month-old boy is brought to the emergency department by his aunt due to leg pain. He was dropped off at her house this morning by the mother and since then has cried whenever his left leg is touched, refuses to stand up, and has been irritable. Treatment with acetaminophen has not provided any relief. According to the aunt, the patient was born at home, and his mother received no prenatal care during her pregnancy. He was breastfed exclusively until age 6 months. The patient has had no routine health care and takes no daily medications or supplements. The toddler’s father is unknown; his mother had a forearm and wrist fracture as a child. Weight is at the 5th percentile and height is at the 50th percentile. On physical examination, the left distal thigh has mild swelling and point tenderness. The skin has no bruising, but beefy erythematous plaques with satellite papules are present in the diaper area. X-ray of the left thigh reveals a medial metaphyseal corner fracture of the distal femur. Which of the following is the most likely cause of this patient’s x-ray findings?"}],"o":[["A","Child abuse"],["B","Congenital syphilis"],["C","Langerhans cell histiocytosis"],["D","Osteogenesis imperfecta"],["E","Rickets"]],"a":"A"},{"id":"18175","b":14,"n":14,"s":[{"p":"An 18-month-old boy is brought to the clinic because he has been pulling on his ears. Two weeks ago, the patient was taken to an urgent care center for fever and irritability and was found to have acute otitis media of the right ear. He completed the prescribed course of amoxicillin, with resolution of symptoms. However, for the past few days, the patient has been tugging at both of his ears, and his parents are concerned that he may have another ear infection. Temperature is 36.8°C (98.2°F). On otoscopic examination, air-fluid levels are visible posterior to both tympanic membranes, which appear translucent and gray. Pneumatic insufflation demonstrates reduced mobility of tympanic membranes bilaterally. Both external ear canals are clear. The remainder of the examination is unremarkable. Which of the following is the best next step in management of this patient?"}],"o":[["A","Additional antibiotic course"],["B","Glucocorticoid therapy"],["C","Intranasal decongestant"],["D","Observation and follow up"],["E","Tympanostomy tube placement"]],"a":"D"},{"id":"18897","b":14,"n":15,"s":[{"p":"A 16-year-old girl is brought to clinic for vision follow-up. The patient has myopia that was diagnosed at age 8. She wears corrective lenses, and her prescription has progressed yearly. The patient has no other chronic medical conditions and takes no daily medications. Vital signs are normal. Examination shows equal pupillary reflexes. Visual acuity is 20/50 bilaterally with current lenses. Refraction testing results in a lens prescription of -9 diopters sphere in the right eye and -8.75 diopters sphere in the left eye. This patient is at increased risk for which of the following complications?"}],"o":[["A","Anterior chamber hemorrhage"],["B","Anterior uveitis"],["C","Pterygium development"],["D","Retinal detachment"],["E","Retinal microinfarctions"]],"a":"D"},{"id":"17857","b":14,"n":16,"s":[{"p":"A 3-year-old boy is brought to the emergency department after swallowing a battery. About an hour ago, his father was changing his watch battery when the patient grabbed and swallowed it and then coughed for several minutes. Since then, he has been able to drink and talk normally. Vital signs are normal. The patient appears alert and comfortable. He is not drooling, and the posterior oropharynx is clear. The lungs are clear to auscultation bilaterally. Cardiac examination is unremarkable. The abdomen is soft and nontender. Chest x-ray on anteroposterior view shows a radiopaque, circular object with a halo sign. The lateral view is shown (demonstrates a button battery in the esophagus with a step-off/beveled edge). Which of the following is the best next step in management of this patient?"}],"o":[["A","Barium contrast study"],["B","Blind sweep for object"],["C","Bronchoscopy"],["D","Observation and repeat x-ray in 24 hours"],["E","Upper gastrointestinal endoscopy"]],"a":"E"},{"id":"14272","b":14,"n":17,"s":[{"p":"A 6-year-old boy is brought to the office by his mother due to noisy breathing. Approximately 6 months ago, his older brother asked to be moved to a different room because the patient’s noisy breathing was keeping him up at night; his mother reports that it sounds like he gasps for air while sleeping. During the day, the patient breathes through his mouth and eats and drinks without gagging or choking. He is able to keep up with his peers during outdoor play. The patient takes no medications and is up to date with vaccinations. He lives with his mother, father, older brother, and the family cat. No one in the household smokes. Height is at the 40th percentile and weight is at the 25th percentile. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Allergic rhinitis"],["B","Asthma"],["C","Choanal atresia"],["D","Laryngomalacia"],["E","Obstructive sleep apnea"],["F","Vascular ring"]],"a":"E"},{"id":"17637","b":14,"n":18,"s":[{"p":"A 5-year-old boy is brought to the clinic for follow-up of abdominal pain and diarrhea. Four days prior, he was evaluated at the onset of low-grade fever and mucus-filled diarrhea, and a stool culture was obtained. The parents were instructed to increase the patient’s fluid intake and return in a few days. Since that time, his fevers have resolved, but he continues to have 5-6 episodes of watery, mucus-filled diarrhea daily. The patient has no chronic medical conditions. Temperature is 37.2°C (99°F) and blood pressure is 98/50 mm Hg. Mucous membranes are moist. Heart and lung examinations are normal. The abdomen is mildly distended and diffusely tender to deep palpation without hepatosplenomegaly or masses. Hemoccult testing is negative. Stool culture reveals a large growth of Campylobacter coli with the following susceptibilities:"},{"ul":["Ciprofloxacin: resistant","Ampicillin: sensitive","Erythromycin: intermediate","Tetracycline: sensitive"]},{"p":"Which of the following is the most appropriate treatment for this patient’s condition?"}],"o":[["A","Amoxicillin"],["B","Azithromycin"],["C","Doxycycline"],["D","Levofloxacin"],["E","Symptomatic care only"]],"a":"E"},{"id":"18456","b":14,"n":19,"s":[{"p":"A 17-year-old girl is brought to the clinic due to headaches and daytime sleepiness. Six weeks ago, the patient was involved in a motor vehicle collision. She was driving her car when she was hit by another car on the passenger side. The patient hit her head on the window and briefly lost consciousness. She was taken to the emergency department, where CT scan of the head was normal. The patient was diagnosed with a concussion and discharged. She rested at home for 2 days before returning to school. The patient has been eager to participate in class but has a dull headache when reading. The headache is worsened with loud noises. She also has felt sleepy in class and has had difficulty falling asleep at night. The patient has no medical conditions and takes no medications. Temperature is 37.3°C (99.1°F), blood pressure is 115/75 mm Hg, and pulse is 70/min. Pupils are equal and reactive. Cranial nerves II-XII are grossly intact. The neck is supple. Strength, sensations, and reflexes are equal. Gait is normal. Which of the following is the best next step in management of this patient?"}],"o":[["A","Begin selective serotonin reuptake inhibitor"],["B","Obtain electroencephalography"],["C","Perform lumbar puncture"],["D","Recommend symptomatic care only"],["E","Repeat CT scan of the head"]],"a":"D"},{"id":"17425","b":14,"n":20,"s":[{"p":"An 18-month-old girl is brought to the emergency department due to decreased energy. Over the last 2 months, the parents have noticed that she tires easily after play, and the fatigue has steadily worsened. The patient has been drinking 1,080 mL (36.5 oz) of cow’s milk daily since transitioning from breast milk at age 12 months. She is a picky eater. Examination is unremarkable other than notable pallor. Hemoglobin is 2.3 g/dL. Stool occult blood is negative. The patient is admitted to the hospital for iron deficiency anemia due to poor dietary intake and receives 20 mL/kg of packed red blood cells over 3 hours. An hour after completion, she develops respiratory distress. Temperature is 37.1°C (98.8°F), blood pressure is 130/60 mm Hg, pulse is 160/min, and respirations are 44/min. Pulse oximetry is 89% on room air. The patient is grunting with retractions. Cardiac examination shows tachycardia with an S3 gallop but no friction rub. Lung examination shows diffuse crackles bilaterally. She is placed on oxygen. Which of the following is the best next step in management of this patient?"}],"o":[["A","Antibiotic therapy"],["B","Epinephrine"],["C","Furosemide"],["D","Iron chelation therapy"],["E","Respiratory support only"],["F","Therapeutic heparin infusion"]],"a":"C"},{"id":"18604","b":14,"n":21,"s":[{"p":"A 1-day-old girl is being evaluated in the newborn nursery. She was born at 39 weeks gestation. Vital signs are normal. Examination shows a vigorous newborn with a firm, nonfluctuant swelling confined to the right side of the skull, as seen in the image (shows a cephalohematoma that does not cross suture lines). In addition to monitoring bilirubin levels, which of the following is the best next step in management of this patient?"}],"o":[["A","Brain MRI"],["B","Cranial molding helmet"],["C","Hematoma evacuation"],["D","Reassurance and observation only"],["E","Serial hemoglobin levels"]],"a":"D"},{"id":"18429","b":14,"n":22,"s":[{"p":"A 7-year-old girl is brought to clinic due to a diffuse headache. She first developed pain while working on a math assignment today. The headache was exacerbated by the sound of her classmates yelling at recess. She was permitted to lie down in a dark, quiet room, which helped. The patient had just returned to school today after a vacation, during which she hit her head on the passenger door when her mother’s car collided with another car. The patient did not lose consciousness and was taken to the emergency department, where head imaging was normal. Since the incident, she has been more irritable at times. Vital signs are normal. The patient has a normal affect and can easily recall details of the accident. Examination shows return of headache when asked to move her eyes left and right rapidly between 2 points held a short distance away. Neurologic examination is otherwise normal. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Acute stress disorder"],["B","Concussion"],["C","Migraine headache"],["D","Perilymphatic fistula"],["E","Tension headache"]],"a":"B"},{"id":"16273","b":14,"n":23,"s":[{"p":"A 1-month-old boy is brought to the emergency department by his mother due to fussiness and vomiting. Three days ago, the patient vomited after being laid down for a nap. The vomitus was not bloody or bilious. The mother thought the vomiting was due to gastroesophageal reflux and kept the infant upright after his next feedings. However, he continued to vomit several times a day and today has been difficult to console. Urine output remains normal. The patient was born at home via spontaneous vaginal delivery and is exclusively breastfed. He has received no vaccinations or medications. Temperature is 37.4°C (99.3°F). Vital sign measurement also reveals intermittent bradycardia and hypertension. The anterior fontanelle is bulging. Eye examination shows a persistent downward gaze bilaterally. Cardiac examination reveals no murmurs. Extremities appear normal. Head imaging is as shown (demonstrates intracranial hemorrhage in the posterior ventricles and severe obstructive hydrocephalus). Which of the following is the most likely cause of this patient’s presentation?"}],"o":[["A","Chiari II malformation"],["B","Glioblastoma"],["C","Meningitis"],["D","Trisomy 13"],["E","Vitamin K deficiency"]],"a":"E"},{"id":"18571","b":14,"n":24,"s":[{"p":"A 5-year-old boy is brought to the emergency department due to confusion and weakness. The patient was accompanying his mother on a shopping trip 2 hours ago when he developed a severe headache, followed by vomiting. His mother took him home and allowed him to rest. Thirty minutes ago, he appeared excessively drowsy and could not move the left side of his body. The patient has had no recent illnesses and takes no medications. He has a history of hereditary hemorrhagic telangiectasia. Temperature is 37.2°C (99°F) and blood pressure is 140/90 mm Hg. Examination shows a somnolent boy who withdraws from painful stimuli. There are a few telangiectasias along the lips and tongue. Cardiopulmonary examination is unremarkable. The abdomen is soft with normal bowel sounds. Which of the following features would most likely be found on CT scan of the head?"}],"o":[["A","Biconvex hyperdensity adjacent to the right temporal bone"],["B","Hyperdense fluid collection with irregular margins in the right cerebral cortex"],["C","Hypoattenuation and edema within the cerebral cortex in the right middle cerebral artery territory"],["D","Mass within the right cerebellar hemisphere that enhances with contrast"],["E","Patchy areas of hypodensity within the right temporal lobe"]],"a":"B"},{"id":"18425","b":14,"n":25,"s":[{"p":"A 3-year-old girl is brought to the emergency department after a head injury. About 30 minutes ago, she was playing in the backseat of a parked car and leaned against the car door while her mother was loading groceries. When her mother opened the door, the patient fell forward onto the ground, hitting her forehead. The seat was approximately 0.6 m (24 in) from the ground. She cried immediately but has not vomited. Temperature is 37.4°C (99.3°F), pulse is 130/min, and respirations are 24/min. The patient is alert and oriented. During the examination, she is anxious but consolable by her mother. There are abrasions on the forehead and right cheek. There are no step-offs or hematomas. The pupils are equal and reactive. There is no nasal drainage. The tympanic membranes appear clear. Which of the following is the best next step in management of this patient?"}],"o":[["A","Admit for inpatient observation"],["B","Notify Child Protective Services"],["C","Obtain CT scan of the head without contrast"],["D","Perform head ultrasound"],["E","Reassure and discharge home"]],"a":"E"},{"id":"18663","b":14,"n":26,"s":[{"p":"A 16-month-old girl is brought to clinic by her father for behavior concerns. For the last 6 weeks, the patient has been less interactive with family members and increasingly irritable. Her last checkup was at 12 months, when she met all developmental milestones and was growing appropriately. Since then, the patient has not attained new milestones in speech, gross motor, or fine motor development, which her father attributes to recent social stressors because the parents are undergoing a divorce. Temperature is 37.3°C (99.1°F), blood pressure is 140/90 mm Hg, and pulse is 70/min. The patient has poor eye contact. The anterior fontanelle is closed. Cardiopulmonary examination is unremarkable. The skin is pink and well perfused. Growth charts for head circumference, height, and weight are shown in the exhibits (head circumference rapidly crossing percentile lines upward from the 25th to >90th percentile; length and weight tracking normally). Which of the following is the most likely cause of this patient’s presentation?"}],"o":[["A","Adjustment disorder"],["B","Congenital cytomegalovirus infection"],["C","Hydrocephalus"],["D","Hypothyroidism"],["E","Rett syndrome"]],"a":"C"},{"id":"17517","b":14,"n":27,"s":[{"p":"A 6-month-old boy is brought to the clinic for routine care. He cannot sit with support, and his mother is concerned that his head is large for his age. For the last week, the patient has napped more frequently and vomited at the end of sleep. Height and weight are at the 25th percentile. Head circumference is at the 95th percentile (increased from the 50th percentile at birth and the 75th percentile at age 4 months). The anterior fontanelle is bulging. MRI of the head is shown in the image (demonstrates enlarged ventricles and an intraventricular mass/choroid plexus papilloma). Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","Congenital atresia of the ventricular foramina"],["B","Decreased cerebrospinal fluid absorption"],["C","Generalized cerebral edema"],["D","Increased cerebrospinal fluid production"],["E","Intraparenchymal hemorrhage"]],"a":"D"},{"id":"17499","b":14,"n":28,"s":[{"p":"A 16-year-old boy comes to the clinic due to 3 days of abdominal pain and diarrhea. The patient returned yesterday from a 2-week vacation in Belize where he ate street food most days. At the end of his trip, he developed diarrhea with 6 or 7 watery, nonbloody stools a day. The patient has felt nauseated but has been able to tolerate fluids without vomiting. He has taken no recent medications. Temperature is 37.5°C (99.5°F), blood pressure is 105/62 mm Hg, and pulse is 78/min. On examination, the mucous membranes appear moist, and capillary refill is <2 seconds. Heart and lung examinations are normal. The abdomen is mildly distended and tender to deep palpation periumbilically. Stool occult blood is negative. Which of the following is the most likely etiology of this patient’s illness?"}],"o":[["A","Entamoeba histolytica"],["B","Enterotoxigenic Escherichia coli"],["C","Giardia lamblia"],["D","Rotavirus"],["E","Salmonella typhi"],["F","Shigella sonnei"]],"a":"B"},{"id":"3297","b":14,"n":29,"s":[{"p":"A 4-year-old boy with sickle cell disease is brought to the emergency department by his parents due to a progressive headache and drowsiness. While coming down the stairs, the patient slipped and fell from a height of 1.5 m (5 ft), hitting his head on the tile floor. He lay on the ground for several seconds but got up and continued walking and talking normally. The patient initially had only mild pain at the injury site. A few minutes later, he developed a progressive headache and vomiting before becoming somnolent. The patient has been hospitalized multiple times for vasoocclusive crises. He takes hydroxyurea and penicillin daily. Blood pressure is 140/86 mm Hg and pulse is 66/min. The patient is sleepy and requires painful stimuli to remain awake. On neurologic examination, the left pupil is 3 mm with normal pupillary reflex, but the right pupil is 8 mm and unreactive to light. Which of the following is the most likely cause of this patient’s acute decompensation?"}],"o":[["A","Cerebral contusion"],["B","Epidural hematoma"],["C","Ischemic stroke"],["D","Subarachnoid hemorrhage"],["E","Subdural hematoma"]],"a":"B"},{"id":"17748","b":14,"n":30,"s":[{"p":"A 16-year-old girl is brought to the clinic due to vomiting and abdominal pain. Since this morning, the patient has had multiple episodes of nonbilious, nonbloody emesis as well as intermittent nausea and abdominal pain. She has also had 3 episodes of watery diarrhea. The patient attended a school cookout approximately 36 hours prior to her first bout of emesis, and several of her friends who also attended have similar symptoms. Temperature is 37.4°C (99.1°F), blood pressure is 115/75 mm Hg, and pulse is 95/min. She appears uncomfortable but is alert and interactive. Mucous membranes are slightly dry. There is diffuse tenderness to deep palpation on abdominal examination but no masses or hepatosplenomegaly. The skin is well perfused, and no rashes are evident. Which of the following is the most likely etiology of this patient’s illness?"}],"o":[["A","Bacillus cereus"],["B","Norovirus"],["C","Rotavirus"],["D","Shigella sonnei"],["E","Staphylococcus aureus"]],"a":"B"},{"id":"3134","b":14,"n":31,"s":[{"p":"A 3-year-old boy is brought to the hospital after being found in a storage shed struggling to breathe. His parents are unsure of what has happened and note that multiple chemicals are stored in the shed. Temperature is 36.6°C (98°F), blood pressure is 98/65 mm Hg, pulse is 58/min, and respirations are 40/min. Oxygen saturation is 86% on room air. On examination, the patient is lethargic; his body and clothes are soiled with vomit. The pupils are pinpoint bilaterally, and there is significant watering of the eyes. Auscultation of the lungs demonstrates widespread rhonchi with prolonged expiration. Muscle fasciculations are noted in the extremities. Following endotracheal intubation, which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Administer physostigmine"],["B","Administer sodium bicarbonate"],["C","Initiate hemodialysis"],["D","Obtain an ECG to evaluate QRS interval"],["E","Remove clothing and irrigate the skin"]],"a":"E"},{"id":"18665","b":14,"n":32,"s":[{"p":"A 3-hour-old boy is being evaluated in the newborn nursery. The patient was born via spontaneous vaginal delivery to a 25-year-old woman, gravida 2 para 2. The mother had no prenatal care and takes no medications. Head circumference is at the 90th percentile. Weight is at the 25th percentile. Temperature is 37.3°C (99.1°F), pulse is 140/min, and respirations are 32/min. Per the Ballard Score, the patient is at 38 weeks gestation. Head examination shows a full fontanelle. The ears are in the normal position. The oropharynx is clear. Cardiopulmonary examination is unremarkable. The abdomen is soft with no organomegaly. Examination of the back shows a large myelomeningocele. Bilateral lower extremities are flaccid. Head imaging is most likely to reveal which of the following?"}],"o":[["A","Arteriovenous malformation at the vein of Galen"],["B","Choroid plexus overgrowth in the lateral ventricles"],["C","Diffuse leptomeningeal enhancement"],["D","Hemorrhage in the germinal matrix"],["E","Inferior displacement of the medulla and cerebellum"]],"a":"E"},{"id":"16407","b":14,"n":33,"s":[{"p":"A 6-hour-old boy is evaluated in the newborn nursery due to scalp swelling. The patient was born at term via cesarean delivery to a 21-year-old primigravida. The pregnancy was unremarkable, and the mother’s only medication was a prenatal multivitamin. Delivery was complicated by 18 hours of active labor followed by arrest of descent, necessitating cesarean delivery. Family history is notable for a maternal uncle with severe hemophilia A. Temperature is 37.3°C (99.1°F) and pulse is 190/min. The patient appears pale. Examination of the scalp shows diffuse, fluctuant edema extending from the right ear across the vertex to just above the left ear. Laboratory results are as follows:"},{"ul":["Hemoglobin: 9 g/dL","Platelets: 192,000/mm³","Leukocytes: 10,000/mm³","PT: 13 sec","PTT: 38 sec"]},{"p":"Which of the following is the most likely cause of this patient’s clinical presentation?"}],"o":[["A","Absent coagulation factor carboxylation"],["B","Factor VIII deficiency"],["C","Massive coagulation factor consumption"],["D","Subgaleal vein shearing"],["E","Subperiosteal vessel rupture"]],"a":"D"},{"id":"15731","b":14,"n":34,"s":[{"p":"A 3-year-old girl with a history of asthma is brought to the clinic for follow-up. Five days ago, the patient had a choking episode during a meal. She subsequently developed persistent cough and wheezing and was taken to the emergency department the same day. The wheezing improved with 3 treatments of nebulized albuterol, and chest radiograph was unremarkable. The patient was discharged with instructions to continue the albuterol and begin oral corticosteroids. She finished her corticosteroid course this morning, but the cough has persisted despite albuterol use. The patient has had no fever, congestion, or rhinorrhea. Vital signs are normal. The oropharynx is clear. Lung examination shows symmetric chest expansion, with diminished breath sounds and a faint wheeze in the right middle lobe. There are no crackles. The left lung is clear. Cardiac examination is unremarkable. Pulses are 2+ bilaterally. The abdomen is soft and nontender. Skin examination shows no rashes. Repeat chest radiograph is unchanged. Which of the following is the best next step in management of this patient?"}],"o":[["A","Allergy testing"],["B","Antibiotic therapy"],["C","Bronchoscopy"],["D","Extended corticosteroid course"],["E","Pulmonary function testing"],["F","Supportive care with antitussives"]],"a":"C"},{"id":"17281","b":14,"n":35,"s":[{"p":"A 7-day-old African American boy is being evaluated in the hospital. He was admitted yesterday for sepsis after being brought to the emergency department with fever and vomiting. The patient is receiving intravenous antibiotics, and blood cultures grew Escherichia coli. He had been breastfeeding prior to admission, but feeds are being held due to vomiting. The patient was born at term, and there were no complications during the pregnancy and delivery. Temperature is 38.2°C (100.8°F) and pulse is 158/min. Examination shows jaundice. The liver is palpable 4 cm below the costal margin. Laboratory results are as follows:"},{"ul":["Hemoglobin: 12 g/dL (normal: 13.4-19.9)","Mean corpuscular volume: 98 μm³ (normal: 88-123)","Platelets: 260,000/mm³","Leukocytes: 15,000/mm³","Mean corpuscular hemoglobin concentration: 33% Hb/cell","Total bilirubin: 13 mg/dL (normal: ≤ 12)","Direct bilirubin: 2 mg/dL","Aspartate aminotransferase (SGOT): 182 U/L (normal: 47-150)","Alanine aminotransferase (SGPT): 160 U/L (normal: 13-45)","Direct Coombs: negative"]},{"p":"Which of the following is the most likely cause for this patient’s condition?"}],"o":[["A","Inability to metabolize galactose to glucose"],["B","Inadequate NADPH production for oxidative injury protection"],["C","Loss of function mutation in the WAS gene"],["D","Mutation in proteins linking the red blood cell membrane to its cytoskeleton"],["E","Single amino acid substitution within the beta globin chain"]],"a":"A"},{"id":"18593","b":14,"n":36,"s":[{"p":"A 19-year-old college student is brought to the emergency department via ambulance after his roommate found him barely rousable in bed this morning. The patient had developed a fever, headache, and nausea the evening before. On examination, he is stuporous and not responding to questions. The patient is diagnosed with meningococcal meningitis. The roommate received the meningococcal booster vaccine several months ago and has no active symptoms or additional sick contacts. Which of the following is the most appropriate treatment recommendation for the patient’s roommate?"}],"o":[["A","Administer a dose of intravenous immunoglobulin"],["B","Give a dose of ceftriaxone immediately"],["C","No prophylaxis required because of recent vaccination"],["D","Prescribe ciprofloxacin if pharyngeal culture positive"],["E","Start rifampin only if symptoms develop"]],"a":"B"},{"id":"18424","b":14,"n":37,"s":[{"p":"A 9-year-old girl is brought to the office due to “ringing in her right ear” over the past week. She also has noticed a popping sensation in the ear when she swallows and difficulty hearing soft sounds. The patient has had nasal congestion during this time but is otherwise well. She and her family flew home from a ski trip in Colorado a few days before her symptoms began. Vital signs are normal. Otoscopic examination shows a retracted right tympanic membrane with surrounding dilated blood vessels; the left side is unremarkable. Pupils are equal, round, and reactive to light and accommodation. Coordination and balance are normal. Cranial nerve testing demonstrates a mild reduction in hearing on the right side. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute otitis media"],["B","Eustachian tube dysfunction"],["C","Ménière disease"],["D","Otosclerosis"],["E","Tympanic membrane rupture"]],"a":"B"},{"id":"16357","b":14,"n":38,"s":[{"p":"A 15-month-old boy is brought to the emergency department due to refusal to stand. Earlier today, the patient fell from a standing height after tripping on toys. The event was witnessed by several employees at the day care that he has been attending for a week. He cried initially but was consoled and continued playing. At home, however, he was unwilling to walk or bear weight on his right leg. The patient has met appropriate growth parameters and developmental milestones. Weight and height are at the 75th percentile. Temperature is 37.7°C (99.9°F). The patient is sitting comfortably in his mother’s lap. The abdomen is soft with no organomegaly. The right distal tibia is slightly edematous compared with the left. Palpation over the right distal tibia elicits crying. Skin examination shows scattered bruises on the bilateral knees and lower legs. The radiograph is shown in the image (demonstrates a spiral/hairline fracture of the distal tibia). In addition to leg immobilization, which of the following is the best next step in evaluation of this patient?"}],"o":[["A","Bone marrow evaluation"],["B","Calcium, phosphorus, and parathyroid hormone levels"],["C","Collagen type 1 mutation testing"],["D","MRI of the tibia"],["E","No additional workup"]],"a":"E"},{"id":"18572","b":14,"n":39,"s":[{"p":"A 1-week-old girl is evaluated in the neonatal intensive care unit. She was born at 29 weeks gestation via spontaneous vaginal delivery due to preterm labor. Her mother had routine prenatal care. Rupture of membranes with clear amniotic fluid occurred 2 hours prior to delivery. Apgar scores were 8 and 8 at 1 and 5 minutes, respectively. Birth weight was 1.51 kg (3 lb  5.3 oz). The patient has been tolerating enteral feeds via an orogastric tube, and her weight remains appropriate. Vital signs are normal. Examination shows a sleeping, nondysmorphic infant. A nasal continuous positive airway pressure mask is in place. The anterior fontanelle is open and soft. The oropharynx is clear, and the neck is supple. The lungs are clear to auscultation, and cardiac examination is unremarkable. The abdomen is soft without organomegaly. The external genitalia appear normal, and the skin is intact. The newborn moves all 4 extremities. Which of the following screening tests is indicated in this patient?"}],"o":[["A","Abdominal ultrasound"],["B","Echocardiogram"],["C","Head ultrasound"],["D","Karyotype analysis"],["E","Urinalysis"]],"a":"C"},{"id":"18411","b":14,"n":40,"s":[{"p":"A 5-month-old boy is brought to the clinic due to fever and irritability. Over the past 48 hours, the patient has been less interested in drinking formula, although he still produces an adequate number of wet diapers each day. He woke up crying several times last night and developed a fever this morning. The patient was born at term following an uncomplicated pregnancy and has met all developmental milestones. Temperature is 38.3°C (100.9°F), blood pressure is 89/50 mm Hg, pulse is 135/min, and respiratory rate is 28/min. On examination, the patient is fussy but consolable in his parent’s arms. Heart and lung examinations are unremarkable. There is clear rhinorrhea from the nares bilaterally. Otoscopic examination shows erythematous, bulging tympanic membranes bilaterally. Which of the following pieces of additional history is most relevant to this patient’s condition?"}],"o":[["A","Delivery mode"],["B","Formula preparation"],["C","Household pets"],["D","Smoke exposure"],["E","Travel history"]],"a":"D"}];
const B={};Q.forEach(q=>B[q.id]=q);
const KEY="peds-bank-v1";
let st={wrong:[],flag:[],hist:[]};
try{const r=localStorage.getItem(KEY);if(r)st=Object.assign(st,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const app=document.getElementById("app");
const blocks=[...new Set(Q.map(q=>q.b))].sort((a,b)=>a-b);
const cfg={src:"blocks",sel:new Set(blocks),count:20,mode:"tutor",shuffle:true};
let S=null;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const pool=()=>cfg.src==="wrong"?Q.filter(q=>st.wrong.includes(q.id)):cfg.src==="flag"?Q.filter(q=>st.flag.includes(q.id)):Q.filter(q=>cfg.sel.has(q.b));
const pr=(on)=>on?"true":"false";

function home(){
  S=null;const p=pool();const n=cfg.count?Math.min(cfg.count,p.length):p.length;
  const cnt=b=>Q.filter(q=>q.b===b).length;
  const hs=st.hist,tot=hs.reduce((a,x)=>a+x.n,0),cc=hs.reduce((a,x)=>a+x.c,0);let h=`<div class="hero"><button class="chip tg" data-a="theme">الوضع الليلي / النهاري</button><h1>بنك أسئلة طب الأطفال</h1><p class="by">إعداد: <bdi dir="ltr">michaeel alathamenh</bdi></p><p class="sub">${Q.length} سؤالاً في ${blocks.length} بلوكاً. اختر ما تريد وابدأ متى شئت.</p></div><div class="stats"><div class="stat"><b>${Q.length}</b>سؤال</div><div class="stat"><b>${blocks.length}</b>بلوك</div><div class="stat"><b>${tot?Math.round(cc/tot*100)+"%":"—"}</b>متوسط نتائجك</div><div class="stat"><b>${st.wrong.length}</b>أخطاء للمراجعة</div></div><div class="card">`;
  h+=`<h2 style="margin-top:0">مصدر الأسئلة</h2><div class="row">
  <button class="chip" data-a="src" data-v="blocks" aria-pressed="${pr(cfg.src==="blocks")}">البلوكات</button>
  <button class="chip" data-a="src" data-v="wrong" aria-pressed="${pr(cfg.src==="wrong")}" ${st.wrong.length?"":"disabled"}>أخطائي السابقة (${st.wrong.length})</button>
  <button class="chip" data-a="src" data-v="flag" aria-pressed="${pr(cfg.src==="flag")}" ${st.flag.length?"":"disabled"}>المُعلَّمة (${st.flag.length})</button></div>`;
  if(cfg.src==="blocks"){
    h+=`<h2>البلوكات المشمولة</h2><div class="row"><button class="chip" data-a="all" aria-pressed="${pr(cfg.sel.size===blocks.length)}">الكل</button>`;
    blocks.forEach(b=>h+=`<button class="chip" data-a="blk" data-v="${b}" aria-pressed="${pr(cfg.sel.has(b))}">${b} (${cnt(b)})</button>`);
    h+=`</div>`;
  }
  h+=`<h2>عدد الأسئلة</h2><div class="row">`;
  [10,20,40,0].forEach(c=>h+=`<button class="chip" data-a="cnt" data-v="${c}" aria-pressed="${pr(cfg.count===c)}">${c||"الكل"}</button>`);
  h+=`</div><h2>نمط الاختبار</h2><div class="row">
  <button class="chip" data-a="mode" data-v="tutor" aria-pressed="${pr(cfg.mode==="tutor")}">تدريبي: الإجابة بعد كل سؤال</button>
  <button class="chip" data-a="mode" data-v="exam" aria-pressed="${pr(cfg.mode==="exam")}">امتحان: النتيجة في النهاية</button>
  <button class="chip" data-a="shuf" aria-pressed="${pr(cfg.shuffle)}">ترتيب عشوائي</button></div>
  <div class="go"><button class="btn" data-a="start" ${n?"":"disabled"}>ابدأ الاختبار (${n} سؤالاً)</button></div></div>`;
  if(st.hist.length){
    h+=`<h2>آخر المحاولات</h2><ul class="hist">`;
    st.hist.slice(-5).reverse().forEach(x=>h+=`<li>${new Date(x.d).toLocaleDateString("ar")} — ${x.c} من ${x.n} (${Math.round(x.c/x.n*100)}%) — ${x.m==="exam"?"امتحان":"تدريبي"}</li>`);
    h+=`</ul>`;
  }
  app.innerHTML=h;
}

function start(ids){
  if(!ids){
    ids=pool().map(q=>q.id);
    if(cfg.shuffle)for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
    if(cfg.count)ids=ids.slice(0,cfg.count);
  }
  S={ids,i:0,ans:{},mode:cfg.mode,t0:Date.now(),review:false};
  quiz();
}

const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
setInterval(()=>{const t=document.getElementById("tm");if(t&&S&&!S.done&&!S.review)t.textContent=fmt(Date.now()-S.t0)},1000);
function quiz(){
  const q=B[S.ids[S.i]],a=S.ans[q.id],n=S.ids.length;
  const lock=S.review||(S.mode==="tutor"&&!!a);
  app.innerHTML="";
  const top=el("div","top");
  const tm=el("span","tag");tm.id="tm";tm.textContent=S.review?"":fmt(Date.now()-S.t0);
  top.append(el("strong",null,`السؤال ${S.i+1} من ${n}`),el("span","tag",`بلوك ${q.b}`),tm);
  const fl=el("button","chip",st.flag.includes(q.id)?"إزالة العلامة":"علّم السؤال");
  fl.dataset.a="flag";fl.setAttribute("aria-pressed",pr(st.flag.includes(q.id)));top.append(fl);
  const bar=el("div","bar");const bi=el("i");bi.style.width=((S.i+1)/n*100)+"%";bar.append(bi);
  const card=el("div","card"),qd=el("div","q");
  q.s.forEach(b=>{if(b.p)qd.append(el("p",null,b.p));else{const u=el("ul");b.ul.forEach(x=>u.append(el("li",null,x)));qd.append(u)}});
  const os=el("div","opts");
  q.o.forEach(([L,t])=>{
    let c="opt";
    if(lock){if(L===q.a)c+=" ok";else if(L===a)c+=" no"}else if(L===a)c+=" sel";
    const b=el("button",c);b.dataset.a="opt";b.dataset.v=L;b.append(el("b",null,L),el("span",null,t));os.append(b);
  });
  card.append(qd,os);
  if(lock){
    const ok=a===q.a;
    card.append(el("div","fb "+(ok?"ok":"no"),ok?"إجابة صحيحة":(a?`إجابة خاطئة. الصحيحة: ${q.a}`:`لم تُجب. الصحيحة: ${q.a}`)));
  }
  const nav=el("div","nav");
  const pv=el("button","btn alt","السابق");pv.dataset.a="prev";if(S.i===0)pv.disabled=true;
  const last=S.i===n-1;
  const nx=el("button","btn",S.review?(last?"العودة للنتيجة":"التالي"):(last?"إنهاء الاختبار":"التالي"));
  nx.dataset.a=S.review&&last?"results":(last?"finish":"next");
  if(S.mode==="tutor"&&!S.review&&!a)nx.disabled=true;
  nav.append(pv,nx);
  const nv=el("div","nv");
  S.ids.forEach((id,k)=>{const x=S.ans[id],b=el("button",null,k+1);b.dataset.a="jump";b.dataset.v=k;let c="";if(k===S.i)c="cur";if(x)c+=(S.review||S.mode==="tutor")?(x===B[id].a?" ok":" no"):" done";else if(S.review)c+=" no";b.className=c;nv.append(b)});
  app.append(top,bar,card,nav,nv);
  if(!S.review&&!last){const f=el("div","go");const e=el("button","btn alt","إنهاء الاختبار الآن");e.dataset.a="finish";f.append(e);app.append(f)}
  window.scrollTo(0,0);
}

function finish(){
  const n=S.ids.length;let c=0;
  S.ids.forEach(id=>{
    const a=S.ans[id];
    if(a===B[id].a){c++;st.wrong=st.wrong.filter(x=>x!==id)}
    else if(a&&!st.wrong.includes(id))st.wrong.push(id);
  });
  S.c=c;S.secs=Math.round((Date.now()-S.t0)/1000);
  st.hist.push({d:Date.now(),n,c,m:S.mode});st.hist=st.hist.slice(-20);save();
  S.done=true;results();
}

function results(){
  S.review=false;const n=S.ids.length;
  const m=Math.floor(S.secs/60),s=S.secs%60;
  app.innerHTML="";
  const card=el("div","card");
  const pct=Math.round(S.c/n*100),rg=el("div","res"),rn=el("div","ring");
  rn.innerHTML=`<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${pct*3.267} 327" transform="rotate(-90 60 60)"/></svg><b>${pct}%</b>`;
  const tx=el("div");tx.append(el("h2",null,"النتيجة"),el("p","score",`${S.c} من ${n}`),el("p","sub",`الوقت: ${m} د ${s} ث`));rg.append(rn,tx);card.append(rg);
  const bb={};S.ids.forEach(id=>{const k=B[id].b;bb[k]=bb[k]||[0,0];bb[k][1]++;if(S.ans[id]===B[id].a)bb[k][0]++});
  const bl=el("div","bk");Object.keys(bb).forEach(k=>{const r=el("div","brow");r.innerHTML=`<span>بلوك ${k}</span><i><u style="width:${bb[k][0]/bb[k][1]*100}%"></u></i><span>${bb[k][0]}/${bb[k][1]}</span>`;bl.append(r)});card.append(bl);
  const row=el("div","go");
  const mk=(t,a,cls)=>{const b=el("button","btn"+(cls?" "+cls:""),t);b.dataset.a=a;row.append(b)};
  if(S.ids.some(id=>S.ans[id]!==B[id].a))mk("إعادة الأسئلة الخاطئة فقط","retry");
  mk("اختبار جديد","home","alt");
  card.append(row);
  const list=el("div","list");
  S.ids.forEach((id,i)=>{
    const ok=S.ans[id]===B[id].a;
    const b=el("button","item");b.dataset.a="goto";b.dataset.v=i;
    const t=B[id].s.map(x=>x.p||"").join(" ").trim();
    b.append(el("span","mk "+(ok?"ok":"no"),ok?"✓":"✗"),el("span",null,`${i+1}. ${t}`));
    list.append(b);
  });
  app.append(card,el("h2",null,"مراجعة الأسئلة"),list);
  window.scrollTo(0,0);
}

const act={
  src:v=>{cfg.src=v;home()},
  blk:v=>{v=+v;cfg.sel.has(v)?cfg.sel.delete(v):cfg.sel.add(v);home()},
  all:()=>{cfg.sel=cfg.sel.size===blocks.length?new Set():new Set(blocks);home()},
  cnt:v=>{cfg.count=+v;home()},
  mode:v=>{cfg.mode=v;home()},
  shuf:()=>{cfg.shuffle=!cfg.shuffle;home()},
  start:()=>start(),
  opt:v=>{
    const q=B[S.ids[S.i]];
    if(S.review||(S.mode==="tutor"&&S.ans[q.id]))return;
    S.ans[q.id]=v;quiz();
  },
  next:()=>{S.i++;quiz()},
  prev:()=>{S.i--;quiz()},
  flag:()=>{const id=S.ids[S.i],k=st.flag.indexOf(id);k<0?st.flag.push(id):st.flag.splice(k,1);save();quiz()},
  finish:finish,
  results:results,
  goto:v=>{S.review=true;S.i=+v;quiz()},
  retry:()=>{const ids=S.ids.filter(id=>S.ans[id]!==B[id].a);cfg.mode=S.mode;start(ids)},
  home:home,
  jump:v=>{S.i=+v;quiz()},
  theme:()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark"}
};
app.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&!t.disabled)act[t.dataset.a](t.dataset.v)});
document.addEventListener("keydown",e=>{
  if(!S||S.done&&!S.review&&!document.querySelector(".opts"))return;
  const o=document.querySelector(".opts");if(!o)return;
  const k=e.key.toUpperCase(),b=[...o.children].find(x=>x.dataset.v===k);
  if(b)b.click();
  else if(e.key==="Enter"){const nx=document.querySelector(".nav .btn:not(.alt)");if(nx&&!nx.disabled)nx.click()}
});
home();
</script>
</body>
</html>
