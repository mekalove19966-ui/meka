n to a 29-year-old woman, gravida 3 para 0 aborta 2, who did not receive prenatal care. The mother presented in labor at approximately 38 weeks gestation and had a forceps-assisted vaginal delivery due to fetal heart rate abnormalities. Apgars were 6 and 8 at 1 and 5 minutes, respectively. Weight is 2.5 kg (5.5 lb). Physical examination shows microcephaly, a wide anterior fontanelle, cleft palate, and hypoplasia of the distal phalanges. Further evaluation of the mother would most likely reveal a history of which of the following?"}],"o":[["A","Alcohol use"],["B","Cocaine use"],["C","Lisinopril use"],["D","Phenytoin use"],["E","Untreated syphilis"]],"a":"D"},{"id":"4822","b":2,"n":24,"s":[{"p":"A 12-month-old boy is brought to the office by his parents for a routine well-child visit. He was born at 39 weeks gestation. Birth weight was 3.4 kg (7 lb  8 oz) and length was 50.8 cm (20 in). He was primarily breastfed until last week, when he was transitioned to cow’s milk. The patient can feed himself small pieces of table food with his thumb and first finger and drinks from a sippy cup. His only words are “mama,” “dada,” and “doggy.” His parents are concerned about his growth because some children at his day care center seem taller. The patient weighs 12 kg (26.5 lb) and is 76.2 cm (30 in) tall. On examination, he can pull himself up to stand and stand unassisted but requires holding onto objects for support while walking. He comes to his parents when called by name but does not speak during the examination. Which of the following is the most appropriate assessment of this patient’s development?"}],"o":[["A","Growth: Delayed | Motor: Delayed | Language: Delayed"],["B","Growth: Delayed | Motor: Delayed | Language: Normal"],["C","Growth: Delayed | Motor: Normal | Language: Delayed"],["D","Growth: Delayed | Motor: Normal | Language: Normal"],["E","Growth: Normal | Motor: Delayed | Language: Delayed"],["F","Growth: Normal | Motor: Delayed | Language: Normal"],["G","Growth: Normal | Motor: Normal | Language: Delayed"],["H","Growth: Normal | Motor: Normal | Language: Normal"]],"a":"H"},{"id":"2196","b":2,"n":25,"s":[{"p":"A 5-year-old boy is brought to the emergency department by his parents due to sudden-onset difficulty breathing. The patient developed a mild cough and sore throat yesterday; his parents gave him acetaminophen, which improved his throat pain. However, this morning the patient had difficulty breathing and was sitting in bed and leaning forward, refusing to lie down. He takes no medications and has no known allergies. The patient has had no vaccinations. Temperature is 39.1°C (102.4°F), blood pressure is 100/65 mm Hg, pulse is 130/min, and respirations are 46/min. Oxygen saturation is 92% on room air. The patient appears anxious, is drooling, and has inspiratory stridor. The uvula is midline, and there is no oropharyngeal or tonsillar erythema. Lung examination shows transmitted upper airway noises without wheezing or crackles. Which of the following is the most likely diagnosis?"}],"o":[["A","Bronchiolitis"],["B","Croup"],["C","Diphtheria"],["D","Epiglottitis"],["E","Foreign body aspiration"],["F","Peritonsillar abscess"]],"a":"D"},{"id":"4699","b":2,"n":26,"s":[{"p":"A 7-year-old boy is brought to the emergency department due to difficulty breathing. The patient was at a family reunion all morning. Thirty minutes after lunch, he developed wheezing and difficulty breathing, and an ambulance was called. He has had no recent fevers or infections. The patient has mild eczema that is treated with petroleum ointment. He has an allergy to sesame and is up to date on his immunizations. On arrival, temperature is 36.7°C (98°F), blood pressure is 80/50 mm Hg, pulse is 132/min, and respirations are 28/min; pulse oximetry is 93% on room air. Examination shows an anxious-appearing patient with increased work of breathing and diffuse wheezes on auscultation. Mucous membranes appear normal, and no rashes are appreciated. Which of the following is the best initial treatment for this patient?"}],"o":[["A","Inhaled albuterol"],["B","Inhaled racemic epinephrine"],["C","Intramuscular epinephrine"],["D","Intravenous diphenhydramine"],["E","Intravenous magnesium"],["F","Intravenous methylprednisolone"]],"a":"C"},{"id":"13401","b":2,"n":27,"s":[{"p":"A 16-year-old girl comes to the clinic due to a rash. The patient developed a pruritic red lesion on her back 5 days ago that has slowly grown. She has since developed multiple new lesions on the chest and back. The patient has tried over-the-counter topical antibiotics with no improvement. She also had a fever, headache, and malaise about a week ago, which resolved after 2 days. She has no chronic medical conditions, takes no medications, and has no allergies. The patient is a wrestler for her high school team. She is sexually active and uses combination oral contraceptives. Temperature is 37.2°C (99°F). Cardiopulmonary examination is normal. Skin examination shows multiple 0.5- to 1-cm (0.2- to 0.4-in) erythematous macules with minimal scaling on the chest, as seen in the exhibit, and back oriented along the lines of tension. There is a larger, 3-cm (1.2-in) erythematous patch on the upper back with scaling. The rash spares the palms and soles. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Erythema multiforme"],["B","Nummular eczema"],["C","Pityriasis rosea"],["D","Rheumatic fever"],["E","Secondary syphilis"],["F","Tinea corporis"]],"a":"C"},{"id":"8955","b":2,"n":28,"s":[{"p":"A 3-year-old boy is brought to the office for help with toilet training. He recently started day care and screams “no” when teachers try to place him on the toilet. He urinates several times a day. However, he strains with his bowel movements, which occur every other day with hard, pellet-like stools. The boy is a picky eater and prefers to drink milk. He used to drink up to 30 oz of milk daily; for the past month, this has been reduced to 24 oz per day. His parents also have tried giving more water, fruits, and vegetables, but he refuses them. He has no medical problems and takes no medications. His weight and height have been tracking along the 75th percentile. Examination shows a cooperative, well-nourished boy. He runs well and can climb onto the examination table independently. He speaks in short sentences that are mostly understandable. The boy’s abdomen is soft, nontender, and mildly distended. He has Tanner I male genitalia. A small fissure is noted on the anal verge. Which of the following is the best next step in management of this patient?"}],"o":[["A","Begin oral laxative therapy"],["B","Disimpact with rectal enema"],["C","Obtain thyroid function testing"],["D","Order abdominal x-ray"],["E","Perform anorectal manometry"],["F","Replace dietary milk with juice"]],"a":"A"},{"id":"2456","b":2,"n":29,"s":[{"p":"A 3-week-old boy in the neonatal intensive care unit has several episodes of vomiting. The vomiting developed 6 hours ago and is bilious but nonbloody. The patient was born at 28 weeks gestation by vaginal delivery due to cervical insufficiency. Birth weight was 900 g (2 lb). The patient initially required mechanical ventilation but was extubated to oxygen via nasal cannula last week. He has advanced on continuous nasogastric formula feeds and has gained appropriate weight daily. The infant has had small, yellow, seedy stools but no bowel movement for the past 24 hours. Temperature is 35.6°C (96°F), blood pressure is 75/45 mm Hg, pulse is 165/min, and respirations are 70/min. Pulse oximetry is 97% on 2 L oxygen. Examination shows a lethargic neonate. The abdomen is tense and distended with hypoactive bowel sounds. Laboratory results indicate leukocytosis and metabolic acidosis. Which of the following imaging findings would most likely be seen in this patient?"}],"o":[["A","Abdominal ultrasound with thickened pylorus muscle"],["B","Abdominal x-ray with air in the bowel wall and portal veins"],["C","Abdominal x-ray with air in the stomach and duodenum but no distal air"],["D","Contrast enema with narrow rectosigmoid and dilation of the rest of the colon"],["E","Head ultrasound with hemorrhage into the lateral ventricles"]],"a":"B"},{"id":"3545","b":2,"n":30,"s":[{"p":"A 3-hour-old girl is evaluated in the neonatal intensive care unit for cyanosis. She was born at 38 weeks gestation by cesarean delivery for nonreassuring fetal heart tones. The mother is a 28-year-old primigravida who had an uncomplicated pregnancy. Apgar scores were 8 at both 1 and 5 minutes. The infant was initially rooming-in with her mother but was moved to the nursery shortly after delivery due to a dusky appearance. Pulse oximetry of the right hand and leg shows 72% on room air. The patient remains hypoxic after 10 minutes of breathing 100% oxygen delivered by hood. On examination, she is cyanotic and tremulous. She has low-set ears, micrognathia, and a cleft palate. Chest x-ray reveals an absent thymus. Echocardiography shows truncus arteriosus. Given the presumed diagnosis, this patient most likely has which of the following conditions?"}],"o":[["A","Anemia"],["B","Duodenal atresia"],["C","Horseshoe kidney"],["D","Hypocalcemia"],["E","Hypoglycemia"],["F","Myelomeningocele"],["G","Neutropenia"]],"a":"D"},{"id":"3664","b":2,"n":31,"s":[{"p":"A 12-year-old boy is brought to the emergency department by his parents as “he cannot walk anymore.” The patient has had a pins-and-needles sensation and weakness in both feet for the past few days. This morning, he could not stand or move his legs and has bilateral thigh pain. Two weeks ago, the patient had a febrile diarrheal illness that resolved on its own. He has had no headaches, nausea, vomiting, or recurrent diarrhea. He and his family are vegetarians, and they recently visited a petting zoo. The patient has no significant past medical history, and vaccinations are up to date. On arrival, temperature is 36.7°C (98.1°F), blood pressure is 150/90 mm Hg, pulse is 92/min, and respirations are 16/min; pulse oximetry is 99% on room air. Physical examination shows symmetric flaccid paralysis of the lower extremities and absent ankle and patellar deep tendon reflexes. Sensation is intact to light touch in both legs. The upper extremities are weak and hyporeflexic. There is no photophobia or nuchal rigidity. Which of the following structures is primarily impaired in this patient’s condition?"}],"o":[["A","Anterior horn cells"],["B","Dorsal and lateral spinal columns"],["C","Muscle fibers"],["D","Neuromuscular junction"],["E","Peripheral nerve fibers"]],"a":"E"},{"id":"4638","b":2,"n":32,"s":[{"p":"A 12-year-old girl is brought to the emergency department due to rash and difficulty breathing. Her symptoms started acutely after being stung by a bee while playing soccer. Her coach says that the girl developed full-body hives, difficulty breathing, and vomiting before the ambulance arrived. The patient has a history of moderate persistent asthma. Home medications include inhaled fluticasone twice daily and inhaled albuterol PRN. On arrival, temperature is 37.2°C (99°F), blood pressure is 110/70 mm Hg, pulse is 114/min, and respirations are 28/min; pulse oximetry is 91% on room air. Examination shows a thin girl in moderate respiratory distress with hives present over her trunk and extremities. Diffuse wheezing is appreciated on auscultation, and the patient has mild tenderness to palpation of her abdomen. Intramuscular epinephrine is administered with resolution of symptoms and normalization of vital signs; however, 10 minutes later, she begins to have worsening hives, mild wheezing, and one additional episode of emesis. Repeat vital signs show a respiratory rate of 18/min and pulse oximetry of 97%. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Emergency intubation"],["B","Inhaled albuterol"],["C","Intramuscular epinephrine"],["D","Intravenous dopamine"],["E","Intravenous methylprednisolone"],["F","Venom immunotherapy"]],"a":"C"},{"id":"3633","b":2,"n":33,"s":[{"p":"An 8-month-old boy is brought to the emergency department with fever and vomiting. He has had a fever for the past 3 days, despite receiving acetaminophen and ibuprofen. Today, the patient has been refusing solid foods but is still breastfeeding. He is up to date on immunizations. The infant attends day care twice a week but has stayed home with his mother since becoming sick. Temperature is 40°C (104°F), blood pressure is 92/48 mm Hg, pulse is 120/min, and respirations are 30/min. On examination, the patient appears uncomfortable. He cries when the neck is flexed. The anterior fontanelle is bulging. The pupils are equal, round, and reactive to light. Extraocular movements are normal. There are no focal neurologic deficits. Complete blood count and blood culture are pending. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","CT scan of the brain"],["B","Dexamethasone therapy"],["C","Intravenous antibiotics"],["D","Lumbar puncture"],["E","MRI of the brain"]],"a":"D"},{"id":"9848","b":2,"n":34,"s":[{"p":"A 16-year-old boy is brought to the office by his parents for evaluation of depression. For the past 2 weeks, the patient has cried daily since his girlfriend ended their relationship. After school, he has gone directly to his bedroom and has avoided his parents. The patient quit his high school baseball team last week and now only plays violent video games. He sleeps the majority of the day and states that he has no energy and that his appetite has decreased substantially. The patient also falls asleep in class, when he’s not skipping school, and his grades have dropped. Last week, he got into a fight with a classmate. The patient’s father is an avid hunter and keeps multiple firearms in the basement of their home. Examination shows a cooperative boy with a flat affect. He says that he has no suicidal or homicidal ideation but has multiple superficial lacerations on the wrists and forearms. Which of the following would be the most effective recommendation for decreasing this patient’s immediate suicide risk?"}],"o":[["A","Advise restricting access to violent video games"],["B","Encourage the patient to rejoin his sports team"],["C","Offer reassurance that this is a normal grief reaction"],["D","Recommend a selective serotonin reuptake inhibitor"],["E","Suggest removing all firearms from the home"]],"a":"E"},{"id":"2134","b":2,"n":35,"s":[{"p":"A 3-year-old boy is brought to the emergency department for 2 days of fever, cough, and worsening shortness of breath. The patient’s parents report that he recently recovered from prolonged diarrhea due to Giardia infection. Medical history is significant for recurrent ear infections treated with antibiotics since age 6 months and lobar pneumonia requiring hospitalization. Temperature is 38.7°C (101.7°F), pulse is 140/min, and respirations are 60/min. Physical examination reveals small tonsils and crackles in the lower lobe of the right lung. The child’s weight is at the 40th percentile. Which of the following is the most likely cause of this patient’s recurrent infections?"}],"o":[["A","Abnormal B-lymphocyte maturation"],["B","Adenosine deaminase deficiency"],["C","Complement deficiency"],["D","Impaired oxidative burst"],["E","Thymic hypoplasia"]],"a":"A"},{"id":"3380","b":2,"n":36,"s":[{"p":"A young mother brings her 5-year-old daughter to the office due to problems at school. The patient started kindergarten 2 months ago and appeared to be doing fine. Last week, the teacher called to say that the child has persistently refused to answer questions or speak to others in class since her arrival. The teacher did not report it earlier as she thought the child was undergoing an adjustment period. During playtime, she prefers to play by herself. In class she remains quiet while the other children sing songs or recite the alphabet. The mother finds this very surprising as the patient is talkative at home and plays with her siblings and neighborhood friends. In addition, the patient did not report any issues with school to her mother, saying it was “fine.” She is “a little shy” at social gatherings but interacts with other kids and adults when she gets to know them. The child is able to tie her shoelaces, jump rope, and dress and feed herself. She can copy a triangle and is able to count to 10. Physical examination shows no abnormalities. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Adjustment disorder"],["B","Normal shyness"],["C","Selective mutism"],["D","Separation anxiety disorder"],["E","Social (pragmatic) communication disorder"],["F","Stranger anxiety"]],"a":"C"},{"id":"16614","b":2,"n":37,"s":[{"p":"A 14-year-old girl is brought to the office for a well-child examination. The patient’s mother states that she is doing well in school and plays on the volleyball team. The patient sleeps 9 hours every night and often until noon on weekends. She drinks 2 glasses of 2% milk daily and her screen time is limited to 2 hours a day. She has no chronic medical conditions and takes no medications. At age 12, she received her first dose of human papillomavirus (HPV) vaccination, with another dose administered 6 months later. The patient underwent menarche at age 13, and her last menstrual period was 2 weeks ago. She has never been sexually active. The patient’s mother has hypothyroidism, and her maternal grandmother recently died from complications of type 2 diabetes mellitus. Height and weight are at the 60th percentile. Blood pressure is 104/68 mm Hg and pulse is 60/min. Physical examination reveals an alert and engaged adolescent. Sexual maturity rating (Tanner) stage is 4. Cardiopulmonary examination is unremarkable. The abdomen is soft and nontender. The remainder of the examination is normal. Which of the following is the best next step in management of this patient?"}],"o":[["A","Chlamydia trachomatis screening"],["B","Discuss contraception"],["C","Give an additional HPV vaccination dose"],["D","Hemoglobin A1c testing"],["E","Measure TSH level"],["F","Teach breast self-examination"]],"a":"B"},{"id":"15955","b":2,"n":38,"s":[{"p":"A 2-day-old boy is evaluated in the newborn nursery. The patient was born at an estimated 40 weeks gestation to a 26-year-old primigravida who received no prenatal care. He has been taking 30 mL (1 oz) of a cow’s milk-based formula every 3 hours since birth. The mother says the boy seems uncomfortable. She is worried about dehydration because he has been spitting up formula after his last few feeds and has only had one damp diaper and a single stool since birth. Birth weight was 3,200 g (7 lb  1 oz), and weight today is 3,260 g (7 lb  3 oz). Temperature is 36.7°C (98.1°F), pulse is 150/min and respirations are 66/min. Pulse oximetry is 88% on room air. Lung examination shows diminished breath sounds bilaterally. Cardiac examination is normal. The abdomen is distended. The urethral meatus appears intact. A small sacral dimple with intact skin overlies the coccyx. His skin is warm and pink. Chest radiograph reveals diminished lung volumes bilaterally with a normal heart size. The patient is placed on supplemental oxygen. Which of the following is the best next step in the evaluation of this patient’s condition?"}],"o":[["A","Echocardiogram"],["B","Lumbosacral MRI"],["C","Pyloric ultrasound"],["D","Renal and bladder ultrasound"],["E","Upper gastrointestinal series"]],"a":"D"},{"id":"12338","b":2,"n":39,"s":[{"p":"A 4-week-old boy is brought to the office for his first well-child visit. The patient was born at 38 weeks gestation to a 27-year-old woman following an uncomplicated pregnancy and delivery. He has been exclusively breast-fed since birth and has had normal urine and stool output. The patient takes supplemental vitamin D and no other medications. His 4-year-old brother has neurofibromatosis but is otherwise healthy. The patient is well-appearing and vigorous. His weight and length are at the 50th percentile. There is a 5-cm skin lesion with overlying hair on the upper back, as shown (solitary hyperpigmented patch with increased hair density). The remainder of the skin examination is unremarkable. Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","Café au lait macule"],["B","Congenital dermal melanocytosis"],["C","Congenital melanocytic nevus"],["D","Nevus flammeus"],["E","Nevus simplex"],["F","Superficial infantile hemangioma"]],"a":"C"},{"id":"15992","b":2,"n":40,"s":[{"p":"A 2-year-old boy is brought to the office for evaluation of right ear pain. Two days ago, his mother saw him put a small rock in his ear while he was playing outside. She pulled it out and rinsed his ear thoroughly with soapy water in the bath that evening. The patient had no pain that night, but the next morning he woke up crying and pulling on his ear. He has been fussy and has not slept well since then. The patient has had 2 previous episodes of acute otitis media that resolved with antibiotics. Immunizations are up to date. Temperature is 37°C (98.6°F), blood pressure is 90/50 mm Hg, and pulse is 100/min. Examination shows a somewhat anxious child. There is no rhinorrhea. Physical examination of the oropharynx shows normal tonsils with no exudate or erythema. There is no cervical adenopathy. The patient cries during examination of the right ear, which reveals a tender, swollen ear canal. Although only a part of the tympanic membrane is seen, it appears normal. The left ear is normal. Which of the following is the most appropriate treatment for this patient’s condition?"}],"o":[["A","Oral amoxicillin/clavulanic acid"],["B","Oral fluconazole"],["C","Oral trimethoprim-sulfamethoxazole"],["D","Topical ciprofloxacin"],["E","Topical clindamycin"],["F","Topical nystatin"]],"a":"D"},{"id":"2444","b":3,"n":1,"s":[{"p":"A 3-year-old boy is brought to the physician for evaluation of delayed milestones. Over the past year, he has been receiving physical and speech therapies for delays in gross motor skills and speech. He is currently able to walk up and down stairs and run well. He has a vocabulary of approximately 25 words and does not make 2-word sentences. His parents report that he has poor eye contact and does not show interest in engaging with other children. Review of systems is otherwise negative. His vaccinations are up to date. He has an uncle with Down syndrome and a cousin with autism. Head circumference, length, and weight are each at the 5th percentile. Examination of the face shows small palpebral fissures, absent philtrum, and a thin upper lip border. What is the underlying cause of his problems?"}],"o":[["A","Adverse effects from vaccination during infancy"],["B","Fragile X mental retardation 1 gene mutation"],["C","In utero exposure to alcohol"],["D","In utero exposure to cytomegalovirus"],["E","In utero exposure to phenytoin"],["F","In utero exposure to rubella"],["G","Nondisjunction resulting in an extra copy of chromosome 21"]],"a":"C"},{"id":"12419","b":3,"n":2,"s":[{"p":"An 18-month-old boy is admitted to the pediatric intensive care unit after undergoing cardiac surgery. At age 16 months, his parents brought him to a pediatrician due to intermittent episodes of cyanosis when he became upset. At that time, a cardiac murmur was noted, and echocardiogram revealed tetralogy of Fallot with moderate pulmonary stenosis. The patient’s initial postoperative period is unremarkable, but on postoperative day 4 he develops tachypnea with an increasing oxygen requirement. Chest x-ray reveals significant pleural fluid in the right hemithorax. Analyses of serum and pleural fluid obtained by thoracentesis are as follows:"},{"p":"Serum values"},{"ul":["Total protein: 7.0 g/dL","Lactate dehydrogenase: 70 U/L","Hematocrit: 48%"]},{"p":"Pleural fluid values"},{"ul":["pH: 7.45","Total protein: 4.0 g/dL","Lactate dehydrogenase: 65 U/L","Glucose: 85 mg/dL","Hematocrit: 0.2%","Triglycerides: 724 mg/dL (n = <50 mg/dL)","Cell count: 300/mm³","Neutrophils: 9%","Lymphocytes: 90%","Eosinophils: 1%"]},{"p":"Which of the following is the most likely mechanism causing this patient’s pleural effusion?"}],"o":[["A","Bacterial infection of the pleural cavity"],["B","Blood loss into the pleural cavity"],["C","Decreased plasma oncotic pressure"],["D","Disruption of the thoracic duct"],["E","Increased pulmonary vascular pressures"],["F","Transudation of ascitic fluid through the diaphragm"]],"a":"D"},{"id":"2443","b":3,"n":3,"s":[{"p":"A 10-month-old girl is brought to the office because she has not yet begun to stand. She can pull herself along the floor using her arms but drags her legs behind her. The patient was born at 32 weeks gestation by spontaneous vaginal delivery after the mother developed preeclampsia with severe features. Her Apgar scores were 7 and 8 at 1 and 5 minutes, respectively. On physical examination, the patient is alert and well-appearing. She says “mama” and “dada.” Mild hypertonia of the upper extremities is noted; bilateral lower extremities are hypertonic with significant resistance to passive extension. Patellar reflexes are brisk. Bilateral feet have equinovarus deformities, but the examination reveals no other dysmorphic features. Babinski reflex is present bilaterally. Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","Cerebral palsy"],["B","Fetal alcohol syndrome"],["C","Myotonic dystrophy"],["D","Rett syndrome"],["E","Spinal muscular atrophy"],["F","Tethered spinal cord"]],"a":"A"},{"id":"2479","b":3,"n":4,"s":[{"p":"A 10-week-old girl is brought to the office by her mother for a well-infant examination after missing her visit 2 weeks earlier. She was born at 34 weeks gestation and weighed 2.2 kg (4 lb  14 oz) at birth. She has been breastfed exclusively since then, and her growth and development are appropriate for her chronological and gestational ages. Her physical examination is notable for mild pallor but is otherwise normal. The mother eats a balanced diet that includes meat products. At this time, which of the following is the most appropriate nutritional intervention for this patient?"}],"o":[["A","Introduction of eggs and meat to the diet"],["B","Introduction of fruit juices to the diet"],["C","Introduction of pureed vegetables to the diet"],["D","Iron and vitamin D supplementation"],["E","No additional supplementation needed"],["F","Vitamin B₁₂ supplementation"],["G","Vitamin C supplementation"]],"a":"D"},{"id":"4661","b":3,"n":5,"s":[{"p":"A 1-day-old boy is brought to the emergency department due to worsening cyanosis. He was delivered at home via spontaneous vaginal delivery. The mother received no prenatal care and is unsure of the gestational age at delivery. The neonate did well after delivery and has breastfed several times. Two hours ago, he developed rapid breathing and cyanosis. On examination, the patient is hypotensive. Pulse oximetry from the right hand is 80% on room air and does not improve with 100% inspired oxygen. Physical examination shows a diffusely cyanotic infant. Cardiac examination reveals tachycardia, a regular rhythm, and no murmur. The patient is tachypneic but has normal breath sounds bilaterally. Chest x-ray is normal. Echocardiography is pending. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hematocrit: 60% (normal: 47%-65%)","Platelets: 240,000/mm³","Leukocytes: 9,000/mm³"]},{"p":"Which of the following is the best next step in the management of this patient?"}],"o":[["A","Indomethacin"],["B","Partial exchange transfusion"],["C","Prostaglandin E1"],["D","Sildenafil"],["E","Surfactant"]],"a":"C"},{"id":"12458","b":3,"n":6,"s":[{"p":"A 2-year-old boy is brought to the emergency department following a 2-minute, generalized tonic-clonic seizure at home, which resolved spontaneously. The patient was behaving normally until this morning when he appeared to have abdominal pain and felt warm to the touch. He has had no emesis but has been passing large amounts of watery diarrhea over the past 24 hours that now contains dark red mucus. Temperature is 39.7°C (103.5°F), blood pressure is 100/62 mm Hg, pulse is 140/min, and respirations are 26/min. The patient is awake, active, and responsive. The pupils are equal and reactive and the fundi appear normal. The oral mucosa is dry. The abdomen is soft with hyperactive bowel sounds and bilateral lower quadrant tenderness on palpation. There is no hepatosplenomegaly or abdominal mass. Cranial nerve examination and deep tendon reflexes are normal. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Clostridium perfringens"],["B","Enterotoxigenic Escherichia coli"],["C","Giardia intestinalis"],["D","Inflammatory bowel disease"],["E","Intussusception"],["F","Rotavirus"],["G","Shigella sonnei"]],"a":"G"},{"id":"16134","b":3,"n":7,"s":[{"p":"A 16-year-old boy is brought to the clinic for evaluation of intermittent fevers. He first noticed symptoms after returning from a rabbit hunting trip in Pennsylvania a month ago. Initially, the fevers occurred every few days; however, for the past 2 weeks, he has had daily temperature spikes ≥ 38.1°C (100.6°F). The patient has been taking acetaminophen daily, which reduces the fevers only temporarily. Since the trip, he has also noticed a swelling above his right collarbone that has enlarged to the size of a quarter. He has no dyspnea, night sweats, or weight loss. The patient has no chronic medical conditions, and immunizations are up to date. He has 3 pet cats at home. He is sexually active and has had 3 lifetime partners. Temperature is 38.3°C (100.9°F). Multiple small right anterior cervical lymph nodes are palpable. The right supraclavicular fossa has a solitary, firm, 2.5-cm (1-in) palpable lymph node. Cardiopulmonary examination is normal. The abdomen is soft with no palpable masses. Biopsy of the lymph node is shown in the exhibit. Which of the following is the most likely diagnosis for this patient?"}],"o":[["A","Acute HIV infection"],["B","Cat scratch disease"],["C","Hodgkin lymphoma"],["D","Lyme disease"],["E","Sarcoidosis"],["F","Tuberculosis"]],"a":"C"},{"id":"3669","b":3,"n":8,"s":[{"p":"An 18-month-old boy is brought to the office due to developmental concerns. His parents have noticed that he does not walk independently, which worries them because his older brother began walking at age 12 months. The patient holds on to furniture while standing and steps sideways to move around. He can speak in 2- to 3-word sentences and follow simple commands. The patient can also build a tower of 6 cubes, drink from a straw, and feed himself table foods. Height, weight, and head circumference track at the 20th percentile, similar to prior visits. During physical examination, he uses his hands to push on his legs while getting up and seems to have pain when doing so. Which of the following is the best next step in evaluation of this patient?"}],"o":[["A","Brain imaging"],["B","Creatine kinase level"],["C","Karyotype analysis"],["D","Reassurance only"],["E","Serum TSH level"]],"a":"B"},{"id":"4925","b":3,"n":9,"s":[{"p":"A 12-month-old baby girl is brought to the office because of vomiting and diarrhea. She became ill 3 days ago when she developed a low-grade fever and diarrhea. She refuses to eat, but was drinking some until yesterday when she began vomiting. In the last 24 hours, she has had 1 wet diaper. Temperature is 38°C (100.4°F), pulse is 110/min, respiratory rate is 25/min and blood pressure is 90/50 mmHg. On examination, she is lethargic with sunken eyes. Her mucous membranes are dry and her capillary refill is 3-4 seconds. Which of the following is the next best step in the management of this patient?"}],"o":[["A","Oral rehydration"],["B","20 mL/kg of normal saline intravenously"],["C","20 mL/kg of D5 normal saline intravenously"],["D","20 mL/kg of 1/2 normal saline intravenously"],["E","20 mL/kg of 1/4 normal saline intravenously"]],"a":"B"},{"id":"2429","b":3,"n":10,"s":[{"p":"A 3-month-old boy is rushed to the emergency department for evaluation of cyanosis. The baby appeared “bluish-pale” during a bottle feeding this morning and still appears “dusky.” The parents say that this color change has occurred during crying or feeding for the past few days. The patient also seems to tire and breathe faster after a few minutes of feeding. Review of systems is negative for fever, coughing, choking, and gagging. Temperature is 36.7°C (98°F); blood pressure is 84/50 mm Hg in the right arm, 85/55 mm Hg in the left arm, 88/58 mm Hg in the right leg, and 87/52 mm Hg in the left leg; pulse is 155/min and respirations are 54/min. Pulse oximetry shows an oxygen saturation of 80% on room air. The infant is crying and the cyanosis is most prominent in the lips and tongue. Auscultation reveals a single S2, and a harsh crescendo-decrescendo systolic murmur is heard at the left upper sternal border. The abdomen is soft, nontender, and nondistended. No digital clubbing is present. Capillary refill is <2 sec. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Coarctation of the aorta"],["B","D-transposition of the great arteries"],["C","Hypoplastic left heart syndrome"],["D","Isolated ventricular septal defect"],["E","Tetralogy of Fallot"]],"a":"E"},{"id":"3458","b":3,"n":11,"s":[{"p":"A 9-year-old boy is brought to the emergency department for a worsening cough. Two weeks ago, he developed rhinorrhea, congestion, and a mild cough. Since then, the cough has worsened, particularly at night and during exertion, and he often vomits after a bout of coughing. The patient has no chronic medical conditions. Temperature is 37.2°C (99°F), blood pressure is 90/60 mm Hg, pulse is 98/min, and respirations are 20/min. Pulse oximetry shows an oxygen saturation of 98%. On physical examination, the child is alert and well-appearing. Bilateral subconjunctival hemorrhages and periorbital petechiae are noted. The lungs are clear to auscultation. Which of the following organisms is the most likely cause of this patient’s illness?"}],"o":[["A","Adenovirus"],["B","Bordetella pertussis"],["C","Influenza virus"],["D","Nontypeable Haemophilus influenzae"],["E","Parainfluenza virus"],["F","Respiratory syncytial virus"]],"a":"B"},{"id":"4242","b":3,"n":12,"s":[{"p":"A 15-year-old girl comes to the office due to a self-palpated breast lump. She is concerned about cancer as her mother passed away from pancreatic cancer last year. The patient discovered the mass 2 days ago while taking a shower and noted that it is mildly tender. She has no medical problems and takes no medications. Her menstrual periods are regular and occur every 26-28 days; she thinks her next period is due in a few days. Physical examination reveals a 3-cm mass in the superior outer quadrant of the right breast. There is no palpable lymphadenopathy. Which of the following is the most appropriate next step in management of this patient?"}],"o":[["A","Order mammography"],["B","Provide reassurance that no work-up or follow-up is necessary"],["C","Refer for excisional biopsy"],["D","Refer for fine-needle aspiration"],["E","Schedule follow-up shortly after next menses"]],"a":"E"},{"id":"4831","b":3,"n":13,"s":[{"p":"A newborn boy is in the delivery room with respiratory distress. He was born vaginally at 28-weeks gestation due to maternal pre-eclampsia. Examination shows a cyanotic tachypneic boy with intercostal and subcostal retractions and nasal flaring. On lung auscultation, coarse breath sounds are heard bilaterally. Respiratory support with continuous positive airway pressure is provided. The patient is admitted to the neonatal intensive care unit where he is intubated due to worsening respiratory status. An orogastric tube is placed to decompress the stomach. A chest radiograph is obtained. In addition to prematurity, which of the following is a risk factor for the development of respiratory distress syndrome?"}],"o":[["A","Antenatal corticosteroids"],["B","Intrauterine growth restriction"],["C","Maternal diabetes mellitus"],["D","Maternal hypertension"],["E","Prolonged rupture of membranes"],["F","Vaginal delivery"]],"a":"C"},{"id":"4187","b":3,"n":14,"s":[{"p":"A 6-year-old boy is brought to the emergency department with fever, purulent nasal discharge, and epistaxis. He has had daily fever and persistent nasal discharge for the past 10 days without improvement. The parents have had difficulty controlling his intermittent epistaxis, which began 2 days ago. The patient has also had easy bruising for the past 2 months. His medical history is significant for several recurrent pulmonary infections requiring hospitalization for parenteral antibiotic therapy, and previous sweat chloride testing was positive. The boy’s father recently lost his job, and his parents report financial difficulties obtaining the patient’s prescribed medications. Coagulation study results are as follows:"},{"ul":["Prothrombin time: 25 sec","Activated partial thromboplastin time: 35 sec"]},{"p":"Which of the following coagulation factors is most likely to be abnormal in this patient?"}],"o":[["A","Factor V"],["B","Factor VII"],["C","Factor VIII"],["D","Factor XII"],["E","Fibrinogen"]],"a":"B"},{"id":"3974","b":3,"n":15,"s":[{"p":"An 18-month-old boy is brought to the emergency department for evaluation of a productive cough and fever. He has had 8 office and emergency department visits over the past year, all of which required antibiotics for diagnoses of sinusitis and pneumonia. He was delivered vaginally without complications. His older brother has had similar recurrent infections throughout his life. Temperature is 38.9°C (102°F), blood pressure is 90/60 mm Hg, pulse is 120/min, and respirations are 30/min. The patient’s pulse oximetry is 99% on room air. Examination of the oropharynx reveals mildly enlarged tonsils without erythema or exudate. Auscultation reveals rales and rhonchi in both lungs, and point of maximal impulse is displaced to the right side of the chest. What is the most likely diagnosis?"}],"o":[["A","Common variable immunodeficiency"],["B","Cystic fibrosis"],["C","Foreign body"],["D","Kartagener syndrome"],["E","Normal childhood infections"],["F","X-linked agammaglobulinemia"]],"a":"D"},{"id":"4439","b":3,"n":16,"s":[{"p":"A 3-year-old girl is brought to the emergency department for sudden onset of weakness. She was well until this morning, when she woke up and was unable to climb out of bed. Her mother lifted her up, but the child was unable to bear weight on her right leg. She could not grasp her mother’s hand to stand up. The patient has had no recent fevers or upper respiratory symptoms. She was adopted from Nigeria 6 months ago, and family history is unknown. The child has had no hospitalizations or illnesses since her adoption. Her developmental milestones have been appropriate for age. Temperature is 37.2°C (99°F), pulse is 140/min, and respirations are 18/min. The patient is awake and alert but has difficulty articulating. Her head is normocephalic and atraumatic. Pupils are 2 mm and react to light and accommodation. Tympanic membranes and pharynx are clear. Cardiovascular examination demonstrates tachycardia but normal S1 and S2 without murmurs. Lungs are clear on auscultation. There is significant weakness, hypotonia, and hyperreflexia of the right arm and leg. Neuroimaging studies are pending. Which of the following additional tests is most likely to reveal an underlying abnormality in this patient?"}],"o":[["A","Cerebrospinal fluid culture"],["B","Echocardiography"],["C","Electroencephalography"],["D","Hemoglobin electrophoresis"],["E","Muscle biopsy"],["F","Serum ammonia"]],"a":"D"},{"id":"16271","b":3,"n":17,"s":[{"p":"A 2-week-old boy is brought to the office due to persistent yellowing of the skin and eyes. In the first few days of life, his parents were told the patient had jaundice that would likely improve over time. However, they feel that his color has not changed significantly. The patient was born at term, and his parents declined the hepatitis B vaccine because the mother’s serologic studies confirm she is immune. The boy is exclusively breastfed and voids frequently. He has 3 or 4 bowel movements daily, and the stools are light yellow. The patient’s only medication is vitamin D. Weight today is 3.5 kg (7.7 lb), increased from 3.4 kg (7.5 lb) at birth. Examination reveals scleral icterus and jaundice of the face and chest. The abdomen is soft with normal bowel sounds. The remainder of the examination is normal. Total bilirubin is 10.0 mg/dL and direct bilirubin is 7.4 mg/dL. Aspartate aminotransferase and alanine aminotransferase are within normal limits. Maternal blood type is O, Rh-D positive. Which of the following is the best next step in management of this patient?"}],"o":[["A","Obtain ultrasound of right upper quadrant"],["B","Perform serial monitoring of HBsAg"],["C","Recommend continued breastfeeding only"],["D","Send genetic testing for Crigler-Najjar syndrome"],["E","Supplement with cow’s milk-based formula"]],"a":"A"},{"id":"2768","b":3,"n":18,"s":[{"p":"A 3-year-old boy is brought to the clinic by his parents for fever and rash. Two days ago, the patient developed fever and decreased appetite. Yesterday, a maculopapular rash appeared on his trunk and face and became vesicular. This morning, another small group of vesicles appeared on his arms and legs. The rash is intensely pruritic. The child is playful and has been drinking normally. He is up to date on immunizations and has no medical issues. The patient attends day care. The family travels extensively for the mother’s job, and they recently returned from a 2-week trip to South Africa. Temperature is 38.2°C (100.8°F), and pulse is 100/min. Physical examination shows a mild, diffuse maculopapular rash with some scattered vesicular lesions. The mucous membranes are normal. Which of the following is the most likely explanation for this rash?"}],"o":[["A","Eczema herpeticum"],["B","Hand-foot-and-mouth disease"],["C","Impetigo"],["D","Measles"],["E","Roseola"],["F","Rubella"],["G","Scabies"],["H","Varicella"]],"a":"H"},{"id":"4199","b":3,"n":19,"s":[{"p":"A 6-month-old girl is brought to the office for a routine well-child visit. The patient has been breastfeeding well and has recently started eating pureed solid foods. She babbles but does not say “mama” or “dada.” Her 2-year-old brother has a speech delay requiring therapy twice a week. The patient is at the 40th percentile for length, 50th percentile for weight, and 60th percentile for head circumference. She cries when the physician picks her up but is easily consoled by her mother. The patient transfers a toy from her left hand to her right and sits unsupported, but she falls forward after a few seconds. When her father calls her name, she turns to him and smiles. She is unable to pull to a stand and does not crawl. Moro and grasp reflexes are absent. Firm stroking of the soles of her feet causes the big toes to turn up. Which of the following is the most appropriate assessment of this child’s development?"},{"p":"| :--- | :--- | :--- | :--- |"}],"o":[["A","Gross Motor: Delayed · Fine Motor: Delayed · Cognitive: Delayed"],["B","Gross Motor: Delayed · Fine Motor: Delayed · Cognitive: Normal"],["C","Gross Motor: Delayed · Fine Motor: Normal · Cognitive: Delayed"],["D","Gross Motor: Delayed · Fine Motor: Normal · Cognitive: Normal"],["E","Gross Motor: Normal · Fine Motor: Delayed · Cognitive: Delayed"],["F","Gross Motor: Normal · Fine Motor: Delayed · Cognitive: Normal"],["G","Gross Motor: Normal · Fine Motor: Normal · Cognitive: Delayed"],["H","Gross Motor: Normal · Fine Motor: Normal · Cognitive: Normal"]],"a":"H"},{"id":"4533","b":3,"n":20,"s":[{"p":"A 7-year-old boy is brought to the office for evaluation of chronic left thigh pain and a limp. The pain began 8 months ago as an intermittent ache, especially after soccer practice. The patient’s family thought his symptoms were growing pains and have been giving him ibuprofen as needed for pain, with some improvement. Over the past month, however, the pain has been constant, and the patient recently developed a limp. He has had no fever, additional joint pain, or chronic medical problems and takes no daily medications. While walking to the examination table, the patient avoids bearing full weight on the left leg. Examination shows significantly limited range of motion of the left hip and atrophy of the left proximal thigh muscle. The remainder of the examination is unremarkable. X-ray of the pelvis is shown in the image. Which of the following is most likely responsible for this patient’s condition?"}],"o":[["A","Bone infection"],["B","Malignancy"],["C","Muscular dystrophy"],["D","Osteonecrosis"],["E","Slipped epiphysis"],["F","Stress fracture"],["G","Synovitis"]],"a":"D"},{"id":"16245","b":3,"n":21,"s":[{"p":"A 3-year-old boy is brought to the clinic due to increased seizure frequency. Over the past year, the patient has had recurrent tonic-clonic seizures that are poorly controlled despite multiple antiepileptic medications. The seizures have become more frequent in the past month and now occur daily. The patient has developmental delay and receives speech and physical therapy. He was born at term without perinatal complications and has received all age-appropriate vaccinations. Family history includes mild intellectual disability in his father. Physical examination is notable for multiple 1- to  2-cm hypopigmented macules on the trunk and lower extremities. MRI of the brain reveals subependymal nodules, as shown in the image. Which of the following is associated with the most likely underlying condition in this patient?"}],"o":[["A","Cardiac rhabdomyoma"],["B","Optic nerve glioma"],["C","Pheochromocytoma"],["D","Vestibular schwannoma"],["E","Wilms tumor (nephroblastoma)"]],"a":"A"},{"id":"12516","b":3,"n":22,"s":[{"p":"A 7-week-old boy is evaluated for persistent hypoxia. He has been in the neonatal intensive care unit since birth. He was born at 29 weeks gestation due to placental abruption and weighed 1150 g (2.5 lb). Six hours after delivery, the patient developed tachypnea, grunting, and cyanosis; a chest x-ray revealed ground-glass opacities. Surfactant was administered and mechanical ventilation was initiated. He remained on mechanical ventilation for the first 3 weeks of life. Ever since ventilation was discontinued, the patient has remained hypoxic and continues to require oxygen administration by nasal cannula. Temperature is 36.7°C (98°F), pulse is 124/min, and respirations are 50/min. He is awake and alert. No rhinorrhea or pharyngeal erythema is found. S1 and S2 are normal; a 1/6 systolic murmur is present at the lower left sternal border. Scattered rhonchi and rales are present in both lungs. The abdomen is soft without organomegaly. There is no extremity edema. Chest radiograph appears hazy bilaterally and demonstrates slightly decreased lung volumes. What is the most likely diagnosis for this patient’s current presentation?"}],"o":[["A","Bronchiectasis"],["B","Bronchopulmonary dysplasia"],["C","Congenital heart disease with right-to-left shunt"],["D","Meconium aspiration"],["E","Neonatal pneumonia"],["F","Persistent pulmonary hypertension"]],"a":"B"},{"id":"16295","b":3,"n":23,"s":[{"p":"A 3-year-old boy is brought to the emergency department due to refusal to walk. The patient’s mother first noticed a mild limp 3 days ago after picking him up from day care. The patient tends to climb and jump on furniture, so she initially attributed the limp to rough play. The symptoms worsened today, and the patient now refuses to stand, falling when held up by his mother. He has no chronic medical conditions but has had a runny nose and fever intermittently for 2 months since starting day care. Temperature is 38°C (100.4°F), pulse is 90/min, and respirations are 24/min. Pulse oximetry is 100% on room air. The patient appears comfortable while lying supine on the examination table. He has clear rhinorrhea with several soft and mobile anterior cervical lymph nodes approximately 1 cm in diameter. The abdomen is nontender and the liver edge is palpable. The hips are held flexed bilaterally. During movement of the left hip, the patient wails and resists. Sensation is normal, and reflexes are intact. Babinski sign is negative bilaterally. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hemoglobin: 11.5 g/dL","Platelets: 380,000/mm³","Leukocytes: 15,000/mm³","Neutrophils: 80%","Lymphocytes: 20%"]},{"p":"Immunologic and rheumatologic studies"},{"ul":["Erythrocyte sedimentation rate: 30 mm/hr"]},{"p":"Which of the following is the best next step in management of this patient?"}],"o":[["A","Bilateral hip ultrasound"],["B","CT scan of the abdomen and pelvis"],["C","Ibuprofen and close follow-up only"],["D","Lumbar puncture"],["E","Lymph node biopsy"]],"a":"A"},{"id":"11984","b":3,"n":24,"s":[{"p":"A 4-year-old girl is brought to the clinic by her parents due to painful swelling in her groin, which began 2 weeks ago and has gradually become red and tender. Cool compresses and over-the-counter analgesics have not improved her symptoms. The patient attends preschool 3 times a week and returned from a family trip to China 2 months ago. The family has 2 dogs, a cat, and a turtle. Temperature is 37.4°C (99.3°F); other vital signs are normal. Examination shows a small, nontender papule on the anterior left thigh. There is a 4-cm, tender, soft, and freely mobile left inguinal lymph node with overlying erythema. Which of the following is the most likely causative organism of this patient’s condition?"}],"o":[["A","Bartonella henselae"],["B","Mycobacterium tuberculosis"],["C","Pasteurella multocida"],["D","Salmonella enteritidis"],["E","Staphylococcus aureus"],["F","Streptococcus pyogenes"]],"a":"A"},{"id":"4912","b":3,"n":25,"s":[{"p":"(Note: This item has associated audio media in the original exam) A 6-month-old male is brought to your office for a routine check-up. He has met all of the expected developmental milestones and all of his vaccinations are up-to-date. On physical examination, his peripheral pulses are somewhat accentuated. Cardiac auscultation findings at the left sternal border are given below (continuous flow murmur). What is the most likely diagnosis?"}],"o":[["A","Endocardial cushion defect"],["B","Mitral valve prolapse"],["C","Patent ductus arteriosus"],["D","Williams syndrome"]],"a":"C"},{"id":"4239","b":3,"n":26,"s":[{"p":"A 7-year-old boy is brought to the office for severe facial acne that has developed over the past few months. His mother tried treating it with topical benzoyl peroxide and a salicylic acid face wash with no improvement. She also noticed a significant increase in her son’s growth, and he is now much taller than his fraternal twin brother. The patient is otherwise healthy with no chronic medical conditions and takes no medications. Height is at the 98th percentile and weight is at the 85th percentile for age and sex. Neurologic examination is normal. Skin examination shows severe cystic acne involving the face and shoulders. Examination reveals coarse pubic and axillary hair. Testicular volume is 2 mL. Bone age is 2 standard deviations higher than chronological age. Baseline LH levels are low and do not increase after stimulation with a GnRH agonist. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Hypothyroidism"],["B","Idiopathic precocious puberty"],["C","Klinefelter syndrome"],["D","McCune-Albright syndrome"],["E","Nonclassic congenital adrenal hyperplasia"],["F","Pituitary microadenoma"]],"a":"E"},{"id":"12423","b":3,"n":27,"s":[{"p":"A newborn girl is evaluated in the delivery room 30 minutes after delivery. The infant was born at 41 weeks gestation to a 23-year-old woman, gravida 2 para 1, via uncomplicated vaginal delivery. The mother was previously healthy and had routine prenatal care. Serology was normal. The pregnancy was complicated by polyhydramnios and gestational diabetes necessitating insulin. The infant’s vital signs are normal and birth weight is 4.2 kg (9 lb  4 oz). Apgar scores were 7 and 9 at 1 and 5 minutes, respectively. Physical examination shows an active, crying infant lying under the radiant warmer. Cardiac auscultation reveals a soft, 1/6 systolic murmur. The infant’s hands and feet are cyanotic; the mucosal membranes are pink. Moro reflex is normal. The remainder of the examination is normal. Which of the following tests is most likely to be abnormal?"}],"o":[["A","Blood culture"],["B","Clavicle x-ray"],["C","Contrast enema"],["D","Glucose level"],["E","Hearing screening"],["F","Pulse oximetry"]],"a":"D"},{"id":"2488","b":3,"n":28,"s":[{"p":"A newborn girl is examined in the delivery room immediately after induced vaginal delivery for fetal growth restriction. She was born to a 40-year-old woman with no significant medical history. In addition to fetal growth restriction, a prenatal ultrasound demonstrated a ventricular septal defect. Her parents declined additional prenatal testing. The patient’s weight and head circumference are <5th percentile. Examination shows hypertonia and closed fists, with the second digit overlapping the third and the fifth overlapping the fourth. Based on this patient’s presumed chromosomal abnormality, which of the following additional physical findings is most likely to be present on examination?"}],"o":[["A","Cat-like cry"],["B","Cutis aplasia"],["C","Micrognathia"],["D","Microphthalmia"],["E","Transverse palmar crease"],["F","Webbed neck"]],"a":"C"},{"id":"3967","b":3,"n":29,"s":[{"p":"A 22-year-old man comes to the emergency department after an episode of gross hematuria and right flank pain that resolved spontaneously. The episode occurred while he was hiking in the mountains in summer heat. The patient has no dysuria, urgency, frequency, or fever. He smokes cigarettes occasionally but does not use illicit drugs or alcohol. Temperature is 36.7°C (98°F), blood pressure is 120/70 mm Hg, pulse is 70/min, and respirations are 14/min. Physical examination shows no abnormalities. Laboratory results are as follows:"},{"p":"Complete blood count"},{"ul":["Hemoglobin: 10.4 g/dL","Reticulocytes: 6%","Platelets: 200,000/mm³","Leukocytes: 7,500/mm³"]},{"p":"Serum chemistry"},{"ul":["Blood urea nitrogen: 10 mg/dL","Creatinine: 0.8 mg/dL"]},{"p":"Urinalysis"},{"ul":["pH: 5.8","Protein: none","Blood: 3+","Glucose: negative","Bacteria: none","Red blood cells: 20-30/hpf","White blood cells: 1-2/hpf","Casts: none"]},{"p":"Urine microscopic examination reveals numerous intact red blood cells but no other abnormal findings. Renal ultrasound demonstrates increased echogenicity of the renal medulla, but there is no hydronephrosis. Which of the following is the most likely cause of this patient’s hematuria?"}],"o":[["A","Glomerulonephritis"],["B","Nephrolithiasis"],["C","Papillary necrosis"],["D","Pyelonephritis"],["E","Rhabdomyolysis"]],"a":"C"},{"id":"15584","b":3,"n":30,"s":[{"p":"A 4-year-old girl is brought to the emergency department for evaluation of bloody diarrhea. Five days ago, she developed vomiting and diarrhea. The vomiting resolved, but she continued to have 4-5 episodes of diarrhea per day. The patient then developed bloody stools last night. She has had minimal fluid intake in the last 24 hours and has been sleeping most of the day today. Her younger brother had similar symptoms this week and required hospitalization 2 days ago for dehydration; his stool culture was positive for Escherichia coli O157:H7. The patient has no chronic medical conditions and has not traveled outside of the country. Temperature is 37.1°C (98.8°F), blood pressure is 120/70 mm Hg, pulse is 150/min, respirations are 30/min. She appears tired and anxious on physical examination. The oral mucosa appears dry, and capillary refill is 4 seconds. The remainder of the physical examination is unremarkable. The patient is admitted to the hospital for further management. Which of the following is the most appropriate therapy for this patient’s condition?"}],"o":[["A","Azithromycin"],["B","Ceftriaxone"],["C","Ciprofloxacin"],["D","Supportive care only"],["E","Trimethoprim-sulfamethoxazole"],["F","Vancomycin"]],"a":"D"},{"id":"3774","b":3,"n":31,"s":[{"p":"A 7-week-old boy is brought to the clinic for the first time since discharge from the neonatal intensive care unit (NICU). The infant was born at 32 weeks gestation weighing 1800 g (4 lb) following a pregnancy complicated only by preterm labor. In the NICU, he initially had difficulty feeding. By age 6 weeks, he was taking an appropriate volume of fortified preterm formula and was gaining weight well. His parents report no problems since discharge. On examination, the infant is slightly pale. Cardiac auscultation reveals a 2/6 systolic flow murmur, but no tachycardia or gallop. Laboratory results are as follows:"},{"ul":["Hemoglobin: 7.8 g/dL","Hematocrit: 24.1%","White blood cells: 7,000/mm³","Platelets: 230,000/mm³","Reticulocytes: 0.8%"]},{"p":"The peripheral smear shows normocytic, normochromic red blood cells. Which of the following is the most likely diagnosis?"}],"o":[["A","Alpha thalassemia"],["B","Anemia of prematurity"],["C","Beta thalassemia"],["D","Glucose 6-phosphate dehydrogenase deficiency"],["E","Hemolytic disease of the newborn"],["F","Iron deficiency"],["G","Sickle cell anemia"],["H","Vitamin B₁₂ deficiency"]],"a":"B"},{"id":"16028","b":3,"n":32,"s":[{"p":"A term newborn is undergoing routine evaluation in the nursery. The boy was born 12 hours ago via spontaneous vaginal delivery to a 24-year-old woman. His mother had appropriate prenatal care, and her pregnancy was uncomplicated. Delivery was unremarkable, and the patient has had a normal nursery course. He received the hepatitis B vaccine, erythromycin eye ointment, and intramuscular vitamin K after delivery. Family history reveals factor VIII deficiency in the patient’s paternal grandfather. Vital signs are normal. Physical examination shows a sleeping newborn with normal tone. A 1/6 systolic murmur is best heard at the left sternal border. Peripheral pulses are strong. Genitourinary examination shows a penis of normal length with no curvature. The urethral meatus extends to the corona on the ventral aspect of the penis, and the foreskin has a dorsal hood appearance. The testes are present bilaterally within the scrotum. The patient urinates through the urethral meatus during examination. The father requests that a circumcision be performed. Which of the following is the best next step in management of this patient?"}],"o":[["A","Coagulation studies"],["B","Echocardiogram"],["C","Karyotype"],["D","Renal ultrasound"],["E","Urology evaluation"]],"a":"E"},{"id":"2794","b":3,"n":33,"s":[{"p":"A 4-week-old full-term boy is brought to the emergency department due to vomiting. His parents describe the emesis as undigested formula without blood or bile. The vomiting occurs after feeds and has increased in frequency and force over the past 6 days. However, the infant continues to bottle-feed every 1-2 hours. He previously had soft, yellow stools daily but has had no stool for the past 2 days. The patient was born at 39 weeks gestation through meconium-stained amniotic fluid with Apgar scores of 8 and 9. Temperature is 37.2°C (99°F), blood pressure is 70/30 mm Hg, pulse is 182/min, and respirations are 10/min; pulse oximetry is 98% on room air. Examination shows a thin, sleepy infant with a sunken anterior fontanelle and dry mucous membranes. Cardiac examination reveals tachycardia but no murmurs or gallops. The abdomen is soft, nontender, and nondistended. Which of the following laboratory findings would be expected in this patient?"},{"p":"| :--- | :--- | :--- | :--- | :--- | :--- |"}],"o":[["A","pH: ↓ · PaCO₂: ↓ · HCO₃⁻: ↓ · K⁺: ↓ · Cl⁻: ↓"],["B","pH: ↓ · PaCO₂: ↑ · HCO₃⁻: ↑ · K⁺: Normal · Cl⁻: Normal"],["C","pH: Normal · PaCO₂: Normal · HCO₃⁻: Normal · K⁺: Normal · Cl⁻: Normal"],["D","pH: ↑ · PaCO₂: ↑ · HCO₃⁻: ↑ · K⁺: ↓ · Cl⁻: ↓"],["E","pH: ↑ · PaCO₂: ↑ · HCO₃⁻: ↑ · K⁺: ↑ · Cl⁻: ↑"],["F","pH: ↑ · PaCO₂: ↓ · HCO₃⁻: ↓ · K⁺: ↓ · Cl⁻: ↓"]],"a":"D"},{"id":"11981","b":3,"n":34,"s":[{"p":"A 6-year-old girl is brought to the clinic by her parents after multiple falls while running in the past few months. Over the past month, the patient has also had intermittent headaches, with increased frequency in the past 2 weeks. The headaches are worse in the morning and have occasionally been accompanied by nausea and vomiting. Examination shows a tired-appearing young girl. The patient walks with a wide-based gait and has difficulty with heel-to-toe walking. Eye examination reveals bilateral abducens nerve palsies and papilledema. The remainder of the cranial nerve examination is normal. Strength is 5/5 in bilateral upper and lower extremities. Sensation is intact, and reflexes are 2+ bilaterally. Babinski testing reveals plantar flexion of the toes. Which of the following is most likely responsible for this patient’s symptoms?"}],"o":[["A","Acoustic neuroma"],["B","Craniopharyngioma"],["C","Glioblastoma"],["D","Medulloblastoma"],["E","Meningioma"],["F","Pinealoma"]],"a":"D"},{"id":"4839","b":3,"n":35,"s":[{"p":"A 16-year-old boy with Crohn disease is brought to the office due to diarrhea and rash. For the last 3 months, the patient has had watery, nonbloody diarrhea 3 or 4 times daily as well as a rash on his distal arms and legs that sometimes becomes intensely pruritic. He has also had a difficult time concentrating in school and has been less interested in his usual activities, such as skateboarding and rollerblading. Vital signs are normal. Physical examination reveals a smooth, red tongue. The abdomen is soft, is nontender, and has no hepatosplenomegaly. A dry, erythematous, and hyperpigmented rash is located on the distal arms and legs. The affected area has thickened skin and sharp lines of demarcation. Neurologic examination is normal. This patient’s symptoms are most likely due to a deficiency of which of the following vitamins?"}],"o":[["A","Cobalamin"],["B","Niacin"],["C","Pyridoxine"],["D","Riboflavin"],["E","Thiamine"]],"a":"B"},{"id":"12267","b":3,"n":36,"s":[{"p":"A 1-year-old boy is brought to the office for evaluation of fever and rash. He felt warm to his parents this morning and did not eat breakfast. Subsequently, the patient developed a maculopapular rash over the face and upper trunk. The child has a history of eczema treated with emollients at night and a topical corticosteroid as needed. He has no other medical issues. The patient received the measles-mumps-rubella vaccine and the varicella-zoster virus vaccine 7 days ago. He lives with his parents and 8-year-old twin sisters, all of whom are healthy and up to date on immunizations. Temperature is 39.8°C (103.6°F). On examination, there is a faint maculopapular rash on the face, shoulders, and upper chest that is nontender to palpation. The remainder of the examination is unremarkable. Which of the following is the best next step in management of this patient?"}],"o":[["A","Airborne isolation"],["B","Measles serology"],["C","Oral antihistamines"],["D","Oral antiviral therapy"],["E","Reassurance"],["F","Topical corticosteroids"]],"a":"E"},{"id":"15405","b":3,"n":37,"s":[{"p":"A 4-week-old girl is brought to the clinic for post-hospitalization follow-up. Her mother moved from Greece to the United States for a diplomatic position a few months prior to giving birth. The patient was born at term, and the mother’s prenatal course and delivery were uncomplicated. Due to hyperbilirubinemia, the patient was in the nursery for 3 weeks of phototherapy. Bilirubin was normal at discharge. Since discharge, the girl’s skin and eyes have remained yellow. Maternal blood type is AB, Rh-D positive. Infant blood type is A, Rh-D positive. The patient has been breastfeeding exclusively. Weight and length were at the 50th percentile at 2 weeks of age and remain at the 50th percentile today. Laboratory results today are as follows:"},{"p":"Complete blood count"},{"ul":["Hemoglobin: 9 g/dL","Mean corpuscular volume: 78 μm³","Reticulocytes: 15%","Platelets: 225,000/mm³","Leukocytes: 9,000/mm³"]},{"p":"Liver function studies"},{"ul":["Total bilirubin: 6.5 mg/dL","Direct bilirubin: 0.4 mg/dL"]},{"p":"Hematology"},{"ul":["Mean corpuscular hemoglobin concentration: 40% Hb/cell"]},{"p":"Which of the following is the most likely cause of this patient’s condition?"}],"o":[["A","ABO incompatibility"],["B","Beta thalassemia"],["C","Breastfeeding failure jaundice"],["D","Glucose-6-phosphate dehydrogenase deficiency"],["E","Hereditary spherocytosis"]],"a":"E"},{"id":"4893","b":3,"n":38,"s":[{"p":"While making rounds in the newborn nursery, a physician is asked to examine a 2-day-old infant who is not feeding well. A nurse reports that the infant is irritable, is not sleeping well, and has had several episodes of vomiting and loose stools that day. A review of the maternal history reveals that the mother had poor prenatal care and the pregnancy was complicated by intrauterine growth restriction. On examination, the infant is diaphoretic and has a high-pitched cry. The infant is also noted to have occasional sneezing and is mildly tachypneic. No dysmorphic features are noted and the remainder of the examination is unremarkable. This infant’s symptoms are most likely caused by prenatal exposure to which of the following?"}],"o":[["A","Alcohol"],["B","Cocaine"],["C","Heroin"],["D","Phenytoin"],["E","Valproic acid"]],"a":"C"},{"id":"2680","b":3,"n":39,"s":[{"p":"An 8-year-old boy is brought to the emergency department 45 minutes after falling out of bed. He had been asleep for about 10 minutes when his mother heard a thud and immediately ran to his room. She found him unconscious on the floor with a blue discoloration around his lips that resolved after a few seconds. The patient regained consciousness after a few minutes but seemed excessively sleepy. He has had no fever, vomiting, diarrhea, or change in appetite. The patient has no chronic medical conditions and takes no medication. He was drowsy but responsive on the drive to the hospital and was able to walk in unassisted. Vital signs are normal for age. The patient is now alert and interactive but does not remember anything about the event. Which of the following is the most likely diagnosis?"}],"o":[["A","Breath-holding spell"],["B","Cardiogenic syncope"],["C","Generalized seizure"],["D","Hypnagogic hallucination"],["E","Vasovagal syncope"]],"a":"C"},{"id":"3688","b":3,"n":40,"s":[{"p":"A 6-month-old boy is brought to the office for follow-up after a urinary tract infection. The boy was initially brought in 2 weeks ago with fever for 4 days. A urine culture from a catheterized urine specimen at that first visit grew >100,000 colony-forming units of Escherichia coli. The fever resolved within 48 hours with antibiotic therapy, and a full course of antibiotics was completed. Renal ultrasound performed 2 days ago showed mild right hydronephrosis; voiding cystourethrogram revealed dilation of the right ureter with blunting of the right renal calyces. The patient has no prior medical conditions and is up to date with vaccinations. Temperature is 36.7°C (98°F). Physical examination shows a circumcised male with a normal abdominal examination. If untreated, which of the following is the most likely long-term complication of this patient’s condition?"}],"o":[["A","Development of renal cysts"],["B","Fibrosis of renal interstitial space"],["C","Inflammation of the renal glomerulus"],["D","No long-term complications"],["E","Obstruction from uric acid stones"]],"a":"B"},{"id":"12200","b":4,"n":1,"s":[{"p":"A 3-week-old boy is brought to the emergency department due to a seizure. The patient was born at term to a 23-year-old woman who had no prenatal care and delivered him at home. The mother states that he was healthy until this morning, when he developed a low-grade fever. The patient has been very fussy and refused to nurse at his last feed. Subsequently, he experienced a 4-minute, generalized tonic-clonic seizure with mild perioral cyanosis. Temperature is 38.3°C (100.9°F). The patient is lethargic but arouses to painful stimuli. Pupils are equal and reactive; the anterior fontanel is full. The remainder of the physical examination is normal. Blood and urine samples are obtained and a lumbar puncture is performed, with results pending. Brain imaging reveals patchy areas of increased attenuation in the cerebral cortex and edema and hemorrhage in the left temporal lobe and brainstem; no intracranial calcifications are seen. Vertical transmission of which of the following is the most likely cause of this patient’s presentation?"}],"o":[["A","Cytomegalovirus"],["B","Group B Streptococcus"],["C","Herpes simplex virus"],["D","Listeria monocytogenes"],["E","Toxoplasma gondii"]],"a":"C"},{"id":"2446","b":4,"n":2,"s":[{"p":"An 8-year-old boy is brought to the clinic for evaluation of a limp. The patient first noticed a mild ache in his upper right thigh 6 days ago. The pain is worse in the evening and improves after sleep. He does not recall an injury but notes that the pain started after returning from a weeklong camping trip. His group went hiking each day of the trip except for 2 days in the middle, during which some campers, including the patient, were experiencing vomiting and diarrhea. He had a similar pain in his left thigh 6 months ago, which resolved after a few days. The patient is otherwise healthy and takes no medications. Temperature is 37.8°C (100°F). He bears little weight on his right leg while walking. There is no gross abnormality or tenderness along the thigh. While supine, the patient holds the right hip slightly flexed, resisting extension and internal rotation. Skin examination is normal. Laboratory evaluation reveals a leukocyte count of 8,000/mm³ and erythrocyte sedimentation rate of 10 mm/h. Ultrasound of the right hip shows a small intracapsular fluid collection. Which of the following is the best pharmacotherapy for this patient?"}],"o":[["A","Doxycycline"],["B","Ibuprofen"],["C","Methotrexate"],["D","Metronidazole"],["E","Vancomycin"]],"a":"B"},{"id":"3196","b":4,"n":3,"s":[{"p":"A 14-month-old boy is admitted to the hospital for treatment of pneumonia. He has a fever, cough, and increased labored breathing. Sick contacts include multiple children in day care who have had a “cold.” The boy’s mother is concerned about him “frequently being ill” as he had 3 episodes of bronchiolitis during infancy and pneumococcal pneumonia 2 months ago that required intubation and hospitalization in the intensive care unit. The patient also had tympanostomy tubes recently placed for recurrent otitis media. He takes no medications and his vaccinations are up to date. Weight is 7 kg (15.4 lb, <3rd percentile). Temperature is 39.6°C (103.3°F), blood pressure is 90/50 mm Hg, pulse is 128/min and respirations are 38/min. On examination, the patient appears listless and is in mild respiratory distress. Both ear canals contain purulent drainage. Crackles are heard in the left lung base. Laboratory results are as follows:"},{"ul":["Hemoglobin: 12.6 g/dL","Platelets: 260,000/μL","Leukocytes: 9,000/μL","Neutrophils: 40%","Lymphocytes: 50%","IgG: 250 mg/dL (normal, 700-1,500 mg/dL)","IgA: 24 mg/dL (normal, 60-400 mg/dL)","IgM: 450 mg/dL (normal, 60-300 mg/dL)","CD4/CD8 ratio: 2.2 (normal, 1-4)","HIV-1 antibody: negative"]},{"p":"Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Bruton agammaglobulinemia"],["B","Common variable immunodeficiency"],["C","Hyper-IgM syndrome"],["D","IgA deficiency"],["E","Medical child abuse"],["F","Selective IgG subclass deficiencies"],["G","Transient hypogammaglobulinemia of infancy"]],"a":"C"},{"id":"17012","b":4,"n":4,"s":[{"p":"A 6-year-old boy is brought to the office for evaluation of a neck lump. His mother first noticed the mass 2 weeks ago while he was experiencing cold symptoms. His nasal congestion and fever resolved within several days with symptomatic treatment, but the mass failed to improve. The patient was born at full term without pregnancy complications and has been healthy until now. He has received all recommended vaccines and takes no medications. The patient is afebrile, and height and weight are at the 60th percentile for his age. Physical examination shows a 1.5-cm, soft, mildly tender mass in the midline upper neck. It moves up and down when the patient swallows; there are no other neck masses. The nasal turbinates are pink with no rhinorrhea, and the tonsils are normal with no erythema or exudates. The remainder of the examination shows no abnormalities. Which of the following is the most likely underlying cause of this patient’s condition?"}],"o":[["A","Embryologic anomaly"],["B","Glandular duct obstruction"],["C","Granulomatous inflammation"],["D","Neoplastic proliferation"],["E","Reactive lymphadenopathy"],["F","Suppurative bacterial infection"]],"a":"A"},{"id":"4898","b":4,"n":5,"s":[{"p":"A 6-year-old girl is brought to the clinic for evaluation of “strange behavior.” Her parents have noticed that she seems to have conversations with herself when no one else is there, especially when she is alone in her room. In addition, when the girl dropped a plate at dinner, she said that “Mudsie did it” and that Mudsie was a friend who went to school with her. She states, “Mudsie is my invisible friend who is a bit clumsy, but I am teaching her to go slowly so that she gets better.” The patient has no chronic medical conditions and has reached all her developmental milestones on time. Her maternal aunt was recently diagnosed with bipolar disorder. The patient has friends at school and gets along well with her 2 older siblings. She plays basketball, although she worries that she is not a good player because she drops the ball often. On mental status examination, the patient is friendly, cooperative, and responds appropriately to questions. She says that she can see and hear Mudsie but reports no other auditory or visual hallucinations. At one point in the interview, she looks over her shoulder and says, “Shhh, Mudsie, not now.” Her parents are concerned that her behavior is abnormal and will interfere with her ability to make real friends. Which of the following is the most appropriate response?"}],"o":[["A","Having imaginary friends is normal at this age and may help with social relationships."],["B","Having imaginary friends is normal; however, their presence can adversely affect the development of real friendships."],["C","Having imaginary friends is often associated with mood disorders; starting cognitive-behavioral therapy should be considered."],["D","Your daughter may be experiencing early signs of psychosis; she requires further evaluation."],["E","Your daughter will likely no longer need her imaginary friend once she feels more confident playing basketball."]],"a":"A"},{"id":"4705","b":4,"n":6,"s":[{"p":"A 1-month-old boy is brought to the clinic due to poor feeding. When nursing, he becomes diaphoretic, and for the past week he has fed for only 5 minutes at a time before falling asleep. The patient was born full term via spontaneous vaginal delivery. Today, his weight is 30 g (1 oz) below birth weight. Temperature is 37°C (98.6°F). Blood pressure is normal. Examination shows a thin infant who is sleeping but easily arousable. Cardiac examination reveals tachycardia and a I/VI holosystolic murmur over the left lower sternal border with a diastolic rumble over the cardiac apex. The S2 is prominent. The patient is tachypneic, but the lung fields are clear to auscultation. There is no clubbing, cyanosis, or peripheral edema. Which of the following is the most likely cause of this patient’s symptoms?"}],"o":[["A","Atrial septal defect"],["B","Coarctation of the aorta"],["C","Mitral stenosis"],["D","Tetralogy of Fallot"],["E","Transposition of the great vessels"],["F","Ventricular septal defect"]],"a":"F"},{"id":"17055","b":4,"n":7,"s":[{"p":"A 12-year-old boy is brought to the emergency department due to worsening facial swelling. Thirty minutes ago, the patient began experiencing a burning sensation and swelling of the eyes. He also has had a “scratchy” sensation and tightness in the throat. The patient was seen at an urgent care clinic earlier today due to persistent nasal discharge for the past several days. He was diagnosed with acute sinusitis and amoxicillin was prescribed. The patient has no other medical conditions and has no drug allergies. Temperature is 37.2°C (98.9°F), blood pressure is 116/68 mm Hg, and pulse is 92/min. Physical examination shows bilateral periorbital swelling and mild conjunctival erythema. There are scattered, raised wheals on his trunk. Which of the following is the best next step in management of this patient?"}],"o":[["A","Broad-spectrum antibiotics"],["B","Intramuscular epinephrine"],["C","Liposomal amphotericin B"],["D","Oral antihistamine"],["E","Systemic glucocorticoids"]],"a":"B"},{"id":"3444","b":4,"n":8,"s":[{"p":"A 14-year-old girl is brought to the office due to a rash. Five days ago, the patient became ill with fever, sore throat, and malaise. Ibuprofen helped the fever. However, the sore throat persisted; so her father gave her amoxicillin, which was unused after a previous throat infection. The patient took the first dose of amoxicillin 3 days ago. Today, she noticed a rash over her entire body. She has no cough, abdominal pain, nausea, or vomiting. She has no other medical conditions and has taken amoxicillin previously without reaction. Temperature is 38.3°C (100.9°F), blood pressure is 110/70 mm Hg, pulse is 84/min, and respirations are 12/min. Examination shows enlarged, erythematous tonsils bilaterally with white exudates and diffuse bilateral cervical lymphadenopathy. Auscultation reveals a 1/6 systolic murmur along the left sternal border. The lungs are clear bilaterally. The abdomen is soft and nontender with mild hepatosplenomegaly. An erythematous, polymorphous, maculopapular rash is present over the entire body. Which of the following is the most likely diagnosis in this patient?"}],"o":[["A","Acute rheumatic fever"],["B","Erythema infectiosum"],["C","IgE-mediated drug allergy"],["D","Infectious mononucleosis"],["E","Kawasaki disease"],["F","Stevens-Johnson syndrome"],["G","Streptococcal scarlet fever"]],"a":"D"},{"id":"2233","b":4,"n":9,"s":[{"p":"A 9-year-old boy is brought to the clinic for evaluation of dark brown urine for a day. He has had no fever, dysuria, hesitancy, or urinary frequency. For the past 3 days, the patient has had rhinorrhea, nasal congestion, and a sore throat, but these symptoms are improving. He has bilateral, sensorineural hearing loss that has worsened over the past 4 years. A maternal uncle died from complications of a renal transplant 5 years ago. Temperature is 37.1°C (98.8°F), blood pressure is 132/94 mm Hg, pulse is 90/min, and respirations are 14/min. The abdomen is soft and nontender and has no palpable masses. There is no suprapubic or costovertebral angle tenderness. Urinalysis reveals hematuria. Serum creatinine is 1.4 mg/dL, and serum complement levels are normal. A renal biopsy is performed. Which of the following is the most likely histologic finding?"}],"o":[["A","Effacement of podocyte foot processes"],["B","Linear deposition of IgG along the glomerular basement membrane"],["C","Longitudinal splitting of the glomerular basement membrane"],["D","Mesangial and glomerular capillary deposition of C3 and IgG"],["E","Mesangial deposition of IgA"]],"a":"C"},{"id":"2428","b":4,"n":10,"s":[{"p":"A 19-day-
